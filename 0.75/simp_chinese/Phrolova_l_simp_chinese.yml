 pf075_aid_trust:0 "共同守望"
 pf075_aid_trust_desc:0 "舰队在他国星海留下的守望，使彼此的承诺拥有了可以信赖的重量。"
 pf075_ame_final_invitation_desc:0 "漫长的风雪终会消融于春日的炉火。愿每次归航都有启明星为你引路，愿下一段旅途永远有人与你并肩同行。"
 pf075_ame_final_invitation_title:0 "爱弥斯发来了一段私人消息……"
 pf075_daily_invitation_desc:0 "隧者已经再次出航。现在，她想与你一起走进索拉里斯的灯火与人群。"
 pf075_daily_invitation_title:0 "爱弥斯想与你见一面……"
 pf075_grand_invitation_desc:0 "新的乐章已经准备好。弗洛洛在索拉里斯为你筹备了一场盛大的演出。"
 pf075_grand_invitation_title:0 "弗洛洛为你留好了席位……"
 pf075_home_invitation_desc:0 "她想带你走过重建后的失亡彼岸。熟悉的街道重新有了声音，她在那座剧院前等你。"
 pf075_home_invitation_title:0 "弗洛洛在索拉里斯上发来了邀约……"
 pf075_party_invitation_desc:0 "守岸人提到，索拉里斯正在筹备一个不同寻常的夜晚。她邀请你回来看看。"
 pf075_party_invitation_title:0 "索拉里斯的守岸人发来了邀请……"
 pf075_suizhe_imperial:0 "拉海洛"
 pf075_suizhe_imperial_plural:0 "拉海洛"
 pf075_suizhe_melee:0 "拉海洛"
 pf075_suizhe_melee_plural:0 "拉海洛"
 pf17_festival_desc:0 "守岸人从索拉里斯发来了一封邀请。海岸与街道正在为一个不同寻常的夜晚作准备，她想请你亲自回来看看。"
 pf17_festival_title:0 "索拉里斯好像要发生什么不同寻常的事，守岸人邀请我们去看看……"
 pf17_frequency_ready_desc:0 "弗洛洛从索拉里斯发来了消息。观测与算力网络已完成接驳，那道断续的声音终于有了稳定下来的可能。她正在实验室里等待，想与你一起接通这条通向彼端的联系。"
 pf17_frequency_ready_title:0 "彼岸的弗洛洛发来了消息，告诉我们下一步已经准备好……"
 pf17_heart_pulse_desc:0 "修复完成的拉海洛之心，正传出缓慢而稳定的搏动。弗洛洛还在留意它的变化，等待你决定，是否让这颗心脏真正重新跳动。"
 pf17_heart_pulse_title:0 "修复完成的拉海洛之心开始脉动……"
 pf17_heart_secret_desc:0 "拉海洛之心的搏动中，混入了一道陌生而不稳定的频率。弗洛洛怀疑，那些尚未读懂的深层记录里，仍有一个声音想要传达什么。她希望与你一同听清它的来处。"
 pf17_heart_secret_title:0 "脉动的拉海洛之心中传来了奇怪且不稳定的频率。"
 pf22_malevolent_horror:0 "虚无之神"
 pf22_malevolent_horror_plural:0 "虚无之神"
 pf23_specimen_01_category:0 "遗漏的回声：陈旧的唱片"
 pf23_specimen_01_category_desc:0 "监测网在此处捕捉到一段断断续续的轻柔哼唱。这缕附着在旧时代废弃物上的微弱频率，与我们馆藏记录中缺失的“陈旧的唱片”高度吻合，可派遣科研船前往回收。"
 pf23_specimen_02_category:0 "遗漏的回声：「剧本」"
 pf23_specimen_02_category_desc:0 "一处带有叙事性频率波动的特殊信号在此地浮现。经特征比对，其内部结构对应着馆藏目录中缺失的「剧本」，可派遣科研船前往发掘归档。"
 pf23_specimen_03_category:0 "遗漏的回声：星炬奖科学勋章"
 pf23_specimen_03_category_desc:0 "天体表面反射出一道恒定而规律的拉贝尔曲线微光。这处信号源与旧日表彰卓越学者的“星炬奖科学勋章”特征一致，可派遣科研船前往调查回收。"
 pf23_specimen_04_category:0 "遗漏的回声：“故土晨光”"
 pf23_specimen_04_category_desc:0 "探测器在此处感应到一缕纤弱却温暖的祝愿频率。该信号与昔日献予英雄王的信物“故土晨光”同源，可派遣科研船前往打捞。"
 pf23_specimen_05_category:0 "遗漏的回声：映照万音的星彩"
 pf23_specimen_05_category_desc:0 "上万道细碎的星光回音在此处的地层裂隙中彼此共鸣。比对确认，这是馆藏中尚未收录的“映照万音的星彩”，可派遣科研船前往收容。"
 pf23_specimen_06_category:0 "遗漏的回声：筑昼辉砾"
 pf23_specimen_06_category_desc:0 "一束穿透迷雾的温和辉光在此地持续闪烁。其频段特征指向黎那汐塔的提灯终端“筑昼辉砾”，可派遣科研船前往回收。"
 pf23_specimen_07_category:0 "遗漏的回声：灼霜"
 pf23_specimen_07_category_desc:0 "极寒的冰霜与炽热的燃烧频率在此处奇异地交织在一起。这道锋利的信号对应着尚未归档的“灼霜”，可派遣科研船前往提取。"
 pf23_specimen_08_category:0 "遗漏的回声：炽烈权霆"
 pf23_specimen_08_category_desc:0 "一阵夹杂着雷霆轰鸣与砂砾摩擦的暴烈波形在此处回荡。比对显示其为馆藏缺失的“炽烈权霆”，可派遣科研船前往调查。"
 pf23_specimen_09_category:0 "遗漏的回声：昭日译注"
 pf23_specimen_09_category_desc:0 "高强度的恒星辐射在此地蚀刻出了清晰的频率文字。这处遗留物对应着“昭日译注”，可派遣科研船前往拓印回收。"
 pf23_specimen_10_category:0 "遗漏的回声：星图核心"
 pf23_specimen_10_category_desc:0 "一段压缩了无数星辰哀鸣的沉重频谱正在此处低频震颤。经核对，这是尚未收入展馆的“星图核心”，可派遣科研船前往打捞。"
 pf23_specimen_11_category:0 "遗漏的回声：辛吉勒姆的核心"
 pf23_specimen_11_category_desc:0 "一缕糅合了悲欢与叹息的金色频率在此地久久徘徊。信号特征与“辛吉勒姆的核心”完全吻合，可派遣科研船前往收容。"
 pf23_specimen_12_category:0 "遗漏的回声：赝作的矮星"
 pf23_specimen_12_category_desc:0 "一处沉寂的微型引力场正在此处默默守护着内里的余光。比对确认其为“赝作的矮星”，可派遣科研船前往回收。"
 pf23_specimen_13_category:0 "遗漏的回声：拉海洛之心的复制品"
 pf23_specimen_13_category_desc:0 "一段与隧者炉芯同源的算力波纹在此处留下了清晰的备份投影。科研船可前往调查，将这枚“拉海洛之心的复制品”收回馆藏。"
 pf23_specimen_14_category:0 "空洞的残响"
 pf23_specimen_14_category_desc:0 "这里曾反复传出一段微弱的频率，如今只剩零散的底噪。"
 pf23_specimen_15_category:0 "遗漏的回声：星序协响"
 pf23_specimen_15_category_desc:0 "一段拟造群星演化循环的观测波形在此处重新浮现。这处散落的备份对应着“星序协响”，可派遣科研船前往回收归档。"
 pf23_specimen_16_category:0 "遗漏的回声：宙算仪轨"
 pf23_specimen_16_category_desc:0 "一处遵循着严密析解逻辑的仪器残响在此地持续发出脉冲。比对确认其为遗漏的“宙算仪轨”，可派遣科研船前往提取。"
 pf23_specimen_17_category:0 "遗漏的回声：时和岁稔"
 pf23_specimen_17_category_desc:0 "一道温润如玉、仿佛能化解寒冰与时光的剑气残韵留存于此。该线索指向“时和岁稔”，可派遣科研船前往调查收容。"
 pf23_specimen_18_category:0 "遗漏的回声：不屈命定之冠"
 pf23_specimen_18_category_desc:0 "一段不肯向命定浪海低头的凛然频率在此处铮然作响。比对显示其为“不屈命定之冠”的遗留印记，可派遣科研船前往回收。"
 pf28_guide_aemeath_0_desc:0 "拉海洛之心深处传来了陌生的频率。弗洛洛正在辨认其中的回应，索拉里斯的观测网络也已转向这道信号。那颗完整的心脏，仍维系着通向彼端的联系。"
 pf28_guide_aemeath_0_title:0 "来自拉海洛之心的回声"
 pf28_guide_aemeath_1_desc:0 "那道来自拉海洛之心的声音，已经学会在通讯中找到你。爱弥斯还在慢慢适应这条新的联系，偶尔会带来一段消息。她的私人频道里，仍有许多想与你说的话。"
 pf28_guide_aemeath_1_title:0 "爱弥斯的消息"
 pf28_guide_aemeath_2_desc:0 "爱弥斯正在慢慢习惯拥有实体的生活。重新触及世界，让许多从前平常的事都有了不同的分量。她想把这些感受讲给你听，也想听听你的声音。"
 pf28_guide_aemeath_2_title:0 "爱弥斯的消息"
 pf28_guide_aemeath_3_desc:0 "爱弥斯带来了隧者的诊断记录。她希望与你前往神秘地点，再看看那沉默的机神。残骸深处仍留着旧日的回声，或许能够指引它重新出航。"
 pf28_guide_aemeath_3_title:0 "爱弥斯的消息"
 pf28_guide_aemeath_4_desc:0 "沉默的隧者残骸旁，重构舰体的准备已经就绪。爱弥斯仍守着那道熟悉的频率，等待物资与工程队抵达。她想亲眼看着拉海洛再次亮起，也想与你一起迎接它的归航。"
 pf28_guide_aemeath_4_title:0 "爱弥斯的消息"
 pf28_guide_aemeath_5_desc:0 "拉海洛已经重新出航。爱弥斯却给你留了一封与舰队无关的消息：她想和你一起回到索拉里斯，走进灯火与人群，看看今天会遇见些什么。"
 pf28_guide_aemeath_5_title:0 "爱弥斯的消息"
 pf28_guide_aemeath_6_desc:0 "即使星海不平静，爱弥斯也仍愿意与你并肩前行。若有一天，笼罩银河的灾厄终于平息，她想与你好好谈谈这段旅途，以及你们还未走到的远方。"
 pf28_guide_aemeath_6_title:0 "爱弥斯的消息"
 pf28_guide_denia_0_desc:0 "达妮娅的私人频道仍然开着。她正在慢慢找回自己的步调，也会在闲暇时提起那些终于愿意与你分享的事。等你有空，再陪她聊一会儿吧。"
 pf28_guide_denia_0_title:0 "达妮娅的消息"
 pf28_guide_morin_0_desc:0 "拆解拉海洛之心后留下的部分碎片被送回了索拉里斯，这给了守岸人一条新的线索。她发现在索拉里斯极地旧城区的深处，仍有一座封闭舱室维持着供能。考察队正在为深入冰原作准备，等待查明那里究竟保存着什么。"
 pf28_guide_morin_0_title:0 "索拉里斯的守岸人发来了消息……"
 pf28_guide_morin_10_desc:0 "索拉里斯的守岸人正在为一次相聚作准备。远方的风波暂时平息，莫宁也终于能从观测站的工作台前抬起头来。等大家重新聚齐，她们想邀你回来，一同迎接属于这颗星球的新一次日出。"
 pf28_guide_morin_10_title:0 "莫宁的消息"
 pf28_guide_morin_1_desc:0 "莫宁正在适应索拉里斯的新生活。拉海洛之心的碎片仍放在她的工作台上，她偶尔会停下来，重新端详其中熟悉的结构。等研究准备妥当，她想与你认真谈谈这些发现。"
 pf28_guide_morin_1_title:0 "莫宁的消息"
 pf28_guide_morin_2_desc:0 "莫宁送来了地下研究站的勘测记录。深空联合留下的实验室仍有修复的希望，她想让这里重新亮起灯光，再把那些旧图纸放回能够继续工作的地方。索拉里斯正在等待这项重建的安排。"
 pf28_guide_morin_2_title:0 "莫宁的消息"
 pf28_guide_morin_3_desc:0 "碎片上的接口，与神秘地点的隧者残骸留下了相同的痕迹。莫宁希望随科研船前往神秘地点，亲自检查那具沉默的机神，为旧图纸上的空白找到可靠的答案。"
 pf28_guide_morin_3_title:0 "莫宁的消息"
 pf28_guide_morin_4_desc:0 "莫宁正将远征带回的接口记录，与深空联合的旧图纸逐一叠合。地下研究站里还有一些需要复核的细节，她希望把这些地方查清，再将设计交到工程队手中。"
 pf28_guide_morin_4_title:0 "莫宁的消息"
 pf28_guide_morin_5_desc:0 "莫宁已把审定的轨道框架蓝图送回索拉里斯。首批施工接口完成了预制，工程队正在等候你的安排。旧图纸上的线条，即将开始成为恒星轨道上的真实结构。"
 pf28_guide_morin_5_title:0 "莫宁的消息"
 pf28_guide_morin_6_desc:0 "索拉里斯的轨道框架已经搭起。莫宁与工程队正在准备接入超导传输层，旧档案中也还有值得追索的记录。她希望继续这项工程，同时请你留意外围航道上逐渐接近的陌生舰影。"
 pf28_guide_morin_6_title:0 "莫宁的消息"
 pf28_guide_morin_7_desc:0 "拟制炉芯已经有了稳定的轮廓。莫宁正在索拉里斯准备最后的核心整合，接收站档案与外围航道的安全仍需要确认。等这些工作落定，她便能与你一同见证炉芯完整亮起。"
 pf28_guide_morin_7_title:0 "莫宁的消息"
 pf28_guide_morin_8_desc:0 "莫宁与弗洛洛正在索拉里斯守着那道微弱的回应。接收阵列已经准备好，但远方也传来了令人不安的动静。先听听她们的安排，将守护这颗星球的舰队带到身边，再决定何时点亮通路。"
 pf28_guide_morin_8_title:0 "莫宁的消息"
 pf28_guide_morin_9_desc:0 "接收室里仍有一个声音等待回应。那场漫长的归途终于走到了索拉里斯，而达妮娅还有些话想亲口告诉你。再去见见她吧，这次相会仍为你留着位置。"
 pf28_guide_morin_9_title:0 "莫宁的消息"
 pf28_guide_phrolova_0_desc:0 "弗洛洛又给你留了一段讯息。她想找个安静的时候，继续讲讲那些尚未说完的往事。接通她的私人频道，听听她这次想说些什么。"
 pf28_guide_phrolova_0_title:0 "弗洛洛的消息"
 pf28_guide_phrolova_1_desc:0 "索拉里斯的旧设施陆续传回了新的声音。遗址里的调查与地表的清理仍在继续，弗洛洛正在等待下一批残响，准备将它们重新调律。"
 pf28_guide_phrolova_1_title:0 "弗洛洛的消息"
 pf28_guide_phrolova_2_desc:0 "弗洛洛近来常去失亡彼岸。她想让那里的街道与乌洛波洛大剧院重新热闹起来，再带你去看看那些终于能够留下的声音。索拉里斯的重建仍在等候你的安排。"
 pf28_guide_phrolova_2_title:0 "弗洛洛的消息"
 pf28_guide_phrolova_3_desc:0 "失亡彼岸传来了邀约。弗洛洛已经在重建的故乡等候，想带你走过那些重新响起脚步声的街道。前往索拉里斯，赴这场属于你们的约。"
 pf28_guide_phrolova_3_title:0 "弗洛洛的消息"
 pf28_guide_phrolova_4_desc:0 "弗洛洛把你与同伴们一路走来的经历记进了新的乐章。她愿意等你们各自完成眼前的心愿，再在索拉里斯请你听一场完整的演出。"
 pf28_guide_phrolova_4_title:0 "弗洛洛的消息"
 pf28_guide_phrolova_5_desc:0 "索拉里斯的大剧院发来了消息。弗洛洛的邀请仍为你保留着，观众席上有一个专属于你的位置。若这颗星球正忙于另一场庆典，她愿意等热闹稍歇，再把这段时间完整地交给你。"
 pf28_guide_phrolova_5_title:0 "弗洛洛的消息"
 pf28_guide_shorekeeper_0_desc:0 "守岸人一直在整理索拉里斯留下的观测记录。旧黑海岸的声音仍埋在废墟之下，她想与你商量，是否能让那座观测中心重新亮起灯光。"
 pf28_guide_shorekeeper_0_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_1_desc:0 "索拉里斯的观测中心恢复了联系。守岸人已为潮汐测量中枢与泰缇斯系统选好位置，等待它们在海岸边重新建立。新的执花也将从这里开始守望。"
 pf28_guide_shorekeeper_1_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_2_desc:0 "泰缇斯正在重新认识索拉里斯。守岸人希望先清理仍阻隔观测的遗留地带，让各处记录重新连成完整的图景。等新的观测结果足够可靠，她会再与你商量远方的事。"
 pf28_guide_shorekeeper_2_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_3_desc:0 "黑海岸的观测记录正沿航路传向远方。守岸人希望更多殖民地与居住站能够接入这张网络，让来自不同星球的目光彼此照应。她会在新的成员准备好后，再与你谈谈如何分担这份守望。"
 pf28_guide_shorekeeper_3_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_4_desc:0 "黑海岸的星图仍在向外延伸。继续把观测节点带到更多星球，让遥远的呼唤也能抵达索拉里斯。守岸人正在这些记录里，寻找每一道回应应有的位置。"
 pf28_guide_shorekeeper_4_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_5_desc:0 "守岸人把星序协响交到了你手中。关于共鸣的记录也已整理妥当，她想与你一起，让这份回应走出黑海岸，成为更多生命能够亲身触及的未来。"
 pf28_guide_shorekeeper_5_title:0 "守岸人的消息"
 pf28_guide_shorekeeper_6_desc:0 "索拉里斯的海岸近来很安静。守岸人正在那里写一首想弹给你听的曲子，也为你留了一段不被打扰的时光。下一次接通私人频道时，听听她想邀你去哪里。"
 pf28_guide_shorekeeper_6_title:0 "守岸人的消息"
 pf40_aemeath_suizhe_command:0 "星辉同调"
 pf40_aemeath_suizhe_command_desc:0 "爱弥斯的频率与拉海洛的核心保持同步，她的指令沿着每一条回路传至舰体。"
 pf44_everstar_route_1:0 "启明星航路"
 pf44_everstar_route_1_desc:0 "从索拉里斯的归航灯火出发，那道星辉已经照亮了更多文明的前路。爱弥斯与你共同守住的每一次黎明，都让这条航路伸向更远的群星。"
 pf44_everstar_route_2:0 "启明星航路"
 pf44_everstar_route_2_desc:0 "从索拉里斯的归航灯火出发，那道星辉已经照亮了更多文明的前路。爱弥斯与你共同守住的每一次黎明，都让这条航路伸向更远的群星。"
 pf44_everstar_route_3:0 "启明星航路"
 pf44_everstar_route_3_desc:0 "从索拉里斯的归航灯火出发，那道星辉已经照亮了更多文明的前路。爱弥斯与你共同守住的每一次黎明，都让这条航路伸向更远的群星。"
 pf54_institute_shipyards:0 "深空联合造舰协调"
 pf54_institute_shipyards_desc:0 "联合研究院的工程团队接入了轨道船坞，协调着各条生产线。"
 pf_aemeath_contact:0 "永远的启明星"
 pf_aemeath_contact_desc:0 "与爱弥斯保持联系。"
 pf_aleph_income:0 "阿列夫一的残余"
 pf_aleph_income_desc:0 "阿列夫一的残响沿着航道渗入国库，像一条永不枯竭的暗流。"
 pf_aleph_site:0 "阿列夫一：残存的声部"
 pf_aleph_site_desc:0 "位于“阿列夫一的残余”外侧的这颗小行星内部，隐藏着一座抗衡黑洞引力的精密人工掩体。其中的高频记录与封存物同黑洞本身的异常息息相关，只能由弗洛洛亲自主持考古发掘。"
 pf_aleph_star_lore:0 "阿列夫一的残余"
 pf_aleph_star_lore_desc:0 "曾执掌“虚无”、试图将万物拖入深渊的恐怖鸣式，如今在现实维度中只剩下了这颗形如死寂巨眼的超大质量黑洞。它的视界边缘仍在不断翻涌着高浓度的虚质与高维粒子。"
 pf_ame_contact_hint_desc:0 "稳定下来的频率中，传来了一段有趣的消息。信号彼端的声音正试着找到能够与你交流的方式，似乎也在等待你给出回应。"
 pf_ame_contact_hint_title:0 "异常频率中的消息"
 pf_ame_research_exchange:0 "异常频率交流"
 pf_ame_research_exchange_desc:0 "顺着加密频段传来的奇妙机甲调校心得与逆向工程笔记。虽然字里行间满是跳脱的批注，却为我们的科研人员打开了全新的解题思路。"
 pf_archives_restored:0 "重开的档案馆"
 pf_archives_restored_desc:0 "索拉里斯的调查记录已经重新归档。"
 pf_array_garrison:0 "防御阵列"
 pf_array_garrison_desc:0 "修复后的旧时代防御阵列重新接入了星系防御网，驻军与轨道火力得以相互支援。"
 pf_array_garrison_gestalt:0 "防御阵列"
 pf_array_garrison_gestalt_desc:0 "修复后的旧时代防御阵列重新接入了星系防御网，防卫子个体与轨道火力得以相互支援。"
 pf_array_platforms:0 "防御阵列"
 pf_array_platforms_desc:0 "庞大的旧时代防空基座在帝国工程师的手中重获新生。其深埋地下的强劲火控中继网络，已成为拱卫这片星空不可或缺的坚实支柱。"
 pf_array_platforms_ring:0 "防御阵列：星环协防"
 pf_array_platforms_ring_desc:0 "索拉里斯的星环基地与地表阵列协同运转，为星系防御网接入更多平台。"
 pf_b19_approach:0 "防线集结"
 pf_b19_approach_final:0 "最后准备"
 pf_b19_approach_middle:0 "防线加固"
 pf_b19_core_defense:0 "拟制炉芯·防御供能"
 pf_b19_core_defense_desc:0 "炉芯将稳定的能量流送入索拉里斯防御网络。"
 pf_b19_hold:0 "集结索拉里斯防线"
 pf_b19_hold_desc:0 "舰队正在集结，拟制炉芯为防御网络持续供能。"
 pf_b19_prepare:0 "帷幕外的双翼"
 pf_b19_prepare_desc:0 "守岸人确认，接收信号引来了来自星海边缘的古老生命。它们正在逼近索拉里斯。莫宁已将拟制炉芯接入当地防御网络，弗洛洛仍然在维持那道微弱的回应。我们还有时间把舰队集结到她们身边。"
 pf_b19_prepare_monthly_change_tooltip:0 "远方的双翼正在接近。莫宁维持着拟制炉芯的防御供能，守岸人继续追踪它们的航迹，为索拉里斯争取最后的准备时间。"
 pf_b19_prepare_type:0 "帷幕外的双翼"
 pf_b21_invitation_desc:0 "守岸人向你发来了一封简短而温和的邀请函。莫宁、弗洛洛和刚刚康复的达妮娅今晚都会到场，研究站的观测窗前已经为你留好了位置。\n\n索拉里斯的轨道航灯正静静亮着，等待你的赴约。"
 pf_b21_invitation_title:0 "索拉里斯的守岸人发来了邀请……"
 pf_b_archive_site:0 "废弃接收站"
 pf_b_archive_site_desc:0 "一座被封闭的旧接收站。断裂的输送管线通向地下，隔离墙后仍留有低功率设备运转的痕迹。残星会曾在这里研究来自虚质环境的信号。"
 pf_b_expedition_wait_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n隧者的残骸或许保存着缺失的结构记录。远征队仍在等待帝国掌握穿越虫洞的技术。"
 pf_b_expedition_wait_title:0 "莫宁的新进展·远方的接口"
 pf_b_forge_facility_1:0 "拟制炉芯·轨道框架"
 pf_b_forge_facility_1_desc:0 "环绕恒星的第一层主承力框架已完成合拢，重启的地下研究站正全力承担起轨道应力监测与后续转换设备的调试工作。"
 pf_b_forge_facility_2:0 "拟制炉芯·传输层"
 pf_b_forge_facility_2_desc:0 "多相态能量转换模块与超导传输层开始协同运转，地面研究站的实时校准数据正源源不断地汇入高轨控制网络。"
 pf_b_forge_facility_3:0 "拟制炉芯·稳定运转"
 pf_b_forge_facility_3_desc:0 "彻底竣工的拟制炉芯如同一颗新生的太阳，在索拉里斯的轨道上空平稳搏动。地面研究站与高轨转换网络已完美融为一体，源源不断地为世界注入光明与动力。"
 pf_b_local_research_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n她与研究团队正重新接通地下研究站，比对碎片与深空联合的旧图纸。"
 pf_b_local_research_title:0 "莫宁的新进展·旧图纸与新记录"
 pf_b_progress_06_restore_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n莫宁已整理好地下研究站的重启方案。她准备重新接通掩体电力，取回深空联合封存在地底的实验资料。"
 pf_b_progress_06_restore_title:0 "莫宁的新进展·重建研究站"
 pf_b_progress_07_recovery_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n地下研究站的资料库已重新开放。莫宁从中清点出了一批仍具实用价值的旧时代原型设备，正准备用现有技术重新检验它们。"
 pf_b_progress_07_recovery_title:0 "莫宁的新进展·旧技术回收"
 pf_b_progress_08_fragment_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n前期回收的结构资料已悉数摆上莫宁的案头。她准备将“拉海洛之心”碎片的实测数据与深空联合的旧图纸进行逐一比对。"
 pf_b_progress_08_fragment_title:0 "莫宁的新进展·碎片研究"
 pf_b_progress_09_tunnel_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n碎片与旧图纸的交叉核对已经完成。莫宁正准备循着残留的谐振信号，率队前往神秘地点的“隧者”残骸开展实地测绘。"
 pf_b_progress_09_tunnel_title:0 "莫宁的新进展·隧者远征"
 pf_b_progress_10_validation_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n远征科研船已带回“隧者”胸腔接口的完整测绘记录。莫宁正在将这些关键参数并入拟制炉芯的最终总装设计。"
 pf_b_progress_10_validation_title:0 "莫宁的新进展·联合验证"
 pf_b_progress_11_frame_desc:0 "莫宁向你提交了最终审定的轨道框架蓝图。索拉里斯的太空工程团队已经完成了第一批施工接口的预制，正在等待你下令批准高轨建设。"
 pf_b_progress_11_frame_title:0 "莫宁的研究有了新进展……"
 pf_b_progress_12_trial_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n索拉里斯的外围航道已恢复平静。莫宁希望趁此机会，对刚刚合拢的高轨主框架进行一次完整的全回路负载试验。"
 pf_b_progress_12_trial_title:0 "莫宁的新进展·运行试验"
 pf_b_progress_13_records_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n炉芯试运行的频谱中浮现出了一缕值得追索的异常波动。莫宁正与弗洛洛一起，在实验室里重新比对那段从神秘地点带回的旧录音。"
 pf_b_progress_13_records_title:0 "莫宁的新进展·记录比对"
 pf_b_progress_14_archive_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n旧档案中的线索指向了一座深埋裂谷的封闭接收站。莫宁希望派人前往发掘，从残留的数据库中找回缺失的终端接收参数。"
 pf_b_progress_14_archive_title:0 "莫宁的新进展·接收站档案"
 pf_b_progress_15_half_desc:0 "高轨主框架顺利通过了首次负载试验，外围航道的威胁也已肃清。莫宁与工程团队已整理好二期超导传输层的施工方案，等待你批准继续推进这项宏大工程。"
 pf_b_progress_15_half_title:0 "莫宁从索拉里斯发来了消息……"
 pf_b_progress_16_core_desc:0 "旧接收站的底层档案已全数送回索拉里斯，莫宁也完成了最后一道双向接口的复核，守岸人则维持着星球的供能和轨道防御网络，拟制炉芯的最终合拢整合工作现已准备就绪。"
 pf_b_progress_16_core_title:0 "守岸人发来了消息……"
 pf_b_progress_18_prepare_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n弗洛洛与莫宁已确认了那道微弱频率。莫宁正在全力改造地面接收室，做好最后的供能与隔离准备。"
 pf_b_progress_18_prepare_title:0 "莫宁的新进展·接收准备"
 pf_b_progress_19_start_desc:0 "莫宁在索拉里斯上的项目有了新进展……\n\n跨维度接收设备的点检已经全部完成。莫宁、弗洛洛与守岸人正守在索拉里斯的控制室内，等待你下达最后的启动确认。"
 pf_b_progress_19_start_title:0 "莫宁的新进展·等待回应"
 pf_b_raid_11_retry_desc:0 "索拉里斯外围轨道仍有残余的掠夺者舰队游荡。守岸人已重新标定了剩余敌军的坐标分布，等待你重整当地防线、夺回制空权。"
 pf_b_raid_11_retry_title:0 "守岸人发来了航道警报……"
 pf_b_raid_15_retry_desc:0 "第二批来犯的重型袭击舰队仍未撤离索拉里斯星系。守岸人正全力维持外围监听网的运转，等待你重整防线、再次组织迎击。"
 pf_b_raid_15_retry_title:0 "守岸人发来了新的航道警报……"
 pf_b_receive_ready_desc:0 "莫宁、弗洛洛与守岸人已经完成了跨维度接收前的全部设备自检。她们正守在接收室的通讯终端前，等待你下达最后的启动指令。"
 pf_b_receive_ready_title:0 "索拉里斯的接收室已经准备就绪……"
 pf_b_research_station:0 "重启的地下研究站"
 pf_b_research_station_desc:0 "深埋冰原之下的旧深空联合研究站重新亮起了灯光。在莫宁的主持下，沉寂多年的实验设备恢复运转，新一代的研究人员开始在此接续前人未竟的求索。"
 pf_battlefield_lore:0 "破碎战场"
 pf_battlefield_lore_desc:0 "一颗在远古激战中被硬生生打碎的天体，周围环绕着无数早已被彻底冻僵的舰船龙骨与装甲碎片。真空完美地保存了防线崩溃那一刻的惨烈轮廓，这里没有预想中的激战和警报，只有一曲早已终结的钢铁挽歌。"
 pf_battlefield_map_label:0 "破碎战场"
 pf_blackshore_empire:0 "黑海岸的守望"
 pf_blackshore_empire_desc:0 "海风轻拂过重建的街巷，带来了属于新时代的生机。在那位熟悉故人的亲自坐镇与守望下，整颗星球的政务与科研都在有条不紊地高效运转。"
 pf_blackshore_watch:0 "黑海岸的守望"
 pf_blackshore_watch_desc:0 "索拉里斯庞大而精密的地下演算网络已与帝国的行政中枢实现对接。那位静默的守望者正如同一座不灭的灯塔，为整个国度的航向提供着精准的指引。"
 pf_defense:0 "迫近的威胁"
 pf_defense_desc:0 "拉海洛之心的脉动，正引来彼端愈发清晰的注视。观测站记录到不断增强的空间扰动，索拉里斯的防线需要尽快集结；那道恶意的回应，已经在索拉里斯之庭靠近。"
 pf_defense_emergency:0 "紧急筹备"
 pf_defense_emergency_desc:0 "以现有驻防力量建立紧急警戒，优先加固舰体与装甲，让索拉里斯在援军集结前守住第一道防线。"
 pf_defense_full:0 "全力投入"
 pf_defense_full_desc:0 "将防务列为最高优先事项，集中资源强化索拉里斯驻军，并为舰队建立更灵活的战术机动空间。"
 pf_defense_monthly_change_tooltip:0 "虫洞彼端的空间扰动仍在增强。索拉里斯的驻防力量正抓紧时间，准备迎接即将到来的威胁。"
 pf_defense_platform_construction:0 "索拉里斯防御平台筹备"
 pf_defense_prepare:0 "防御准备"
 pf_defense_standard:0 "标准投入"
 pf_defense_standard_desc:0 "按计划调配能源与合金，完成舰队检修、星港加固和补给储备，为即将到来的正面交锋做好准备。"
 pf_defense_type:0 "迫近的威胁"
 pf_echo_final:0 "终焉的回响"
 pf_echo_final_desc:0 "跨越漫长孤寂的星辉终于降临，困扰这颗星球许久的狂躁残响已化作温顺的春风。过去的苦难不再是梦魇，而是滋养新生的温柔底色。"
 pf_echo_relief:0 "未校准的回响·缓解"
 pf_echo_relief_desc:0 "经过大规模的人工调律，刺耳的悲鸣余波已被成功压制。虽然旧日的回响仍未彻底散去，但它已不再能够淹没新城市里的欢声笑语。"
 pf_echo_tides:0 "残响潮汐"
 pf_echo_tides_desc:0 "如同永不停歇的海浪，地脉深处的回音能量仍在周期性地涨落。这种奇特的物理现象虽然令人不安，却也向学者们敞开了一扇窥视宇宙本源的窗口。"
 pf_echo_uncalibrated:0 "未校准的回响"
 pf_echo_uncalibrated_desc:0 "大气与地壳中弥漫着尚未完全平息的旧日杂音。怪异的磁暴与微小的空间扭曲仍在时刻上演，令开拓者的日常生活充满了严酷的挑战。"
 pf_everstar_active:0 "启明星的指引"
 pf_everstar_active_desc:0 "那颗跨越漫长孤寂的启明星在星图上投下了一道温暖而耀眼的轨迹，为穿行于未知深空的探索者们照亮了前行的航向。"
 pf_flavor_defense:0 "自动防御系统残留"
 pf_flavor_defense_desc:0 "被重新写入识别码的旧时代自律机兵，成为了驻地守军最无情的战术陪练。高强度的实兵对抗，正迅速磨砺着防卫部队的锋芒。"
 pf_flavor_flowers:0 "彼岸花海异常绽放"
 pf_flavor_flowers_desc:0 "荒原上盛放的黑红色花海，成为了开拓者们在沉重劳作之余的心灵寄托。这片跨越灾厄的静谧奇景，让人们重新找回了对生活的热忱。"
 pf_flavor_logs:0 "失落的遗民日志"
 pf_flavor_logs_desc:0 "从避难所中抢救出的民间日志，为研究院提供了极其宝贵的一手资料。旧日居民应对极端环境的实用智慧，激发了研究员们的诸多灵感。"
 pf_flavor_research:0 "残响中的低语"
 pf_flavor_research_desc:0 "学者们正在对旧水渠中周期性响起的谐振低语进行持续测绘。对回音衰变规律的直观观测，极大拓宽了物理学界的认知边界。"
 pf_flavor_shadow:0 "回声中的身影"
 pf_flavor_shadow_desc:0 "那道在废墟浓雾中默默为巡逻队指路的神秘身影，被居民们视作这片土地的守望者。巡逻队说，只要那道身影还在，路就没有走错。"
 pf_flavor_storm:0 "频率风暴"
 pf_flavor_storm_desc:0 "工程师们利用频率风暴留下的过载数据，对旧时代的地下导流槽进行了针对性改造，它们的重新运转，让城市电网焕发出新的活力。"
 pf_forge_core:0 "拟制炉芯"
 pf_forge_core_DESC:0 "由莫宁主持、以深空联合研究和帝国工业共同建成的拟制炉芯。核心碎片与新的结构一同运转，持续供给能量，并为进一步研究提供稳定条件。"
 pf_forge_frame:0 "拟制炉芯框架"
 pf_forge_frame_DESC:0 "拟制炉芯的轨道框架。工程船沿着标定的接口安装设备，来自地表的研究记录正被转化为实际结构。"
 pf_forge_half:0 "半完成的拟制炉芯"
 pf_forge_half_DESC:0 "能量传输与转换装置已经陆续接入。炉芯在持续测试中输出光与热，内部控制网络仍在等待最后的整合。"
 pf_ghost_fleet:0 "幽灵频率"
 pf_ghost_fleet_desc:0 "受控的通讯矩阵正持续向星海播送着经过加密调制的特殊信号。那轻快而坚定的频率如同黑夜中的启明星，时刻指引并守护着这片领空。"
 pf_ghost_frequency:0 "幽灵频率"
 pf_ghost_frequency_desc:0 "一段源自电子海深处的特殊频段已接入帝国的战略指挥网。这道无形的波纹正如同幽灵的披风，在危急关头庇护着远航舰队与母星的安危。"
 pf_heart_active:0 "拉海洛之心启用"
 pf_heart_active_desc:0 "那颗跨越虚空的炉芯仍在搏动，像一枚被遗忘在星海深处的心脏。"
 pf_heart_legacy:0 "拉海洛之心的遗产"
 pf_heart_legacy_desc:0 "从拉海洛之心的拆解记录中整理出的结构与能量转换知识，正在为帝国的研究提供新的方向。"
 pf_institute_empire:0 "$pf_institute_rebuilt$"
 pf_institute_empire_desc:0 "$pf_institute_rebuilt_desc$"
 pf_institute_rebuilt:0 "重建的深空联合研究院"
 pf_institute_rebuilt_desc:0 "六座继承了旧世界最高技术结晶的尖端设施已在地表拔地而起。这座横跨多个学科的庞大联合体，正源源不断地将古人智慧转化为前行的动力。"
 pf_island_lore:0 "残响孤岛"
 pf_island_lore_desc:0 "一块漂浮在巨型黑洞外围的特殊小行星。粗糙的岩层下包裹着明显的人工掩体结构，那些无法回归故土的古老记录与核心造物便封存在其深处，等待着科研船的实地发掘。"
 pf_journey_chain_desc:0 "弗洛洛将沿途听见的残响留在了这份记录里。从索拉里斯的旧日废墟，到阿列夫一边缘尚未平息的回声，这段旅途仍有未被听清的声音，等待你们继续追索。"
 pf_journey_chain_title:0 "弗洛洛：彼岸旅程"
 pf_local_emergency:0 "索拉里斯紧急防御"
 pf_local_emergency_desc:0 "索拉里斯的航标转为警戒色。值勤舰封闭外舱，星港里最后一批焊工沿着刚补好的装甲撤回闸门。"
 pf_local_full:0 "索拉里斯全力防御"
 pf_local_full_desc:0 "恒星基地和各舰桥接入同一条战术频道。引航灯沿防线依次转向，为即将变阵的舰队留出一条通道。"
 pf_local_standard:0 "索拉里斯防御准备"
 pf_local_standard_desc:0 "运送备件的驳船穿梭在泊位之间。每交回一张检修单，轨道上便又亮起一艘舰船的就绪灯。"
 pf_math_instrument_active:0 "宙算仪轨运行"
 pf_math_instrument_active_desc:0 "这柄修长如星轨指针的测算武装已在最高功率下展开，核心周围悬浮的棱晶正与高轨炉芯高频同步，为帝国的能源调配、前沿演算与巨型工程提供着精密无误的全局指引。"
 pf_new_solaris:0 "新索拉里斯"
 pf_new_solaris_desc:0 "这段纪念已融入一张送出的门票。"
 pf_old_memories:0 "层叠的旧日"
 pf_old_memories_desc:0 "七段相连的记录已被重新读懂。旧世界留下的城市格局与规划经验，正从残响中的往事，成为索拉里斯重建的基石。"
 pf_pollution_cleared:0 "复原的地表"
 pf_pollution_cleared_desc:0 "盘踞在盆地中的扭曲残像已被连根拔除。那些曾令人毛骨悚然的致命禁区终于重见天日，化作了可供城市自由向外舒展的广阔疆域。"
 pf_resonator_group_aquatic:0 "共鸣者（$AQUATIC$）"
 pf_resonator_group_aquatic_desc:0 "共鸣者外观组，沿用$AQUATIC$的物种分类。"
 pf_resonator_group_art:0 "共鸣者（$ART$）"
 pf_resonator_group_art_desc:0 "共鸣者外观组，沿用$ART$的物种分类。"
 pf_resonator_group_avi:0 "共鸣者（$AVI$）"
 pf_resonator_group_avi_desc:0 "共鸣者外观组，沿用$AVI$的物种分类。"
 pf_resonator_group_biogenesis_01:0 "共鸣者（$BIOGENESIS_01$）"
 pf_resonator_group_biogenesis_01_desc:0 "共鸣者外观组，沿用$BIOGENESIS_01$的物种分类。"
 pf_resonator_group_fun:0 "共鸣者（$FUN$）"
