 PF22_passage_1:0 "“通行本身不会有任何问题，我已经用索拉里斯的基准频率把通道内壁加固过了，只要不是故意关掉导航引擎往墙上撞，你的船队都能全须全尾地过去。”\n\n弗洛洛用指尖敲了敲屏幕上另一端那片完全漆黑的星图区域，语气多了几分冷淡的提醒。\n\n“但‘安全通过’不代表那边是一座铺好地毯的后花园。通道彼端没有任何现成的哨站，也没有接入超空间航道网。船只过去之后，依然需要从零开始测绘天体、排查异常。别把我的调律当成免死金牌，探索未知的规矩，你应该比我更清楚。”"
 PF22_passage_2:0 "“如果我能隔着一道虫洞看清所有底牌，现在就不用费尽心思把门打开了。”\n\n弗洛洛轻哼了一声，将几段从裂隙深处截获的微弱脉冲放大到你面前。那是一些极度深沉、仿佛被极大质量天体拉长扭曲过的残碎频段。\n\n“从泄露过来的声部来看，那边只有一片死寂的空洞，以及几段早就失去归处的古老回声。它们有的来自很久以前，有的……还在固执地重复着同一个节拍。我不喜欢拿没验证过的猜测当结论。先派一艘船过去替我们睁开眼吧，等拿到了第一手现场记录，我们再好好聊聊那边到底藏着什么。”"
 PF22_passage_back:0 "关于这条通道，我还想问问。"
 PF22_passage_confirm:0 "出发。"
 PF22_passage_depart:0 "弗洛洛随手关掉了身后的波形分析界面，嘴角勾起一抹浅淡的弧度。\n\n“很干脆的决定。那么，下达跃迁指令吧——我会盯紧这扇门的稳定性，顺便期待着你的船队能给我带回几份足够精彩的乐谱。”"
 PF22_passage_menu:0 "弗洛洛将双臂抱在胸前，身后全息屏上的双端波形图正平稳地跳动着。“还有什么顾虑就一并问出来吧。在正式登台前把细节确认清楚，总好过半路踩空。”"
 PF22_passage_question_0:0 "通道稳定后，舰船就能安全通过了吗？"
 PF22_passage_question_1:0 "另一端会有什么？"
 PF22_passage_talk:0 "在出发前，先听听你的判断。"
