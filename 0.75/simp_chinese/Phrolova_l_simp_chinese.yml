 PF_SK_ACCEPT_INVITATION:0 "我来赴约了。"
 PF_SK_ACTIVATION_DESC:0 "伴随着低沉而稳定的嗡鸣，人造星光从地下穹顶的一端依次亮起，顺着重新铺设的能量回路漫延开来，将整座黑海岸观测大厅映照得如同不夜的星河。\n\n值守的新成员报出了第一组跨星系观测结果。守岸人认真听完，然后嘱咐他将未经修饰的原始环境记录也一并妥善保存。\n\n曾经，为了对抗泰缇斯以悲鸣预测悲鸣的残酷回环，她不得不化作核心介质，任由汹涌的灾难数据将自己的能量体冲刷得碎裂脱落；而此刻，站在经过校准与改良的新系统前，她走到你身边，目光仍停留在穹顶那片璀璨的星空上：\n\n“我认得这里曾经孤寂的样子，也记得每一颗星星代表的名字。接下来，我们会一起看见它变成什么模样。”"
 PF_SK_ACTIVATION_REPLY:0 "开始今天的观测吧。"
 PF_SK_ACTIVATION_TITLE:0 "泰缇斯重新启用"
 PF_SK_AFTER_CONCERT_DESC:0 "“那张回音唱片还在继续记录。最近，一位驻守在远方节点的新成员，给我寄来了当地雨季第一场春雷的声音。”\n\n守岸人把一页新写好的谱子轻轻放在琴架上，转过头向你微笑。\n\n“只要记录者仍在，只要我们的旅途还没有停下，这张唱片就会一直更新下去。我想再写一首新曲子，写完以后，也先弹给你听。”"
 PF_SK_AWAKENING_SURVEY:0 "担任科研船主管时，失踪耗时§G-75%§!；勘测合适且尚无异常的天体，有额外§G10%§!机会发现战略资源线索。"
 PF_SK_CONVERSION_DESC:0 "观测网已经准备好接收新的回应。\n\n守岸人将几种稳定的频率显现方式交到你面前。现在，你可以为自己的同伴选择适合他们的形态。"
 PF_SK_CONVERSION_EFFECT:0 "共鸣者物种特性与领袖共鸣觉醒已解锁。可在物种界面创建模板，自由更换共鸣者肖像。"
 PF_SK_CONVERSION_OPEN:0 "关于共鸣者的频率适应……"
 PF_SK_CONVERSION_TITLE:0 "共鸣者"
 PF_SK_CONVERTED_DESC:0 "新的频率已经稳定。\n\n有人仍在适应变化，有人已经迫不及待地开始了第一次尝试。来自观测站的确认消息一条接着一条，最后汇入索拉里斯的记录。\n\n守岸人读完回报，将终端轻轻放下。\n\n“我会记住今天。”"
 PF_SK_CONVERTED_REPLY:0 "我们一起见证了它。"
 PF_SK_CONVERTED_TITLE:0 "同一片星海之中"
 PF_SK_COUNCIL_LEADER:0 "由守岸人担任。"
 PF_SK_COUNCIL_UNLOCK:0 "星图中的位置"
