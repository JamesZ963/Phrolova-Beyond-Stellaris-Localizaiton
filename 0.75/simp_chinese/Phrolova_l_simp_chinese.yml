 PF17_branch_aemeath_reply:0 "“想打听什么情报？只要不是问我生前的期末考试分数，我都知无不言哦～”"
 PF17_branch_denia:0 "关于这件事，我还想问得更详细些。"
 PF17_branch_denia_0:0 "有什么是我们应当记住的？"
 PF17_branch_denia_0_reply:0 "“记住那些漂亮的谎言就够了哦。”\n\n达妮娅习惯性地歪了歪头，脸上的笑容甜美得无懈可击。\n\n“毕竟，真相往往既残忍又毫无意义。如果有人愿意为了你编织一个温柔的美梦，哪怕明知是假的，把它当成真的记在心里，不是也会稍微幸福一点吗？”"
 PF17_branch_denia_1:0 "你会怎样面对接下来的旅程？"
 PF17_branch_denia_1_reply:0 "“接下来的旅程？唔……我想先把今天过好。”\n\n达妮娅拨弄着指尖的一颗小小泡泡，看它映出舷窗外的星光。\n\n“以前总有人告诉我，我该成为什么、最后又该走到哪里。现在难得能自己选，我可不想急着给未来写好结局。”\n\n她抬起眼，笑意比刚才认真了一点。\n\n“你们要向前走的话，就给我留个位置吧。我会跟上的。当然，休息和甜点也不能少哦。”"
