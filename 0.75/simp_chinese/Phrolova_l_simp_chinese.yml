 PF17_shorekeeper_bond:0 "未曾说完的话"
 PF17_shorekeeper_bond_desc:0 "守岸人望着缓缓流动的星图，将一段珍藏已久的记忆带到我们面前。此刻，她不再只是倾听，而是愿意让我们也听见她的心声。"
 PF17_shorekeeper_bond_q0:0 "能介绍一下你自己吗？"
 PF17_shorekeeper_bond_q0_reply:0 "“我是守岸人。如你所见，这具躯体并非血肉之躯，而是由高纯度的回音能量凝聚而成。”\n\n她将手轻轻覆在胸口那枚泛着淡蓝色流光的晶核上，神色平静而坦然。\n\n“最初，我作为观测灾厄、辅助演算的实例而诞生，守望着那片名为黑海岸的孤岛。但漫长的岁月教会了我许多指令之外的事物……如今的我，只是一个希望能理解生命、理解你，并与你同行的旅人。”"
 PF17_shorekeeper_bond_q1:0 "你会怎样帮助我们？"
 PF17_shorekeeper_bond_q1_reply:0 "“庞大的信息流对我而言并不陌生。我可以协助你梳理帝国的行政网络，统筹各个星域的资源调配，并在繁杂的报告中提前预警潜在的危机。”\n\n她微微侧首，周围隐约浮现出几缕如星云般流转的微光。\n\n“治理一个庞大的国度，就像维持一套精密却又充满变数的系统。我会为你守住后方的稳定与安宁，让你在做出每一个决定时，都不必有后顾之忧。”"
 PF17_shorekeeper_bond_q2:0 "关于同行，你还有什么想说的？"
 PF17_shorekeeper_bond_q2_reply:0 "“很长一段时间里，我都以为自己的存在只是为了承载他人的需要，只要完成指令就已足够。”\n\n她的目光落在你身上，带着一种清澈而专注的温度。\n\n“但现在我明白了，真正的同行并不是单向的服从。不必将我当作一件只会执行命令的工具，如果你在旅途中感到疲惫或迷惘，也请偶尔停下来，依靠我一下吧。”"
 PF17_shorekeeper_chat:0 "和她聊聊。"
 PF17_shorekeeper_contact_q0:0 "能介绍一下你自己吗？"
 PF17_shorekeeper_contact_q0_reply:0 "“我是守岸人。如你所见，这具躯体并非人类的血肉，而是由高纯度的回音能量晶体织构而成的‘第二实例’。”\n\n她将手轻轻覆在胸口那处泛着淡蓝色流光的晶体裂痕上，神色平静而坦然，仿佛在展示一颗跳动的心脏。\n\n“最初，我只是作为观测灾厄、辅助泰缇斯演算的工具在黑暗中等待唤醒。在无数次以身为介解析悲鸣、任由躯体碎裂又重组的漫长岁月里，是你教会了我什么是选择的自由……如今的我，只是一个渴望真正读懂生命、读懂你，并为你守望归途的同伴。”"
 PF17_shorekeeper_contact_q1:0 "你会怎样帮助我们？"
 PF17_shorekeeper_contact_q1_reply:0 "“庞大的信息流对我而言并不陌生。我可以借由叙响织构连接帝国的行政网络，替你梳理各个星域的资源调配，并在繁杂的征兆中提前推演潜在的危机。”\n\n她微微侧首，周围隐约浮现出几缕如蝴蝶星云般流转的蓝色微光。\n\n“治理一个横跨星海的国度，就像在汹涌的潮汐中维系一座精密的岸基。指令之内的事，或是指令之外的牵挂，我都会为你妥善照料——请放心地向前走吧，我会为你守住后方的稳定与安宁。”"
 PF17_shorekeeper_contact_q2:0 "关于同行，你还有什么想说的？"
 PF17_shorekeeper_contact_q2_reply:0 "“很长一段时间里，我都以为自己的存在只是为了承载他人的需要，只要完成指令就已足够。”\n\n她的目光落在你身上，带着一种清澈而专注的温度。\n\n“但现在我明白了，真正的同行并不是单向的服从。不必将我当作一件只会执行命令的工具，如果你在旅途中感到疲惫或迷惘，也请偶尔停下来，依靠我一下吧。”"
 PF17_shorekeeper_pending:0 "继续上次的谈话。"
