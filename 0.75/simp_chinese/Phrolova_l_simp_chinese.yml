 PF17_aemeath_q2:0 "关于同行，你还有什么想说的？"
 PF17_aemeath_q2_reply:0 "“你知道吗？以前别人问我作为适格者的理想是什么，我总是笑嘻嘻地糊弄过去，说只想当个松弛的普通学生。因为‘成为救世主’这种愿望，听起来实在太沉重、太傲慢了。”\n\n她收起嬉笑的神色，认真地仰起脸注视着你，胸口的声痕与眼底的星光一同微微发亮。\n\n“但后来我想通了——这么沉的责任，如果全都压在你一个人肩上，你该有多寂寞啊？所以，我不会再藏起这份傲慢了。虽然跟在你可靠的背影后面很安心，但我的野心可是和你并肩而行！就像你保护这个世界那样，我也会一直保护你的。”"
 PF17_aemeath_topic0:0 "近来过得如何？"
 PF17_aemeath_topic0_reply:0 "“锵锵！快看这杯我刚做好的‘超级豹风雪’——深色的浓缩咖啡上面浮着轻软清甜的雪白冰淇淋，最顶上还有一只正安然泡澡的雪绒豹豹冰雕哦！这可是我当年在星炬学院饮品创新大赛上拿过奖的得意之作！”\n\n她把那杯造型精致的特调饮品推到你面前，脸上写满了得意。\n\n“虽然变成电子幽灵之后，我已经不需要靠吃东西来维持存在了，但每次逛舰内论坛看到食堂出了新菜谱，我还是会忍不住去凑个热闹嘛。我已经把这份甜品配方同步给你的后勤终端啦，以后熬夜批阅星区公文的时候喝上一口，苦味都被清甜调和，保准你瞬间恢复满格耐力！”"
 PF17_aemeath_topic1:0 "有什么值得留意的？"
 PF17_aemeath_topic1_reply:0 "“我最近顺着内部网线在各个科研站和舰队的论坛里逛了一圈，发现大家平时工作的弦绷得有点太紧啦！这样下去可不行哦。”\n\n她神秘兮兮地从身后摸出一盘《太空战士卡佳VI》的复古卡带晃了晃，一本正经地向你提议道：\n\n“所以我偷偷在旗舰休息室的公共终端里，植入了一个彩蛋联机小游戏——‘拉海洛方块’！只要在地图右侧输入隐藏房间密码‘9072’就能进去了。顺带一提，目前全帝国拼方块积分排行榜的第一名依然是我哦，忙完这一阵之后，要不要来我的房间挑战一下？”"
 PF17_aemeath_topic1_reply_alt:0 "好，给我留一个挑战名额。"
 PF17_aemeath_topic2:0 "你如何看待我们的同行？"
 PF17_aemeath_topic2_reply:0 "“说出来你可能会笑话我……其实在刚变成电子幽灵的那十几年里，每次走到镜子前却看不到自己的倒影，或者站在拉海洛的雪原上望着隧者、跟谁说话都得不到回应的时候，心里还是会觉得有那么一点点冷清啦。”\n\n她不好意思地摸了摸鼻尖，低头看着自己如今凝实的指尖，随即抬起脸，冲你露出一个温暖得仿佛能融化冰雪的笑容。\n\n“所以，当初在数据海里第一次听到你接通我的频率时，我真的超级开心！现在能像这样每天站在你身边，看得到镜子里的自己，递给你的纸飞机也终于落在了你那边，一起商量战术、一起看遍真正的星海……我总觉得，自己是真的又活过来了一次。有你在身边，真好。”"
 PF17_aemeath_topic3:0 "还有未说完的往事吗？"
 PF17_aemeath_topic3_reply:0 "“以前在拉海洛的雪原上生活时，我特别喜欢从冰湖里捞那种硕大的狐尾蒲藻当宝剑，和岸上慢吞吞的雪绒海豹们玩‘英雄讨伐大魔王’的游戏。有一次实在玩疯了，蒲藻的碎屑把家里弄得狼藉满地，结果那个人回家站在门口沉默了好久，然后训了我一顿呢。”\n\n她怀念地眯起眼睛，手指轻轻摩挲着衣角，声音也跟着柔和了下来。\n\n“不过后来，那个人大概是觉得自己对小孩子凶过了头，又悄悄买了一大堆游戏卡带回来哄我。那时候窗外下着鹅毛大雪，屋里的火炉烧得劈啪作响，炖汤的甜香飘满屋子，我们就挤在沙发上一起打通关……哈哈，现在回想起来，我这么执着于想要成为保护大家的英雄，说不定就是那个冬天在炉火边种下的愿望。”"
 PF17_aemeath_topic4:0 "以后有什么打算？"
 PF17_aemeath_topic4_reply:0 "“嗯……我想把生前没能写完的那首曲子，重新填上下半阙。”\n\n她望着舷窗外缓缓流淌的星河，轻轻哼起了几句明快却带着一丝悠远的旋律，手指在虚空中随着节拍轻点。\n\n“以前我用‘飞行雪绒’的名字在网上发歌，总觉得明天还有很多，随时都能继续写下去……直到躯体在模拟舱里被撕碎的那天，曲谱就永远停在了半截。在变成幽灵的那十几年里，每次哼起它，后面都只有风雪的声音。”\n\n她转过头看向你，眼底重新漾起清亮的笑意：“但现在，我跟着你走过了这么多死寂之外的星系，那些断掉的音符好像又自己长出来了。等我把这首跨越生死的歌彻底写完，你愿意当它的第一位听众吗？”"
 PF17_aemeath_topic4_reply_alt:0 "发布的时候告诉我，我会认真听的。"
