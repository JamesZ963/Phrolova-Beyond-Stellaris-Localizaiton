 PF_PHX_HOME_DESC:0 "失亡彼岸的街道重新亮起了温暖的灯火。不再是迷雾中停滞的幻影，由帝国工程与频率重构技术共同筑起的屋舍间，传来了久违的笑语与琴音。\n弗洛洛停在你身旁，破天荒地没有立刻开口。她望向熟悉的街角与澄澈的晴空，屏住呼吸，像是在确认一场终于落进现实的梦。"
 PF_PHX_HOME_REWARD_TT:0 "索拉里斯的§Y层叠的旧日§!升级为§Y重现的故乡§!。"
