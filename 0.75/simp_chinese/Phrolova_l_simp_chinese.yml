 pf_rest_lore:0 "安息地"
 pf_rest_lore_desc:0 "这颗彻底崩坏的星球早已失去了大气与地质活性，裸露在外的灰白地壳断面宛如一页没有写完的墓志铭。它安静地停留在黑洞的阴影之下，不再回应任何来自星海的呼唤。"
 pf_rest_map_label:0 "安息地"
 pf_ruin_01_restored:0 "修复的观测穹顶"
 pf_ruin_01_restored_desc:0 "重新校准的穹顶恢复了天文观测职能。"
 pf_ruin_01_restored_gestalt:0 "修复的观测穹顶"
 pf_ruin_01_restored_gestalt_desc:0 "重新校准的穹顶恢复了天文观测职能，为格式塔的集体意识提供新的观测视角。"
 pf_ruin_02_restored:0 "重开的运输枢纽"
 pf_ruin_02_restored_desc:0 "重新开放的运输枢纽将物资及时送往各处工地。"
 pf_ruin_03_restored:0 "校准的共鸣阵列"
 pf_ruin_03_restored_desc:0 "失谐的阵列重新对齐，旧日设施恢复了协调运转。"
 pf_ruin_04_restored:0 "结晶城"
 pf_ruin_04_restored_desc:0 "结晶城重新迎来居民与商旅，旧日的街区成为新的居所和市场。"
 pf_ruin_05_restored:0 "资料库"
 pf_ruin_05_restored_desc:0 "整理后的资料库保存着索拉里斯的旧日研究，也为新的研究提供了起点。"
 pf_ruin_05_restored_gestalt:0 "资料库"
 pf_ruin_05_restored_gestalt_desc:0 "整理后的资料库保存着索拉里斯的旧日研究，也为新的研究提供了起点。"
 pf_ruin_06_restored:0 "重启的深空港"
 pf_ruin_06_restored_desc:0 "废弃泊位重新开放，商贸与物流再次在此汇聚。"
 pf_ruin_06_restored_gestalt:0 "重启的深空港"
 pf_ruin_06_restored_gestalt_desc:0 "废弃泊位重新开放，补给与物流重新在此汇聚。"
 pf_ruin_07_restored:0 "黑潮观测站"
 pf_ruin_07_restored_desc:0 "黑潮边缘架起了监测站，持续记录着深渊的潮汐。"
 pf_ruin_07_restored_gestalt:0 "黑潮观测站"
 pf_ruin_07_restored_gestalt_desc:0 "黑潮边缘架起了监测站，持续记录着深渊的潮汐。"
 pf_ruin_08_restored:0 "修复的能源管线"
 pf_ruin_08_restored_desc:0 "断裂的管线重新接通，稳定的能量流再次穿行于地下网络。"
 pf_ruin_09_restored:0 "生态庭院"
 pf_ruin_09_restored_desc:0 "生态庭院重新开放。栽培设施与公共绿地为居民提供食物，也为生活留出一片安静的空间。"
 pf_ruin_09_restored_gestalt:0 "生态庭院"
 pf_ruin_09_restored_gestalt_desc:0 "生态庭院重新开放。栽培设施与公共绿地为居民提供食物，也为生活留出一片安静的空间。"
 pf_ruin_10_restored:0 "巨型地下运输网络"
 pf_ruin_10_restored_desc:0 "纵贯地下的巨型运输网络让设施维护所需的设备和物资得以高效流通。"
 pf_ruin_11_restored:0 "校准的引力锚"
 pf_ruin_11_restored_desc:0 "紊乱的引力场恢复稳定，矿脉再次变得可及。"
 pf_ruin_11_restored_gestalt:0 "校准的引力锚"
 pf_ruin_11_restored_gestalt_desc:0 "紊乱的引力场恢复稳定，矿脉再次变得可及。"
 pf_sent_ticket_active:0 "赴约的回响"
 pf_sent_ticket_active_desc:0 "那场终于兑现的邀约，成为了人们继续创造明天的动力。"
 pf_sk_active_nodes:0 "接入星图的黑海岸网络节点§G"
 pf_sk_central_build_desc:0 "旧观测中心的场址已重新清理出来，守岸人也安置好了仍被保存的记录。潮汐测量中枢与泰缇斯系统将在索拉里斯接续这份守望，海岸边的工程队正等待重建的安排。"
 pf_sk_central_build_title:0 "重新亮起的观测中心"
 pf_sk_gestalt_coordination:0 "黑海岸的观测者"
 pf_sk_gestalt_coordination_desc:0 "守岸人以叙响织构将黑海岸观测网深度接入集体的协调体系。"
 pf_sk_highest_invitation_desc:0 "守岸人为你准备的曲子，落下了最后一个音符。她希望在索拉里斯的海岸边亲自弹给你听。接通她的私人频道，回应这封仍为你保留的邀请。"
 pf_sk_highest_invitation_title:0 "索拉里斯的守岸人发来了邀请……"
 pf_sk_network_desc:0 "来自远方的黑花正沿着航路陆续亮起。各地的观测记录汇入索拉里斯，也将沿途尚未听清的呼唤送回海岸。守岸人希望更多星球能够接入，让这些目光彼此照应。"
 pf_sk_network_income:0 "黑海岸观测网"
 pf_sk_network_income_desc:0 "各殖民地的实地观测与演算在索拉里斯汇总，佩戴黑花的成员们由此共同承担起日益辽阔的星海守望。"
 pf_sk_network_title:0 "黑海岸观测网"
 pf_sk_resource_echo:0 "频率中的资源线索"
 pf_sk_resource_echo_desc:0 "在常规勘测记录之外，科研领队循着守岸人传授的频率溯源法，察觉到一组稳定而细微的岩层脉动。其源头正藏着尚未被识别的战略资源。"
 pf_sk_science_mia:0 "共鸣导航"
 pf_sk_science_mia_desc:0 "科研船搭载的黑海岸频率信标，能帮助舰船在亚空间乱流中迅速锚定归途，大幅缩短失踪后的返航时间。"
 pf_sk_stage_1_desc:0 "守岸人送来了旧黑海岸观测中心的记录。废墟里还留着故人的声音，也留着能够重新使用的观测设施。她想与你商量修复这里的安排，让新的执花有一个开始守望的地方。"
 pf_sk_stage_1_title:0 "重新出现的声音"
 pf_sk_stage_2_desc:0 "地面观测员带回了一些出乎泰缇斯预料的发现。守岸人希望把这些记录逐一核验，再将黑海岸的观测与联络延伸到远方。她已在私人频道里留好了相关资料，等你听听这项新的提议。"
 pf_sk_stage_2_title:0 "预测之外"
 pf_sk_stage_3_desc:0 "星图上的回应越来越多，新的成员也在尝试彼此引航、核验预警与接续救助。守岸人整理了他们的经历，想与你谈谈，如何让这份守望由更多人一同承担。"
 pf_sk_stage_3_title:0 "分担守望"
 pf_sk_stage_4_desc:0 "来自各地的共鸣记录，正逐渐呈现出新的联系。守岸人想与你继续核验这些生命亲身经历的变化，寻找一种能够让更多声音安稳相遇的方式。她已把观测资料留在私人频道里，等待与你商议。"
 pf_sk_stage_4_title:0 "星图中的位置"
 pf_sk_star_order_active:0 "星序协响：新星的问候"
 pf_sk_star_order_active_desc:0 "来自核心的稳定频率在各个殖民地得到回应，工程与生产进入新的循环。"
 pf_sk_tidal_capacity:0 "重建的黑海岸观测中心"
 pf_sk_tidal_capacity_desc:0 "旧观测中心的场址已清理完毕，新的潮汐与共鸣观测设施可以在这里建立。"
 pf_solaris_home_reborn:0 "重现的故乡"
 pf_solaris_home_reborn_desc:0 "旧日的频率终于找到了归处。失亡彼岸重燃的灯火与乌洛波洛大剧院的乐声，让这颗星球的往昔与故人，成为了仍可共同生活的今日。"
 pf_solaris_investment:0 "索拉里斯加大投入"
 pf_solaris_investment_desc:0 "持续的物资补给与人员支援正推动索拉里斯的建设。"
 pf_solaris_memory:0 "层叠的旧日"
 pf_solaris_memory_desc:0 "这颗星球的表面保存着七段彼此相连的记录。"
 pf_solaris_site:0 "索拉里斯：沉默的回响"
 pf_solaris_site_desc:0 "这颗遗落于星海边缘的星球，封存着无数彼此交织却又各自孤立的文明残响。唯有曾亲历过那场盛大演出的弗洛洛，能够穿过狂乱的频率风暴，为你将这些破碎的乐章重新拼合。"
 pf_tower_restored:0 "研究塔"
 pf_tower_restored_desc:0 "坍塌的废墟已被彻底清空。塔底那座曾见证过无数尖端实验的重型抗干扰设施重新亮起了灯光，迎来了新一批渴求真理的探索者。"
 pf_tower_restored_gestalt:0 "研究塔"
 pf_tower_restored_gestalt_desc:0 "坍塌的废墟已被彻底清空。塔底重新亮起灯光，格式塔的研究单元接入旧阵列，继续追寻真理。"
 pf_tunnel_derelict:0 "沉默的隧者"
 pf_void_active:0 "虚无之神的孑遗"
 pf_void_active_desc:0 "虚无之神留下的残片在低语，力量与代价一同沉淀在帝国的纹理中。"
 phrolova_ww01_category:0 "陈旧的唱片"
 phrolova_ww01_category_desc:0 "扫描波束在一处废墟夹层中捕捉到了极其微弱的声波谐振。那并非自然风声，更像是一段被刻在古老介质上、反复回放的轻柔哼唱。"
 phrolova_ww02_category:0 "「剧本」"
 phrolova_ww02_category_desc:0 "探测器在一间坍塌的石室内发现了一团奇异的叙事性频率。某种记录介质正在无人的角落里，按照既定的逻辑自行翻动与推演。"
 phrolova_ww03_category:0 "星炬奖科学勋章"
 phrolova_ww03_category_desc:0 "地表瓦砾堆下传来了一阵极其规律的拉贝尔曲线微光。那似乎是一枚经过精密锻造、用于褒奖智慧与求索精神的荣誉信物。"
 phrolova_ww04_category:0 "“故土晨光”"
 phrolova_ww04_category_desc:0 "严寒的石缝间散发出了一丝不合常理的纤弱暖意。传感器在其中检测到了一段封存已久、充满怀念与祝愿的温和回音。"
 phrolova_ww05_category:0 "映照万音的星彩"
 phrolova_ww05_category_desc:0 "冰川裂隙深处折射出了一团永不消散的璀璨极光。上万道细碎的星辰回响在那里彼此牵引，凝结成了某种华美的冠冕轮廓。"
 phrolova_ww06_category:0 "筑昼辉砾"
 phrolova_ww06_category_desc:0 "浓雾笼罩的废墟间亮起了一点柔和而坚定的明光。一台形如古典提灯的共鸣终端仍在原地静静运转，仿佛在为夜行者照亮前路。"
 phrolova_ww07_category:0 "灼霜"
 phrolova_ww07_category_desc:0 "传感器记录到一处极度矛盾的能量反应：刺骨的寒霜与沸腾的热血在同一点上剧烈碰撞，凝聚成了一道试图划破长夜的锋芒。"
 phrolova_ww08_category:0 "炽烈权霆"
 phrolova_ww08_category_desc:0 "密集的球状闪电正围绕着红砂荒原上的一处祭坛不断盘旋。狂暴的雷霆在砂砾间熔铸出了一件散发着辉煌威严的权柄遗存。"
 phrolova_ww09_category:0 "昭日译注"
 phrolova_ww09_category_desc:0 "一座古老观测台的焦平面下方反射出刺眼的金芒。高强度的恒星辐射似乎在某种耐热金箔上，蚀刻下了一段决然的求索誓言。"
 phrolova_ww10_category:0 "星图核心"
 phrolova_ww10_category_desc:0 "破碎的卫星残骸内部传出了一阵令人心悸的低频震颤。一枚高密度晶体正在那里不断重演着群星坠落时的哀恸数据。"
 phrolova_ww11_category:0 "辛吉勒姆的核心"
 phrolova_ww11_category_desc:0 "紊乱的峡谷磁场中央悬浮着一团澄澈的金色微光。无数悲欢离合的记忆与一声悠长的叹息糅合在一起，在此处久久徘徊。"
 phrolova_ww12_category:0 "赝作的矮星"
 phrolova_ww12_category_desc:0 "废弃的轨道坞站内残留着一处微弱的人工引力源。一颗褪去华彩的小型球体正静默地悬浮在约束环中，小心翼翼地护着内里的一点余光。"
 planet_pf_blackflowers:0 "黑海岸的执花"
 pm_Phrolova_beyond:0 "彼岸的花园"
 pm_Phrolova_beyond_desc:0 "彼岸花开遍了旧战场。风吹过低矮的花丛时，田间的小径若隐若现，远处又传来有人推开窗户的声音。"
 pm_Phrolova_oblivion_active:0 "忘忧章：余韵"
 pm_Phrolova_oblivion_active_desc:0 "被重新奏响的古老乐章在索拉里斯的地脉中久久回荡。这股跨越岁月的宏大余韵洗涤了开拓者的心智，令整颗星球的学术求索与社会凝聚在共鸣中迸发出前所未有的活力。"
 pm_Phrolova_unstable:0 "未校准的残响"
 pm_Phrolova_unstable_desc:0 "整颗星球仍被狂乱而危险的未知频率死死包裹。在彻底完成勘探与频率校准之前，这片充满恶意的土地拒绝着任何生者的草率定居。"
 r_Phrolova_oblivion:0 "幽冥的忘忧章"
 r_Phrolova_oblivion_active:0 "添加§Y$pm_Phrolova_oblivion_active$§!修正，持续§Y10年§!：\n研究岗位产出：§G+35%§!\n岗位凝聚力产出：§G+35%§!"
 r_Phrolova_oblivion_desc:0 "由索拉里斯七处遗址的核心残响凝练而成的终极乐章，封存于这具盛放着彼岸花的提琴共鸣器之中。它不仅沉淀着一个旧日文明在苦难中摸索出的全部智慧结晶，更在弗洛洛的调律下，为即将到来的星海时代留出了奏响新篇的琴弦。"
 r_pf_everstar:0 "永远的启明星"
 r_pf_everstar_activation_key:0 "循着微光前行"
 r_pf_everstar_active:0 "添加§Y$pf_everstar_active$§!修正，持续§Y10年§!：\n位于友方恒星系舰船射速：§G+40%§!\n护盾硬化：§G+30%§!\n防御平台船体值：§G+100%§!\n防御平台装甲值：§G+100%§!"
 r_pf_everstar_desc:0 "“你在寂静的星海中飞行，星屑在身侧崩解，时间在身后消亡。漫漫孤寂并未消失，它只是被拉伸、稀释、重塑，最终成为你羽翼的一部分。宇宙以沉默考验你，而你持续前行，以明亮的辉光作答。”\n\n在一次次跨越生死的呼唤与回应之后，那颗曾在风雪数据海中独自闪烁的启明星，终于化作了与你共担重任、并肩同行的利剑。"
 r_pf_everstar_effect:0 "添加§Y$pf_everstar_active$§!修正，持续§Y10年§!：\n位于友方恒星系舰船射速：§G+40%§!\n护盾硬化：§G+30%§!\n防御平台船体值：§G+100%§!\n防御平台装甲值：§G+100%§!"
 r_pf_math_instrument:0 "宙算仪轨"
 r_pf_math_instrument_desc:0 "一切规律皆可被观测，一切现象皆可被析解。\n\n正如理想远在光年之外，抵达的方法却在双手咫尺之间。"
 r_pf_math_instrument_effect:0 "添加§Y$pf_math_instrument_active$§!修正，持续§Y10年§!：\n每月能量币产出：§G+25%§!\n研究岗位产出：§G+20%§!\n巨构建造队列上限：§G+2§!\n巨构建造速度：§G+30%§!\n巨构维护费：§G-30%§!"
 r_pf_paper_plane:0 "纸飞机"
 r_pf_paper_plane_2:0 "$r_pf_paper_plane$"
 r_pf_paper_plane_2_desc:0 "$PF_AMX_PLANE_DESC_OPEN$\n\n$PF_AMX_PLANE_INSCRIPTION_2$\n\n$PF_AMX_PLANE_DESC_END$"
 r_pf_paper_plane_3:0 "$r_pf_paper_plane$"
 r_pf_paper_plane_3_desc:0 "$PF_AMX_PLANE_DESC_OPEN$\n\n$PF_AMX_PLANE_INSCRIPTION_3$\n\n$PF_AMX_PLANE_DESC_END$"
 r_pf_paper_plane_4:0 "$r_pf_paper_plane$"
 r_pf_paper_plane_4_desc:0 "$PF_AMX_PLANE_DESC_OPEN$\n\n$PF_AMX_PLANE_INSCRIPTION_4$\n\n$PF_AMX_PLANE_DESC_END$"
 r_pf_paper_plane_5:0 "$r_pf_paper_plane$"
 r_pf_paper_plane_5_desc:0 "$PF_AMX_PLANE_DESC_OPEN$\n\n$PF_AMX_PLANE_INSCRIPTION_5$\n\n$PF_AMX_PLANE_DESC_END$"
 r_pf_paper_plane_desc:0 "$PF_AMX_PLANE_DESC_OPEN$\n\n$PF_AMX_PLANE_INSCRIPTION_1$\n\n$PF_AMX_PLANE_DESC_END$"
 r_pf_paper_plane_effect:0 "§W这是一架再普通不过的纸飞机。它不提供任何加成，也无需消耗任何资源去激活——因为你们已经靠自己的双手赢下了未来，它只需要安安静静地停在这里就足够了。§!"
 r_pf_sent_ticket:0 "一张送出的门票"
 r_pf_sent_ticket_desc:0 "一张纸角微卷、写有前排座号的剧院门票。它曾是一场漫长演出的无声邀约，如今则化作了跨越星海、终于如约相聚的信物。"
 r_pf_sent_ticket_effect:0 "添加§Y$pf_sent_ticket_active$§!修正，持续§Y10年§!：\n岗位资源产出：§G+40%§!"
 r_pf_star_order:0 "星序协响"
 r_pf_star_order_desc:0 "载有能量的核心，拟造着群星演化的循环。无限以奇点为源，将牵引的星团抛散，但寂灭流转，末陨尽头处又总传来不息的回声——那是新星诞生时的问候。"
 r_pf_star_order_effect:0 "£energy£ $energy$：§G+30000§!\n添加§Y$pf_sk_star_order_active$§!修正，持续§Y10年§!：\n岗位资源产出：§G+25%§!\n基础设施建造速度：§G+50%§!"
 r_phrolova_heart:0 "拉海洛之心"
 r_phrolova_heart_damaged:0 "损坏的拉海洛之心"
 r_phrolova_heart_damaged_desc:0 "从“阿列夫一的残余”外围孤岛中发掘出的隧者炉芯。因长年抵御虚质侵蚀且经历过强行共鸣，其外壳与内部回路均已严重受损，必须在修复后方能展现真正价值。"
 r_phrolova_heart_damaged_effect:0 "拉海洛之心目前处于严重受损状态，只能发挥极其有限的作用。"
 r_phrolova_heart_desc:0 "经过弗洛洛的全面调律与结构重塑，这枚由希望和牺牲打造的心脏终于恢复了往昔的律动。纯净而磅礴的星辉在其中流转不息，随时准备回应持有者的呼唤。"
 r_phrolova_heart_effect:0 "添加§Y$pf_heart_active$§!修正，持续§Y10年§!：\n对普雷索林虫群伤害：§G+75%§!\n对破界者、背道者及狂热者伤害：§G+75%§!\n对肃正协议伤害：§G+75%§!\n对塞塔娜相关阵营伤害：§G+75%§!\n舰船射速：§G+25%§!\n亚光速航速：§G+20%§!"
 r_phrolova_void_god_remnant:0 "虚无之神的孑遗"
 r_phrolova_void_god_remnant_desc:0 "击溃来犯的虚无实体后得到的本源核心。这枚幽暗的结晶内部封存着令万物归于无意义的恐怖伟力，它正沉默地注视着持有者的野心；一旦帝国踏上改写宇宙的极端道路，其深处的毁灭共鸣便会彻底苏醒。"
 r_phrolova_void_god_remnant_effect:0 "添加§Y$pf_void_active$§!修正，持续§Y10年§!：\n幸福度：§R-15%§!\n战斗撤离几率：§G+25%§!\n护盾硬化：§G+20%§!\n能量武器伤害：§G+20%§!"
 remove_Phrolova_events:0 "我需要一点时间，重新考虑这场合作。"
 remove_permissions_Phrolova_events:0 "让她离开王座，回到自己的研究。"
 research_Phrolova_events:0 "讨论彼岸计划。"
 ruler_Phrolova_events:0 "请她执掌帝国的总谱。"
 suizhe2_titan:0 "拉海洛"
 suizhe2_titan_plural:0 "拉海洛"
 suizhe_suppression:0 "拉海洛的压制光环"
 suizhe_titan:0 "拉海洛"
 suizhe_titan_plural:0 "拉海洛"
 tech_Phrolova_Beyond_1:0 "失亡彼岸"
 tech_Phrolova_Beyond_1_desc:0 "从海岸到冰原，各地的观测记录终于有了同一套标尺。过去只能讲给后来者听的经验，如今也能在另一间实验室里重现。"
 tech_Phrolova_Beyond_2:0 "重世总谱"
 tech_Phrolova_Beyond_2_desc:0 "把各座城市留下的共鸣记录铺在一起，原本互不相干的杂音便有了呼应。那些失落的声部，终于能写回同一份总谱。"
 tech_Phrolova_Beyond_3:0 "挽歌永不落幕"
 tech_Phrolova_Beyond_3_desc:0 "剧院的灯光重新照上旧日的乐谱。曾被封存在结晶中的旋律，终于又有了愿意倾听它的观众。"
 tech_pf_aemeath_ancient_pd:0 "远古近防阵列"
 tech_pf_aemeath_ancient_pd_desc:0 "爱弥斯被困于虚无时，曾在一个失落文明的残骸中偶然发现这套武器。即使文明本身早已消亡，它密集的弹幕仍守护着早已无人归来的航道，如今，它将为我们的舰队拦下迎面而来的威胁。"
 tech_pf_aemeath_fire_control:0 "拉海洛火控终端"
 tech_pf_aemeath_fire_control_desc:0 "从隧者驾驶系统中解析出的火控技术，能够同时追踪大量目标，并协调各组武器的射击时序。爱弥斯将自己的驾驶经验补入其中，让帝国舰队也能跟上她眼中的战场。——救世之刻已至！"
 tech_pf_aemeath_light_array:0 "拉海洛小型火力阵列"
 tech_pf_aemeath_light_array_desc:0 "由拉海洛的辅助武装改造而来的舰载火力阵列。动能机关炮以持续而密集的射击覆盖远方目标，为主力武器打开进攻的空隙。——真理疾驰寰宇。"
 tech_pf_b_forge:0 "分布式民用能源网络"
 tech_pf_b_forge_desc:0 "从高轨炉芯到地表街巷，星罗棋布的分布式超导转换节点将磅礴的能源温顺地送往千家万户，显著降低了行星建筑网络的日常运行损耗。"
 tech_pf_b_fragment:0 "极地封闭生态循环"
 tech_pf_b_fragment_desc:0 "拉海洛的先民曾在不见天日的极寒地底构建起自给自足的食物与大气循环网。如今这项重获解读的生态工程技术，足以帮助我们的新殖民地在严酷的外星环境中迅速扎根。"
 tech_pf_b_receiver:0 "深空联合民用工程规范"
 tech_pf_b_receiver_desc:0 "旧接收站出土的完整基建档案与高轨施工的实测经验，在此汇拢为一套成熟的标准化工程规范。索拉里斯历经磨难沉淀下的建设智慧，正开始惠及帝国的每一颗星球。"
 tech_pf_b_recovery:0 "标准化预制构件"
 tech_pf_b_recovery_desc:0 "全面重启深空联合时代的模块化预制与精密装配标准，让尘封在旧图纸上的精巧设计，能够通过帝国的现代化工厂流水线源源不断地转化为实体。"
 tech_pf_b_trial:0 "城居环境维持系统"
 tech_pf_b_trial_desc:0 "将旧地下城紧凑而高效的气压、温湿度与照明维持方案接入现代市政设施，以更低的能耗为不同星球的居民提供舒适安稳的起居空间。"
 tech_pf_b_tunnel:0 "旧式矿物分选工艺"
 tech_pf_b_tunnel_desc:0 "从隧群材料循环课题中衍生出的高精度频谱分选法。经过莫宁的现代化改良，这套工艺同样能大幅提升帝国各地矿物精炼网络的提纯效率。"
 tech_pf_blackshore_nodes:0 "黑海岸网络节点"
 tech_pf_blackshore_nodes_desc:0 "将索拉里斯的观测经验带往其他殖民地，让彼此相距遥远的成员能够核验发现、传递预警并协调行动。"
 tech_pf_special_1:0 "失亡彼岸"
 tech_pf_special_1_desc:0 "解析半能量化植物与频谱凝结物的结构力学，使工程团队能够利用特殊的高维共鸣材料，在脆弱的残响地带构筑起稳固的宏伟基建。"
 tech_pf_special_2:0 "赫卡忒回廊"
 tech_pf_special_2_desc:0 "通过逆向推导旧时代的多维拓扑管网，我们的工程师得以掌握在复杂地质断层间架设高通量能源与物流回廊的核心技术。"
 tech_pf_special_3:0 "深红调律塔"
 tech_pf_special_3_desc:0 "建立一套以特定声学波长干涉宏观物理场的理论模型，使我们能够通过巨型谐振阵列，将狂暴的地脉杂音驯服为有序的科研算力。"
 tech_pf_special_4:0 "残响存续所"
 tech_pf_special_4_desc:0 "深入研究回音能量的半衰期与真空驻波锁定技术，从而实现在不破坏原始波形的前提下，对高危未知频率进行长久封存与无损读取。"
 tech_pf_special_5:0 "冥扉构装局"
 tech_pf_special_5_desc:0 "探讨高频共鸣环境下群体意识的演化规律，将旧日文明在极端压力下维持社会协作的构装逻辑，转化为适应星际时代的治理学说。"
 tech_pf_special_6:0 "阿斯忒里亚之门"
 tech_pf_special_6_desc:0 "整合遗落星球的远古星象学与跨文化沟通范式，为这座重获新生的世界构建起衔接外部星海与深空未知领域的制度基础。"
 tech_pf_theatre:0 "乌洛波洛大剧院"
 tech_pf_theatre_desc:0 "从七处遗址的终极交响中直接重构出的奇观建筑学。它将整座建筑视为一件庞大的精密乐器，让艺术的感染力与科学的求索精神在共鸣中彼此升华。"
 tech_pf_tunnel_armament:0 "拉海洛重型火力阵列"
 tech_pf_tunnel_armament_desc:0 "根据拉海洛的高能武装重构而成的巨型舰载武器。阵列将庞大的能量压缩于短暂的齐射之中，令灼目的星辉贯穿敌舰防线。——此夜，星海澈明。"
 tech_suizhe_frame:0 "拉海洛战斗框架"
 tech_suizhe_frame_desc:0 "积雪下的机体沉寂多年，护板内侧仍留着上次检修的笔迹。循着那些记号，隧者的骨架在图纸上重新连成了整体。"
 tr_pf_b_dingjie_1:0 "解算"
 tr_pf_b_dingjie_1_delayed:0 "世间不存在无法理解的奇迹，只有尚未建立模型的结构。当纷繁复杂的现象被拆解为清晰的变量与方程，再庞大的机械与天体，也将在精确的演算下展露其原理。"
 tr_pf_b_dingjie_1_desc:0 "帝国能量币产出§G+15%§!；岗位维护费§G-15%§!。"
 tr_pf_b_dingjie_2:0 "归敛"
 tr_pf_b_dingjie_2_delayed:0 "发散的假设与冗余的误差在一次次严苛的实验中被逐一剔除。我们将离散的能量流向收束于稳定的轨道，在不断增加的宇宙熵流里，锚定属于秩序的唯一最优解。"
 tr_pf_b_dingjie_2_desc:0 "研究岗位产出§G+10%§!；研究站产出§G+20%§!。"
 tr_pf_b_dingjie_3:0 "递归"
 tr_pf_b_dingjie_3_delayed:0 "每一次推演的终点，都是下一轮重构的起点。通过将实证数据不断回代至初始模型，旧文明留下的断章在自我迭代中得以补全，昨日的难题已化作今日的基石。"
 tr_pf_b_dingjie_3_desc:0 "巨构建造成本§G-15%§!；巨构建造速度§G+15%§!。"
 tr_pf_b_dingjie_4:0 "解耦"
 tr_pf_b_dingjie_4_delayed:0 "破除对单一核心的盲目依赖，将原本盘根错节的古代系统拆分为独立运转的标准模块。当每一处构件都能被自由替换与重组，受制于造物的历史便宣告终结。"
 tr_pf_b_dingjie_4_desc:0 "舰船装甲§G+20%§!；舰船护盾§G+20%§!；舰船维护费§R+5%§!。"
 tr_pf_b_dingjie_5:0 "视域"
 tr_pf_b_dingjie_5_delayed:0 "拟造的天幕终究只是狭小的摇篮，真正的繁星正高悬于隔绝之外。当演算的边界跨越大气与引力的藩篱，那些自光年外投下的星辉，已从遥不可及的风景变为可被标定的航向。"
 tr_pf_b_dingjie_5_desc:0 "犯罪度§G-20%§!；人口幸福度§G+10%§!。"
 tr_pf_b_dingjie_adopt:0 "定解：采纳"
 tr_pf_b_dingjie_adopt_delayed:0 "旧日炉芯的外壳已被开启，沉睡在结构深处的原理已经成为帝国的力量。我们不再满足于仰赖现成的奇迹，而是选择拿起理性的标尺，亲手丈量并接管这份跨越时代的工程遗产。"
 tr_pf_b_dingjie_adopt_desc:0 "解锁议程：§Y高智能研究助理§!。\n标本资源产出§G+30%§!。"
 tr_pf_b_dingjie_finish:0 "定解：完成"
 tr_pf_b_dingjie_finish_delayed:0 "从解析一枚齿轮的咬合，到重构整片星海的法则，所有积累的理论都已找到通往现实的映射。"
 tr_pf_b_dingjie_finish_desc:0 "解锁法令：§Y基态校准§!。"
 tradition_pf_b_dingjie:0 "定解"
 tradition_pf_b_dingjie_desc:0 "面对未知的造物与深邃的宇宙，盲目的敬畏无法带来前路。"
 trait_pf_resonator:0 "共鸣者"
 trait_pf_resonator_desc:0 "这个物种学会了辨认自己的频率。即使隔着陌生的躯壳与从未听过的语言，一个生命发出的呼唤，也能在另一个生命那里找到回音。"
 triggered_opinion_pf075_aid:0 "来自星海的驰援"
 wuwa_species_all:0 "共鸣者（$HUM$）"
 wuwa_species_all_desc:0 "共鸣者外观组，沿用$HUM$的物种分类。"
 zone_Phrolova_Beyond_engineering:0 "冥扉构装局"
 zone_Phrolova_Beyond_engineering_arcology:0 "§R彼岸§!：冥扉构装局"
 zone_Phrolova_Beyond_engineering_arcology_desc:0 "理想城中的立体构装网络，将调律装置、重构机械和承载结构纳入连续生产流程。"
 zone_Phrolova_Beyond_engineering_desc:0 "研究意识共鸣与社会组织形态的特化院落。学者们在此剖析旧时代的群体记忆与构装心智，为新生的殖民社会重塑稳固的秩序准则。"
 zone_Phrolova_Beyond_physics:0 "深红调律塔"
 zone_Phrolova_Beyond_physics_arcology:0 "§R彼岸§!：深红调律塔"
 zone_Phrolova_Beyond_physics_arcology_desc:0 "理想城中的垂直调律阵列，以独立声场承担密集的物理试验与精密测量。"
 zone_Phrolova_Beyond_physics_desc:0 "直刺云霄的深红色高塔群，塔身镶嵌着巨大的音律谐振环。它日夜不休地捕捉并驯服着大气中的狂乱波段，将其转化为纯粹的物理实验场。"
 zone_Phrolova_Beyond_research:0 "失亡彼岸"
 zone_Phrolova_Beyond_research_desc:0 "在静默花海与悬空基岩之间构筑的复合工程院区。曾用于承载执念的彼岸空间，如今已被改造成支撑行星运转与大型基建的核心枢纽。"
 zone_Phrolova_Beyond_society:0 "残响存续所"
 zone_Phrolova_Beyond_society_arcology:0 "§R彼岸§!：残响存续所"
 zone_Phrolova_Beyond_society_arcology_desc:0 "理想城中的生命与频谱研究设施，在拥挤的城区深处维持长期实验所需的安静环境。"
 zone_Phrolova_Beyond_society_desc:0 "由多重静默力场层层包裹的半地下物理收容设施。那些极易消散或失控的高危频率样本被封存于此，供学者们安全地窥探宇宙的底层规律。"
 zone_Phrolova_Hecate_research:0 "赫卡忒回廊"
 zone_Phrolova_Hecate_research_desc:0 "纵横交错的多向立体回廊，内部铺设着精密的重型机械导轨与能量管网。它如同星球地表的精密齿轮，将分散的工程节点紧密咬合在一起。"
 zone_pf_asteria:0 "阿斯忒里亚之门"
 zone_pf_asteria_desc:0 "环绕着巨型星象拱门建立的社会学与跨星域交流中心。它象征着索拉里斯告别被天空海封闭的过去，向着更辽阔的星海文明敞开怀抱。 拱门的能量枢纽为整座行星持续供电，驻防设施则守护着通往星海的门户。"
 zone_pf_tidal_center:0 "黑海岸观测中心"
 zone_pf_tidal_center_desc:0 "地下的人造星空重新亮起，过往的记录在这里被妥善保存，新的星海观测也将从这里出发。"
 Phrolova_event.328.name:0 "索拉里斯遗迹的新家"
 Phrolova_event.328.desc:0 "随着考古工作的完成，我们已经掌握了索拉里斯遗迹的全貌。考虑到我们的游牧文化，我们决定把遗迹地块搬迁到我们的首都方舟舰上进行下一步的修复工作。"
 PF_nomad_solaris_transfer:0 "欢迎来到你的新家，索拉里斯！"
