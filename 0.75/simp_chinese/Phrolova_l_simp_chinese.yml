 PF22_ticket_offer_desc:0 "庆典广场上的人群依然熙熙攘攘，但身旁的几位同伴却默契地为你留出了独处的空间。达妮娅与守岸人交换了一个温和的眼神，爱弥斯也轻轻拉了拉衣角，笑着退开了半步。\n\n在漫天灯火的映衬下，弗洛洛深吸了一口气，缓步走到你面前。她原本似乎准备了一长串尖锐又不失优雅的开场白，可当目光真正与你相撞时，那些排演过无数遍的腹稿却化作了一片安静的停顿。一抹少见的薄红，悄然漫上了她向来苍白的脸颊。\n\n她从袖中抽出一张保存已久的门票，递到你的面前。门票的边缘因为漫长的等待与攥握而微微卷起，上面亲手写下的时间与第一排座号，正等待着一个迟到了太久的回答。"
 PF22_ticket_question:0 "这一次，我赴约了吗？"
 PF22_ticket_received:0 "获得遗珍“一张送出的门票”。"
 PF22_ticket_reply_desc:0 "看到你郑重地收下那张门票，弗洛洛一直微绷的肩线终于彻底松弛了下来。她凝视着你，唇角缓缓漾开一个释然而真切的笑容。\n\n“嗯，这一次，你来了。”\n\n她收回手指，却没有移开望向你的视线。不远处的同伴们默契地保持着安静，任由晚风拂过盛放的花海与温暖的街灯。\n\n一场充满血与火的演出或许终会落幕，而这张跨越了无数回声、被小心翼翼送出的邀请，终于等到了它命中注定的回答。"
 PF22_ticket_thanks:0 "收下这张门票。"
 PF22_ticket_title:0 "一张送出的门票"
 PF22_tunnel_desc:0 "那尊曾为索拉里斯带来文明曙光的天外巨型机兵——“隧者”的庞大躯壳，正失去动力，静默地悬浮在残响孤岛外侧的虚空中。\n\n我们的扫描波束数次掠过它层叠的装甲缝隙，但空荡的胸腔与数据接口均如深渊般死寂，没有传回任何微弱的信号。眼下，我们的工程手段尚无法介入这具精密而陌生的造物，只能远远地记录下它沉默的轮廓。"
 PF22_tunnel_tooltip:0 "古老机神“隧者”的躯壳，内部接口没有任何信号回应。"
 PF22_void_give_confirm:0 "§Y将它交给弗洛洛。我们已经作出了选择。§!"
 PF22_void_give_warning:0 "弗洛洛深深地看了你一眼，伸手按在了收容箱的锁定阀上。\n\n“一旦到了我的手术台上，这份力量就再也不可能为你的霸权或野心所用了。在松手之前，最后确认一次——你真的清楚自己正在放弃怎样一条捷径吗？”\n\n§Y确认交付后，将永久失去该遗珍，并永久无法选择星海天罚、宇宙创生、巨兽之怒和星系热症。此决定不可撤销。§!\n\n“如果还有半点犹豫，现在收回成命还来得及。”"
 PF22_void_keep_confirm:0 "§R我愿承担一切风险，将它留在手中。§!"
 PF22_void_keep_warning:0 "“既然这是你的决定，那我尊重你的胃口。”弗洛洛收回了手，后退半步，眼神里带着一丝冷澈的审视与警告，“你可以把它锁进你的收藏室，但请时刻记住，深渊的力量从不会白白借给任何人。它不仅会回应你的野心，更会喂养你心底最危险的念头。”\n\n她顿了顿，目光掠过那枚幽暗的结晶，轻声补了一句：\n\n“而随着你的保留，那些被困在帷幕之后的微弱声音，也将永远被埋葬在黑暗里了。在真正扣下锁扣之前，你还有最后一次反悔的机会。”\n\n§Y保留遗珍后，仍可自行决定是否选择灾难飞升。若选择星海天罚、宇宙创生、巨兽之怒或星系热症，将唤醒该遗珍对应的灾难共鸣。§!"
 PF22_void_questions:0 "在做决定之前，我还有些问题想问你。"
 PF22_void_questions_desc:0 "弗洛洛没有催促，只是安静地靠在控制台边，等待着你做出最终的权衡。"
 PF22_void_reconsider:0 "等等，让我再重新考虑一下。"
 PF23_capacity_tooltip:0 "馆藏容量不足时，标本将暂存，可稍后通过彼岸通讯领取。"
 PF23_collect:0 "将回收的标本送入馆藏。"
 PF23_notice_desc:0 "帝国的远距声学监测网在[event_target:pf23_site.GetName]附近捕捉到了一阵极其微弱、却带有鲜明旧日特征的共鸣波动。经过初步频谱比对，这处散落在深空中的信号，恰好与我们索拉里斯馆藏目录中尚处于空白状态的一件历史遗存相吻合。\n\n我们可以派遣一艘科研船前往该天体开展专项打捞，将这件遗漏在星海角落的珍贵标本回收归档。"
