 PF_MORIN_APPEARANCE_DESC:0 "莫宁把终端放到一旁，看向你。\n\n“想换一身？等我一下。”"
 PF_MORIN_BOND_1_DESC:0 "这天与莫宁核对进度时，她正对着面前悬浮屏上的一条内部通讯发呆，连头顶的星栈都罕见地停止了多任务运转。看到你接入，她有些苦恼地叹了口气，主动把那条消息共享给你——那是一名刚从帝国科学院调入项目组的基层演算员发来的考核申诉，前面列了一堆跨体系公式有多难兼容，最末一行则附了一句直白的请求：“教授，捞一下！”\n\n“以前在星炬学院教书的时候，每到期末出分，我的终端里也会塞满这种消息。”莫宁指着那行字，神情认真得近乎呆板，“因为我不太明白为什么会有人试图用主观诉求去改变客观的物理标准，所以我通常的做法，是直接把《隧者工学部考核评分细则》原封不动地再给他们重发一次。只是……每次发完之后，就再也没有人敢主动联系我了。”\n\n你反问她，那她现在心里其实想怎么处理。莫宁垂下眼帘思考了许久，最终伸手删掉了已经挂载好的《评分细则》附件，在回复框里一字一句地敲下了一行话：\n\n“第四周期的休整时段，我的三号演算频段保持开放。把你没能收敛的那组错题模型带上，接入我的终端。”"
 PF_MORIN_BOND_1_OPTION:0 "放心吧，他会带着模型准时接入的。"
 PF_MORIN_BOND_1_TITLE:0 "教授，捞一下"
 PF_MORIN_BOND_2_DESC:0 "高轨观测站的长廊里安静得能听见恒星风掠过护盾的微弱声响。由于内外温差，厚重的防辐射玻璃窗上结了一层薄薄的白霜。莫宁站在窗前，用外套的袖口一点点擦开了一块透明的区域——那宽度算得刚刚好，不多不少，恰好只够两个人肩膀挨着肩膀一同往外看。\n\n“我以前跟你说过吗？人生中第一次离开地下去雪原科考的时候，我其实还坐在那架笨重的轮椅上。”莫宁望着窗外璀璨的拟制炉芯与漫天星河，声音轻得像是一片羽毛，“那时候碰到联运车开不过去的冰缝，带队的前辈就会把我背在背上，一步步顶着暴风雪往前走。后来我写过很多份关于那次科考的学术报告，沿途的气温、风速、机械参数我全都倒背如流……但唯独有一件小事，我从来没写进过任何记录里。”\n\n她微微凑近玻璃，轻轻呵出一口热气，看着白雾在镜面上迅速晕开：“那天趴在别人背上看星星的时候，我其实哭得很厉害。冰原上的狂风一吹，眼泪流过的地方就变成一条冰凉的线，刚流出来的又是滚烫的，弄得脸上凉一条、热一条，狼狈极了。我当时心里急得不得了，生怕前面的人突然回头看见我那副样子。”\n\n说到这里，她转过头看向你，清澈的眼眸里漾开一抹无比温柔的笑意，主动往旁边让出了半扇擦干净的窗子：\n\n“不过，我已经不需要人背着走了。就算现在眼眶有点发热，我也不怕被你看见了……所以，再往我这边靠一点吧。今天，你可以光明正大地看我。”"
 PF_MORIN_BOND_2_OPTION:0 "顺着她的话，往她身边挨近一点。"
 PF_MORIN_BOND_2_TITLE:0 "到我这边来一点"
 PF_MORIN_BOND_3_DESC:0 "今天来找莫宁核对数据时，你注意到她刚刚自己动手把额前长长的一点碎发重新剪短了，露出了光洁的额头与那双专注的眼睛；可在她右侧的发丝间，依然端端正正地别着那两枚样式简单、甚至早已不再具备固定刘海功能的旧发卡。你只是多看了一眼，敏锐的工程师便立刻察觉到了你的视线，下意识地伸手摸了摸鬓角。\n\n“……是不是觉得有点多余？明明头发都已经剪短了，从效率角度来说，根本不需要再佩戴发卡。”莫宁有些不好意思地垂下眼帘，伸手从发间轻轻摘下其中一枚，摊在掌心递到你面前。你能清晰地看到，发卡背面的金属边缘因为常年的摩挲，已经磨掉了一小块漆皮。\n\n“很久以前，我还习惯用长长的刘海把自己的脸遮起来，躲在轮椅上不去看别人的眼神。直到有人提醒我说，头发老是垂下来会看坏眼睛……为了买这两枚最普通的发卡，我鼓起勇气，在从没去过的热闹集市上来回走了整整三趟才敢进店。”\n\n她低头凝视着掌心的小小物件，声音柔软而坦诚：“买回来对着镜子夹好的那一刻，我才终于算明白了自己当时为什么那么忐忑。我把视野清理干净，其实不只是为了看清黑板上的公式……我是希望，当我有勇气抬起头看向世界的时候，恰好也能迎上一道正在注视着我的目光。”\n\n莫宁将那枚带着她体温的旧发卡轻轻递向你，随后向你走近半步，微微低下了头，露出一截白皙的颈线与柔软的发丝：\n\n“右边这一枚，我今天早上自己对着镜子夹了三次，总觉得角度有点歪。既然你注意到了……今天，能请你帮我把它别好吗？”"
 PF_MORIN_BOND_3_OPTION:0 "接过发卡替她仔细夹正，静静等她抬起眼睛。"
 PF_MORIN_BOND_3_TITLE:0 "两枚发卡"
 PF_MORIN_CLASS_ASK:0 "星期四来问问题的学生，后来怎么样了？"
 PF_MORIN_CLASS_DESC:0 "“他准时接入了，而且还壮着胆子拉上了另外两个同样卡在那道题上的同期生。”莫宁指了指实验室一侧的辅助主机，那里新增了四组常亮的并行数据接口，“我当时没料到会有这么多终端同时连进来，原本预留的带宽根本不够用。结果到了最后，我干脆解除了自己星栈的算力限制，和他们四个在虚拟沙盘里直接串联推导了整整三个标准时。”\n\n她的眼睛亮晶晶的，语气里透着一股身为师长纯粹的愉悦：“刚才断开连接前，他们又主动跟我预约了下一周期的公共演算频段。为了提高效率，我已经提前向后勤中枢申请扩容了常驻接口——不管下次再来多少好学的家伙，带宽都绝对够用了。”"
 PF_MORIN_CONTACT_APPEARANCE:0 "调整外观。"
 PF_MORIN_CONTACT_NAME_WHITE:0 "§W莫宁§!"
 PF_MORIN_CONTACT_SELF:0 "能介绍一下你自己吗？"
 PF_MORIN_MEMORY_DESC:0 "你就这么和莫宁并肩站在擦开一角的观测窗前，聊起了更多关于故乡雪原的往事。\n\n“对了，那次在暴风雪里看星星的时候，其实还有一个很突发的小插曲。”莫宁忽然想起了什么，伸出纤细的手指，在自己后颈的衣领位置轻轻比画了一下，“当时风太大了，有一小团夹着冰碴的雪块，刚好顺着围巾的缝隙滑进了我的后领口里。”\n\n你似乎也从她生动的描述中感受到了那股刺骨的凉意——当时的她一定冷得猛地缩起了肩膀，可为了不打断前行的脚步，这个一贯习惯忍耐的女孩，大概只是用力拍了拍背着她的人，催促对方继续往前走。\n\n“真的很冷，冰块化开的时候，冻得连后背的骨头都在发疼。可是……我这辈子从来没有像那一刻那样高兴过。”莫宁转过头望着你，眼底闪烁着比窗外恒星还要明亮的光彩，“因为那是我第一次不再透过别人洗出来的照片去看世界。我就在外面，在风雪里，和大家一起真切地挨着冻。”\n\n冰凉的防辐射玻璃上，清晰地映出你们两人并肩而立的倒影。莫宁伸出手，把刚才擦开的小窗又往外擦宽了一圈，让深空远处最暗的那颗星辰也露了出来。"
 PF_MORIN_MEMORY_OPTION:0 "陪她等到窗上重新结起白霜。"
 PF_MORIN_MEMORY_TITLE:0 "雪落在领口里"
 PF_MORIN_OUTFIT_0:0 "装束一。"
 PF_MORIN_OUTFIT_1:0 "装束二。"
 PF_MORIN_OUTFIT_2:0 "装束三。"
 PF_MORIN_PIN_ASK:0 "发卡今天还夹得稳吗？"
 PF_MORIN_PIN_DESC:0 "听到你的问题，莫宁下意识地停下手里的笔，微微偏过头，将自己右侧鬓角那两枚端端正正的旧发卡让到你的视线正中央。\n\n“今天早上是我自己对照着你上次的位置夹上去的。你帮我目测一下，跟上次你夹的角度相比，误差大吗？”\n\n当你笑着给出“非常稳、分毫不差”的肯定答复后，她也伸出指尖轻轻碰了碰那枚掉了点漆的发卡，白皙的脸颊上浮现出一抹浅浅的红晕，小声补充道：“……就算我已经学会怎么把它夹稳了，你也不用非得等到它歪掉的时候，才来研究室找我啊。”"
 PF_MORIN_POST_PROGRESS:0 "下班以后，想去哪儿？"
 PF_MORIN_POST_PROGRESS_DESC:0 "“我想去外环港口坐一会儿。”莫宁几乎没有犹豫就给出了答案，“每次研究站换班的时候，都会有一列远航运输船队从观测窗前驶过。它们的班次表和引擎型号我早就背熟了，但……我还从来没有真正坐在港口的候船长椅上，安静地看它们起降过一次。”\n\n她利落地关掉面前的悬浮屏，把叠得整整齐齐的外套搭在手臂上，抬头看向你：“今天不聊公式了，你陪我一起走过去吧。要是我们走得慢、赶不上这一班船也没关系……我们可以坐在一起，慢慢等下一班。”"
 PF_MORIN_RECOVERY_DESC:0 "这通私人通讯并非来自地下实验室，而是接通自地表研究站外围的观景长廊。画面刚亮起时轻轻晃动了一下，莫宁伸手扶住金属栏杆，头顶的“改良星栈”微微闪烁，帮她将镜头校准到了刚好能将远方星港尽收眼底的角度。\n\n“今天没有借助轮椅和扶持，是我自己一步步走过来的。虽然……实际路程比我在地图上测算的稍微远了一点。”她望着夜幕下一盏接一盏亮起的引航灯，笑了笑。\n\n一艘庞大的军用运输船缓缓划破大气层，引擎的尾焰将她的侧脸映得格外柔和。她安静地目送船只远去，才重新转过头看向你：“这双腿已经能完全跟上这里的节奏了，或许是时候去做些我能做到的事了。”"
 PF_MORIN_RECOVERY_EFFECT:0 "莫宁移除§Y伤残§!特质。"
 PF_MORIN_RECOVERY_OPTION:0 "期待第一次离开地表的感觉吗？"
 PF_MORIN_RECOVERY_TITLE:0 "窗外的航灯"
 PF_MORIN_RECRUIT_BACK:0 "先聊聊别的吧。"
 PF_MORIN_RECRUIT_BACK_REPLY:0 "“好。你想知道什么？”"
 PF_MORIN_RECRUIT_BODY:0 "你的身体状况如何？"
 PF_MORIN_RECRUIT_BODY_REPLY:0 "“静滞之后，我的神经接口需要重新适应。我已经向医疗团队要了清单，别人调试总隔着一层参数，我想等感知恢复后亲自校准义肢。”"
 PF_MORIN_RECRUIT_COMPANION:0 "关于同行，你还有什么想说的吗？"
 PF_MORIN_RECRUIT_COMPANION_REPLY:0 "“我愿意留下。只是，刚醒来就得到这样的邀请，有点不知道该怎么回答。等我能独自走到港口的时候，你愿意陪我看一眼那些船吗？”"
 PF_MORIN_RECRUIT_DETAIL:0 "我想详细了解沉睡之前的往事。"
 PF_MORIN_RECRUIT_DETAIL_REPLY:0 "“我最后的记忆是‘夜幕’闭合前研究院一盏接一盏熄灭的顶灯。那时我们以为，熬过虚质退潮，防壁留守的人总能把课题接下去……没关系，请把你们掌握的现状原原本本告诉我吧，我需要知道后面发生了什么。”"
 PF_MORIN_RECRUIT_HELP:0 "你会怎样帮助我们？"
 PF_MORIN_RECRUIT_HELP_REPLY:0 "“我的共鸣能力可以完全解析并精细操控视线内的精密机械结构。只要先让我通读一遍你们现有的工程规范与材料学图谱，那些深空联合未能完成的旧设计——无论是多相态能量转换，还是巨型天体工程——我都可以尝试用你们的工业体系重新推导并验证出来。只要是能提高效率的事，我都很乐意接手。”"
 PF_MORIN_RECRUIT_SELF:0 "能介绍一下自己吗？"
 PF_MORIN_RECRUIT_SELF_REPLY:0 "“我在深空联合研究院从事炉芯与隧者工程研究，过去的课题主要是能量输出管理、隧群材料循环，以及‘换日仪式’的工程落地。简单来说，我习惯先把复杂的现象解析成明确的结构模型，再用双手把它们造出来。至于其他部分……参照系都已经不在了，现在的我到底算什么，也得在接下来的工作中重新演算一遍。”"
 PF_MORIN_RECRUIT_WORLD:0 "你想了解现在的世界吗？"
 PF_MORIN_RECRUIT_WORLD_REPLY:0 "“当然。在被天空海封锁的拉海洛地底，我们只能靠大气拟造阵列模仿被记录下来的古老星图。星图上的许多坐标对我们而言只是遥不可及的数学模型。但现在，你们的舰船已经真正航行在那些星辰之间了……请给我一点时间阅读现有的观测档案，我想把记忆里的公式，和眼前这片真正的星海重新对应起来。”"
 PF_MORIN_REPLAY_ENDING:0 "重温“致第二次日出”。"
 PF_MORIN_REPLAY_MEMORY:0 "还记得那天雪落进领口吗？"
