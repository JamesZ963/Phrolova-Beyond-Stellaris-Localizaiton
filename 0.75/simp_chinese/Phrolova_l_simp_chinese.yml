 PF_B_DENIA_RESUME:0 "再接通达妮娅的通讯。"
 PF_B_DEPART_DESC:0 "莫宁独自站在科研船观测甲板的落地舷窗前。下方的停机坪上，几架工程运输艇正忙碌地将最后一批索拉里斯制造的“海维夏”改进型探测器装入货舱。越过闪烁的作业灯带，索拉里斯蔚蓝的大气层在深空背景中勾勒出了一道璀璨而温柔的弧线。\n\n“在我的学生时代，所有关于宇宙的想象都只能被困在窄小的轮椅上，通过纸张和拟造天幕去推算。”\n\n听到你的通讯接入，她转过身，定制义肢稳稳地踏在金属甲板上，没有半分摇晃。她最后看了一眼脚下那颗孕育了自己的星球，目光随即变得清澈而坚定。\n\n“今天，我的航行日志上终于有了一段真正驶向群星的航程。我已经做好全部准备了——等我从那具‘隧者’的残骸旁回来，一定把在那里找到的答案，完完整整地讲给你听。”"
 PF_B_DEPART_GO:0 "一路平安，我们等你回来。"
 PF_B_DEPART_RESUME:0 "在远征出发之前，再和莫宁说说话。"
 PF_B_DEPART_TITLE:0 "启航之前"
 PF_B_ECOLOGY_REWARD:0 "获得稀有科技：§Y极地封闭生态循环§!。"
