 PF_TUNNEL_ARMAMENT:0 "拉海洛重型火力阵列"
 PF_TUNNEL_ARMAMENT_DESC:0 "根据拉海洛的高能武装重构而成的巨型舰载武器。阵列将庞大的能量压缩于短暂的齐射之中，令灼目的星辉贯穿敌舰防线。——此夜，星海澈明。"
 PF_TX28_1720_PF17_chat_intro:0 "私人通讯已接通。人造星空的柔光下，屏幕那端的身影将注意力完全转向了我们，安静地等待着这次谈话的开端。"
 PF_TX28_1740_PF17_chat_intro:0 "私人通讯已接通。屏幕那端的少女停下了手中正在折的纸飞机，将注意力转向了我们，眉眼弯弯地等待着这次谈话的开端。"
 PF_TX28_1760_PF17_chat_intro:0 "私人通讯已接通。屏幕那端的少女收敛了平日跳脱的模样，安静地注视着我们，等待着这次谈话的开端。"
 PF_WORMHOLE_LOCK:0 "需要由弗洛洛主持并完成索拉里斯的虫洞稳定特殊项目。"
 PF_WORMHOLE_RESEARCH_OPTION_TT:0 "获得§Y$tech_wormhole_stabilization$§!的研究选项。"
 PF_WORMHOLE_TECH:0 "需要研究虫洞稳定技术。"
 PF_aemeath_bio:0 "曾是星炬学院极具天赋的适格者，在献身阻止灾厄后化作了漫游于数据海中的电子幽灵。她未曾被漫长的孤寂与死寂的虚无击垮，依然保持着如火般明快爽朗的心性。在被启用的拉海洛之心的力量下，她获得了实体，也仍能以幽灵形态穿行数据。如今，她驾驭着自主设计的机甲兵装跨越星海而来，以舰队指挥官的身份与你并肩，誓要将一切来犯的恶敌轰碎在星光之下。"
 PF_aemeath_bond_1_desc:0 "通讯接通时，爱弥斯正托着一个精巧的小型机甲手办。看到你进来，她笑着晃了晃手里的物件。\n\n“这是以前在学院过生日时，朋友们送我的礼物。那时候大家总盼着能早日去真正的星空探险，只有我每天吸果冻、打游戏，装出一副对未来满不在乎的懒散样子。”\n\n她的手指轻轻抚过手办的机翼，眼底却亮起一抹灼热而坦诚的光。\n\n“因为曾有人叮嘱我要‘轻松快乐地活着’，所以我把那个既傲慢又沉重的救世主愿望死死埋在心底，不敢对任何人说。直到灾厄降临、我的躯体在驾驶舱里因强行共鸣而寸寸撕裂的那一刻，剧痛淹没了一切，可那道束缚我多年的咒语也终于失效了……我在数据流里发自内心地感到兴奋——因为我终于可以不必只做一个快乐的旁观者，终于能去保护我想保护的一切了，是不是很乱来？”"
 PF_aemeath_bond_2_desc:0 "画面中的爱弥斯罕见地没有笑。她手里攥着一只由数据折成的纸飞机，静静地望着窗外深邃的宇宙。\n\n“成为电子幽灵之后，我在虚质空间里飘荡了很久，也不止一次和宇宙深处那只巨大的‘眼睛’对视过。它总是试图向我灌输虚无、对死亡的渴望、万物终归寂静的荒谬……”\n\n她冷哼了一声，掌心微拢，那只纸飞机瞬间在飞溅的火星中化作灰烬。\n\n“我当时就在想，原来我最在乎的那个人，一直都是背负着这样令人窒息的绝望在世间独行吗？从那天起，我心底一半是刺骨的悲伤，一半是从未有过的怒火。我不管什么宇宙的终局，也不管什么狗屁真相——谁敢让我珍视的人陷入那样的痛苦，哪怕把这具幽灵之躯再烧成灰烬，我也会用剑和光炮把它们统统撕碎！”"
 PF_aemeath_bond_3_desc:0 "这一次，背景里亮起了温暖的炉火，旁边还摆着一个插满蜡烛的雪绒海豹蛋糕。爱弥斯站在柔和的火光旁，眉眼弯弯地看着你。\n\n“以前在故乡的雷雨夜里，我总害怕得睡不着，那个人就会牵着我的手讲英雄的冒险故事。直到很久以后我才明白，那些九死一生的故事根本不是童话，而是对方独自走过的漫长岁月……在去往隧者脚下的前一晚，我在终端里写满了想说的话，可写了又删、删了又写，最后也只敢留下一句‘只要抬头，那颗星总能找到我’。”\n\n她向你靠近了一步。炉火轻轻晃动，她掌心的星辉在你们之间停了下来。\n\n“我不在乎什么崇高的头衔，我只是希望，我所珍惜的你，能够不用那么辛苦，能够自由又快乐地活着。不管未来的星空有多冷、路有多远，只要你抬头，有颗启明星就一定会一直亮着，陪你走到最后！”"
