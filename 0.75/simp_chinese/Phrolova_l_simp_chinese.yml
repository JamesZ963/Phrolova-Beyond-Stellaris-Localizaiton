 PF_SK_PROJECT_1:0 "重新出现的声音"
 PF_SK_PROJECT_1_DESC:0 "修复索拉里斯旧黑海岸观测中心，封存逝去同伴留下的残响记录，为新一代执花成员恢复可用的观测与守望场所。"
 PF_SK_PROJECT_2:0 "预测之外"
 PF_SK_PROJECT_2_DESC:0 "将地面观测员的发现与泰缇斯的推演记录逐一印证，研发能够在遥远殖民地建立的观测与联络节点。"
 PF_SK_PROJECT_3:0 "分担守望"
 PF_SK_PROJECT_3_DESC:0 "汇总各星域节点在实际协作中积累的经验，梳理观测核验、预警与引航救助流程，让守望不再只是少数人的负重。"
 PF_SK_PROJECT_4:0 "星图中的位置"
 PF_SK_PROJECT_4_DESC:0 "深入研究来自各节点的共鸣现象，核验参与成员的适应记录，探寻能够推广至更多生命形态的共鸣觉醒方案。"
 PF_SK_RECORDING_DESC:0 "一段来自新建节点的音频被守岸人添进了那张回音唱片里。她坐在琴边仔细听了两遍，又将其中短短的一小段单独截取出来，留在手边。\n\n“这是交接班时的问候。那两位成员来自相隔甚远的不同星域，起初还不熟悉彼此的语言与表达方式，只能依靠简单的信号交流；可现在，他们已经能默契地互道珍重了。”\n\n她抬起眼眸看向你，指尖轻轻按在黑白琴键上，试着弹出了一串清澈的和弦：\n\n“我想试着把这段声音写进那首曲子里，作为我们旅途的一部分。”"
 PF_SK_RECORDING_REPLY:0 "我很想听听。"
 PF_SK_RECORDING_TITLE:0 "留在唱片里的声音"
 PF_SK_RECORDS_OPEN:0 "看看黑海岸最近的记录。"
 PF_SK_RELIC_DISPLAY_REPLY:0 "收好这份赠礼。"
 PF_SK_RELIC_GIFT_DESC:0 "守岸人将一只镌刻着星轨纹路的匣子放在你面前。随着匣盖缓缓展开，环绕核心的弦丝轻轻震颤，淡蓝色的微光正随着某种悠长的周期节律柔和明灭。\n\n她抬起手，让它稳稳悬停在你们之间。\n\n“它叫‘星序协响’。在过去的漫长岁月里，它伴我记录、演奏，也陪我在不曾流转的地下星空下守望过很长的时间，见证了无数星辰的明灭。”\n\n她的目光越过那片如蝴蝶星云般流动的光，专注地落在你身上：\n\n“如今，这片海岸有了新的同伴，而我的守望也有了新的意义。现在，我想把它交给你——愿它在你经过的每一片星域，也能听见新星诞生时的问候。”"
 PF_SK_RELIC_GIFT_EFFECT:0 "获得遗珍：§G星序协响§!。"
 PF_SK_RELIC_GIFT_REPLY:0 "我会带着它，继续我们的旅途。"
 PF_SK_RELIC_GIFT_TITLE:0 "星序协响"
 PF_SK_REPLAY:0 "再听一遍。"
 PF_SK_RESOURCE_DESC:0 "借助守岸人整理的共鸣导航与频率溯源法，科研团队进一步分析了目标天体岩层深处那缕微弱的共鸣脉动，成功标定了隐藏的战略资源矿脉位置，并将开采所需的数据传回。"
 PF_SK_RESOURCE_EFFECT:0 "在目标天体发现一处§G战略资源矿藏§!。"
 PF_SK_RESOURCE_REPLY:0 "保存这些坐标。"
 PF_SK_RESOURCE_TITLE:0 "隐藏的结晶"
 PF_SK_SPREAD:0 "让其他愿意参与的同伴也接入。"
 PF_SK_STAGE_1_APPROVE:0 "一起让那里重新亮起来。"
 PF_SK_STAGE_1_DESC:0 "守岸人来到指挥室，将一段从索拉里斯旧址深处修复出来的残损录音呈现在你面前。\n\n音频里的呼叫声很短，带着风浪侵蚀的沙沙杂音，结束后只余下细微的海潮拍岸声。守岸人安静地听完，指尖轻轻点在录音末尾那个早已模糊的成员署名上，随后展开了旧黑海岸观测中心的地下结构图。\n\n“在过去的岁月里，曾有许多佩戴黑花的同伴一直守在这里。哪怕明知即将坠落，他们也会用最后的微光照亮前路，把收集到的数据带回海岸。他们收集而来的数据仍然保存在地底的星河中，而余下的观测设备还有很大一部分可以修复。”\n\n她抬起眼眸看向你，胸口的淡蓝晶核微微闪烁：“我想回去看看，把那里重新清理出来。”"
 PF_SK_STAGE_1_DONE_DESC:0 "当最后一道尘封的隔离门再次开启，那台在漫长岁月里陪伴着她的终端终于出现在眼前。守岸人走上前，轻轻拂去控制台上的厚重尘埃，然后重启了系统。\n\n旧观测中心的场址已经整理妥当，散落的记录也被尽数归入档案室。门外，第一批前来报到的新成员正安静地等待着她。\n\n守岸人取出一枚象征守望与传承的黑花交给领队，随后转身回到你的身旁，眼底漾开一抹温和的暖意：\n\n“过去的托付已经妥善收好。从今天起，这片海岸会有新的声音响起了。”"
 PF_SK_STAGE_1_DONE_EFFECT:0 "解锁§G潮汐测量中枢§!，建筑§G泰缇斯系统§!。"
 PF_SK_STAGE_1_DONE_REPLY:0 "我在听。"
 PF_SK_STAGE_1_DONE_TITLE:0 "呼叫已被接收"
 PF_SK_STAGE_1_EFFECT:0 "£energy£ $energy$：§R-2000§!\n£minerals£ $minerals$：§R-2000§!\n\n研究历时§Y180天§!。"
 PF_SK_STAGE_1_TITLE:0 "重新出现的声音"
 PF_SK_STAGE_2_APPROVE:0 "把这些地方连接起来。"
 PF_SK_STAGE_2_DESC:0 "一份来自边境行星地面观测员的实地记录，修正了泰缇斯系统刚刚发出的常规预警。守岸人得知后亲自前往现场核实，并带回了两份互相印证的报告。\n\n“那位观测员在当地生活了很久，凭着对那片土地的熟悉，注意到了精密仪器尚未录入的细微变化。”守岸人将报告放在你面前，语气里透着由衷的欣慰，“这再次印证了我一直相信的事——鲜活的生命从来不是被算法限制的概念，在既定的推演之外，永远存在着更多的可能性。”\n\n她抬起手，在全息星图上依次点亮了几个遥远的殖民地：\n\n“我想在这些地方建立观测与联络节点，让更多驻守远方的成员有机会把发现传回来，也让他们能够跨越星海，听见彼此的声音。”"
 PF_SK_STAGE_2_DONE_DESC:0 "第一批黑海岸网络节点的测试讯号，跨越遥远的光年清晰地传回了索拉里斯。在录音的末尾，还能听见外勤成员对下一班值守者的提醒——天亮前还有一场天体观测，记得提前校准设备。\n\n守岸人没有裁掉这段工作之外的尾音，而是将这句话也一并留在了档案里。\n\n“你看，不需要中央系统下达指令，他们已经开始主动安排下一次出发了。”\n\n她将整理完备的研究成果交给你，片刻之后，又从身侧取来几朵盛放的黑花，目光柔和地望向你：“看着他们充满干劲的样子，我想起了以前在黑海岸遇到过的一些故人……如果你现在有空，我想把这些往事讲给你听。”"
 PF_SK_STAGE_2_DONE_EFFECT:0 "获得§G黑海岸网络节点§!研究选项及§G25%§!进度。"
 PF_SK_STAGE_2_DONE_REPLY:0 "慢慢说吧。"
 PF_SK_STAGE_2_DONE_TITLE:0 "远方的黑花"
 PF_SK_STAGE_2_EFFECT:0 "£energy£ $energy$：§R-3000§!\n£consumer_goods£ $consumer_goods$：§R-1000§!\n\n研究历时§Y180天§!。"
 PF_SK_STAGE_2_TITLE:0 "预测之外"
 PF_SK_STAGE_3_APPROVE:0 "让他们的经验留下来。"
 PF_SK_STAGE_3_DESC:0 "就在不久前，分布在几个不同星系的节点第一次在没有中央干预的情况下，独立完成了一场跨殖民地的协作——一处节点率先察觉到空间频率异常，相邻的节点迅速复核了讯号波形，而附近的执花成员则及时联系了航线上的船只安全改道。\n\n当守岸人收到完整的复盘报告时，最后一艘船只已经平安抵达了港湾。\n\n“过去，我总习惯把所有沉重的演算都揽在自己身上，像一艘不断剥落又不断修补的忒修斯之船一样独自航行。”\n\n守岸人指了指报告末尾那几行由各地成员补充的改进建议，眼底闪动着柔和的微光，“但现在我明白了，守望是可以分担的。我想把他们这次配合的经验整理下来，让下一批成员也能使用——他们还有不少自己的新想法，我答应和他们一起试一试。”"
 PF_SK_STAGE_3_DONE_DESC:0 "整理完备的跨星系协作记录已经送达各个节点。守岸人认真读完最后一份回执，在成员名单旁添上了几句批注。\n\n星图之上，有的资深成员已经启程前往新的星域，也有人留在当地，耐心地教新来的同伴如何辨认细微的频率讯号。明天的值守表也已经排得井井有条。\n\n守岸人放下终端，从观测台前走到你的身旁，向你发出邀请。\n\n“今天的事情都已经安排妥当，大家做得比我预想的还要好。接下来的时间，不再属于运算核心……我想把它完完全全地留给你。”"
 PF_SK_STAGE_3_DONE_EFFECT:0 "守岸人获得§G群星漫想§!特质，更多连接的节点将继续增强该特质。"
 PF_SK_STAGE_3_DONE_REPLY:0 "那就陪我待一会儿。"
 PF_SK_STAGE_3_DONE_TITLE:0 "交给下一班"
 PF_SK_STAGE_3_EFFECT:0 "£energy£ $energy$：§R-4000§!\n£unity£ $unity$：§R-1500§!\n\n研究历时§Y180天§!。"
 PF_SK_STAGE_3_TITLE:0 "分担守望"
 PF_SK_STAGE_4_APPROVE:0 "一起开始吧。"
 PF_SK_STAGE_4_DESC:0 "来自各星域节点的报告里，开始出现越来越多相似的描述：有的成员能先于探测仪器察觉到微弱的频率变化，也有人能在日常协作中，凭自身感知帮助同伴将紊乱的讯号重新稳定下来。\n\n守岸人逐一核实了这些经历，将几份得到本人自愿许可的适应性记录放到你面前。\n\n“在与索拉里斯及黑海岸网络的长期接触中，不同的生命形态都在与这片宇宙的频率产生更深层的共鸣。他们愿意继续参与研究——我也想知道，这种跨越物种界限的共鸣能力，究竟能够走多远。”\n\n她抬起眼眸，湛蓝的瞳孔里映着流转的星光：“如果你也想看见那个万物彼此倾听、彼此回应的未来，我们可以一起开始。”"
 PF_SK_STAGE_4_DONE_DESC:0 "当最后一轮适应性测试顺利完成时，观测大厅里响起了一阵由衷的掌声。\n\n守岸人收好了测试记录，又逐一确认了每一位参与者的状态都稳定无虞，这才缓步走到你的面前。\n\n“将与特定频率产生共鸣的方法推广向更多生命形态的道路已经铺好了。接下来，可以由你决定我们怎样走下去。”\n\n她微微停顿了一下，向来宁静的脸庞上露出一抹格外柔和的笑意：“另外，还有一件私人的事。等你忙完手头的事务，我想请你来海岸边，听我弹完那首曲子。”"
 PF_SK_STAGE_4_DONE_EFFECT:0 "解锁§G共鸣者§!飞升天赋。解锁内阁职位§G黑海岸的观测者§!。"
 PF_SK_STAGE_4_DONE_REPLY:0 "我记得我们的约定。"
 PF_SK_STAGE_4_DONE_TITLE:0 "新的回应"
 PF_SK_STAGE_4_EFFECT:0 "£energy£ $energy$：§R-8000§!\n£alloys£ $alloys$：§R-2000§!\n£unity£ $unity$：§R-3000§!\n\n研究历时§Y180天§!。"
