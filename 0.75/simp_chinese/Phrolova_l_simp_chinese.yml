 PF_shorekeeper_bio:0 "由高纯度回音能量凝聚而成的生命体，曾在地底的孤岛上度过漫长的守望岁月。她原本只为执行演算与观测的使命而存在，却在与生命的接触中萌生了属于自己的情感与愿望。如今，她走出了那扇尘封的大门，以行政官的身份为你梳理纷繁的政务，成为你航程中最宁静而坚定的岸基。"
 PF_shorekeeper_bond_1_desc:0 "画面中，守岸人的掌心托着一小块失去光泽、呈死寂灰白色的碎裂晶体。\n\n“过去解析灾厄时，每当损耗超出限度，我的躯体就会像这样崩解、剥落。那时我总觉得，工具坏了很正常，就算彻底消散，也会有下一个完好的‘守岸人’来接替我。”\n\n她抬起头静静凝视着你，手指轻轻收拢，握紧了那枚旧碎片。\n\n“可当我用新的晶体填补缺口时，却第一次感到了困惑。如果所有部件都被替换了一遍，那留在这里与你说话的，究竟还是不是最初的那个我呢？”"
 PF_shorekeeper_bond_1_reply:0 "谢谢你愿意告诉我们。"
 PF_shorekeeper_bond_2_desc:0 "桌案上摆着几朵凝结而成的黑花。守岸人伸出指尖，极轻地触碰了一下花瓣。\n\n“在漫长的岁月里，我曾送别过许多同伴。我握住过他们逐渐冰冷的手，看着那些鲜活的温度一点点流失，最终化作地底星河里的一颗星辰。”\n\n她收回手，目光穿过屏幕落在你身上，眼底泛起细碎的涟漪。\n\n“我始终没有经历过从稚嫩到迟暮的生长，这样的我，真的有资格去谈论‘理解’人类的悲欢吗？直到来到你身边，看着你奔波的背影，我才觉得……或许我离那个答案，已经比从前更近了一些。”"
 PF_shorekeeper_bond_3_desc:0 "桌角的计时沙漏正静静流淌着微光。看到你出现，她的唇边绽开一抹清澈的笑意，将手轻轻按在胸口明亮的蓝核上。\n\n“那些守望、送别，以及与你共度的时光，都留在了我的选择里。它们让我明白，我从来不是一个可以被随意替换的答案。”\n\n几只淡蓝色的能量蝴蝶从她指尖飞出，轻盈地停在屏幕边缘。\n\n“明明没有器官在跳动，可每次见到你，胸腔都会传来剧烈的共鸣。留在你身边、成为你随时可以停靠的海岸——这就是我用自己的意志，做出的唯一选择。”"
