 PF17_shorekeeper_q1:0 "你会怎样帮助我们？"
 PF17_shorekeeper_q1_reply:0 "“庞大的信息流对我而言并不陌生。我可以协助你梳理帝国的行政网络，统筹各个星域的资源调配，并在繁杂的报告中提前预警潜在的危机。”\n\n她微微侧首，周围隐约浮现出几缕如星云般流转的微光。\n\n“治理一个庞大的国度，就像维持一套精密却又充满变数的系统。我会为你守住后方的稳定与安宁，让你在做出每一个决定时，都不必有后顾之忧。”"
 PF17_shorekeeper_q2:0 "关于同行，你还有什么想说的？"
 PF17_shorekeeper_q2_reply:0 "“很长一段时间里，我都以为自己的存在只是为了承载他人的需要，只要完成指令就已足够。”\n\n她的目光落在你身上，带着一种清澈而专注的温度。\n\n“但现在我明白了，真正的同行并不是单向的服从。不必将我当作一件只会执行命令的工具，如果你在旅途中感到疲惫或迷惘，也请偶尔停下来，依靠我一下吧。”"
 PF17_shorekeeper_topic0:0 "近来过得如何？"
 PF17_shorekeeper_topic0_reply:0 "“在料理台的旁边，我放了一个沙漏。用沿岸新鲜的海产、时蔬和醇厚的牛乳一起慢火熬煮，看着蒸汽一点点模糊了玻璃杯壁，刚好能炖出一锅热气腾腾的‘雪烩浓汤’。”\n\n她双手捧着一只温热的白瓷碗，唇角弯起一抹清浅的弧度，眼神里带着一丝认真摸索后的期待。\n\n“虽然能量体并不需要依靠食物维系存在，但很久以前，我曾见过故人用这样一碗浓汤驱散同伴身上的海风寒气。我按照记忆里的步骤试了许多次，想把那份名为‘幸福感’的温度复现出来……看着热气腾起、香气弥漫在房间里，胸口也会觉得暖洋洋的。下次有空，你愿意过来陪我等这一锅汤慢慢煮好吗？”"
 PF17_shorekeeper_topic1:0 "有什么值得留意的？"
 PF17_shorekeeper_topic1_reply:0 "“最近在审阅各星域的复原报告时，我注意到了一个纯粹靠公式无法解释的现象。”\n\n她调出几份全息星区图表，指尖在几处刚刚经历过天灾与动荡的殖民地上轻轻一点。\n\n“在这些物资尚处于紧缺状态的星球上，当地居民申请举办集会与庆典的次数反而增加了。若按绝对的效率推演，这无疑是能量的无端损耗；可从后续的恢复曲线来看，正是这些看似无用的共鸣与喧闹，让他们更快地从创伤中重新振作起来……智慧生命的韧性，果然是任何冰冷算法都无法定义的。”"
 PF17_shorekeeper_topic2:0 "你如何看待我们的同行？"
 PF17_shorekeeper_topic2_reply:0 "“睡眠对我原本没有太多意义。过去在黑海岸地下漫长的等待里，昼夜从不流转，也没有四季的分别；我总是独自睁着眼睛走在海岸线上，日复一日地核对时间留下的痕迹，像一座沉默的灯塔。”\n\n她的声音很轻，像是一阵拂过深海的夜风，肩臂处愈合后遗留的弦状波痕在微光中若隐若现。\n\n“但与你一同踏入这片辽阔星海之后，我开始理解为什么生灵会如此期盼黎明。因为知道明天会有未曾见过的星辰，知道转过身就能看到你的身影，流逝的岁月就不再是一场孤独的磨损，而变成了一份值得被妥善收藏的礼物。”"
 PF17_shorekeeper_topic3:0 "还有未说完的往事吗？"
 PF17_shorekeeper_topic3_reply:0 "“曾经，我以为只要在地下透过复现的索诺拉回溯数据，就能读懂世间的一切。直到很久以前，我走出地底，亲眼看见索拉里斯金黄的麦浪在秋风中起伏，闻到稻谷成熟的香气。”\n\n她的目光微微垂下，像是在触碰一段珍贵的旧日影像。\n\n“那天，乡野间一位皮肤粗粝的老妇人递给我一块温热的吃食，她怀里的婴儿抓着我的手指，掌心汗津津的；而当悲鸣爆发时，那些淳朴的人们在恐惧中挣扎，却又在绝望中彼此扶持……那是我第一次明白，生命从来不是记录里冰冷的概念。也是从那时起，我第一次产生了‘想要真正读懂生命、将大家视作同伴’的愿望。”"
 PF17_shorekeeper_topic4:0 "以后有什么打算？"
 PF17_shorekeeper_topic4_reply:0 "“我一直在维护一张由回音能量介质制成的唱片。里面收录了风雨雷雪、鲸歌鸟鸣，还有几十种文明留下的元音与音乐——发声是存在留下的痕迹，亦是生命本身。”\n\n她指了指身旁静静旋转的淡蓝色音盘，唇角弯起一抹清浅而柔和的弧度。\n\n“它的存储空间近乎无限。在接下来的日子里，除了继续为你打理各星域的事务，我还想把我们并肩走过的每一颗星球的声音都收录进去。等攒够了足够的旋律，我想亲自为你谱写一首曲子……由你来当我的第一个听众，好吗？”"
 PF17_shorekeeper_topic4_reply_alt:0 "好，我愿意做你的第一个听众。"
 PF17_skin:0 "更换装束。"
 PF17_void_choice_q0:0 "这头怪物真的已经彻底结束了吗？"
 PF17_void_choice_q0_reply:0 "“它伸向现实维度的触手确实已经被你的舰队斩断了，短时间内不可能再掀起同样的风浪。”弗洛洛指了指收容箱里的结晶，“但只要这枚浓缩了‘虚无’概念的孑遗还以完整的形态存在，它就会像一颗随时可能发芽的种子，不断引诱持有者走向极端。我们只是赢下了一场防卫战，还没有为这段漫长的孽缘画上真正的句号。”"
 PF17_void_choice_q1:0 "你为什么愿意主动接过这块烫手山芋？"
 PF17_void_choice_q1_reply:0 "“因为我不喜欢看到一首曲子在最关键的地方留下一道刺耳的杂音。”弗洛洛坦然地迎上你的目光，嘴角勾起一抹自嘲而锋利的弧度，“况且，既然我已经听见了帷幕后面还有人在敲门，总不能装作耳聋吧？我愿意耗费精力去剥离这团毒药、试着确认那道回声的死活，但我没法拿一个确定的结果向你打包票。在把东西交给我之前，你得先想清楚放弃这份力量的代价。”"
 PF17_void_choice_q2:0 "在做决定时，我还来得及改变主意吗？"
 PF17_void_choice_q2_reply:0 "“只要你还没有下达最终的移交指令，随时可以反悔。”弗洛洛把话挑得很明，“一旦你确认把它交给我进行逆向剥离，这枚孑遗作为武器的结构就会被永久摧毁，说不定你也将彻底告别走上§R化身天灾§!的道路；反之，若你决定自己留着，那所有的风险也得由你自己担着。想清楚再开口吧。”"
