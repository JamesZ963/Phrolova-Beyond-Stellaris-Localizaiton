 leader_trait_pf075_sunset_1:0 "不再日落"
 leader_trait_pf075_sunset_1_desc:0 "那些得到回应的约定，终于在同一首乐章中延续。"
 leader_trait_pf075_sunset_2:0 "不再日落"
 leader_trait_pf075_sunset_2_desc:0 "那些得到回应的约定，终于在同一首乐章中延续。"
