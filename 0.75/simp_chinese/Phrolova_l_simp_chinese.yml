 PF_B_MATH_SHIELD_DESC:0 "将拟制炉芯的能源回路接入舰船防护系统，维持护盾并补充受损的屏障。"
 PF_B_MEMORY_DESC:0 "莫宁把那段旧影像重新调出来。画面里是冰原上的星空，和一个曾经背着她走过风雪的人。\n“我以前以为，记得这些会让人停在原地。”她说，“现在才发现，它也可以是指向未来的坐标。”"
 PF_B_MEMORY_OPTION:0 "把这段回忆留在通讯档案里。"
 PF_B_MEMORY_TITLE:0 "私人回忆"
 PF_B_MORIN_COMPANIONS:0 "关于同行。"
 PF_B_MORIN_MEMORY:0 "重温雪原的私人回忆。"
 PF_B_MORIN_PROJECT:0 "目前的工程进展如何？"
 PF_B_MORIN_SOLARIS:0 "和她聊聊索拉里斯。"
 PF_B_MORIN_TALK:0 "和她聊聊。"
 PF_B_NEED_MATERIALS:0 "材料不足。"
 PF_B_RAID_PREPARE:0 "立刻安排防御舰队，全星系进入紧急状态"
 PF_B_RAID_STRENGTH_NOTE:0 "确认后有60天备战。预计来袭战力约5万。"
 PF_B_RAID_VICTORY_DESC:0 "随着最后一艘海盗袭击舰在密集的防空火力中化作一团失控的火球，索拉里斯外围轨道终于重新归于平静。警报解除后，工程运输船队重新驶入航道。\n\n通讯接通时，莫宁还没从重度超频的疲惫中缓过来。她先逐一核对工程人员报平安的回执，最后才把外围框架的战损报告存进另一个文件夹。\n\n“主承力结构与核心转换器都通过了战后复检，没有出现内应力损伤。只要舰队确认航道残骸清理完毕，我们随时可以恢复满负荷试验。”\n\n在准备切断通讯前，这位难掩疲惫的工程师突然停顿了一下，抬起眼眸，认真地注视着屏幕前的你：\n\n“……谢谢你，准时把大家都平平安安地带了回来。”"
 PF_B_RAID_VICTORY_TITLE:0 "航道重归平静"
 PF_B_RAID_WARNING_DESC:0 "一颗在黑暗森林中重新点燃的太阳，注定无法永远隐藏自己的光芒。就在拟制炉芯的功率逐步爬升之际，索拉里斯外围的远距监听站截获了数段经过多重加密的异常超空间通讯——有人正在黑市与流亡海盗的频道中，高价悬赏索拉里斯的货运班次表与特种工程材料清单，甚至连拟制炉芯的高清遥测图像，都已经出现在了一份来历不明的掠夺标的目录中。\n\n莫宁在收到情报的五分钟内，便面无表情地用红线在星图上重新划定了外围施工船的紧急撤收半径。\n\n“我已经下令将所有非战斗试验人员转移至地表掩体与内环安全区了。”她将整理好的防御方案推到你面前，“外围的测绘仪器和脚手架就算被炸碎了，我也随时能重新造出来；但我的学生和工程师们不行。请先让所有施工船全部撤回来。”\n\n守岸人已将推算出的三处敌方潜在跃迁点标入了防御星图。这束凝聚了无数心血的微光，终究还是引来了星空深处贪婪的豺狼。"
 PF_B_RAID_WARNING_TITLE:0 "被发现的光"
 PF_B_RECEIVE_RESUME:0 "关于接回那个女孩的准备……"
 PF_B_RELIC_DISPLAY_CLOSE:0 "收好这份赠礼。"
 PF_B_REOPEN_B05:0 "继续讨论拟制炉芯的提案。"
 PF_B_REQUIRE_MORIN:0 "需要由莫宁亲自主持该项工程。"
 PF_B_RESEARCH_STATUS_B06:0 "“深空联合遗留的旧图纸和文献我已经全部梳理完毕了。目前只缺几组最关键的现场实测参数，只要去‘隧者’的残骸上做一次抵近测绘，应该就能把最后的空白补齐。”"
 PF_B_RESEARCH_STATUS_B07_B08:0 "“两组记录对上了。剩下的疑问，或许只能去隧者身边确认。”"
 PF_B_RESEARCH_STATUS_B09:0 "“远征带回来的隧者接口记录正在导入主数据库。所有的理论拼图都已经凑齐，我们手里终于有一套可以真正交付施工的完整太阳设计图了。”"
 PF_B_RESEARCH_STATUS_B09_READY:0 "“通过对碎片底层谐振的逆向推导，我们已经锁定了通向那具‘隧者’残骸的坐标线索。旧档案里关于核心接口的记载有几处断层，我想亲自跟船过去看一看。”"
 PF_B_RESEARCH_STATUS_B09_RUN:0 "“前往神秘地点的远征科研船已经正式启航了。我在船上专门留了一条直通索拉里斯研究站的加密通讯链路，沿途有任何进展，你随时可以联系我。”"
 PF_B_RESEARCH_STATUS_B10:0 "“最终审定的全套蓝图就在这里。等高轨承力框架的建设正式动工，我会带着工程团队驻扎在现场，亲自为你核对每一道接口的咬合精度。”"
 PF_B_RESEARCH_STATUS_EMPTY:0 "“研究团队正在地下掩体里重新接通旧时代的检测设备。我想先把炉芯碎片的这几组基础物理测量做扎实，等拿到确切的数据再一并带给你。”"
 PF_B_RESEARCH_STATUS_TITLE:0 "研究准备情况"
 PF_B_STAGE_1_0:0 "准备下一阶段。"
 PF_B_STAGE_2_0:0 "好，先去休息吧，核心整合的事明天再继续。"
 PF_B_STAGE_3_0:0 "然后，再一步"
 PF_B_STATUS_B05:0 "“当务之急是先恢复地下研究站的基础运转。我需要调阅深空联合留在主机里的原始实验日志，也需要一个具备屏蔽力场的无尘环境，来开展炉芯碎片的微观检验与设备调试。”\n\n“前置的理论模型我已经搭建完毕了，只要工程与科研条件准备就绪，我们随时可以推进下一步。”"
 PF_B_STATUS_B05_PENDING:0 "“现阶段的设计资料与演算进程都已经妥善保存。你可以先去处理帝国的其他政务，等腾出空来我们再继续讨论——届时我会把最新一轮的验算结果一并带给你。”"
 PF_B_STATUS_B06:0 "“地底的旧研究站终于又能正常开展实验了。以前我和同事们留在老设备上的校验记号居然都还在，新调来的年轻研究员们今天围着我问了半天，想弄明白那些符号各自代表什么参数。”"
 PF_B_STATUS_B06_RUN:0 "“研究站主走廊的照明和通风都已经重新接通了。最深处还有几个封存着旧时代原型的实验室没有打开，我想等外围的防护设备全部自检完毕后，再带人进去清点。”"
 PF_B_STATUS_B07_B08:0 "“两组记录对上了。剩下的疑问，或许只能去隧者身边确认。”"
 PF_B_STATUS_B09:0 "“从‘隧者’残骸上拓印回来的核心接口记录已经全部送进实验室了。给我一点时间，我要把这些缺失了数十年的拼图，和我们之前的碎片测量结果放在一起重新核对一遍。”"
 PF_B_STATUS_B09_READY:0 "“通过对碎片谐振的逆向追踪，我们已经锁定了通向那具‘隧者’残骸的空间坐标。有些深层接口的排布在旧档案里记载得很模糊，我想亲自随船过去看一看。”"
 PF_B_STATUS_B09_STARTED:0 "“远征科研船正在缓缓靠向那具漂浮在黑洞外围的‘隧者’残骸。我已经把旧图纸上所有存疑的接口位置都用红圈标出来了，等到了近前，一定能把当年未解的结构看个清楚。”"
 PF_B_STATUS_B10_READY:0 "“全套施工图纸我已经反复验算过三遍，确认没有任何逻辑漏洞了。如果你那边的物资与船坞都已经调配妥当，我随时准备见证它在星空中搭起第一道轮廓的样子。”"
 PF_B_STATUS_EARLY:0 "“我们先按部就班地完成手头的勘测吧。炉芯碎片与地下旧设施的数据可以互为参照，等交叉比对的结果出来之后，我会立刻为你整理出下一阶段所需的工程条件清单。”"
 PF_B_STATUS_FORGE_BLOCKED:0 "“轨道外围的几处关键转换设备目前处于断联状态。我已经把断联前最后一秒的遥测记录全部提取出来了，但具体的受损程度，还需要我带队去现场做一次实地复勘。”"
 PF_B_STATUS_FORGE_PAUSED:0 "“目前我们暂时无法在索拉里斯轨道上继续施工。不过请放心，所有的核心工程记录和阶段性测算资料都已经被我锁进了离线备份库，只要现场重新具备安全作业条件，我们随时可以无缝恢复项目。”"
 PF_B_STATUS_STAGE_1:0 "“高轨承力框架的应力测试已经全部达标，接下来终于可以往里面安装内部转换设备了。各处高维接口都需要用共鸣能力逐一校准，地面的辅助供能系统也必须同步跟上。”"
 PF_B_STATUS_STAGE_1_RUN:0 "“工程船队正在太空中搭建炉芯的第一层主承力框架。我留在研究站里实时核对承力结构的形变参数与设备接口，科研船新传回来的观测数据也正在同步并入我的演算模型。”"
 PF_B_STATUS_STAGE_2:0 "“现有的轨道传输系统已经能够维持高功率稳定输出了。接下来的收官阶段，我们需要将中央炉芯与地表的控制网络彻底并网，再完成最后一轮全闭环抗压测试。”"
 PF_B_STATUS_STAGE_2_RUN:0 "“多相态能量转换模块与超导传输层正在逐一接入主框架。为了确保万无一失，我把工程队分成了六个小组同步做极限测试，必须确认每一个部件都能在极端工况下正常运转。”"
 PF_B_STATUS_STAGE_3:0 "“拟制炉芯已经正式进入长期的满负荷稳定运行阶段了。工程团队正在整理最终的竣工验收报告，接下来无论是深空观测还是高能耗工业应用，都可以直接在这套成熟的能源网之上继续拓展。”"
 PF_B_STATUS_STAGE_3_RUN:0 "“最后的系统总成整合正在按计划推进。我要求团队把调试期间的每一条报错和修正记录都完整保留下来——等以后把炉芯移交给常规维护班组时，这些一手资料能帮他们省去很多弯路。”"
 PF_B_TRADITION_FLAVOR:0 "一次次复验，将猜想写成可以交给后来者的答案。那些曾经隔着天空仰望群星的人，也终于为远航留下了自己的方法。"
