 leader_trait_pf075_sunset_4_desc:0 "那些得到回应的约定，终于在同一首乐章中延续。"
 leader_trait_pf_aemeath:0 "长航的星辉"
 leader_trait_pf_aemeath_2:0 "春风祝颂你的旅途"
 leader_trait_pf_aemeath_2_desc:0 "希望现在的我，已经成长到能和你并肩而行了。"
 leader_trait_pf_aemeath_3:0 "于无垠电子海间轻舞"
 leader_trait_pf_aemeath_3_desc:0 "我想和你一样，成为救世主。"
 leader_trait_pf_aemeath_desc:0 "“我只希望，你能自由又快乐地活着。”"
 leader_trait_pf_denia:0 "薄明梦中的寂静光辉"
 leader_trait_pf_denia_2:0 "若能以谎言缝补心脏"
 leader_trait_pf_denia_2_desc:0 "笑是一种很方便的工具，它能以廉价的方式拉近你和别人的距离。"
 leader_trait_pf_denia_3:0 "从远方，回到远方"
 leader_trait_pf_denia_3_desc:0 "砰。像一场玩笑——无限坠落的黑暗，忽地有了尽头。昏冥中，有人轻轻叹了口气，似是等了许久。"
 leader_trait_pf_denia_desc:0 "她的频率破裂成千丝万缕的线，身躯溶解为污浊汇入海洋——随后，她升腾为穿越世界的大雾与风，拂过没有色彩的荒原，直到抵达那片再熟悉不过的、腐烂的星空。而死寂的世界一如既往地凝视着她，一言不发。"
 leader_trait_pf_morin:0 "熵增的启明星"
 leader_trait_pf_morin_2:0 "缄默的观测者"
 leader_trait_pf_morin_2_desc:0 "再宏伟的工程模型，都始于日复一日耐心而沉默的验算。她从不放过曲线中哪怕一微米的微小偏差，也从未忘记那些与实验数据一同留在昨日的名字。"
 leader_trait_pf_morin_3:0 "直到群星的尽头"
 leader_trait_pf_morin_3_desc:0 "告别了轮椅与拟造的天幕之后，她终于能用自己的双腿踏足大地，亲手测量那些曾经只能仰望的星光。每一份核对无误的实证数据，都在为下一次更遥远的启程指明航向。"
 leader_trait_pf_morin_4:0 "临界协议"
 leader_trait_pf_morin_4_desc:0 "星栈安静下来，莫宁仍在听。遗址的石层深处、裂隙那头看似空无一物的黑暗里，都有尚未读完的记录。"
 leader_trait_pf_morin_desc:0 "在万物走向热寂的宏大宇宙尺度下，渺小的生灵依然执拗地用理性点亮了属于自己的坐标。莫宁将旧时代的理论火种带出地底，在真实的星海中将其锻造成了触手可及的未来。"
 leader_trait_pf_morin_injured:0 "伤残"
 leader_trait_pf_morin_injured_desc:0 "漫长的低温静滞让尾椎处的神经接口与定制义肢需要重新磨合。她正在医护人员的协助下进行康复训练与内部元件微调，逐步恢复完全自主的日常行动能力。"
 leader_trait_pf_resonance_awakening:0 "共鸣觉醒"
 leader_trait_pf_resonance_awakening_desc:0 "这位领袖能够感知并调节自身的频率，将觉醒的能力运用到所承担的职责之中。"
 leader_trait_pf_shorekeeper:0 "来自叙响织构"
 leader_trait_pf_shorekeeper_2:0 "缄默的回声"
 leader_trait_pf_shorekeeper_2_desc:0 "黑海岸地下，群星在永无止息的夜空高悬，时间流转，却没有四季的分别。"
 leader_trait_pf_shorekeeper_3:0 "夜幕的赠予与拒绝"
 leader_trait_pf_shorekeeper_3_desc:0 "你就像黑夜，拥有寂静与群星。"
 leader_trait_pf_shorekeeper_4:0 "群星漫想"
 leader_trait_pf_shorekeeper_4_desc:0 "新的黑花已在遥远的星域绽开。她记住了每一个传回消息的地方，与同伴们一同分担漫长的守望。"
 leader_trait_pf_shorekeeper_desc:0 "别为我叹息，我不在那里，也没有离去。"
