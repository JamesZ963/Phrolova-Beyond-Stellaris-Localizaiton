 PF075_SUIZHE_REACTOR:0 "拉海洛之心接口"
 PF17_1600_desc:0 "特种收容舱被缓缓送入旗舰的主隔离室。透过厚重的防辐射玻璃可以看到，这枚从孤岛最深处带回的“拉海洛之心”早已遍体鳞伤——原本用于约束恒星级热熔能量的外层装甲布满了焦黑的裂纹。\n它就像一件在深渊旁摔碎了琴箱的古老乐器，虽然内部的弦音仍未彻底断绝，但随时都有可能在下一次震颤中彻底解体。我们将它妥善固定在力场基座上，等待弗洛洛给出详细的拆解与修复方案。"
 PF17_1600_title:0 "拉海洛之心"
 PF17_1601_desc:0 "弗洛洛绕着隔离舱走了一圈，手中的指挥棒轻轻敲击着玻璃外壁。随着她的动作，几道探测波束刺入核心内部，将错综复杂的裂痕投影在半空中。\n\n“先别急着尝试启动它。现在的它就像个漏风的破风箱，强行唤醒只会让里面的东西直接炸在我们的甲板上。”\n\n她停下脚步，目光扫过那些致命的创伤，语气冷静而笃定：“想要让这颗曾经照亮地底的太阳重新跳动起来，我们得按规矩分成三个乐章来走——先用特种合金重塑它崩裂的外壳，再把里面被虚质搅乱的频率记录理顺，最后完成底层结构的合拢校准。把工程队交给我吧，一步一步来。”"
 PF17_1601_title:0 "尚未停息的脉动"
 PF17_1602_desc:0 "随着第一阶段工程的结束，收容舱内狂暴的电弧终于平息下来。工程团队利用与隧者同源的流体合金，将炉芯表面那些触目惊心的焦黑裂谷逐一填平、焊死。原本随时可能崩解的机械外壳重新恢复了严丝合缝的几何轮廓，不再向外界泄露危险的高能辐射。\n\n弗洛洛站在操作台前，看着彻底稳定下来的外部读数，满意地收回了指挥棒。“至少现在，它看起来又像是一颗合格的炉芯，而不是一块随时会炸开的废铁了。”她转过身看向你，“容器的裂痕已经补好，接下来，该去清理残留在它血管里的那些杂音了。”"
 PF17_1602_title:0 "容器的裂痕"
 PF17_1603_desc:0 "第二阶段的修复深入到了炉芯的数据与频率回路之中。在过去漫长的岁月里，阿列夫一的虚质侵蚀如同铁锈般爬满了内部导流槽，将原本纯净的星辉频率切割得支离破碎。弗洛洛亲自接管了调律台，用极其刁钻而精准的基准波，一点点剥离附着在线路上的死寂杂音。\n\n当最后一段堵塞的回音通路被强行贯通时，炉芯内部突然亮起了一道温暖而明快的橘红色微光。原本死气沉沉的导流槽仿佛被注入了活水，庞大的能量流开始顺着修复好的线路自主流转。\n\n“听见了吗？里面的弦终于重新绷紧了。”弗洛洛揉了揉有些发酸的手腕，眼底闪过一丝赞许，“那些被虚质掐断的回路已经接上了大半，只差最后一步，就能让它彻底恢复全盛状态。”"
 PF17_1603_title:0 "回声的线路"
 PF17_1604_desc:0 "最后的校准工作在绝对静默中迎来了尾声。随着三组内外部共鸣环在弗洛洛的引导下严丝合缝地咬合归位，整座收容舱猛地一震——紧接着，一声浑厚、有力、宛如真正心脏搏动般的轰鸣声穿透了隔离罩，在整间实验室里回荡开来。\n\n金红色的星辉在炉芯内部流转不息，所有的裂痕与淤塞都已消失不见。\n\n弗洛洛没有立刻去关停设备，而是静静地注视着这枚重获新生的造物。“所有的声部都已经对齐，它现在完美得就像是刚从隧者胸口取出来时一样。”她转过头，神色严肃地看向你，“但在你决定怎么处置它之前，有些话我得先说在前面。”"
 PF17_1604_title:0 "重新合拢的心脏"
 PF17_1611_desc:0 "在密集的舰队齐射与贯穿星空的炮火洗礼下，那团不可一世的庞大阴影终于走到了崩溃的边缘。它曾试图用无意义的绝望吞没整支舰队，却在无数生灵坚定不移的集火中，被硬生生撕裂了核心的频率结构。\n\n没有震耳欲聋的爆炸，那巨物就像是被戳破的泡沫般，开始向内剧烈坍缩。覆盖星空的灰白帷幕寸寸碎裂，化作无数细小的空间裂隙；那个曾经高高在上、要求万物臣服的冰冷声音，在发出最后一声扭曲的嘶鸣后，终于被自己坍缩产生的回响彻底吞没。\n\n当最后一道虚质冲击波掠过舰队护盾，索拉里斯的星空重新恢复了澄澈。而在战场上空的引力中心，只留下了一枚仍在吞吐着诡异微光的浓缩核心。通讯投影亮起，弗洛洛静静地站在画面中，目光落向那枚战利品。"
 PF17_1611_title:0 "虚无之神的终结"
 PF17_1765_desc:0 "五道身影留在同一幅画面里。今晚，没有人需要独自守望。"
 PF17_1765_title:0 "新索拉里斯"
 PF17_1770_desc:0 "弗洛洛站在花坛的边缘，指挥棒被她随手别在腰间。她正微微仰着头，注视着夜空中穿梭的民用穿梭机尾迹。察觉到你的脚步，她转过身，裙摆在灯光下划出一道优雅的弧度，她的眼底倒映着整座城市的万家灯火。"
 PF17_1770_title:0 "彼岸祭典"
 PF17_1771_desc:0 "达妮娅正懒洋洋地靠在一座修复好的喷泉边，手里捏着一块涂满厚厚奶油的蛋糕。她像只刚睡醒的猫一样伸了个懒腰，随后注意到了你的目光，立刻换上了那副毫无破绽的甜美笑容，冲你轻快地挥了挥手。"
 PF17_1771_title:0 "彼岸祭典"
 PF17_1772_desc:0 "守岸人安静地伫立在广场的一角，正低头核对着数据终端上最后一批会场物资的调配记录。几只淡蓝色的能量蝴蝶在她指尖蹁跹起舞，最后化作点点星光消散。她抬起眼眸，视线在与你交汇的瞬间，化作了湖水般的温柔。"
 PF17_1772_title:0 "彼岸祭典"
 PF17_1773_desc:0 "爱弥斯像一阵风似的从人群中钻了出来，手里还捧着一束刚刚用数据与现实物质共同织就的光芒花束。她轻盈地转了个圈，那套熟悉的机甲兵装今天被她收了起来，取而代之的是一身充满活力的常服，眼底的星光比夜空更明亮。"
 PF17_1773_title:0 "彼岸祭典"
 PF17_1780_desc:0 "过去漫长岁月里刺耳的悲鸣，终于在长弓与琴弦的交错下化作了温润的和弦。\n\n它的精密琴腔内封存着整颗索拉里斯在苦难中摸索出的全部智慧结晶，也浸润着失亡彼岸重燃的灯火与欢笑。\n如今，新建的乌洛波洛大剧院已然巍然耸立，当你拂过它的琴弦时，指尖传来的清越震颤正与整颗星球一同呼吸——旧日的挽歌已经画上休止符，这把铭刻着往昔的提琴，正等待着与你和弗洛洛一起，在更辽阔的星海中奏响全新的乐章。"
 PF17_1780_title:0 "失亡彼岸"
 PF17_1781_desc:0 "你低头看向刚刚接过的星之剑。那束跨越了漫长孤寂的光芒温暖而明亮，曾在通讯彼端独自哼歌的身影，如今就站在你的面前。"
 PF17_1781_title:0 "永远的启明星"
 PF17_1782_desc:0 "笼罩星空的灰白阴影已经彻底散去，但收容匣中那枚冰冷的结晶却仍在静静吞吐着幽暗的微光。那微弱的求救杂音最终被厚重的铅封彻底隔绝，我们选择将这份足以扭曲现实的伟力握在自己手中——无论未来的星海将因此迎来怎样的风暴，我们都已准备好独自承担这一选择的全部后果。"
 PF17_1782_title:0 "虚无之神的孑遗"
 PF17_aemeath_bond:0 "未曾说完的话"
 PF17_aemeath_bond_desc:0 "爱弥斯的声音在通讯中停顿了片刻。随后，她轻轻笑了，决定把那段独自保存的回忆与我们分享。"
 PF17_aemeath_bond_q0:0 "能介绍一下你自己吗？"
 PF17_aemeath_bond_q0_reply:0 "“爱弥斯，星炬学院拉贝尔学部的适格者！……不过，那都是很久之前的老黄历啦。如你所见，现在的我是一只在数据海里飘荡的电子幽灵哦～”\n\n投影中的少女笑眯眯地原地转了个圈，几缕像素般的星辉顺着她的发梢散开。\n\n“作为幽灵，我随时可以顺着网络溜进机甲或者舰船系统里！拉海洛之心的力量，也能让我以实体的姿态与你相见。怎么样，身边多一个能在两种形态间来去的同伴，是不是感觉赚大啦？”"
 PF17_aemeath_bond_q1:0 "你会怎样帮助我们？"
 PF17_aemeath_bond_q1_reply:0 "“和坏家伙讲不通道理的时候，当然就得靠火力压制啦！我可以显化专属的机甲兵装，还能把一部分算力分给舰队的主控系统，帮你重新规划光炮的射击阵列。”\n\n她得意地叉起腰，语气轻快得像是在介绍什么新玩具。\n\n“毕竟我已经不做普通生命了嘛，双线程运转根本不在话下～不管是在正面战场用重火力轰开防线，还是在情况不对时入侵敌方雷达、带大家安全撤离，就放心交给我吧！”"
 PF17_aemeath_bond_q2:0 "关于同行，你还有什么想说的？"
 PF17_aemeath_bond_q2_reply:0 "“我以前玩角色扮演游戏的时候就在想，凭什么所有的危险和沉重，都要让主角一个人扛下呢？”\n\n她收起嬉笑的神色，认真地注视着你，眼底闪烁着明亮如火的星光。\n\n“守护世界这种听起来既傲慢又沉重的理想，如果能有两个人一起分担，走起来一定会轻松很多吧？所以，别想把我留在安全的后方哦。接下来的路，我也会一直冲在能看见你的地方！”"
 PF17_aemeath_chat:0 "和她聊聊。"
 PF17_aemeath_contact_q0:0 "能介绍一下你自己吗？"
 PF17_aemeath_contact_q0_reply:0 "“爱弥斯，星炬学院拉贝尔学部的适格者！……不过，那都是很久之前的老黄历啦。如你所见，现在的我是一只在数据海里飘荡的电子幽灵哦～”\n\n投影中的少女笑眯眯地原地转了个圈，几缕像素般的星辉顺着她的发梢散开。\n\n“因为在驾驶舱里和隧者强行共鸣时失去了肉身，我的存在本质已经变成了频率。现在的我既能作为幽灵潜入数据系统内部，又能借着拉海洛之心的力量，像这样站在阳光下与你并肩——跨过死亡之后还能重逢，我已经受到命运的优待啦。”"
 PF17_aemeath_contact_q1:0 "你会怎样帮助我们？"
 PF17_aemeath_contact_q1_reply:0 "“和坏家伙讲不通道理的时候，当然就得靠火力压制啦！我可以显化专属的机甲兵装，还能把一部分算力分给舰队的主控系统，帮你重新规划光炮的射击阵列。”\n\n她得意地叉起腰，语气轻快得像是在介绍什么新玩具。\n\n“毕竟我已经不做普通生命了嘛，双线程运转根本不在话下～不管是在正面战场展开光翼、用集束射击荡平防线，还是在危急关头接管导航带大家安全跃迁，就统统放心交给我吧！”"
