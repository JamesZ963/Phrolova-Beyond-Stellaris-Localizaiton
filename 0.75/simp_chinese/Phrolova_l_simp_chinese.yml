 PF_SK_HIGHEST_DESC:0 "重建的黑海岸边静谧无声，唯有漫天群星倒映在平缓的海潮之上。当你来到琴边时，守岸人微微颔首，指尖落在琴键上，流淌出第一串清澈如星雨的旋律。\n\n起初，曲调中浮现的是旧观测中心在孤寂岁月里反复发出的引航呼叫；片刻之后，一道道来自遥远星域节点的回航讯号、异星的雨声与交接班的问候，都化作温暖而恢弘的和弦轻轻接了上来。\n\n在昔日录音曾因灾厄而中断的地方，守岸人亲手写完了后面的乐章。当最后一个音符融进海风，她的手仍停在琴键上，胸口的晶核泛起温柔而明亮的流光，如同蝴蝶破茧时的振翅，又如新星诞生时的脉动。\n\n“这首曲子里面有很多人的声音——我记得它们来自哪一颗星球，也记得你每一次倾听他们时的样子。”\n\n她转过身，在璀璨的星辉下安静而专注地看着你：\n\n“曾经，我的使命只是作为工具守在原地，对抗漫长的时间；但与你同行之后，是你让我在这片更辽阔的星海里，找到了属于我自己的答案与自由。无论未来的航程通向何方，这里永远是你可以停驻的海岸。”"
 PF_SK_HIGHEST_EFFECT:0 "守岸人的通讯中开放本次演出回顾。"
 PF_SK_HIGHEST_REPLY:0 "能再弹一遍吗？"
 PF_SK_HIGHEST_TITLE:0 "行至海岸尽头"
 PF_SK_INVITATION_DESC:0 "“那首收录了旅途回响的曲子，我已经写下最后一个音符了。”\n\n通讯画面里，守岸人坐在三角钢琴旁，将刚刚整理好的录音样本收进终端，随后轻轻关掉了预览界面。\n\n她抬起头望向你，眼底盛着安静的期许：“我想在海岸边亲自弹给你听。现在，你愿意来赴约吗？”"
 PF_SK_INVITATION_OPEN:0 "你说的那首曲子……"
 PF_SK_INVITATION_TITLE:0 "行至海岸尽头"
 PF_SK_LATER:0 "留着这份记录，我们稍后再谈。"
 PF_SK_MEMBERS_DESC:0 "守岸人收到了一份由数位新成员共同署名的边疆观测报告。在数据末尾，还附着几张照片，那是他们在完成值守工作后拍下的当地天空。\n\n她指着其中一张晨曦穿透云层的照片，轻声告诉你，这是由一位第一次离开母星的年轻成员拍下的。\n\n“在加入黑海岸之前，他原本以为自己一辈子只能留在地面上，重复既定的生活。而现在，他在信里好奇地问我，等这一期的任务结束，下一次还会去往哪一个星系……是我们的同行，给了他们望向远方的契机。”"
 PF_SK_MEMBERS_REPLY:0 "继续。"
 PF_SK_MEMBERS_TITLE:0 "来自远方的来讯"
 PF_SK_OVERVIEW_DESC:0 "守岸人展开了星图。远处一朵黑花亮起来，不一会儿，另一处也传回了讯号。她把两封回信放在一起，留给你慢慢读。"
