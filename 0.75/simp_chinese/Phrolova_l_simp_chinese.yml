 PF_ALEPH_POSITION:0 "稳定虫洞"
 PF_ALEPH_POSITION_DESC:0 "索拉里斯上空的频率，正与尚未标明的彼端相互呼应。弗洛洛准备校正航标、稳定通路，让那片藏在星图之外的区域成为可以抵达的地方。"
 PF_AME_FREQUENCY:0 "稳定异常频率"
 PF_AME_FREQUENCY_DESC:0 "借助索拉里斯的观测与算力网络，将断续的信号从杂音中分离出来，为遥远的声音建立一条能够彼此回应的通路。"
 PF_AME_HEART:0 "深入拉海洛之心的秘密"
 PF_AME_HEART_DESC:0 "拉海洛之心的深层记录中，浮现出了不属于设备噪声的回应。弗洛洛准备重新梳理其中的频谱，确认这道陌生的声音究竟从何而来。"
 PF_AMX_AFTER_DESC:0 "推开气密门，晚风迎面拂来。难得卸下了任务的同伴们，此刻正三三两两地聚在星光下。\n\n弗洛洛斜倚在桌边，难得穿上了那身白色的裙子，指尖漫不经心地转着高脚杯，正听守岸人轻声说起各星域重建航道的趣闻，几只淡蓝色的能量蝴蝶在两人之间安静起落；不远处的长椅扶手上，达妮娅正捧着刚顺来的甜点小口咬着，看到你们并肩走出来，立刻弯起眼睛冲这边俏皮地晃了晃叉子。\n\n爱弥斯笑嘻嘻地快步走到露台边缘，背靠着栏杆转过身。刚才顺手从窗台上抓来一张纸，不知何时已经在她灵巧的指尖翻折了几个来回。\n\n“在拉海洛的那些年里，我做过无数次梦，梦见所有沉重的秘密都不用再隐瞒，梦见大家都能在没有阴霾的天空下热热闹闹地聚在一起……”她的目光掠过每一个人，最后稳稳地落回你的身上，“谢谢你把那个遥不可及的梦，变成了我伸手就能碰到的现实。”\n\n爱弥斯低下头，将手里最后一道折痕认认真真地压平。"
 PF_AMX_AFTER_NEXT:0 "看看她在折什么。"
 PF_AMX_AFTER_TITLE:0 "散场之后"
 PF_AMX_AID_FIRST_DESC:0 "战斗结束后，当地港口发来一段短短的通讯。线路杂音里，有人在确认家人的消息，也有人反复向舰队致谢。\n\n爱弥斯听着那些声音，许久才重新看向你。\n\n“原来，我们真的可以把这样的明天带给别人。”"
 PF_AMX_AID_FIRST_TITLE:0 "他们看见了归航的灯"
 PF_AMX_AID_TT:0 "受援国对我们§G评价+75§!，持续20年；首次驰援获得常驻§G信任上限+30、信任增长+25%§!。\n前三个不同受援国各奖励§G500英武值§!，在取得星河卫士野望后结算。"
 PF_AMX_ANCIENT_PD:0 "远古近防阵列"
 PF_AMX_ANCIENT_PD_DESC:0 "爱弥斯被困于虚无时，曾在一个失落文明的残骸中偶然发现这套武器。即使文明本身早已消亡，它密集的弹幕仍守护着早已无人归来的航道，如今，它将为我们的舰队拦下迎面而来的威胁。"
 PF_AMX_CHOICE_DESC:0 "两份详尽的重构蓝图并排展开在全息星图前。一份保留了隧者古老而纯粹的巨剑，延续它当年劈开灾厄时的孤高姿态；另一份则将帝国先进的动力矩阵、火控网络与远程光炮阵列深度融入舰体，赋予它统筹星海战局的火力。\n\n爱弥斯仔细看过了每一张图纸上的批注，手指在两套方案间轻轻停驻，最后抬起头，将决定权交到了你的手中。\n\n“当年在驾驶舱里与它共鸣时，我们是为了守住拉海洛的最后一道封印；而这一次重启，是为了和你一起去往更辽阔的群星。无论它以什么模样重新出航，只要有我们的频率在里面跳动，它就不再是一座孤独的丰碑了。”"
 PF_AMX_CHOICE_RESUME:0 "关于隧者的重启方案……"
 PF_AMX_CHOICE_TITLE:0 "下一次出航"
 PF_AMX_CHOOSE_IMPERIAL:0 "将帝国的技术与它融为一体。"
 PF_AMX_CHOOSE_MELEE:0 "保留她熟悉的作战方式。"
 PF_AMX_DEFENDER_1_DESC:0 "爱弥斯读完新的宣言，把终端轻轻放回桌上。\n\n“要照顾的地方，一下子变得很远了呢。”\n\n她笑着看向你，目光却比平时更认真。\n\n“那就从我们能抵达的地方开始吧。有人在等我们回应。”"
 PF_AMX_DEFENDER_1_TITLE:0 "愿意回应的人"
 PF_AMX_DEFENDER_5_DESC:0 "港口里，新的航行命令正传向各支舰队。爱弥斯将最后一份记录交给副官，回到了你身旁。\n\n“走到这里，已经有很多人在和我们一起向前了。”\n\n她望向星图上仍然亮着的航路。\n\n“这一次，也把他们平安带回来吧。”"
 PF_AMX_DEFENDER_5_TITLE:0 "灯火仍在前方"
 PF_AMX_FINAL_DESC:0 "笼罩星海的终末警报终于在战略星图上被彻底抹去。\n\n高耸的观测塔舷窗外，劫后余生的都市正重新焕发出沸腾的生机。霓虹与航标灯刺破夜幕，满载归队士兵和物资的运输艇在护航舰的引导下穿过楼宇，一艘接一艘地落向灯火通明的泊位。\n\n她就站在那片流光溢彩的落地玻璃前，长发尾端逸散着几缕轻盈的粉蓝色数据微光。听见你走近的脚步，她回过身，抬手在微凉的玻璃窗上轻轻一点——一枚俏皮的粉红色像素爱心顿时在穿梭的船影间亮了起来。\n\n她眉眼弯弯地冲你笑着，那双映着万家灯火的十字星瞳里，再也没有了昔日独守风雪时的孤寂。\n\n“以前在游戏卡带里打通最终关卡的时候，屏幕一黑就会直接跳出演员表……直到今天真正站在你身边看着这一切，我才发现，原来‘拯救世界’最棒的部分根本不是打倒大魔王的那一秒，而是像现在这样，看着每一盏灯都平平安安地重新亮起来。”"
 PF_AMX_FINAL_NEXT:0 "大家都还在外面等着呢，一起过去吧。"
 PF_AMX_FINAL_TITLE:0 "归航的灯火"
 PF_AMX_FIRE_CONTROL:0 "拉海洛火控终端"
 PF_AMX_FIRE_CONTROL_DESC:0 "从隧者驾驶系统中解析出的火控技术，能够同时追踪大量目标，并协调各组武器的射击时序。爱弥斯将自己的驾驶经验补入其中，让帝国舰队也能跟上她眼中的战场。——救世之刻已至！"
 PF_AMX_IMPERIAL_TT:0 "选择§Y帝国型拉海洛§!。\n开放残骸上的§Y重启隧者§!项目：360天；10000合金、10000能量币、5000矿物、1000易爆微粒。"
 PF_AMX_LAUNCH_REPLY:0 "确认隧者出航。"
 PF_AMX_LAUNCH_TT:0 "在§Y当前首都星系§!生成所选形态的§Y拉海洛§!。"
 PF_AMX_LIFE_DESC:0 "爱弥斯站在观测甲板的舷窗前，缓缓将手伸向舱壁的暖色灯带，凝实的掌心在明暗交界处轻轻翻转，像是在确认某种失而复得的奇迹。\n\n“还是会觉得像在做梦一样。在作为电子幽灵飘荡的那些年里，我只要读取一下环境参数，就能算出炉火和阳光的温度……可那时候，风吹过我不会冷，雪落在鼻尖也不会融化。”\n\n她收回微凉的指尖，转身来到你身边，邀你和她一起站进灯光里。\n\n“现在，我却总想亲手碰一碰这个世界。走吧，今天想去看的风景，我已经在小本子上记满一整页了。”"
 PF_AMX_LIFE_TITLE:0 "再次触及的世界"
 PF_AMX_LIGHT_ARRAY:0 "拉海洛小型火力阵列"
 PF_AMX_LIGHT_ARRAY_DESC:0 "由拉海洛的辅助武装改造而来的舰载火力阵列。动能机关炮以持续而密集的射击覆盖远方目标，为主力武器打开进攻的空隙。——真理疾驰寰宇。"
 PF_AMX_MELEE_TT:0 "选择§Y近战型拉海洛§!。\n开放残骸上的§Y重启隧者§!项目：360天；10000合金、10000能量币、5000矿物、1000易爆微粒。"
 PF_AMX_PLANE_DESC:0 "爱弥斯走近半步，双手捧着那架刚刚折好的纸飞机，递到了你的面前。\n\n它既没有镶嵌高维晶核，也没有缠绕着星辉频率——那只是一架用再普通不过的白色公文纸折成的、棱角分明的纸飞机，纸页背面甚至还印着几行已经作废的舰队补给编号。\n\n“以前每次重逢，我们交给彼此的不是沉甸甸的炉芯，就是用来斩破黑暗的利剑与战舰。但今天，我只想把这个送给你。”\n\n爱弥斯仰起脸望着你，眼睛亮得像是盛满了整片银河：\n\n“很久以前在冰原的小屋里，有人教我折能飞得很远的纸飞机；后来在最绝望的虚空里，我把它揉碎过；再后来隔着数据海，我又用代码折了一只抛给你……而这一只，是用真正能摸得着的纸折出来的哦。”\n\n她从口袋里摸出一支普通的记号笔递向你，脸颊微红，笑容却灿烂得毫无阴霾：\n\n“——不管是为走到这里的旅途画个句点，还是给还没走完的远方留个路标。呐，你想在上面写点什么？”"
 PF_AMX_PLANE_DESC_END:0 "漫长的寒冬早已过去，炉火正暖，群星长明。愿你此后的每一次启航与停泊，都自由而快乐。"
 PF_AMX_PLANE_DESC_OPEN:0 "在击退终末的灾厄之后，爱弥斯用一张作废的公文纸亲手折成的纸飞机。在满是灭世武装与古老神迹的帝国宝库里，它轻巧、脆弱得格格不入，却又比任何冰冷的丰碑都更有温度。"
 PF_AMX_PLANE_INSCRIPTION_1:0 "机翼上留着你亲手写下的字迹：“主线通关，现在是休息时间。” 紧挨着这句话的末尾，被爱弥斯用粉红色的笔悄悄添上了一只戴着墨镜打瞌睡的像素小海豹。如果故事需要一个落点，没有比这更棒的终章了。"
 PF_AMX_PLANE_INSCRIPTION_2:0 "机翼上留着你亲手写下的字迹：“向着下一片星海。” 在这行字的下方，爱弥斯用力画了一道长长的推进尾焰，批注道：“副驾驶已就位，随时准备双线程全速出击！” 只要航程未止，这架纸飞机就永远指向前方。"
 PF_AMX_PLANE_INSCRIPTION_3:0 "机翼上留着你亲手写下的字迹：“这一次，救世主不必再独自面对黑暗了。” 爱弥斯在旁边画了一柄挥舞着光翼的迷你长剑，批注道：“那是当然！因为你的专属副手已经强到能把所有坏结局都劈碎啦~” 无论前路还有怎样的风暴，你或她都不会再是一个人。"
 PF_AMX_PLANE_INSCRIPTION_4:0 "机翼上留着你郑重写下的祝词：“致索拉里斯，与并肩同行的每一个人。” 纸页的角落里，除了爱弥斯飞扬的签名外，还依次留下了弗洛洛干脆的音符记号、守岸人端正的落款，以及达妮娅画歪了的奶油蛋糕。"
 PF_AMX_PLANE_INSCRIPTION_5:0 "机翼上没有留下任何文字，只有你画下的一颗小小的启明星。而在那颗星星的旁边，爱弥斯轻轻补上了另一颗紧挨着它的星辰——无需多言，只要抬头，那束跨越了漫长风雪的光就已经找到了彼此。"
 PF_AMX_PLANE_OPT_1:0 "写下：“主线通关，现在是休息时间。”"
 PF_AMX_PLANE_OPT_2:0 "写下：“向着下一片星海。”"
 PF_AMX_PLANE_OPT_3:0 "写下：“这一次，救世主不必再独自面对黑暗了。”"
 PF_AMX_PLANE_OPT_4:0 "写下：“致索拉里斯，与并肩同行的每一个人。”"
 PF_AMX_PLANE_OPT_5:0 "不写文字，只在机翼上画一颗小小的启明星。"
 PF_AMX_PLANE_REST:0 "§Y让它好好休息吧，接下来的路我们可以自己走。§!"
 PF_AMX_PLANE_TITLE:0 "折进风里的话"
 PF_AMX_PLANE_TT_1:0 "获得纪念遗珍§Y纸飞机§!。机翼上将留下关于休整与圆满的字迹。"
 PF_AMX_PLANE_TT_2:0 "获得纪念遗珍§Y纸飞机§!。机翼上将留下关于远航与未知的字迹。"
 PF_AMX_PLANE_TT_3:0 "获得纪念遗珍§Y纸飞机§!。机翼上将留下关于分担与守望的承诺。"
 PF_AMX_PLANE_TT_4:0 "获得纪念遗珍§Y纸飞机§!。机翼上将留下关于同伴与新家园的祝愿。"
 PF_AMX_PLANE_TT_5:0 "获得纪念遗珍§Y纸飞机§!。机翼上将留下一枚无声的星辰印记。"
 PF_AMX_PREPARE:0 "隧者诊断与重启准备"
 PF_AMX_PREPARED_DESC:0 "神秘地点的严寒中，隧者庞大的残骸静默地停驻在虚空里，一如当年它在拉海洛的漫天风雪中取出炉芯、将光与热留给地下文明时的模样。\n\n随着实地勘探与旧日记录逐一对齐，弗洛洛从纷乱的时空杂音中剥离出了一道微弱却执着的底层脉动。爱弥斯站在控制台前安静地听了许久，才伸出手，隔着观察窗轻轻贴在冰冷的装甲轮廓上。\n\n“变成幽灵后的十多年里，我经常一个人去冰原上看它，问它当年为什么能做出那样孤独的选择……原来，它一直都在等它的适格者回来。”\n\n她转过头看向你，眼眶微红，瞳孔里却燃起了熟悉的星辉：“它还记得我。这一次，我们终于可以把这位沉默的老朋友带回家了。”"
 PF_AMX_PREPARED_TITLE:0 "沉默之后"
 PF_AMX_PREPARE_DESC:0 "爱弥斯重新翻开了隧者封存的旧日记录。科研团队将在神秘地点检查残存舰体，核对拉海洛之心与各套系统的接口，唤醒那位在虚空中沉默已久的守望者。"
 PF_AMX_REBUILD:0 "重建隧者"
 PF_AMX_REBUILD_DESC:0 "隧者核心炉芯传回的频率记录仍被完整保存。首都船坞将按照此前选定的图纸重铸舰体，等待那道跨越星海的星辉再次亮起。"
 PF_AMX_REBUILD_REPLY:0 "接收重建的隧者。"
 PF_AMX_REBUILD_TT:0 "在§Y当前首都星系§!生成§Y拉海洛§!。"
 PF_AMX_REBUILT_DESC:0 "首都船坞传来了最后一道竣工检验记录。重构的舰体沿用了先前的兵装设计，那些在战场上回收的底层频率与记忆核心，已经重新接入了主控炉芯。\n\n爱弥斯听完工程部门的汇报，握着终端的手指微微松开，轻轻呼出了一口气。\n\n“只要频率没有消散，死亡与损毁就永远不是终章……这可是身为电子幽灵最拿手的绝活。”她转过身看向你，重新扬起坚定而明亮的笑脸，“走吧，去接它出坞。这一次，我们也要平平安安地一起回来。”"
 PF_AMX_REBUILT_TITLE:0 "再次出航"
 PF_AMX_RESOURCE_REQUIREMENT:0 "工程船：$COUNT$/$REQUIRED$。\n首次启动时支付：\n£alloys£ $alloys$：§R-10000§!\n£energy£ $energy$：§R-10000§!\n£minerals£ $minerals$：§R-5000§!\n£volatile_motes£ $volatile_motes$：§R-1000§!\n已拨付的资源不会重复扣除。"
 PF_AMX_RESTART:0 "重启隧者"
 PF_AMX_RESTARTED_DESC:0 "巨型机库内，爱弥斯轻盈地悬浮在半空，发梢与裙摆边缘散落着点点蓝色的数据微光。面对眼前如山岳般静默的钢铁巨神，她缓缓抬起右手，指尖之上亮起了一枚璀璨的十字星芒。\n\n那是“拉海洛”与适格者跨越生死的再度共鸣。\n\n仿佛听见了这声久违的呼唤，沉寂已久的隧者苏醒了。磅礴的炉芯辉光自装甲缝隙间轰然迸发，如潮水般将少女纤细的身影温柔笼罩。昔日在风雪中独守封印的孤独巨人，此刻正低垂下宏伟的头颅，回应着它的驾驶员。\n\n“隧者兵装，连接确认……久等啦，老伙计。”\n\n远处，首都星系的接引航标已次第点亮。这尊承载着旧日誓言与新生星辉的巨神即将离开船坞，等待你们共同下达启航的指令。"
 PF_AMX_RESTARTED_TITLE:0 "回应"
 PF_AMX_RESTART_DESC:0 "按照选定的重构方案，在神秘地点的隧者残骸上重铸动力矩阵与武装系统。拉海洛之心与爱弥斯的算力将在校准后同步接入舰体，迎来属于你们的新一次远航。"
 PF_AMX_RETURN_DESC:0 "爱弥斯发来的消息里没有新的航行计划。她提起一个你们曾经约好、却总是错过的地方。\n\n“事情是做不完的，今天先陪我走一走吧？”\n\n通讯另一端，她已经等在门边。"
 PF_AMX_RETURN_TITLE:0 "回到日常"
 PF_ARRAY_PLATFORM_CAPACITY_EFFECT:0 "本星系防御平台容量：§G+24§!\n索拉里斯拥有星环基地时，额外§G+24§!（合计§G+48§!）。"
 PF_B00_0:0 "接收拆解物资，封存实验记录。"
 PF_B01_0:0 "派出科研船，开启冰原测绘。"
 PF_B01_POLAR_SURVEY:0 "极点冰原：封闭舱室"
 PF_B01_POLAR_SURVEY_DESC:0 "调查索拉里斯极点冰原的维护信号，打通通道，检查静滞设施，并安全唤醒其中唯一的生还者。"
 PF_B02_0:0 "切断冗余负载，优先保障舱室供电。"
 PF_B02_CHAMBER:0 "确认静滞舱室"
 PF_B02_CHAMBER_DESC:0 "检查封闭舱室的供能、隔离与静滞系统，确认唯一仍有生命迹象的装置及其保存状态。"
 PF_B03_0:0 "执行唤醒程序。"
 PF_B03_LATER:0 "请先休息，我们稍后再谈。"
 PF_B03_RECRUIT:0 "欢迎加入，莫宁。"
 PF_B03_WAKE:0 "安全唤醒程序"
 PF_B03_WAKE_DESC:0 "修复舱室的外围设备，调整内部环境，逐步解除静滞场，为沉睡其中的研究人员提供安全的苏醒条件。"
 PF_B04_0:0 "§Y放手去做吧§!"
 PF_B04_FRAGMENT:0 "检验拉海洛之心碎片"
 PF_B04_FRAGMENT_DESC:0 "由莫宁主持，对拉海洛之心的碎片进行精密检验，辨认仍然有效的转换与控制结构，并与深空联合的旧研究比对。"
 PF_B05_0:0 "按计划出发吧。"
 PF_B05_APPROVE:0 "§Y放手去做吧§!"
 PF_B05_HOLD:0 "暂缓立项，保留方案。"
 PF_B05_LATER:0 "先保存结果，稍后详谈。"
 PF_B06_ACCEPT:0 "恢复研究站。"
 PF_B06_COMPLETE_DESC:0 "研究站里重新响起设备运转的声音。莫宁站在接通电源的工作台旁，将一份旧记录放到终端前。\n\n“我以前常在这里待到很晚。”她看了一眼刚搬进来的工具，“等我认全这些新设备，应该还会想留下来。”"
 PF_B06_COMPLETE_TITLE:0 "研究站的第一天"
 PF_B06_RESEARCH:0 "重新开灯"
 PF_B06_RESEARCH_DESC:0 "深空联合的旧研究站已经完成勘测。部分实验区域仍可修复，残存数据库中也找到了与拟制炉芯有关的目录。莫宁将主持整理与重建，守岸人负责接通当地网络，让这里重新具备研究和设备调试的条件。"
 PF_B06_RESEARCH_TITLE:0 "重新开灯"
 PF_B07_ACCEPT:0 "继续这些研究。"
 PF_B07_COMPLETE_DESC:0 "回收的记录中，有些图纸保存完整，有些只剩下最后几次试验的数据。研究团队在莫宁的指导下重建了关键设备，再次测量当年留下的结果。\n\n“这一组符合预期。另一组的偏差来自测量条件，需要重新计算。”\n\n莫宁逐项标注，把旧报告中尚待验证的问题带进新的实验安排。那些停在数千年前的日期后面，终于出现了新的记录。"
 PF_B07_COMPLETE_TITLE:0 "能够继续的研究"
 PF_B07_RECOVERY:0 "旧研究的下一页"
 PF_B07_RECOVERY_DESC:0 "从深空联合的旧设备中回收仍可使用的技术资料，重新检验其材料与控制结构。"
 PF_B07_RESEARCH_DESC:0 "整理旧星炬学院与深空联合留下的设备、设计及实验记录。由莫宁组织恢复可用技术，使用帝国现有设备重新验证关键结论，形成拟制炉芯的初步制造资料。"
 PF_B07_RESEARCH_TITLE:0 "旧研究的下一页"
 PF_B08_ACCEPT:0 "保存结果，完善设计。"
 PF_B08_COMPLETE_DESC:0 "新制的试验部件被放进检测台。经过数轮调整，它终于与保留下来的核心碎片建立了稳定连接。\n\n莫宁看着回传曲线，让团队重复了一次测试。结果再次出现时，她在制造流程的末尾签下了名字。\n\n“把完整记录交给工程部门。这部分可以进入后续设计了。”\n\n她重新展开炉芯模型，将一处原本空缺的结构填入其中。"
 PF_B08_COMPLETE_TITLE:0 "可以制造的部分"
 PF_B08_FRAGMENT:0 "碎片中的结构"
 PF_B08_FRAGMENT_DESC:0 "比对拉海洛之心碎片的实验记录与深空联合旧图纸，辨认可以接入新炉芯的转换结构。"
 PF_B08_RESEARCH_DESC:0 "进一步解析拉海洛之心碎片的材料性质、能量转换与控制结构。确认可保留的部分，并为需要重新制造的设备建立设计与检验标准。"
 PF_B08_RESEARCH_TITLE:0 "碎片中的结构"
 PF_B09_ACCEPT:0 "封存原始记录，继续验证。"
 PF_B09_COMPLETE_DESC:0 "凭借着“星枢演构”对精密机械结构的绝对解析力，莫宁耗时数周，终于在隧者空荡的胸腔深处，摸清了当年炉芯剥离时留下的全部超导接口与能量回路。然而，就在这批庞大的测绘数据传回索拉里斯研究站进行汇总时，旁听的弗洛洛却突然叫停了数据降噪程序。\n\n“等等，把刚才那段背景底噪倒回去重放一遍。”\n\n弗洛洛微微蹙眉，要求工程团队将一段原本被判定为虚质干扰的微弱杂音单独剥离出来。她的指尖最终停在了波形图上一处几乎看不出的周期性起伏上。\n\n“这不是机械接口的回音，里面夹着另一个活物的呼吸节拍……虽然微弱得快要断气了，但确实有人还被困在帷幕的夹缝里。莫宁，把这段原始音频原封不动地放进数据库，别让自动清理程序把它删掉。”\n\n莫宁将那段特殊频段加密封存，随后转回主控台，将最后一组隧者接口参数填入了自己的模型。刹那间，全息屏上那座停滞了数十年的“拟制炉芯”总装蓝图，第一次毫无滞涩地完成了全闭环运转模拟。\n\n“所有的结构断层都已经补齐了。”莫宁转过身，露出了一个如释重负的微笑，“图纸已经完美闭合。接下来，只要你一声令下，我们就可以把它造出来。”"
 PF_B09_COMPLETE_TITLE:0 "记录之外的回应"
 PF_B09_FIRST_ENTRY_DESC:0 "穿过虫洞的瞬间，黑洞“阿列夫一的残余”所散发出的高维引力畸变，令科研船上的常规陀螺仪出现了短暂的集体失灵。直到舰船平稳停泊，才得以吧注意力投向舷窗外那片令人窒息的死寂星域。\n\n“这里就是旧记录中一切灾厄与希望的交汇点。”她注视着不远处那具如山岳般横亘在虚空中的隧者躯壳，呼吸微促，眼神却亮得惊人，“它还在那里。通知测绘组，先稳定我们的空间锚点，接下来的所有逆向工程，都从这具古老机体的残骸开始。”"
 PF_B09_FIRST_ENTRY_OPTION:0 "记录这次抵达。"
 PF_B09_FIRST_ENTRY_TITLE:0 "第一次进入神秘地点"
 PF_B09_REQUIRE_WRECK:0 "目标地点存在沉默的隧者残骸"
 PF_B09_RESEARCH_DESC:0 "让莫宁带领科研船前往神秘地点，检查沉默隧者的残存结构。结合旧研究与核心碎片资料，进一步理解其设备与能量传输方式，寻找完善拟制炉芯设计的依据。"
 PF_B09_RESEARCH_TITLE:0 "沉默的隧者"
 PF_B09_SITE_DESC:0 "远征队沿着旧记录重组出的坐标穿过虫洞。当视野重新恢复清晰时，主导航屏上赫然浮现出了一颗正被黑洞视界边缘的恐怖引力缓慢撕扯的小行星——而在那颗小行星外侧的冰冷虚空中，一具失去炉芯的、庞大的钢铁机神残骸正静默漂浮，其层叠的装甲轮廓与旧日拉海洛的“隧者”分毫不差。"
 PF_B09_SITE_OPTION:0 "记录坐标。"
 PF_B09_SITE_TITLE:0 "信号指向"
 PF_B09_TARGET_NOTE:0 "开启通往§Y神秘地点§!的虫洞。"
 PF_B09_TUNNEL:0 "沉默的隧者"
 PF_B09_TUNNEL_DESC:0 "前往神秘地点的隧者残骸，检查其核心接口与残留的运行记录，补齐拟制炉芯缺失的观测数据。"
 PF_B10_ACCEPT:0 "批准框架建设准备。"
 PF_B10_COMPLETE_DESC:0 "历经无数次跨学科的联合验算，“拟制炉芯”的工程施工方案终于在今天彻底定稿。来自地底旧研究站的历史文献、炉芯碎片的微观测试，以及莫宁亲自从隧者残骸上拓印回来的接口参数，在同一套严密的数学模型下达成了完美的统一。\n\n莫宁将最终审定的全套施工图谱提交到了你的案头。\n\n“高轨承力框架的建设随时可以动工了。”\n\n她站在全息投影旁，仰头望着模型中心那团尚未真正点亮的虚拟光球，随后将视线转回你的身上，语气里带着一丝罕见的期待与拘谨：\n\n“等这座属于我们的新太阳真正合拢、点火运转的那一天……我想邀请你亲自到轨道现场来看看。可以吗？”"
 PF_B10_COMPLETE_TITLE:0 "图纸上的太阳"
 PF_B10_RESEARCH_DESC:0 "在索拉里斯汇总旧技术回收、核心碎片分析与隧者研究成果，由莫宁主持完整设计验证。确定拟制炉芯的制造、安装、监测与维护流程，并准备框架建设方案。"
 PF_B10_RESEARCH_TITLE:0 "联合验证"
 PF_B10_VALIDATION:0 "联合验证"
 PF_B10_VALIDATION_DESC:0 "将旧设备、核心碎片与隧者观测结果一并纳入模型，复核拟制炉芯的完整设计。"
 PF_B11_FRAME:0 "建造拟制炉芯框架"
 PF_B11_FRAME_DESC:0 "在索拉里斯轨道搭建拟制炉芯框架，完成承力结构、施工接口与监测网络，为内部设备的安装提供基础。"
 PF_B11_RAID_ARRIVE_DESC:0 "刺耳的防空警报瞬间撕裂了索拉里斯高轨空间的宁静。一支满载着重火力的掠夺者舰队从超空间航道边缘强行跃出，它们对帝国的警告广播置若罔闻，引擎全开，如同闻到血腥味的鲨群般径直朝着尚未完全合拢的拟制炉芯框架扑来。\n\n莫宁拒绝了撤回地底的提议，转身回到了轨道研究站的主控室——她必须亲自留在这里，用共鸣能力稳住炉芯框架在交火震荡中的能量输出平衡。"
 PF_B11_RAID_ARRIVE_OPTION:0 "全舰队迎战，保护炉芯框架！"
 PF_B11_RAID_ARRIVE_TITLE:0 "海盗袭击"
 PF_B11_RAID_FAIL_DESC:0 "掠夺者突破了外围防线。索拉里斯的工程设施被迫停机，部分轨道设备受损。莫宁和守岸人撤到安全区，开始清点还能保留的成果。\n主体工程与技术仍在。重新集结后，可以从这里继续。"
 PF_B11_RAID_FAIL_TITLE:0 "防线失守"
 PF_B11_RAID_HOLD:0 "先保留工程，暂缓行动。"
 PF_B11_RAID_LATER:0 "暂时关闭公开通讯，静观其变。"
 PF_B11_RAID_PREPARE:0 "让舰队进入戒备。"
 PF_B11_RAID_RETRY:0 "重新集结，准备再战。"
 PF_B11_RAID_WARNING_DESC:0 "框架第一次并网运行后，索拉里斯外围出现了不属于既有航线的信号。守岸人把轨迹投到会议桌上：一支掠夺者舰队正在靠近，目标很可能是尚未稳定的炉芯框架。\n莫宁看完了全部数据，才抬头说：“框架不能停。让我们在它周围布防。”"
 PF_B11_RAID_WARNING_TITLE:0 "不请自来的信号"
 PF_B11_RAID_WON_DESC:0 "最后一艘掠夺者舰船在框架外侧解体。索拉里斯的轨道重新安静下来，只有工程队还在清理漂浮的残片。\n莫宁确认框架没有结构性损伤，随后把这次战斗记录归档。“他们不会只为了一批材料来。”她说，“下一次，我们要准备得更充分。”"
 PF_B11_RAID_WON_OPTION:0 "继续运行试验。"
 PF_B11_RAID_WON_TITLE:0 "留下的残骸"
 PF_B12_COMPLETE_DESC:0 "框架第一次以完整功率运行。能量在索拉里斯的昼夜线上流动，研究站的屏幕同时亮起，像一颗被重新点燃的心脏。\n莫宁盯着输出曲线看了很久，才把记录交给团队。“这只是开始。”她说，“现在我们可以听见更远的东西了。”"
 PF_B12_COMPLETE_TITLE:0 "框架开始呼吸"
 PF_B12_CONTINUE:0 "记录运行结果。"
 PF_B12_DESC:0 "随着第一批多相态能量转换模块安装到位，拟制炉芯迎来了首次低功率全回路负载试验。控制室内，莫宁没有坐在主位上，而是站在巨大的监控幕墙前，通过星栈将不断刷新的成千上万条热力学读数逐一缩小、归类，直到整座环绕恒星的宏伟轨道结构完整地呈现在全息投影之中。\n\n伴随着一阵低沉而平稳的嗡鸣，金红色的恒星能量顺着刚刚铺设完毕的超导传输层奔涌而过。曾经只停留在深空联合泛黄纸页上的一条墨线，如今终于在真实的太空中，化作了一条足以承受恒星怒火的璀璨回路。工程团队兴奋地送来了首次试运行的满分报告，以及一套可顺势推广至全帝国工业网的附属稳压设备方案。\n\n莫宁仰望着屏幕中那道划破深空的明亮圆弧，垂在身侧的手指轻轻摩挲了一下衣角。“……它真的开始工作了。”她用只有自己能听清的音量说了一句。"
 PF_B12_OPTION:0 "干得漂亮，把下一阶段的试验时间告诉我。"
 PF_B12_PROJECT_DESC:0 "由莫宁主持拟制炉芯框架的负载试验，检查供能与传输结构，确认下一阶段的建设条件。"
 PF_B12_TITLE:0 "第一次运行"
 PF_B12_TRIAL:0 "第一次运行"
 PF_B12_TRIAL_DESC:0 "对已建成的炉芯框架进行负载与传输试验，记录它在实际运行中的响应。"
 PF_B13_COMPLETE_DESC:0 "弗洛洛把炉芯记录里的背景噪声拆成几层。最底下有一段重复的短促频率，和莫宁在隧者残骸处保存的信号有相同的间隔。\n守岸人调出旧索拉里斯网络的档案。三条记录叠在一起，指向一处残星会接收档案的遗址。\n“还不能确认是谁。”弗洛洛说，“但那里有我们需要的东西。”"
 PF_B13_COMPLETE_TITLE:0 "背景里的第二层声音"
 PF_B13_CONTINUE:0 "准备档案调查。"
 PF_B13_DESC:0 "当轨道上的硝烟散尽、海盗残骸的最后一丝电磁杂音也从航道上彻底消失后，一直待在实验室里的弗洛洛，突然再次调出了当初莫宁从“隧者”胸腔深处带回来的那段加密录音。\n\n她挥动指挥棒，将外围所有的宇宙背景噪音与机械回响一层层剥除，让那段极其微弱的声波在安静的房间里反复回放；紧接着，她又从索拉里斯旧时代的深层档案库里，翻出了一份尘封已久的信号接收日志。在全息屏幕上，两段跨越了漫长时光的波形，竟然在同一个奇异的频段上缓缓重合了。\n\n“我就说，这绝不是什么炉芯冷却时的物理杂音。”弗洛洛用指挥棒敲了敲重叠的波峰。“在很久以前，有一批疯子在索拉里斯的地下专门搭建过一座接收站，日复一日地寻找着来自虚质深处的声音。”\n\n她将一串索拉里斯的地表坐标直接推送到了你的终端上：“去把那座老掉牙的残星会接收站挖出来吧。我也很好奇，当年守在机器前面的那些人，最后到底听见了什么。”"
 PF_B13_OPTION:0 "派人沿着这份记录查下去。"
 PF_B13_RECORDS:0 "留在记录里的声音"
 PF_B13_RECORDS_DESC:0 "将炉芯运行记录与旧接收信号交叉比对，追索那段未曾消散的回声。"
 PF_B13_TITLE:0 "留在记录里的声音"
 PF_B14_ARCHIVE_NOTE:0 "在§Y神秘地点§!发现§Y废弃接收站§!遗址。"
 PF_B14_DESC:0 "一份旧设备清单给出了接收站的坐标。清单经过数次转手，最后的维护记录带着残星会的标记。\n\n弗洛洛认出了档案中的一些用语，把仍然能确认的部分逐条标明。莫宁读完后，向考察队补发了设备检查要求。\n\n“先记录结构和工作顺序。里面可能还有残留的约束装置，接触之前请等我的确认。”"
 PF_B14_FINISH:0 "封存档案，带回收技术。"
 PF_B14_OPTION:0 "调查旧接收站。"
 PF_B14_REQUIRE_MORIN:0 "需要指派莫宁作为首席科学家主持该项调查。"
 PF_B14_STAGE_1_DESC:0 "遗址的第一层是一间被封闭的接收室。墙上留着残星会的标记，地面却铺着深空联合早期实验用的绝缘板。两种来源被粗糙地拼在一起。\n莫宁让人先切断旧电源，再逐一检查容器。她说：“不要把观测设备和伤害性流程混在一起。”"
 PF_B14_STAGE_1_TITLE:0 "被遗弃的接收室"
 PF_B14_STAGE_2_DESC:0 "第二层保存着完整的约束环和一批手写记录。接收流程被拆成许多步骤，其中几页被人为撕去。弗洛洛从残留的频率标记里辨认出残星会常用的编码顺序。\n守岸人把可读部分同步回索拉里斯。莫宁开始重新推演缺少的那几步。"
 PF_B14_STAGE_2_TITLE:0 "约束环与旧记录"
 PF_B14_STAGE_3_DESC:0 "最深处的容器保存着一套完整的接收技术。它原本用于把受损的频率从虚质环境里拉回现实，却被残星会改造成了更危险的东西。\n莫宁和弗洛洛把观测、约束与接收三段流程重新分开。守岸人确认这套方案可以交由帝国团队制造。\n“我们不能保证一次成功。”莫宁说，“但至少，现在知道该往哪里伸手了。”"
 PF_B14_STAGE_3_TITLE:0 "接收技术"
 PF_B14_STAGE_OPTION:0 "继续调查。"
 PF_B14_TITLE:0 "接收端"
 PF_B15_HALF:0 "建造半完成的拟制炉芯"
 PF_B15_HALF_DESC:0 "将能量转换装置与传输网络接入框架，分别验证各部分的输出与控制响应，逐步建立稳定的运行系统。"
 PF_B15_OPTION:0 "准备下一阶段的建设。"
 PF_B15_RAID_ARRIVE_DESC:0 "星系边缘的超空间裂口轰然洞开，第二支来犯的袭击舰队正式露出了獠牙。与先前杂乱无章的掠夺者截然不同，这支舰队全由披挂着厚重装甲的主力战舰组成，阵型严整而冷酷，显然是为了一场高强度的攻坚战有备而来。\n\n轨道控制室内，莫宁确认了各处防空平台与舰队的协同坐标，随后将半成品炉芯内部积蓄的庞大冗余电能，全部切入了轨道护盾发生器与防御平台武器阵列之中。\n\n“这一次，绝不会再让他们碰掉哪怕一块装甲板。”她握紧了身侧的控制台，目光如炬，“最高功率授权！把他们全部留在防线外面！”"
 PF_B15_RAID_ARRIVE_OPTION:0 "命令主力舰队全面迎击！"
 PF_B15_RAID_ARRIVE_TITLE:0 "更深的阴影"
 PF_B15_RAID_FAIL_DESC:0 "敌方舰队仍在星系内。索拉里斯的主体结构没有失去，但外围防线被迫后撤，炉芯的完成工作只能暂停。\n\n莫宁保存了这次交战记录。\n\n“先修好防线。他们还在那里，下一次不会再给我们同样的时间。”"
 PF_B15_RAID_FAIL_TITLE:0 "第二道防线后撤"
 PF_B15_RAID_HOLD:0 "先维持现状。"
 PF_B15_RAID_LATER:0 "暂时维持警戒。"
 PF_B15_RAID_PREPARE:0 "启动第二道防线。"
 PF_B15_RAID_RETRY:0 "修复防线，准备再次迎击。"
 PF_B15_RAID_STRENGTH_NOTE:0 "确认后有90天备战。预计来袭战力约10万。"
 PF_B15_RAID_VICTORY_DESC:0 "最后一艘来犯的战舰终于在耀眼的等离子爆炸中解体。索拉里斯的高轨道防线依然稳如磐石，而在莫宁的精细调控下，拟制炉芯刚刚经历过峰值抽调的输出曲线，也正平缓地回落到稳定的绿色区间内。\n\n控制室里爆发出一阵压抑已久的欢呼，莫宁也忍不住笑了起来。\n\n“所有的干扰项都已经清零了。”她抬起头看向你，眼底映着窗外炉芯夺目的光辉，“这一次，我们靠自己的力量守住了它。下达最终指令吧，让我们完成它。”"
 PF_B15_RAID_VICTORY_OPTION:0 "继续完成拟制炉芯的最终合拢。"
 PF_B15_RAID_VICTORY_TITLE:0 "第二道航迹消失"
 PF_B15_RAID_WARNING_DESC:0 "随着拟制炉芯的核心整合进入最后的冲刺阶段，那股堪比小型恒星苏醒般的磅礴能量波动，不可避免地穿透了星系外围的屏蔽网，被更遥远深空中的窥探者捕捉到了。\n\n莫宁将远距雷达刚刚截获的一组全新跃迁轨迹，直接叠在了上次海盗袭击的战术记录上方。全息星图上，密密麻麻的红点无论在舰船吨位还是编队协同性上，都远超上一次的乌合之众。\n\n“这绝不是上次那种只想捞一笔就跑的流亡海盗。”莫宁指着对方笔直插向恒星轨道的航向线，“他们的目标非常明确，是冲着彻底摧毁或者强行夺取整座炉芯来的。”\n\n舰队指挥官已在第一时间拉响了全星系战备警报，轨道防空阵列重新展开，星堡的深空防御平台也转向了来舰的航线。在真正点亮这颗太阳之前，我们必须先用舰队的炮火，让这片喧嚣的星空彻底安静下来。"
 PF_B15_RAID_WARNING_TITLE:0 "第二道航迹"
 PF_B15_READY_DESC:0 "运行试验与接收结构的修订已经完成。莫宁提交了下一阶段的材料清单，并在图纸上标出了核心碎片将被安置的位置。\n\n“转换层会与新结构一起工作。其余部分已经有对应的制造和检修方案，后续维护也能由团队完成。”\n\n她把最后一页转向你。\n\n“准备好了，就开始吧。”"
 PF_B15_READY_TITLE:0 "继续搭建"
 PF_B16_CORE:0 "完成拟制炉芯"
 PF_B16_CORE_DESC:0 "整合核心碎片、新制造设备与控制网络，完成拟制炉芯的完整运行测试，使其进入持续供能与研究阶段。"
 PF_B16_COUNCIL:0 "让莫宁进入研究内阁。"
 PF_B16_GIFT_DESC:0 "拟制炉芯的日常运转已经彻底步入正轨。这天傍晚，莫宁关掉了身边几块不再需要实时盯梢的监控屏，将一柄造型修长、宛如星轨指针般的器物横放在工作台上，推到了你的面前。\n\n白银与深蓝交织的流线型刃身上镌刻着精密的金色导流纹，核心处镶嵌的明亮球体正散发着恒星般的微光，一圈细碎的棱晶与星环刻度在它周围静静悬浮。\n\n“这是‘宙算仪轨’，我过去一直随身携带的测算终端与武装。”莫宁伸出手指，随着她微弱的共鸣光辉掠过，核心四周的悬浮棱晶顿时沿着光环刻度灵巧地游走起来。\n\n她耐心向你演示了几个关键的数据析解功能，确认你的终端已经完整保存了操作协议后，手指依然轻轻搭在冰凉的银白刃脊上。\n\n“以前在拉海洛的时候，我曾借着它的星芒验算过无数个看似遥不可及的设想——比如在地下造出星空，比如修好自己的双腿，比如真正触摸到群星。今天，这上面最难的一道题，已经由你陪我一起解开了。”\n\n她抬起头，眼神清澈而郑重：“万物皆有规律，只要找对方法，再遥远的理想也不过在双手咫尺之间。接下来，请带着它继续往前走吧。”"
 PF_B16_GIFT_EFFECT:0 "获得遗珍：§Y宙算仪轨§!。"
 PF_B16_GIFT_OPTION:0 "我们还会用它算出更多答案。"
 PF_B16_GIFT_TITLE:0 "宙算仪轨"
 PF_B17_ACCEPT:0 "告诉我怎样把她接回来。"
 PF_B17_DELAY:0 "先记录，暂缓准备。"
 PF_B17_DESC:0 "借助拟制炉芯源源不断提供的庞大算力与纯净能量，旧接收站那套经过莫宁全新改造的跨维度捕捉阵列，终于迎来了第一次全功率运转。\n\n弗洛洛独自站在调律台前，将此前从隧者残骸旁截获、以及从神秘星系的探索中剥离出的所有背景记录，一并导入了滤波核心。随着一层又一层刺耳的虚质白噪音被强行剥落，主扬声器里突然传出了一声轻微、却无比清晰的呼吸声——紧接着，是一句带着睡意的、仿佛在回应谁的模糊呢喃。\n\n弗洛洛猛地抬起指挥棒。那声呢喃又响了一遍，她的手始终停在半空。\n\n“……是§Y达妮娅§!。”她声音低沉得近乎颤抖，“我认得这组频率的纹理，那是她还没被彻底磨灭的证据。”\n\n一旁正在监控供能曲线的莫宁闻言，握着触控笔的手骤然僵住。她调出档案里记录的旧日星炬学院学生们的拉贝尔波形图，与屏幕上跳动的微弱信号进行交叉比对，又戴上耳机，把那段呼吸声仔仔细细地听了一遍。\n\n“真的是她……”莫宁摘下耳机，向来冷静的脸上浮现出一丝难以置信的柔和与怀念。她显然没有想到，自己还会以这样的方式与昔日的学生重逢。\n\n短暂的静默与感慨过后，两人迅速收敛了情绪，重新在全息台上展开了接收室的三层隔离与供能工程图。莫宁用笔圈住供能线路。\n\n“接口已确认。在正式发起呼叫前，我要确保每一个供能节点都绝对稳定——这一次，一定要把她拉回来。”"
 PF_B17_TITLE:0 "全面检查设备，告诉我怎样把她安全接回来。"
 PF_B17_WAIT:0 "先维持信标锁定，等我们准备万全再行动。"
 PF_B18_COMPLETE_DESC:0 "接收装置在索拉里斯轨道完成组装。守岸人稳定了网络，弗洛洛把频率分离器接入炉芯，莫宁最后一次检查约束环。\n“启动后，纯净光辉会吸引附近的以太巨龙。”她说，“两只。我们必须在它们抵达后守住接收器。”\n舰队可以在你确认后进入位置。"
 PF_B18_COMPLETE_TITLE:0 "接收装置就绪"
 PF_B18_CONTINUE:0 "让舰队集结。"
 PF_B18_DESC:0 "地下接收室内的所有指示灯均已切换为准备就绪的常亮状态。莫宁亲自守在拟制炉芯的地面变压枢纽旁，头顶的星栈全功率运转，监控着每一丝能量的输出精度；而弗洛洛则手持指挥棒立于阵列中央，似乎随时准备跨过那道现实与虚无之间的微弱界限。\n\n房间里安静得只能听见仪器平稳的嗡鸣。\n\n万事俱备。只要你点头下达指令，这呼唤便会立刻刺穿重重帷幕，去将那个独自在黑暗中漂流了太久的女孩接回这个世界。"
 PF_B18_PREP:0 "为回应留出的位置"
 PF_B18_PREPARE:0 "启动最终接收程序。"
 PF_B18_PREP_DESC:0 "检验达妮娅接收通道的供能、隔离与约束设备，为她归来留出稳定的位置。"
 PF_B18_PROJECT_DESC:0 "为达妮娅的接收准备稳定供能、隔离设备与频率通道。莫宁将主持最后检查，守岸人与弗洛洛同步完成各自的准备。"
 PF_B18_TITLE:0 "为回应留出的位置"
 PF_B19_BATTLE_DESC:0 "为了强行刺穿与虚质空间之间的帷幕，高轨上的拟制炉芯在一瞬间解除了全部功率限制。一道横贯星系的金红色洪流自轨道核心轰然迸发，如同一颗在深空中悍然点燃的新生恒星，将整片星域照得亮如白昼，无数个帝国或生物见证了一个文明宣布掌握了一颗恒星的瞬间。\n\n然而，这股足以媲美创世之火的磅礴能量，也瞬间惊醒了游弋在古老星海深处的顶级掠食者。\n\n空间曲率在刺耳的引力警报中剧烈扭曲，两道庞大到令人窒息的绚烂阴影降临了。那是两头仅存在于古老星图传说中的星神兽——以太巨龙。它们张开双翼，阴影遮住了半个行星轨道。流淌着纯粹以太火光的鳞甲在恒星光芒下折射出夺目的威严；这两头将拟制炉芯视作“巢穴”的庞然大物，正咆哮着向索拉里斯的最亮处发起进攻。\n\n与此同时，在剧烈震颤的地面接收室内，那条延伸向虚无深处的频率丝线终于传回了清晰的拉力——帷幕另一端的人已经抓住了这道光。弗洛洛正在拼命控制住调律台上的锚点。\n\n“跨维度的通道已经咬合，现在哪怕频率稍有回落，她都会被空间乱流撕碎！”莫宁站在过载报警的配电中枢前，头顶的星栈亮到极致，用超频强行锁死了每一道濒临熔毁的供能阀门。她抬起头，隔着满屏刺眼的红光冲你喊道：“地面和炉芯的输出由我们来顶住——它们就交给你的舰队了！”"
 PF_B19_BATTLE_TITLE:0 "循光而来"
 PF_B19_CORE_DEFENSE_EFFECT:0 "§Y索拉里斯恒星系内的己方舰队与恒星基地§!\n舰船射速：§G+20%§!\n护盾：§G+30%§!\n装甲：§G+30%§!\n\n§Y索拉里斯恒星系防御平台§!\n筹备初段：建造花费§G-40%§!，建造速度§G+40%§!\n筹备中段：建造花费§G-60%§!，建造速度§G+60%§!\n筹备末段：建造花费§G-80%§!，建造速度§G+80%§!\n\n支援持续至战斗结束。"
 PF_B19_DRAGON_ARMOR_REWARD:0 "获得§G龙鳞装甲§!研究选项及§G25%§!研究进度。已完成该科技时跳过。"
 PF_B19_FAILURE_DESC:0 "接收灯一盏盏熄下去。莫宁已经按了中止，手还停在开关上。等所有人撤到隔离门这边，她才肯坐下。\n\n“我刚刚在想，要是再撑一会儿呢？以前在塔上，我也这样想过。”她用手背擦了擦脸，“可留在里面的人，也有人等他们回来。”\n\n她请守岸人替她再核一遍名单，然后拉过椅子让你坐。“陪我等这一轮点名。等人齐了，我们再商量怎么接她。”"
 PF_B19_FAILURE_TITLE:0 "暂时中止"
 PF_B19_FAIL_DESC:0 "以太巨龙的攻击超出了防线承受范围。接收器被迫停机，索拉里斯部分设施受损。\n莫宁保存了已经完成的主体工程、技术与接收记录。修复后可以重新准备，再次启动接收。"
 PF_B19_FAIL_TITLE:0 "接收中断"
 PF_B19_FIGHT:0 "守住接收器。"
 PF_B19_LATER:0 "维持待命。"
 PF_B19_READY_DESC:0 "接收设备已经通过检查，所有岗位均已回复。星系边缘的两个信号仍在靠近，监测站捕捉到了巨翼掠过星光的轮廓。\n\n莫宁站在控制台前，等你作出最后的决定。\n\n“准备完成。收到你的确认，我就开始。”"
 PF_B19_READY_TITLE:0 "最后检查"
 PF_B19_RETREAT:0 "撤退，保留工程。"
 PF_B19_RETRY:0 "安排维修，保留救援计划。"
 PF_B19_RETURN:0 "完成接收。"
 PF_B19_RISK_NOTE:0 "确认后开始§Y120日§!备战，随后§R两只以太巨龙§!将抵达索拉里斯。\n拟制炉芯为本星系友方舰队与恒星基地提供防御支援。"
 PF_B19_START:0 "全舰队迎击巨龙！"
 PF_B19_WON_DESC:0 "这是一场足以载入星海史册的惨烈决战。高轨之上，舰队与防御平台阵列的密集火力与两头以太巨龙喷吐的毁灭性吐息在太空中轰然对撞，交战中迸发的光芒将索拉里斯的整片夜空都染成了绚烂的金紫二色。\n\n在主力舰队悍不畏死的轮番齐射与拟制炉芯超载护盾的协同压制下，最后一头以太巨龙终于发出了震撼整个星系的哀鸣。\n\n随着两头星空霸主的彻底陨落，笼罩在轨道外侧的恐怖威压骤然消散，地面接收室内的过载警报声也随之戛然而止，剧烈抖动的各项读数第一次稳稳地落回了绿色区间。\n\n弗洛洛松开紧绷得发白的手指，扑通一声跪在地上剧烈喘息，却还不忘确认那条跨维度的信号通道在刚才毁天灭地的交火中完好无损。而全身早已被汗水浸透的莫宁甚至没有力气去擦一把脸，她的双手依然按在滚烫的供能控制台上，只是抬起头，用疲惫却亮得惊人的眼神望着你：\n\n“星空已经安静下来了。是时候去接她了。”"
 PF_B19_WON_TITLE:0 "两只巨龙倒下"
 PF_B20_DESC:0 "舱门开启时，莫宁叫了一声达妮娅的名字。走出来的少女抬起脸，迟疑了一下。“教授？今天也点名吗？”\n\n“点。”莫宁的声音哑得自己都吓了一跳。\n\n“那……到。”\n\n莫宁笑出了声，只好抬起袖口擦了擦眼睛。达妮娅扶着门边，看见了你，向你伸出另一只手。这次她自己跨过了门槛。你们三个站了好一会儿，直到守岸人把椅子送来。"
 PF_B20_RECRUIT:0 "欢迎回来，达妮娅。"
 PF_B20_REST:0 "先好好休息，我们稍后再谈。"
 PF_B20_TITLE:0 "归来"
 PF_B20_WELCOME:0 "欢迎回来。"
 PF_B21_CONTINUE:0 "记录这一天。"
 PF_B21_DESC:0 "索拉里斯的夜半球缓缓转到轨道观测站的正下方。你与莫宁并肩站在巨型落地舷窗前，脚下是行星翻涌的云海与弧线，远方的深空正随着拟制炉芯的全面点亮而泛起第一抹璀璨的金光。\n\n巨大的环形星轨结构在无垠的星夜中缓缓旋动，万道金色的光辉刺破宇宙的幽暗，将下方的行星大气染成如日冕般恢弘的几何光环。\n\n莫宁站在舷窗的护栏旁，背对着窗外那轮正在冉冉升起的“新日”，转过身仰起脸望着你。破晓般的金色辉光穿透玻璃落在她半透明的发梢上，将她那双清澈的眼眸映照得宛如琥珀般透亮，她的唇角正漾开一抹卸下了所有沉重过往的灿烂笑意。\n\n“以前在拉海洛的地底，我曾仰望过第一场黎明；而现在，在真正的星海之中，我们又一次亲手把太阳造出来了。”她在满室绚烂的晨晖里向你伸出手，声音轻柔却无比笃定，“早安。这是属于索拉里斯的、也是属于我们的……第二次日出。”"
 PF_B21_OPTION:0 "握住她的手，与她一同沐浴这片晨光。"
 PF_B21_PHROLOVA_DESC:0 "弗洛洛在研究站入口处等你。看见你走近，她收起手中的琴弓，向观测室里望了一眼。\n\n“莫宁已经在里面了。今夜，你可以慢慢听她说。”\n\n她向你伸出手。“走吧。她们都在等你。”"
 PF_B21_PHROLOVA_OPTION:0 "一起进去吧。"
 PF_B21_PHROLOVA_TITLE:0 "门前的弦音"
 PF_B21_TITLE:0 "致第二次日出"
 PF_B22_A_DESC:0 "莫宁把研究院的旧办公室搬到了索拉里斯轨道站。窗边多了两枚发卡，桌上则堆着新的学生论文。\n“我还是不太会拒绝他们。”她说，“但至少，现在可以让他们自己先算一遍。”"
 PF_B22_A_OPTION:0 "和她一起看窗外的星图。"
 PF_B22_A_TITLE:0 "莫宁的新生活"
 PF_B22_B_DESC:0 "达妮娅在研究站的康复舱里醒来。她花了一点时间适应重力，随后要求去看炉芯的运行数据。\n“我不想只被当成需要照顾的人。”她说，“如果这套系统还需要检查，我可以帮忙。”"
 PF_B22_B_OPTION:0 "把检查任务交给她。"
 PF_B22_B_TITLE:0 "达妮娅的恢复"
 PF_B22_C_DESC:0 "守岸人沿着重建后的轨道站走了一圈。旧网络的节点一个个亮起，和炉芯的输出曲线叠在一起。\n“这里和以前不一样了。”她说，“不是因为多了一座工程，而是因为有人愿意留下来维护它。”"
 PF_B22_C_OPTION:0 "把这份记录留在索拉里斯。"
 PF_B22_C_TITLE:0 "守岸人所见的索拉里斯"
 PF_B22_DENIA_DESC:0 "你的个人终端震动了一下，屏幕上跳出了一条来自达妮娅的加密飞讯。附件里是一份拟制炉芯竣工后的首场高层技术总结会名单，而在全息旁听席的最末一排，被她用醒目的标记圈出了两个隐蔽的接入端口。\n\n“长官长官！莫宁老师今天下午要向帝国科学院做长达三个小时的《多相态能量转换与隧群材料循环》总结报告哦。”\n\n视频窗口里的达妮娅正懒洋洋地靠在指挥室的软椅上，手里转着那只破旧的玩偶，冲你狡黠地眨了眨眼：\n\n“虽然以你的身份本来就不需要亲自去听这种枯燥的学术报告，但莫宁老师刚才核对名单的时候，视线在你的名字上停了好几秒呢。我猜，她肯定很希望你能去见证她最得意的研究成果吧？”\n\n紧接着，她又笑吟吟地补上了一条消息：\n\n“我已经用最高权限在后台帮你把静音接入端口设置好啦。你要是政务太忙撑不住，就算在中途偷偷打个瞌睡，我也绝对会替你打好掩护的。所以，要不要上线来捧个场呀？”"
 PF_B22_DENIA_OPTION:0 "准时接入旁听席，去听听莫宁的报告。"
 PF_B22_DENIA_TITLE:0 "出席记录"
 PF_B22_PHROLOVA_DESC:0 "午后，弗洛洛向你的私人终端发送了一段未命名的加密音频。点开播放后，前半段是炉芯并网成功那一刻、高轨谐振环传回的宏大共鸣声；然而当主频段的轰鸣平息后，录音却并没有切断，而是把当时主控室角落里的一段低声交谈也录了进去。\n\n音频里，能清晰地听到莫宁在向守岸人认真推荐一篇长达一百六十七页的黑石微观动力学论文，达妮娅在一旁小声嘀咕着光是听标题就已经困了，随后便是几人各自压低的轻笑声。\n\n“守岸人刚才在整理拟造炉芯的官方史料时问我，后面这段有损各位领袖威严的私下杂音，要不要按规矩抹掉。”弗洛洛的影像出现在屏幕一角，她漫不经心地用指挥棒敲了敲桌面。\n\n从她嘴角似笑非笑的弧度来看，她的心情现在很好。\n\n“我倒是觉得，比起前面那段冷冰冰的机器轰鸣，后面这几声错拍才算得上是整场演出里最难得的彩蛋。作为这出大戏的最高资助人兼总指挥，你觉得呢？”"
 PF_B22_PHROLOVA_OPTION:0 "一起保存下来吧。"
 PF_B22_PHROLOVA_TITLE:0 "留在记录之外"
 PF_B22_SHORE_DESC:0 "清晨的例行政务汇报结束后，守岸人并没有立刻关闭全息投影，而是调出了一幅奇异的双层星图——底层是黑海岸地底那片静默不转的古老星河，上层则是莫宁当年在拉海洛用大气拟造阵列重现的天顶星象。\n\n“以前在黑海岸的地底，我独自仰望那片不会有四季流转的星空，是为了替漂泊之人记住时间留下的痕迹；而莫宁在拉海洛的地底点亮天幕，则是为了提醒人们不要忘记头顶之外还有真正的宇宙。”\n\n守岸人伸出指尖，轻轻触碰着星图上那颗被莫宁标注为“天燕座α”的明亮主序星，清冷的眼眸里流淌着如海水般深邃而柔和的微光。\n\n“昨天夜里，莫宁把那套大气拟造阵列的原始星象参数移交给了我。我本来以为那只是常规的工程归档，可核对到最后才发现，她当年拼死守住信号塔也要投影出来的那片天空，和我在黑海岸守望了无数岁月的星图，指向的其实是同一片星海。”\n\n她抬起头，隔着屏幕静静地注视着你，唇边浮现出一抹浅浅的笑意：\n\n“地底的漫长守望已经结束了。无论是她的拟造天幕，还是我的地下星象，都已经找到了它们真正的归处。我想将这两份旧日的星图合并封存，留在只有我们能随时调阅的私人档案里——作为我们终于在真实的群星下，与你重逢的证明。”"
 PF_B22_SHORE_OPTION:0 "照原样收好，连那张小图也留下。"
 PF_B22_SHORE_TITLE:0 "黑海岸的星图"
 PF_B_ARCH_DESC:0 "一座被封闭的旧接收站。断裂的输送管线通向地下，隔离墙后仍留有低功率设备运转的痕迹。残星会曾在这里研究来自虚质环境的信号。"
 PF_B_ARCH_NAME:0 "废弃接收站"
 PF_B_ARCH_STAGE_1_DESC:0 "顺着弗洛洛提供的坐标，考察队在一片人迹罕至的荒原裂谷下，找到了一座早已被泥石流掩埋的旧时代残星会基地。通往地表的外部天线虽已被彻底摧毁，但当队员们撬开锈死的重型气密门、更换掉早已枯竭的供能单元后，最深处那间保存完好的控制室竟奇迹般地重新亮起了微光。\n\n主控台上的日历早已停留在灾变发生前的某一天，然而，他们留下的那条用于锁定并接引外部特定频段的底层指令，却依然让设施本身固执地履行着自己的职责。"
 PF_B_ARCH_STAGE_1_TITLE:0 "封存的接口"
 PF_B_ARCH_STAGE_2_DESC:0 "随着控制室硬盘里的数据被逐一导出，残星会在这里的罪恶勾当也浮出了水面。旧时代的残星会曾在这里进行过无数次疯狂的尝试——他们试图用高强度的共鸣阵列作为锚点，捕捉游离在虚质环境中的特定频率，并将其锁进事先备好的容器里。那一摞摞领料单与算力过载记录，无声地诉说着每一次强行锚定所引发的剧烈反冲。\n\n弗洛洛站在屏幕前沉默地看了很久，最终有些僵硬地伸手替那份残缺的方案补上了几处破碎的调律参数，似乎这里勾起了她的什么回忆；而莫宁则迅速将整套系统拆解为“前端观测结构”与“终端约束回路”两个部分。\n\n“前端的信号测量结构设计得很扎实，稍微修缮就能继续使用。”莫宁指着后半截已经烧毁的线路，“但他们原来的接收端太激进了，一旦强行运行就会导致约束失稳。这一块必须完全由我重新设计。”\n\n而在档案库的另一侧扇区里，考察队还意外找回了旧地下城市的完整生态循环记录。那些曾经在极寒冰原下供养了无数居民的封闭式农场与环境维持方案，至今依然有着极高的实用价值，随时可以重新应用于我们的殖民地建设。"
 PF_B_ARCH_STAGE_2_TITLE:0 "约束记录"
 PF_B_ARCH_STAGE_3_DESC:0 "最后一批加密扇区的破译，终于交出了这座旧接收站最核心的底层参数。当年建造这里的残星会采用的是一种近乎疯狂的单向拖拽设计——只要捕捉到虚质空间里的目标频段，便不计代价地强行将其扯回现实，哪怕连带着引发毁灭性的虚质倒灌也在所不惜。\n\n莫宁结合拟制炉芯的架构，在全息台上重新绘制出了一幅严谨的三层分流结构图：将持续供能、环境隔离与前端滤波彻底拆开，分别交由独立的阵列模块承担；而在整张图纸的最中央，她专门增设了一道双向校验接口。\n\n“在没弄清那段未知信号到底是什么之前，绝不能直接开门。”莫宁指着中央那道接口，“我已经把接收终端的底层逻辑改成了双向握手协议——我们先向对面发送基准信标，只有当那段频率展现出清晰的逻辑、主动向我们传回确认回应时，接收程序才会真正执行下一步。如果对面只是无序的虚质乱流或是带有恶意的实体，隔离阀就会锁死。”\n\n与此同时，随同接收站数据一并出土的，还有深空联合当年被封存的完整民用工程规范。在莫宁将其与轨道传输层的实测结果完成交叉核验后，索拉里斯沉淀下的旧日基建经验，已准备好正式移交至帝国各地的建设团队。"
 PF_B_ARCH_STAGE_3_TITLE:0 "另一种接法"
 PF_B_BACK:0 "返回。"
 PF_B_BASELINE_CALIBRATION_EFFECT:0 "移除当前所有§Y已招募领袖§!的§G负面特质§!。"
 PF_B_BOND_1_DESC:0 "莫宁在索拉里斯的第一次公开讲座结束后，没有立刻回办公室。她在轨道站的观景台等了很久，直到你出现。\n“我想带你看一样东西。”她说，“不是工程报告。”"
 PF_B_BOND_1_OPTION:0 "和她一起去看。"
 PF_B_BOND_1_TITLE:0 "两年之后"
 PF_B_BOND_2_DESC:0 "莫宁难得没有带任何终端。她把两杯营养剂放在桌上，认真地问你更喜欢哪一种口味。\n“我知道这不在计划里。”她说，“但我想知道。”"
 PF_B_BOND_2_OPTION:0 "告诉她你的选择。"
 PF_B_BOND_2_TITLE:0 "工作之外"
 PF_B_BOND_3_DESC:0 "索拉里斯的夜面亮起时，莫宁站在炉芯的观测窗前。她没有谈研究进度，只问了一个很简单的问题：\n“下一个两年，你还愿意和我一起看星星吗？”"
 PF_B_BOND_3_OPTION:0 "愿意。"
 PF_B_BOND_3_TITLE:0 "走向群星"
