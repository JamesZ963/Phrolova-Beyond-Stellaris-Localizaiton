 PF17_phrolova_d04_0:0 "“一堆腐烂在时间里的残骸而已。如果你觉得翻找别人的旧伤口能满足你的好奇心，那你找错人了。”"
 PF17_phrolova_d04_0_a:0 "把话题收回来。"
 PF17_phrolova_d04_1:0 "“我曾经亲手埋葬过身边所有人。”她的语气冰冷得让人战栗，“然后，我将他们的回响封存在这里……一次次看着他们以扭曲的残象形态‘活’过来。这就是我的过去，你确定还要继续听下去吗？”"
 PF17_phrolova_d04_1_a:0 "把话题收回来。"
 PF17_phrolova_d04_2:0 "“我曾试着拼好一座碎裂的雕像，以为只要足够小心，就能让它恢复无瑕。但每拼好一处，另一处就会剥落。”她看着自己的掌心，“后来我明白了，完美之上的裂隙……永远存在。就像我弄丢的那些人。”"
 PF17_phrolova_d04_2_a:0 "把话题收回来。"
 PF17_phrolova_d04_3:0 "“我总会想起那片黑红色的天空，满手的血污，和那些在我面前永远闭上眼睛的人。”她声音有些发涩，微微闭上了眼，“那时我以为自己只剩绝望，只能在这个虚假的‘彼岸’里，和回响一起永远沉沦下去……”"
 PF17_phrolova_d04_3_a:0 "把话题收回来。"
 PF17_phrolova_d04_4:0 "“我曾经站在音乐厅门口，等过一个许下承诺却永远不会赴约的人。等了很久很久，直到我发誓，我再也不等任何人了。”她抬眼看向你，眼波微动，“但在不知不觉中，你竟然让我打破了那个誓言。”"
 PF17_phrolova_d04_4_a:0 "把话题收回来。"
 PF17_phrolova_d04_5:0 "“曾经我以为，那片黑红色的天空和满手的血污，就是我永远走不出的牢笼。”她垂下眼帘，声音轻缓却坚定，“但当我带着那数千人的残响走得足够远……直到遇见你。我才明白，铭记过去并不是为了在绝望中反复溺死。那些回声依然在，但我已经不再排斥它们了。”"
 PF17_phrolova_d04_5_a:0 "把话题收回来。"
