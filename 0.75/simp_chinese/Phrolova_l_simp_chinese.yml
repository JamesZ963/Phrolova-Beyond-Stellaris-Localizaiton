 PF17_aemeath_contact_q2_reply:0 "“我以前玩角色扮演游戏的时候就在想，凭什么所有的危险和沉重，都要让主角一个人扛下呢？”\n\n她收起嬉笑的神色，认真地注视着你，眼底闪烁着明亮如火的星光。\n\n“守护世界这种听起来既傲慢又沉重的理想，如果能有两个人一起分担，走起来一定会轻松很多吧？所以，别想把我留在安全的后方哦。接下来的路，我也会一直冲在能看见你的地方！”"
 PF17_aemeath_pending:0 "继续上次的谈话。"
