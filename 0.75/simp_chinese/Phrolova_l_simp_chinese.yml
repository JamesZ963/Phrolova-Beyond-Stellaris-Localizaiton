 PF_bond_defer:0 "稍后联络。"
 PF_bond_ready_desc:0 "弗洛洛发来一条私人通讯请求。\n\n她似乎有些事情想与你谈谈。你可以现在回应，也可以稍后通过“挽歌永不落幕”继续。"
 PF_bond_ready_title:0 "一段新的谈话"
 PF_calibration_required:0 "这片区域的异常频率过于致命。必须先通过人工调律抚平星球的悲鸣，或等待星辉彻底降临此地，工程队方可安全入内。"
 PF_cg_aemeath_meet_desc:0 "漫天飞雪的数据孤岛终于迎来了破冰的航船。那些曾在虚无中独自哼唱的旋律，在一次次跨越生死的校对后，化作了眼前触手可及的身影。\n\n不再是镜中无影的幽灵，爱弥斯就站在真实的星光下，等待你向她说出重逢后的第一句话。"
 PF_cg_aemeath_meet_title:0 "爱弥斯·相逢"
 PF_cg_aemeath_memory_desc:0 "曾经只能在冰冷的电子设备里写下又删去的话语，如今终于可以在彼此身旁慢慢倾诉。\n\n爱弥斯向你提起了那段埋藏在风雪与炉火深处的往事。你知道，此刻她所需要的，只是你安静的倾听与并肩的温度。"
 PF_cg_aemeath_memory_title:0 "爱弥斯·私人回忆"
 PF_cg_aemeath_pending:0 "继续听爱弥斯说完那件事"
 PF_cg_concert_desc:0 "弗洛洛拿起提琴，琴弓轻轻落在弦上。\n\n舷窗外，星海无声流转。你暂时放下手中的事务，将这一刻留给她的演奏。"
 PF_cg_concert_title:0 "弗洛洛·演奏"
 PF_cg_continue:0 "继续"
 PF_cg_denia_meet_desc:0 "黑暗里终于传来了回应。达妮娅猛然抬起头，惊讶地望向声音传来的地方。\n\n她还不知道归途在哪里。可这一次，已经有人找到了她。"
 PF_cg_denia_meet_title:0 "达妮娅·相逢"
 PF_cg_denia_memory_desc:0 "交谈在熟悉的声音中慢慢展开。这一次，达妮娅说起的不是需要处理的事务，而是一段只愿在你面前提起的往事。\n\n你没有打断她。"
 PF_cg_denia_memory_title:0 "达妮娅·私人回忆"
 PF_cg_denia_pending:0 "继续听达妮娅说完那件事"
 PF_cg_heart_repaired_desc:0 "最后一道约束回路闭合，曾经逸散的辉光重新汇入核心。修复完成的“拉海洛之心”在层层装置之间缓缓脉动，恢复了稳定而有力的节律。\n\n弗洛洛站在检验台旁，等待与你商议它的去留。"
 PF_cg_heart_repaired_title:0 "拉海洛之心·重启"
 PF_cg_morin_meet_desc:0 "伴随着低沉的泄压声，静滞舱内浓郁的白色冷冻雾气缓缓散开。沉睡在旧日余烬中的工程师轻轻颤动了一下睫毛，睁开双眼，越过数千年的死寂与寒霜，看向这个早已物是人非的时代。。"
 PF_cg_morin_meet_title:0 "相逢"
 PF_cg_phrolova_meet_desc:0 "夜色已经很深。金属墙壁与阶梯被骤然亮起的白光照亮，一个陌生的女孩站在那里，唇边带着一丝笑意。\n\n没有迎接她的仪式。只是这个原本寻常的夜晚，多了一位神秘的来访者。"
 PF_cg_phrolova_meet_title:0 "弗洛洛·相逢"
 PF_cg_phrolova_memory_desc:0 "避开街巷里热闹的人群，街角小酒馆的暖色灯光将夜风挡在门外。吧台边放着一杯色泽殷红、口感酸涩的特调，那是这片土地独有的味道。\n弗洛洛倚着吧台边缘，没有握着她的指挥棒，也没有谈论任何关于航程与职责的话题。她只是托着腮静静望向你，任由舒缓的背景乐在两人之间流淌——在这段无需防备的休止符里，所有的沉默都成了心照不宣的亲昵。"
 PF_cg_phrolova_memory_title:0 "弗洛洛·私人回忆"
 PF_cg_replay_meet:0 "回看相逢"
 PF_cg_replay_memory:0 "回看私人回忆"
 PF_cg_shorekeeper_meet_desc:0 "海潮涌向尽头，永无止息的地下星空终于迎来了远道而来的访客。淡蓝色的能量晶蝶自寂静中翩跹而起，化作少女清冷而温和的身影。\n\n守岸人从漫长的守望中抬起眼眸，望向与你相连的这片浩瀚星海。她还没有给出所有的答案，但这一次，她愿意向你敞开这片海岸，与你开始一场跨越星辰的交谈。"
 PF_cg_shorekeeper_meet_title:0 "守岸人·相逢"
 PF_cg_shorekeeper_memory_desc:0 "夜色如水，守岸人的声音放得很轻，那些曾在漫长守望中独自承受的碎裂与修补、那些送别故人化作地下星辰的片刻，终于不再只是无人回应的记忆。\n\n你留在这片安静的海岸边，听她将过往岁月里的故事慢慢讲完。"
 PF_cg_shorekeeper_memory_title:0 "守岸人·私人回忆"
 PF_cg_shorekeeper_pending:0 "继续听守岸人说完那件事"
 PF_close:0 "结束通讯。"
 PF_daily_0_0:0 "“引擎的轰鸣声扰乱了几个微妙的频段。如果你是来问候的，我建议你先去整顿一下工程部，他们的噪音简直是对声学的侮辱。”"
 PF_daily_0_0_a:0 "我会让他们调整引擎输出频率。"
 PF_daily_0_1:0 "“现在？我正在捕捉深空里的杂音，琴弦可不是为了给帝国统治者解乏准备的。想听演奏，去你们的剧院。”\n\n通讯被单方面切断，只留下一声刺耳的擦弦音。"
 PF_daily_0_1_a:0 "那就不打扰你了。"
 PF_daily_0_2:0 "“外面的碎石带很吵。你们的开采船频率简直是场灾难。”\n\n她皱着眉，“让它们离我的舷窗远点。”"
 PF_daily_0_2_a:0 "我会调整航线。"
 PF_daily_0_3:0 "“各取所需罢了。你给我庇护，我给你武力。很公平，也很脆弱。”"
 PF_daily_0_3_a:0 "那就继续保持这份默契。"
 PF_daily_0_4:0 "“继续我的实验。别的没兴趣。如果你们想让我参加什么述职报告，免谈。”"
 PF_daily_0_4_a:0 "会转告他们。"
 PF_daily_1_0:0 "“你们的后勤部试图对我这把旧提琴进行‘安全审查’。”她面露不悦，“我不管你们帝国的规矩是什么，别让他们碰我的东西，否则我不保证他们的神经频率还能正常运转。”"
 PF_daily_1_0_a:0 "他们确实管得太宽。"
 PF_daily_1_1:0 "“只有一段没写完的练习曲。听完就回去批你的公文，别赖在这。”\n\n她拿起旧提琴，动作透着敷衍。"
 PF_daily_1_1_a:0 "请继续。"
 PF_daily_1_2:0 "“你们的舰队在跃迁时撕裂了航道附近的暗物质带。”\n\n她冷眼看着探测器数据，“真粗暴。只为了效率，却对宇宙本身的节拍毫无敬畏。”"
 PF_daily_1_2_a:0 "帝国更看重前进的速度。"
 PF_daily_1_3:0 "“你居然还没对我失去耐心？”\n\n她嗤笑一声，“真难得。我以为你们这些掌权者，看到不出成果的实验就会立刻翻脸。”"
 PF_daily_1_3_a:0 "奇迹大概也不接受催办。"
 PF_daily_1_4:0 "“打算把那几个总想来我实验室探头探脑的宪兵赶走。你如果不下令，我就亲自把他们的频率调乱。”"
 PF_daily_1_4_a:0 "就按这个约定。"
 PF_daily_2_0:0 "“科研部那些家伙试图解析我调律时的精神波形。我只是稍微放开了右眼的一点限制，他们就吓得切断了监测链路。帝国的胆量，似乎比我预想的要小。”"
 PF_daily_2_0_a:0 "好奇心总要付出点代价。"
 PF_daily_2_1:0 "通讯意外接通，画面中她正垂眼拉着那把旧提琴，没有平时那种指挥千军万马的凌厉，只剩无防备的安宁。\n\n提琴的余音戛然而止。她放下弓弦，有些不自然地别过脸：“……通讯权限可是帝国赋予你的特权？不用打招呼就随意接入？”"
 PF_daily_2_1_a:0 "我以为你开放了频道白名单。"
 PF_daily_2_2:0 "“深渊里传来的那段回声……它的频率衰减方式，有点像我以前听过的风声。”\n\n她有些出神，“原来不管走多远，死亡的声音都是相似的。”"
 PF_daily_2_2_a:0 "我可以请档案馆保留这份波形记录。"
 PF_daily_2_3:0 "“你真的觉得我能把那些消散的灵魂带回来？”\n\n她带着一丝深沉的怀疑，“还是说，这只是你用来笼络我这个疯子的一种政治手段？”"
 PF_daily_2_3_a:0 "我不仅看重你的能力，也尊重你的目标。"
 PF_daily_2_4:0 "“尝试重新调律那组该死的死亡频率。”\n\n她咬了咬牙，“即使再失败一万次，我也要试。”"
 PF_daily_2_4_a:0 "当然可以。"
 PF_daily_3_0:0 "你接通通讯，发现她单手撑着控制台，脸色苍白得像纸，左眼的猩红却亮得惊人。\n\n“别叫你们的医疗队……”她有些吃力地喘了口气，指尖带着透明的闪烁，“深空探测碰到了点乱流，超频过度了……让我在这借靠一会就好。别说话。”"
 PF_daily_3_0_a:0 "你先休息。"
 PF_daily_3_1:0 "“这次的曲子有些低沉。是多洛利斯的风给我的灵感。”\n\n她看着你，“闭上眼吧。就当是在凛冽的风里，暂时把那些战报忘掉。”"
 PF_daily_3_1_a:0 "好，我听着。"
 PF_daily_3_2:0 "“星图边缘那个没名字的星系，我总觉得那里不太对劲。”\n\n她看向你，“哪天有空，坐我的考察船去那看一眼吧。”"
 PF_daily_3_2_a:0 "我们可以一起去看看。"
 PF_daily_3_3:0 "“昨天我超频失控，差点毁了半个舱室的时候，你没有下令把我隔离。”\n\n她别过头，声音有些别扭，“……我记下了。”"
 PF_daily_3_3_a:0 "只要你愿意告诉我，我们就能一起处理。"
 PF_daily_3_4:0 "“等我恢复力气，我要把上次没拉完的那半首曲子补上。”\n\n她看着你，带着不容拒绝的口吻，“你得来听。这是命令——作为会监的命令。”"
 PF_daily_3_4_a:0 "我会把这个‘命令’加入我的个人日程。"
 PF_daily_4_0:0 "“难得的安宁。”\n\n她看着屏幕，“我借用了生态舱的合成器，做了一点红醋栗果饼。虽然你们的人抱怨它酸涩得无法下咽，但我已经让机械卫兵给你送去了一份。敢试试吗？”"
 PF_daily_4_0_a:0 "那我尝尝看。"
 PF_daily_4_1:0 "“这是那首没有名字的变奏。我改了结尾。”\n\n她轻抚着琴颈，声音有些低，“因为……听曲子的人变了，心境也变了。”"
 PF_daily_4_1_a:0 "既然是专属的变奏，那就只有我能听到了。"
 PF_daily_4_2:0 "“我看到了新抵港的那批移民。他们看这片星域的眼神，那种对新生活的渴望……”\n\n她声音很轻，“我已经很久……很久没有在别人眼里看到过这种光了。”"
 PF_daily_4_2_a:0 "帝国会给他们一个安身之所。"
 PF_daily_4_3:0 "她带来了前所未见的点心。\n\n殷红的果酱沿着蜜饼的裂缝慢慢淌下，把松脆的饼芯也浸成了深红色。弗洛洛尝了一口，满意地眯起眼睛。\n\n餐桌旁有谁小声问了一句，那种小巧坚硬的果子究竟是什么。她只笑了笑，又往碟子里添了一块。"
 PF_daily_4_3_a:0 "银河中还能找到比这更酸的东西吗？"
 PF_daily_4_4:0 "“我想把红醋栗的种子种在你们的生态舱里。”\n\n她眨了眨眼，语气变得轻快，“这样……下回有客人说自己的家乡也有很酸的果子，我们就有东西招待了。”"
 PF_daily_4_4_a:0 "到时通知我。"
 PF_daily_5_0:0 "“我刚才看着星港外的航道，突然想起了斯科特那座永不停歇的摩天轮。庞大，精确，却又毫无意义地转动着。”\n\n她眼底带着清浅的笑意，声音放得很轻，“今天的战报批完了吗？如果累了，就留在这里安静地陪我看一会儿星流吧。”"
 PF_daily_5_0_a:0 "能在这里歇一会儿，还不错。"
 PF_daily_5_1:0 "“把那些战报关掉。”\n\n她扬起琴弓，目光柔和而专注地锁定你，“接下来的时间，这首曲子，还有我，只属于你。”"
 PF_daily_5_1_a:0 "这份邀请，我收到了。"
 PF_daily_5_2:0 "“星图尽头的那片暗物质星云。”\n\n她伸手指了指屏幕上那片遥远的星云，语气中带着一抹罕见的温存，“你们的探测器认定那里只有毁灭。但我能听到，在那些崩塌的杂音之下，正在孕育全新的频率。”\n\n她凝视着那片深渊，又将目光转向你：“去把你的主视界切过去吧。那是只有越过生死的边界，才能欣赏到的绝景……我想让你也看看。”"
 PF_daily_5_2_a:0 "我会亲自去看看，和你一起。"
 PF_daily_5_3:0 "“在这个冰冷的宇宙里，追寻那些不可能实现的妄想，注定是一条孤独的绝路。”\n\n她静静地注视着你，眼底褪去了往日的料峭与防备，带着难得的平和，“或许，并不总是孤身一人。”"
 PF_daily_5_3_a:0 "至少这段路，我们可以一起走。"
 PF_daily_5_4:0 "“至于以后？……没什么宏大的计划。”\n\n她微微侧过头，目光越过冰冷的舷窗，像是在回忆某种遥远的旋律。\n\n“下次找我，不用故意带着什么帝国议程。就算只是想听听我的琴声，这里也随时为你敞开。”"
 PF_daily_5_4_a:0 "下次见。"
