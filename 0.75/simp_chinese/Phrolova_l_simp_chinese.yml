 PF_DENIA_B_RECRUIT_QUESTION:0 "你还记得莫宁和弗洛洛吗？"
 PF_DENIA_B_RECRUIT_REPLY:0 "“当然记得呀。在那片连时间概念都快要消失的黑暗里，我本来都已经困得快要彻底睡过去了……结果耳边突然传来了莫宁老师的声音，语调还是和以前在学院开讲座时一模一样，严肃得让人根本不敢睡着呢。还有弗洛洛姐姐熟悉的琴声，以及你通过炉芯传过来的温度……我知道，你们一直都没有放弃找我。”\n\n“现在，逃课的学生终于能当面喊一声‘到’啦。莫宁老师，弗洛洛姐姐，[Root.GetRulerTitle]——我回来咯。”"
