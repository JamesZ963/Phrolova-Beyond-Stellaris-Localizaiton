 PF24_pact_notice_desc:0 "我们曾将虚无之神的孑遗交给弗洛洛。\n\n这份决定现已记入帝国记录：星海天罚、宇宙创生、巨兽之怒与星系热症将不再可选。此决定不可撤销。\n\n既有的救援、同伴与后续剧情进度保持不变。"
