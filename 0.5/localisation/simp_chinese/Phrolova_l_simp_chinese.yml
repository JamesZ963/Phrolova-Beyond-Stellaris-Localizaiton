 PF17_denia_bond_desc:0 "达妮娅收起了惯常的玩笑。舷窗外的星光落在她的指尖，她像是斟酌了许久，终于主动谈起那些尚未向我们说过的往事。"
 PF17_denia_bond_q0:0 "能介绍一下你自己吗？"
 PF17_denia_bond_q0_reply:0 "“见到我很意外吗？哈哈，别紧张嘛，叫我达妮娅就好。”\n\n她用手指轻轻盘卷着耳畔的发丝，语调轻快又温和。\n\n“如你所见，我只是个喜欢打瞌睡、热爱甜食的普通人哦。至于过去那些泡在虚质空间里的无聊故事……唔，那种让人心情变差的东西，我们就先略过吧？”"
 PF17_denia_bond_q1:0 "你会怎样帮助我们？"
 PF17_denia_bond_q1_reply:0 "“虽然我不太擅长战斗，但制造一些五颜六色的泡泡来保护大家，还是勉强能做到的啦。”\n\n她晃了晃手中那个看起来更像玩具的装置，眨了眨眼。\n\n“不管是用来隔绝虚质的侵蚀，还是在必要的时候……砰地一下，把让人心烦的敌人连同空间一起轧碎。只要是你下达的指令，我都会乖乖听话的哦。”"
 PF17_denia_bond_q2:0 "关于同行，你还有什么想说的？"
 PF17_denia_bond_q2_reply:0 "“明明看上去是一副和善可靠的模样，但你好像总是下意识地对周围抱有防备呢。是被骗的次数太多了吗？”\n\n她向前微微倾身，笑容里带着一丝若有若无的试探与狡黠。\n\n“这样多累啊。既然已经决定与你们同行，我也想试着少一点遮掩。接下来的路，你就偶尔……也试着信任我一下吧？”"
