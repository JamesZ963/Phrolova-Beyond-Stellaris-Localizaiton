 PF_TUNNEL_ARMAMENT:0 "隧者兵装"
 PF_TUNNEL_ARMAMENT_DESC:0 "由我们的科学家难以理解的高能光炮阵列重构而成的巨型舰载武器。——此夜，星海澈明。"
 PF_WORMHOLE_LOCK:0 "需要由弗洛洛主持并完成索拉里斯的虫洞稳定特殊项目。"
 PF_aemeath_bio:0 "曾是星炬学院极具天赋的适格者，在献身阻止灾厄后化作了漫游于数据海中的电子幽灵。她未曾被漫长的孤寂与死寂的虚无击垮，依然保持着如火般明快爽朗的心性。在被启用的拉海洛之心的力量下，她获得了实体，也仍能以幽灵形态穿行数据。如今，她驾驭着自主设计的机甲兵装跨越星海而来，以舰队指挥官的身份与你并肩，誓要将一切来犯的恶敌轰碎在星光之下。"
 PF_aemeath_bond_1_desc:0 "通讯接通时，爱弥斯正托着一个精巧的小型机甲手办。看到你进来，她笑着晃了晃手里的物件。\n\n“这是以前在学院过生日时，朋友们送我的礼物。那时候大家总盼着能早日去真正的星空探险，只有我每天吸果冻、打游戏，装出一副对未来满不在乎的懒散样子。”\n\n她的手指轻轻抚过手办的机翼，眼底却亮起一抹灼热而坦诚的光。\n\n“因为曾有人叮嘱我要‘轻松快乐地活着’，所以我一直把心底那个既傲慢又沉重的愿望死死藏着。直到灾厄降临、我在驾驶舱里与隧者强行共鸣的那一刻，那份束缚终于失效了——虽然身体被撕裂，可我却发自内心的感到高兴！哈哈，是不是很乱来？但这就是真正的我，一个哪怕变成幽灵，也贪婪地想要拯救一切的家伙。”"
 PF_aemeath_bond_2_desc:0 "画面中的爱弥斯罕见地没有笑。她手里攥着一只由数据折成的纸飞机，静静地望着窗外深邃的宇宙。\n\n“成为电子幽灵之后，我在虚质空间里飘荡了很久，也不止一次和宇宙深处那只巨大的‘眼睛’对视过。它总是试图向我灌输一种一切都毫无意义、不如干脆消亡的绝望感。”\n\n她冷哼了一声，掌心微拢，那只纸飞机瞬间在飞溅的火星中化作灰烬。\n\n“说实话，当我看到那些被吞噬的文明残骸时，我感受到的第一种情绪根本不是恐惧，而是愤怒！大家明明都在那么努力地生活，凭什么要被这种荒谬的怪东西轻易夺走未来？从那天起我就发誓，如果真相是如此残酷的坏东西，那我就用手里的剑和光炮，把这些狗屁真相统统砸碎！”"
 PF_aemeath_bond_3_desc:0 "这一次，背景里亮起了温暖的虚拟炉火，旁边还摆着一个插满蜡烛的雪绒海豹蛋糕。爱弥斯站在柔和的火光旁，眉眼弯弯地看着你。\n\n“以前在故乡的雷雨夜里，每当我害怕得睡不着，家里人就会牵着我的手讲故事。可后来我才明白，那些惊心动魄的冒险根本不是童话，而是那个人独自背负的过去。从那以后，我就再也不喜欢听孤胆英雄的故事了。”\n\n她向前一步，虚拟的身影几乎贴近了屏幕，向你伸出手，与你的指尖隔空相触。\n\n“我不在乎什么崇高的头衔，我只是偏心又护短地希望，我所珍惜的你，能够不用那么辛苦，能够自由又快乐地活着。不管未来的星空有多冷、路有多远，只要你抬头，有颗启明星就一定会一直亮着，陪你走到最后！”"
