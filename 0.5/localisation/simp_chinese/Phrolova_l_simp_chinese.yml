 mod_shipsize_behemoth_04_hull_mult:0 "巨兽舰体结构强化"
 pf17_festival_desc:0 "索拉里斯似乎正在筹备一场不同寻常的庆典，守岸人正式向我们发出了赴约的邀请……\n请前往索拉里斯行星界面，查看并执行可用的星球决议。"
 pf17_festival_title:0 "索拉里斯好像要发生什么不同寻常的事，守岸人邀请我们去看看……"
 pf17_frequency_ready_desc:0 "彼岸的弗洛洛发来了消息，告诉我们下一步已经准备好……\n请前往索拉里斯行星界面，执行“稳定异常频率”决议。"
 pf17_frequency_ready_title:0 "彼岸的弗洛洛发来了消息，告诉我们下一步已经准备好……"
 pf17_heart_pulse_desc:0 "修复完成的拉海洛之心开始脉动……\n请前往遗珍收藏页面，查看并决定何时启用修复完成的“拉海洛之心”。"
 pf17_heart_pulse_title:0 "修复完成的拉海洛之心开始脉动……"
 pf17_heart_secret_desc:0 "脉动的拉海洛之心中传来了奇怪且不稳定的频率。\n请前往遗珍与文物页面，在文物行动中选择“深入拉海洛之心的秘密”。"
 pf17_heart_secret_title:0 "脉动的拉海洛之心中传来了奇怪且不稳定的频率。"
 pf22_malevolent_horror:0 "虚无之神"
 pf22_malevolent_horror_plural:0 "虚无之神"
 pf23_specimen_01_category:0 "遗漏的回声：陈旧的唱片"
 pf23_specimen_01_category_desc:0 "监测网在此处捕捉到一段断断续续的轻柔哼唱。这缕附着在旧时代废弃物上的微弱频率，与我们馆藏记录中缺失的“陈旧的唱片”高度吻合，可派遣科研船前往回收。"
 pf23_specimen_02_category:0 "遗漏的回声：「剧本」"
 pf23_specimen_02_category_desc:0 "一处带有叙事性频率波动的特殊信号在此地浮现。经特征比对，其内部结构对应着馆藏目录中缺失的「剧本」，可派遣科研船前往发掘归档。"
 pf23_specimen_03_category:0 "遗漏的回声：星炬奖科学勋章"
 pf23_specimen_03_category_desc:0 "天体表面反射出一道恒定而规律的拉贝尔曲线微光。这处信号源与旧日表彰卓越学者的“星炬奖科学勋章”特征一致，可派遣科研船前往调查回收。"
 pf23_specimen_04_category:0 "遗漏的回声：“故土晨光”"
 pf23_specimen_04_category_desc:0 "探测器在此处感应到一缕纤弱却温暖的祝愿频率。该信号与昔日献予英雄王的信物“故土晨光”同源，可派遣科研船前往打捞。"
 pf23_specimen_05_category:0 "遗漏的回声：映照万音的星彩"
 pf23_specimen_05_category_desc:0 "上万道细碎的星光回音在此处的地层裂隙中彼此共鸣。比对确认，这是馆藏中尚未收录的“映照万音的星彩”，可派遣科研船前往收容。"
 pf23_specimen_06_category:0 "遗漏的回声：筑昼辉砾"
 pf23_specimen_06_category_desc:0 "一束穿透迷雾的温和辉光在此地持续闪烁。其频段特征指向黎那汐塔的提灯终端“筑昼辉砾”，可派遣科研船前往回收。"
 pf23_specimen_07_category:0 "遗漏的回声：灼霜"
 pf23_specimen_07_category_desc:0 "极寒的冰霜与炽热的燃烧频率在此处奇异地交织在一起。这道锋利的信号对应着尚未归档的“灼霜”，可派遣科研船前往提取。"
 pf23_specimen_08_category:0 "遗漏的回声：炽烈权霆"
 pf23_specimen_08_category_desc:0 "一阵夹杂着雷霆轰鸣与砂砾摩擦的暴烈波形在此处回荡。比对显示其为馆藏缺失的“炽烈权霆”，可派遣科研船前往调查。"
 pf23_specimen_09_category:0 "遗漏的回声：昭日译注"
 pf23_specimen_09_category_desc:0 "高强度的恒星辐射在此地蚀刻出了清晰的频率文字。这处遗留物对应着“昭日译注”，可派遣科研船前往拓印回收。"
 pf23_specimen_10_category:0 "遗漏的回声：星图核心"
 pf23_specimen_10_category_desc:0 "一段压缩了无数星辰哀鸣的沉重频谱正在此处低频震颤。经核对，这是尚未收入展馆的“星图核心”，可派遣科研船前往打捞。"
 pf23_specimen_11_category:0 "遗漏的回声：辛吉勒姆的核心"
 pf23_specimen_11_category_desc:0 "一缕糅合了悲欢与叹息的金色频率在此地久久徘徊。信号特征与“辛吉勒姆的核心”完全吻合，可派遣科研船前往收容。"
 pf23_specimen_12_category:0 "遗漏的回声：赝作的矮星"
 pf23_specimen_12_category_desc:0 "一处沉寂的微型引力场正在此处默默守护着内里的余光。比对确认其为“赝作的矮星”，可派遣科研船前往回收。"
 pf23_specimen_13_category:0 "遗漏的回声：拉海洛之心的复制品"
 pf23_specimen_13_category_desc:0 "一段与隧者炉芯同源的算力波纹在此处留下了清晰的备份投影。科研船可前往调查，将这枚“拉海洛之心的复制品”收回馆藏。"
 pf23_specimen_14_category:0 "遗漏的回声：虚无之神的碎片"
 pf23_specimen_14_category_desc:0 "一缕冰冷而空洞的虚质残片在此地投下了微弱的阴影。科研船可前往安全封存这枚散落的“虚无之神的碎片”，将其补入展馆。"
 pf23_specimen_15_category:0 "遗漏的回声：星序协响"
 pf23_specimen_15_category_desc:0 "一段拟造群星演化循环的观测波形在此处重新浮现。这处散落的备份对应着“星序协响”，可派遣科研船前往回收归档。"
 pf23_specimen_16_category:0 "遗漏的回声：宙算仪轨"
 pf23_specimen_16_category_desc:0 "一处遵循着严密析解逻辑的仪器残响在此地持续发出脉冲。比对确认其为遗漏的“宙算仪轨”，可派遣科研船前往提取。"
 pf23_specimen_17_category:0 "遗漏的回声：时和岁稔"
 pf23_specimen_17_category_desc:0 "一道温润如玉、仿佛能化解寒冰与时光的剑气残韵留存于此。该线索指向“时和岁稔”，可派遣科研船前往调查收容。"
 pf23_specimen_18_category:0 "遗漏的回声：不屈命定之冠"
 pf23_specimen_18_category_desc:0 "一段不肯向命定浪海低头的凛然频率在此处铮然作响。比对显示其为“不屈命定之冠”的遗留印记，可派遣科研船前往回收。"
 pf_aemeath_contact:0 "永远的启明星"
 pf_aemeath_contact_desc:0 "与爱弥斯保持联系。"
 pf_aleph_income:0 "阿列夫一的残余"
 pf_aleph_income_desc:0 "阿列夫一的残响沿着航道渗入国库，像一条永不枯竭的暗流。"
 pf_aleph_site:0 "阿列夫一：残存的声部"
 pf_aleph_site_desc:0 "位于“阿列夫一的残余”外侧的这颗小行星内部，隐藏着一座抗衡黑洞引力的精密人工掩体。其中的高频记录与封存物同黑洞本身的异常息息相关，只能由弗洛洛亲自主持考古发掘。"
 pf_aleph_star_lore:0 "阿列夫一的残余"
 pf_aleph_star_lore_desc:0 "曾执掌“虚无”、试图将万物拖入深渊的恐怖鸣式，如今在现实维度中只剩下了这颗形如死寂巨眼的超大质量黑洞。它的视界边缘仍在不断翻涌着高浓度的虚质与高维粒子。"
 pf_ame_contact_hint_desc:0 "稳定下来的异常频率中，传来了一段有趣的消息。对方似乎正等待我们的回应。\n\n请在情报日志中推进与这道神秘信号的§Y第一次接触§!。"
 pf_ame_contact_hint_title:0 "第一次接触传来的有趣的消息…"
 pf_ame_research_exchange:0 "异常频率交流"
 pf_ame_research_exchange_desc:0 "顺着加密频段传来的奇妙机甲调校心得与逆向工程笔记。虽然字里行间满是跳脱的批注，却为我们的科研人员打开了全新的解题思路。"
 pf_archives_restored:0 "重开的档案馆"
 pf_archives_restored_desc:0 "索拉里斯的调查记录已经重新归档。"
 pf_array_garrison:0 "复用的防御阵列·驻军"
 pf_array_garrison_desc:0 "旧时代的防空基座被改造成常备驻军营地，锈蚀的炮位重新响起整齐的步伐。"
 pf_array_garrison_gestalt:0 "复用的防御阵列·格式塔驻军"
 pf_array_garrison_gestalt_desc:0 "旧时代的防空基座被改造成格式塔驻军节点，沉默的无人机在废墟间列队。"
 pf_array_platforms:0 "复用的防御阵列"
 pf_array_platforms_desc:0 "庞大的旧时代防空基座在帝国工程师的手中重获新生。其深埋地下的强劲火控中继网络，已成为拱卫这片星空不可或缺的坚实支柱。"
 pf_battlefield_lore:0 "破碎战场"
 pf_battlefield_lore_desc:0 "一颗在远古激战中被硬生生打碎的天体，周围环绕着无数早已被彻底冻僵的舰船龙骨与装甲碎片。真空完美地保存了防线崩溃那一刻的惨烈轮廓，这里没有预想中的激战和警报，只有一曲早已终结的钢铁挽歌。"
 pf_battlefield_map_label:0 "破碎战场"
 pf_blackshore_empire:0 "黑海岸的守望"
 pf_blackshore_empire_desc:0 "海风轻拂过重建的街巷，带来了属于新时代的生机。在那位熟悉故人的亲自坐镇与守望下，整颗星球的政务与科研都在有条不紊地高效运转。"
 pf_blackshore_watch:0 "黑海岸的守望"
 pf_blackshore_watch_desc:0 "索拉里斯庞大而精密的地下演算网络已与帝国的行政中枢实现对接。那位静默的守望者正如同一座不灭的灯塔，为整个国度的航向提供着精准的指引。"
 pf_defense:0 "迫近的威胁"
 pf_defense_desc:0 "防御倒计时已经启动。完整的炉芯脉动彻底引来了深渊的注视，十二个月后，凝聚成形的恶意实体将跨越虫洞直扑索拉里斯。"
 pf_defense_emergency:0 "紧急筹备"
 pf_defense_emergency_desc:0 "以现有驻防力量建立紧急警戒，优先加固舰体与装甲，让索拉里斯在援军集结前守住第一道防线。"
 pf_defense_full:0 "全力投入"
 pf_defense_full_desc:0 "将防务列为最高优先事项，集中资源强化索拉里斯驻军，并为舰队建立更灵活的战术机动空间。"
 pf_defense_monthly_change_tooltip:0 "准备期每月推进一个月；资源投入不影响到期时间。"
 pf_defense_prepare:0 "防御准备"
 pf_defense_standard:0 "标准投入"
 pf_defense_standard_desc:0 "按计划调配能源与合金，完成舰队检修、星港加固和补给储备，为即将到来的正面交锋做好准备。"
 pf_defense_type:0 "迫近的威胁"
 pf_echo_final:0 "终焉的回响"
 pf_echo_final_desc:0 "跨越漫长孤寂的星辉终于降临，困扰这颗星球许久的狂躁残响已化作温顺的春风。过去的苦难不再是梦魇，而是滋养新生的温柔底色。"
 pf_echo_relief:0 "未校准的回响·缓解"
 pf_echo_relief_desc:0 "经过大规模的人工调律，刺耳的悲鸣余波已被成功压制。虽然旧日的回响仍未彻底散去，但它已不再能够淹没新城市里的欢声笑语。"
 pf_echo_tides:0 "残响潮汐"
 pf_echo_tides_desc:0 "如同永不停歇的海浪，地脉深处的回音能量仍在周期性地涨落。这种奇特的物理现象虽然令人不安，却也向学者们敞开了一扇窥视宇宙本源的窗口。"
 pf_echo_uncalibrated:0 "未校准的回响"
 pf_echo_uncalibrated_desc:0 "大气与地壳中弥漫着尚未完全平息的旧日杂音。怪异的磁暴与微小的空间扭曲仍在时刻上演，令开拓者的日常生活充满了严酷的挑战。"
 pf_everstar_active:0 "启明星的指引"
 pf_everstar_active_desc:0 "那颗跨越漫长孤寂的启明星在星图上投下了一道温暖而耀眼的轨迹，为穿行于未知深空的探索者们照亮了前行的航向。"
 pf_flavor_defense:0 "自动防御系统残留"
 pf_flavor_defense_desc:0 "被重新写入识别码的旧时代自律机兵，成为了驻地守军最无情的战术陪练。高强度的实兵对抗，正迅速磨砺着防卫部队的锋芒。"
 pf_flavor_flowers:0 "彼岸花海异常绽放"
 pf_flavor_flowers_desc:0 "荒原上盛放的黑红色花海，成为了开拓者们在沉重劳作之余的心灵寄托。这片跨越灾厄的静谧奇景，让人们重新找回了对生活的热忱。"
 pf_flavor_logs:0 "失落的遗民日志"
 pf_flavor_logs_desc:0 "从避难所中抢救出的民间日志，为研究院提供了极其宝贵的一手资料。旧日居民应对极端环境的实用智慧，激发了研究员们的诸多灵感。"
 pf_flavor_research:0 "残响中的低语"
 pf_flavor_research_desc:0 "学者们正在对旧水渠中周期性响起的谐振低语进行持续测绘。对回音衰变规律的直观观测，极大拓宽了物理学界的认知边界。"
 pf_flavor_shadow:0 "回声中的身影\n\n十四处障碍"
 pf_flavor_shadow_desc:0 "那道在废墟浓雾中默默为巡逻队指路的神秘身影，被居民们视作这片土地的守望者，他的存在使人们感到安心。"
 pf_flavor_storm:0 "频率风暴"
 pf_flavor_storm_desc:0 "工程师们利用频率风暴留下的过载数据，对旧时代的地下导流槽进行了针对性改造，它们的重新运转，让城市电网焕发出新的活力。。"
 pf_ghost_fleet:0 "幽灵频率"
 pf_ghost_fleet_desc:0 "受控的通讯矩阵正持续向星海播送着经过加密调制的特殊信号。那轻快而坚定的频率如同黑夜中的启明星，时刻指引并守护着这片领空。"
 pf_ghost_frequency:0 "幽灵频率"
 pf_ghost_frequency_desc:0 "一段源自电子海深处的特殊频段已接入帝国的战略指挥网。这道无形的波纹正如同幽灵的披风，在危急关头庇护着远航舰队与母星的安危。"
 pf_heart_active:0 "拉海洛之心"
 pf_heart_active_desc:0 "那颗跨越虚空的炉芯仍在搏动，像一枚被遗忘在星海深处的心脏。"
 pf_institute_rebuilt:0 "重建的深空联合研究院"
 pf_institute_rebuilt_desc:0 "六座继承了旧世界最高技术结晶的尖端设施已在地表拔地而起。这座横跨多个学科的庞大联合体，正源源不断地将古人智慧转化为前行的动力。"
 pf_island_lore:0 "残响孤岛"
 pf_island_lore_desc:0 "一块漂浮在巨型黑洞外围的特殊小行星。粗糙的岩层下包裹着明显的人工掩体结构，那些无法回归故土的古老记录与核心造物便封存在其深处，等待着科研船的实地发掘。"
 pf_journey_chain_desc:0 "这里记录着索拉里斯的校准进程与阿列夫一的残存声部。当前调查目标，请参阅“叩响彼岸”日志中的旅程记录。"
 pf_journey_chain_title:0 "弗洛洛：彼岸旅程"
 pf_local_emergency:0 "索拉里斯紧急防御"
 pf_local_emergency_desc:0 "舰队与基地在索拉里斯星系内维持最低限度的战备：船体与装甲各提高 10%。"
 pf_local_full:0 "索拉里斯全力防御"
 pf_local_full_desc:0 "舰队与基地在索拉里斯星系内获得船体与装甲各 +50%，并增加 20 个百分点的闪避。"
 pf_local_standard:0 "索拉里斯防御准备"
 pf_local_standard_desc:0 "舰队与基地在索拉里斯星系内获得船体与装甲各 +25%。"
 pf_new_solaris:0 "新索拉里斯"
 pf_new_solaris_desc:0 "这段纪念已融入一张送出的门票。"
 pf_old_memories:0 "旧日的记忆"
 pf_old_memories_desc:0 "旧世界在漫长岁月中积累的城建与规划经验，已从残响中被成功破译。这些宝贵的知识正跨越时光，为新一代开拓者构筑起温暖的家园。"
 pf_pollution_cleared:0 "复原的地表"
 pf_pollution_cleared_desc:0 "盘踞在盆地中的扭曲残像已被连根拔除。那些曾令人毛骨悚然的致命禁区终于重见天日，化作了可供城市自由向外舒展的广阔疆域。"
 pf_rest_lore:0 "安息地"
 pf_rest_lore_desc:0 "这颗彻底崩坏的星球早已失去了大气与地质活性，裸露在外的灰白地壳断面宛如一页没有写完的墓志铭。它安静地停留在黑洞的阴影之下，不再回应任何来自星海的呼唤。"
 pf_rest_map_label:0 "安息地"
 pf_ruin_01_restored:0 "修复的观测穹顶"
 pf_ruin_01_restored_desc:0 "重新校准的穹顶恢复了天文观测职能。"
 pf_ruin_01_restored_gestalt:0 "修复的观测穹顶"
 pf_ruin_01_restored_gestalt_desc:0 "重新校准的穹顶恢复了天文观测职能，为格式塔的集体意识提供新的观测视角。"
 pf_ruin_02_restored:0 "重开的运输枢纽"
 pf_ruin_02_restored_desc:0 "淤塞的航道被重新疏通，为城市腾出新的居住空间。"
 pf_ruin_03_restored:0 "校准的共鸣阵列"
 pf_ruin_03_restored_desc:0 "失谐的阵列重新对齐，旧日设施恢复了协调运转。"
 pf_ruin_04_restored:0 "结晶旧城遗址"
 pf_ruin_04_restored_desc:0 "晶化的街区被改造成可居住的遗址社区。"
 pf_ruin_05_restored:0 "打捞的资料库"
 pf_ruin_05_restored_desc:0 "沉没的档案被逐页打捞，旧日知识重新回到学者手中。"
 pf_ruin_05_restored_gestalt:0 "打捞的资料库"
 pf_ruin_05_restored_gestalt_desc:0 "沉没的档案被逐页打捞，旧日知识重新汇入集体记忆。"
 pf_ruin_06_restored:0 "重启的深空港"
 pf_ruin_06_restored_desc:0 "废弃泊位重新开放，商贸与物流再次在此汇聚。"
 pf_ruin_06_restored_gestalt:0 "重启的深空港"
 pf_ruin_06_restored_gestalt_desc:0 "废弃泊位重新开放，补给与物流重新在此汇聚。"
 pf_ruin_07_restored:0 "黑潮观测站"
 pf_ruin_07_restored_desc:0 "黑潮边缘架起了监测站，持续记录着深渊的潮汐。"
 pf_ruin_07_restored_gestalt:0 "黑潮观测站"
 pf_ruin_07_restored_gestalt_desc:0 "黑潮边缘架起了监测站，持续记录着深渊的潮汐。"
 pf_ruin_08_restored:0 "修复的能源管线"
 pf_ruin_08_restored_desc:0 "断裂的管线重新接通，稳定的能量流再次穿行于地下网络。"
 pf_ruin_09_restored:0 "重开的生态庭院"
 pf_ruin_09_restored_desc:0 "封闭的庭院重见天日，绿意重新回到聚居地。"
 pf_ruin_09_restored_gestalt:0 "重开的生态庭院"
 pf_ruin_09_restored_gestalt_desc:0 "封闭的庭院重见天日，绿意重新回到聚居地。"
 pf_ruin_10_restored:0 "疏通的地下通道"
 pf_ruin_10_restored_desc:0 "塌陷的通道被重新支撑，为城市腾出新的居住空间。"
 pf_ruin_11_restored:0 "校准的引力锚"
 pf_ruin_11_restored_desc:0 "紊乱的引力场恢复稳定，矿脉再次变得可及。"
 pf_ruin_11_restored_gestalt:0 "校准的引力锚"
 pf_ruin_11_restored_gestalt_desc:0 "紊乱的引力场恢复稳定，矿脉再次变得可及。"
 pf_sent_ticket_active:0 "赴约的回响"
 pf_sent_ticket_active_desc:0 "那场终于兑现的邀约，成为了人们继续创造明天的动力。"
 pf_solaris_memory:0 "层叠的旧日"
 pf_solaris_memory_desc:0 "这颗星球的表面保存着七段彼此相连的记录。"
 pf_solaris_site:0 "索拉里斯：沉默的回响"
 pf_solaris_site_desc:0 "这颗遗落于星海边缘的星球，封存着无数彼此交织却又各自孤立的文明残响。唯有曾亲历过那场盛大演出的弗洛洛，能够穿过狂乱的频率风暴，为你将这些破碎的乐章重新拼合。"
 pf_tower_restored:0 "研究塔遗址复用"
 pf_tower_restored_desc:0 "坍塌的废墟已被彻底清空。塔底那座曾见证过无数尖端实验的重型抗干扰设施重新亮起了灯光，迎来了新一批渴求真理的探索者。"
 pf_tower_restored_gestalt:0 "研究塔遗址复用（格式塔）"
 pf_tower_restored_gestalt_desc:0 "坍塌的废墟已被彻底清空。塔底重新亮起灯光，格式塔的研究单元接入旧阵列，继续追寻真理。"
 pf_tunnel_derelict:0 "沉默的隧者"
 pf_void_active:0 "虚无之神的孑遗"
 pf_void_active_desc:0 "虚无之神留下的残片在低语，力量与代价一同沉淀在帝国的纹理中。"
 phrolova_ww01_category:0 "陈旧的唱片"
 phrolova_ww01_category_desc:0 "扫描波束在一处废墟夹层中捕捉到了极其微弱的声波谐振。那并非自然风声，更像是一段被刻在古老介质上、反复回放的轻柔哼唱。"
 phrolova_ww02_category:0 "「剧本」"
 phrolova_ww02_category_desc:0 "探测器在一间坍塌的石室内发现了一团奇异的叙事性频率。某种记录介质正在无人的角落里，按照既定的逻辑自行翻动与推演。"
 phrolova_ww03_category:0 "星炬奖科学勋章"
 phrolova_ww03_category_desc:0 "地表瓦砾堆下传来了一阵极其规律的拉贝尔曲线微光。那似乎是一枚经过精密锻造、用于褒奖智慧与求索精神的荣誉信物。"
 phrolova_ww04_category:0 "“故土晨光”"
 phrolova_ww04_category_desc:0 "严寒的石缝间散发出了一丝不合常理的纤弱暖意。传感器在其中检测到了一段封存已久、充满怀念与祝愿的温和回音。"
 phrolova_ww05_category:0 "映照万音的星彩"
 phrolova_ww05_category_desc:0 "冰川裂隙深处折射出了一团永不消散的璀璨极光。上万道细碎的星辰回响在那里彼此牵引，凝结成了某种华美的冠冕轮廓。"
 phrolova_ww06_category:0 "筑昼辉砾"
 phrolova_ww06_category_desc:0 "浓雾笼罩的废墟间亮起了一点柔和而坚定的明光。一台形如古典提灯的共鸣终端仍在原地静静运转，仿佛在为夜行者照亮前路。"
 phrolova_ww07_category:0 "灼霜"
 phrolova_ww07_category_desc:0 "传感器记录到一处极度矛盾的能量反应：刺骨的寒霜与沸腾的热血在同一点上剧烈碰撞，凝聚成了一道试图划破长夜的锋芒。"
 phrolova_ww08_category:0 "炽烈权霆"
 phrolova_ww08_category_desc:0 "密集的球状闪电正围绕着红砂荒原上的一处祭坛不断盘旋。狂暴的雷霆在砂砾间熔铸出了一件散发着辉煌威严的权柄遗存。"
 phrolova_ww09_category:0 "昭日译注"
 phrolova_ww09_category_desc:0 "一座古老观测台的焦平面下方反射出刺眼的金芒。高强度的恒星辐射似乎在某种耐热金箔上，蚀刻下了一段决然的求索誓言。"
 phrolova_ww10_category:0 "星图核心"
 phrolova_ww10_category_desc:0 "破碎的卫星残骸内部传出了一阵令人心悸的低频震颤。一枚高密度晶体正在那里不断重演着群星坠落时的哀恸数据。"
 phrolova_ww11_category:0 "辛吉勒姆的核心"
 phrolova_ww11_category_desc:0 "紊乱的峡谷磁场中央悬浮着一团澄澈的金色微光。无数悲欢离合的记忆与一声悠长的叹息糅合在一起，在此处久久徘徊。"
 phrolova_ww12_category:0 "赝作的矮星"
 phrolova_ww12_category_desc:0 "废弃的轨道坞站内残留着一处微弱的人工引力源。一颗褪去华彩的小型球体正静默地悬浮在约束环中，小心翼翼地护着内里的一点余光。"
 pm_Phrolova_beyond:0 "彼岸的花园"
 pm_Phrolova_beyond_desc:0 "研究岗位产出 +50%、维护费 −15%，宜居性 +20%，人口自然增长 +50%。"
 pm_Phrolova_oblivion_active:0 "忘忧章：余韵"
 pm_Phrolova_oblivion_active_desc:0 "被重新奏响的古老乐章在索拉里斯的地脉中久久回荡。这股跨越岁月的宏大余韵洗涤了开拓者的心智，令整颗星球的学术求索与社会凝聚在共鸣中迸发出前所未有的活力。"
 pm_Phrolova_unstable:0 "未校准的残响"
 pm_Phrolova_unstable_desc:0 "整颗星球仍被狂乱而危险的未知频率死死包裹。在彻底完成勘探与频率校准之前，这片充满恶意的土地拒绝着任何生者的草率定居。"
 r_Phrolova_oblivion:0 "幽冥的忘忧章"
 r_Phrolova_oblivion_active:0 "索拉里斯研究岗位与岗位凝聚力产出 +35%，持续 1800 天；消耗 1000 凝聚力，冷却 3600 天。"
 r_Phrolova_oblivion_desc:0 "由索拉里斯七处遗址的核心残响凝练而成的终极乐章。它不仅沉淀着一个旧日文明在苦难中摸索出的全部智慧结晶，更在弗洛洛的调律下，为即将到来的星海时代留出了谱写新篇的空白。"
 r_pf_everstar:0 "永远的启明星"
 r_pf_everstar_activation_key:0 "循着微光前行"
 r_pf_everstar_active:0 "消耗1000凝聚力：友方领土内舰船射速＋40%、舰船护盾硬化＋30个百分点，防御平台船体与装甲各＋100%，持续1800天。若已开启星河卫士野望，当次额外获得2000英武值。共用遗珍冷却3600天。"
 r_pf_everstar_desc:0 "“你在寂静的星海中飞行，星屑在身侧崩解，时间在身后消亡。漫漫孤寂并未消失，它只是被拉伸、稀释、重塑，最终成为你羽翼的一部分。宇宙以沉默考验你，而你持续前行，以明亮的辉光作答。”\n\n在一次次跨越数据海的回应之后，那颗遥远而孤独的启明星，终于化作了与你并肩同行的约定。"
 r_pf_everstar_effect:0 "§Y被动§!：舰船维护费 §G-10%§!、造舰速度 §G+15%§!、外交权重 §G+100%§!、每座恒星基地防御平台容量 §G+8§!。\n§Y主动§!：消耗1000凝聚力：友方领土内舰船射速＋40%、舰船护盾硬化＋30个百分点，防御平台船体与装甲各＋100%，持续1800天。若已开启星河卫士野望，当次额外获得2000英武值。共用遗珍冷却3600天。"
 r_pf_sent_ticket:0 "一张送出的门票"
 r_pf_sent_ticket_desc:0 "一张纸角微卷、写有前排座号的剧院门票。它曾是一场漫长演出的无声邀约，如今则化作了跨越星海、终于如约相聚的信物。"
 r_pf_sent_ticket_effect:0 "花费3600凝聚力，使帝国全岗位产出额外＋40%，持续1800天。共用遗珍冷却时间3600天。"
 r_phrolova_heart:0 "拉海洛之心"
 r_phrolova_heart_damaged:0 "损坏的拉海洛之心"
 r_phrolova_heart_damaged_desc:0 "从“阿列夫一的残余”外围孤岛中发掘出的隧者炉芯。因长年抵御虚质侵蚀且经历过强行共鸣，其外壳与内部回路均已严重受损，必须在修复后方能展现真正价值。"
 r_phrolova_heart_damaged_effect:0 "拉海洛之心目前处于严重受损状态，只能发挥极其有限的作用。"
 r_phrolova_heart_desc:0 "经过弗洛洛的全面调律与结构重塑，这枚由希望和牺牲打造的心脏终于恢复了往昔的律动。纯净而磅礴的星辉在其中流转不息，随时准备回应持有者的呼唤。"
 r_phrolova_heart_effect:0 "完整修复的隧者炉芯正持续为帝国提供稳定的算力与能源增益；首次启用该遗珍将引发§R未知的效果§!"
 r_phrolova_void_god_remnant:0 "虚无之神的孑遗"
 r_phrolova_void_god_remnant_desc:0 "击溃来犯的虚无实体后得到的本源核心。这枚幽暗的结晶内部封存着令万物归于无意义的恐怖伟力，它正沉默地注视着持有者的野心；一旦帝国踏上改写宇宙的极端道路，其深处的毁灭共鸣便会彻底苏醒。"
 r_phrolova_void_god_remnant_effect:0 "§Y普通持有§!：帝国暗物质产出 §G+30%§!，所有殖民地稳定度 §R-5§!；启用消耗 §R500§! 暗物质。\n§Y灾难共鸣§!：选择星海天罚、宇宙创生、巨兽之怒或星系热症后，替换为暗物质产出 §G+50%§!、稳定度 §R-10§!，启用消耗 §R800§! 暗物质。\n§Y共通主动§!：舰船脱离战斗几率 §G+25%§!、护盾硬化 §G+20%§!、能量武器伤害 §G+20%§!；幸福度 §R-15%§!，灾难共鸣时为 §R-20%§!。持续 1800 天，共用遗珍冷却 3600 天。\n§Y星海天罚§!：被动武器伤害 §G+30%§!、海军容量 §G+30%§!；主动额外武器伤害 §G+30%§!、射速 §G+40%§!。\n§Y宇宙创生§!：被动研究速度 §G+10%§!、研究岗位产出 §G+20%§!；主动额外研究速度 §G+10%§!、研究岗位产出 §G+30%§!。\n§Y巨兽之怒§!：巨兽各成长阶段船体与装甲耐久各 §G+50%§!；主动额外巨兽射速 §G+60%§!。\n§Y星系热症§!：被动结晶熵经济产出 §G+150%§!、巨构建造速度 §G+50%§!；主动期间余烬巡洋舰与余烬战列舰的武器伤害、船体及装甲各 §G+50%§!、射速 §G+30%§!，基础结晶熵月产 §G+200§!（另受产出倍率影响）。\n路线专属效果只适用一组，主动额外效果仅在本遗珍启用期间生效。"
 remove_Phrolova_events:0 "我需要一点时间，重新考虑这场合作。"
 remove_permissions_Phrolova_events:0 "让她离开王座，回到自己的研究。"
 research_Phrolova_events:0 "讨论彼岸计划。"
 ruler_Phrolova_events:0 "请她执掌帝国的总谱。"
 tech_Phrolova_Beyond_1:0 "失亡彼岸"
 tech_Phrolova_Beyond_1_desc:0 "将索拉里斯的观测方法整理成可重复的研究体系。解锁彼岸研究区、失亡彼岸与赫卡忒回廊。"
 tech_Phrolova_Beyond_2:0 "重世总谱"
 tech_Phrolova_Beyond_2_desc:0 "由城市网络中的共鸣记录重建总谱。解锁物理、社会与工程专精设施。"
 tech_Phrolova_Beyond_3:0 "挽歌永不落幕"
 tech_Phrolova_Beyond_3_desc:0 "让封存的成果继续参与新的生活。解锁乌洛波洛大剧院。"
 tech_pf_special_1:0 "失亡彼岸"
 tech_pf_special_1_desc:0 "解析半能量化植物与频谱凝结物的结构力学，使工程团队能够利用特殊的高维共鸣材料，在脆弱的残响地带构筑起稳固的宏伟基建。"
 tech_pf_special_2:0 "赫卡忒回廊"
 tech_pf_special_2_desc:0 "通过逆向推导旧时代的多维拓扑管网，我们的工程师得以掌握在复杂地质断层间架设高通量能源与物流回廊的核心技术。"
 tech_pf_special_3:0 "深红调律塔"
 tech_pf_special_3_desc:0 "建立一套以特定声学波长干涉宏观物理场的理论模型，使我们能够通过巨型谐振阵列，将狂暴的地脉杂音驯服为有序的科研算力。"
 tech_pf_special_4:0 "残响存续所"
 tech_pf_special_4_desc:0 "深入研究回音能量的半衰期与真空驻波锁定技术，从而实现在不破坏原始波形的前提下，对高危未知频率进行长久封存与无损读取。"
 tech_pf_special_5:0 "冥扉构装局"
 tech_pf_special_5_desc:0 "探讨高频共鸣环境下群体意识的演化规律，将旧日文明在极端压力下维持社会协作的构装逻辑，转化为适应星际时代的治理学说。"
 tech_pf_special_6:0 "阿斯忒里亚之门"
 tech_pf_special_6_desc:0 "整合遗落星球的远古星象学与跨文化沟通范式，为这座重获新生的世界构建起衔接外部星海与深空未知领域的制度基础。"
 tech_pf_theatre:0 "乌洛波洛大剧院"
 tech_pf_theatre_desc:0 "从七处遗址的终极交响中直接重构出的奇观建筑学。它将整座建筑视为一件庞大的精密乐器，让艺术的感染力与科学的求索精神在共鸣中彼此升华。"
 tech_pf_tunnel_armament:0 "隧者兵装"
 tech_pf_tunnel_armament_desc:0 "根据从“拉海洛之心”内部解析出的高能光炮阵列重构而成的巨型舰载武器蓝图。掌握该线索后，帝国可在物理学领域自行立项研发这门强大的武器。"
 zone_Phrolova_Beyond_engineering:0 "冥扉构装局"
 zone_Phrolova_Beyond_engineering_arcology:0 "§R彼岸§!：冥扉构装局"
 zone_Phrolova_Beyond_engineering_arcology_desc:0 "理想城中的立体构装网络，将调律装置、重构机械和承载结构纳入连续生产流程。"
 zone_Phrolova_Beyond_engineering_desc:0 "研究意识共鸣与社会组织形态的特化院落。学者们在此剖析旧时代的群体记忆与构装心智，为新生的殖民社会重塑稳固的秩序准则。"
 zone_Phrolova_Beyond_physics:0 "深红调律塔"
 zone_Phrolova_Beyond_physics_arcology:0 "§R彼岸§!：深红调律塔"
 zone_Phrolova_Beyond_physics_arcology_desc:0 "理想城中的垂直调律阵列，以独立声场承担密集的物理试验与精密测量。"
 zone_Phrolova_Beyond_physics_desc:0 "直刺云霄的深红色高塔群，塔身镶嵌着巨大的音律谐振环。它日夜不休地捕捉并驯服着大气中的狂乱波段，将其转化为纯粹的物理实验场。"
 zone_Phrolova_Beyond_research:0 "失亡彼岸"
 zone_Phrolova_Beyond_research_desc:0 "在静默花海与悬空基岩之间构筑的复合工程院区。曾用于承载执念的彼岸空间，如今已被改造成支撑行星运转与大型基建的核心枢纽。"
 zone_Phrolova_Beyond_society:0 "残响存续所"
 zone_Phrolova_Beyond_society_arcology:0 "§R彼岸§!：残响存续所"
 zone_Phrolova_Beyond_society_arcology_desc:0 "理想城中的生命与频谱研究设施，在拥挤的城区深处维持长期实验所需的安静环境。"
 zone_Phrolova_Beyond_society_desc:0 "由多重静默力场层层包裹的半地下物理收容设施。那些极易消散或失控的高危频率样本被封存于此，供学者们安全地窥探宇宙的底层规律。"
 zone_Phrolova_Hecate_research:0 "赫卡忒回廊"
 zone_Phrolova_Hecate_research_desc:0 "纵横交错的多向立体回廊，内部铺设着精密的重型机械导轨与能量管网。它如同星球地表的精密齿轮，将分散的工程节点紧密咬合在一起。"
 zone_pf_asteria:0 "阿斯忒里亚之门"
 zone_pf_asteria_desc:0 "环绕着巨型星象拱门建立的社会学与跨星域交流中心。它象征着索拉里斯告别被天空海封闭的过去，向着更辽阔的星海文明敞开怀抱。 拱门的能量枢纽为整座行星持续供电，驻防设施则守护着通往星海的门户。"
