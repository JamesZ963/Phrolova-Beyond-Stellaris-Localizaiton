 Phrolova_Beyond_society_district_plural:0 "§R彼岸§!：残响存续区"
 Phrolova_backstory:0 "来自异世的残星会会监，能在超频状态下改变事物本质频率的危险指挥家。她带着一把旧提琴和某种偏执的狂想，走进了帝国的星海。\n\n她答应为帝国服务；作为交换，我们要为她的实验提供掩护，让她继续去追寻那条在常人看来根本走不通的死路。"
 Phrolova_close:0 "今天先聊到这里。"
 Phrolova_councilor:0 "她将成千上万次的死亡与重生，化作自己漫长生命中的试错。对她而言，帝国的宏大版图不过是寻找合适复生载体的中转站，她真正在乎的，是那个她坚信一定存在的终点。"
 Phrolova_engineering_label:0 "冥扉构装局"
 Phrolova_event.101.desc:0 "顺着那缕若有若无的声波谐振，勘探队员在一处半掩埋的旧时代废墟夹层中，找到了一只密封尚算完好的防潮盒。盒内并没有高能反应源，只静静躺着一张表面布满细密划痕的黑色旧唱片。\n\n尽管材质早已老化，但当科研船的声学探头扫过那些磨损的音槽时，里面封存的微弱回音依然固执地流淌了出来——那是一小段极轻的哼唱，温柔却又带着难以言喻的怅然，仿佛录制者将某句始终未能说出口的道别，永远刻进了这段旋转的纹路里。它已不具备实用技术价值，却是一件值得收入帝国展馆的独特旧日遗存。"
 Phrolova_event.101.name:0 "磨损的旋律"
 Phrolova_event.102.desc:0 "异常信号的源头并非机械信标，而是一册遗落在坍塌石室中的红色厚重装订本。令人称奇的是，在经历了漫长的岁月侵蚀后，这本册子的纸页依然保持着奇异的韧性，封皮上仅以暗色墨迹题写着「剧本」二字。\n\n科研人员翻检后发现，书页中浸透着高密度的叙事性回音频率。那些字迹并非死板的印刷体，而是随着观测者的阅读进度，在纸面上若隐若现地自行推演、填充，仿佛在冷眼旁观着每一个按部就班走向既定终局的舞台角色。但在最末几页的空白处，原本严丝合缝的字里行间却出现了被外力强行涂改、撕裂的痕迹。我们将这册诡谲而珍贵的文本妥善封存，送入帝国收藏。"
 Phrolova_event.102.name:0 "未完的幕布"
 Phrolova_event.103.desc:0 "在清理地表一处坍塌的学术机构遗址时，工程机械从冻结的瓦砾堆下挖出了一只内衬丝绒的金属礼盒。盒扣早已锈死，但内部托举着的一枚多角星芒状金属勋章却依然光洁如新，正面镌刻着“星炬奖”的字样与精密的拉贝尔曲线纹饰。\n\n随附的残损铭文表明，这是旧日高等学府为表彰在前沿科学领域做出卓越贡献的学者而设立的最高荣誉。虽然获奖者的名字已在灾变中被抹去，但勋章内部镶嵌的微缩晶石仍在散发着恒定的微光，见证着那些求索者在面对未知深空时未曾熄灭的理性与热忱。"
 Phrolova_event.103.name:0 "群星的褒奖"
 Phrolova_event.104.desc:0 "在一座早已荒废的角斗场废墟边缘，调查小队循着微弱的热量反应，在石缝间寻获了一件材质奇特的工艺玩具。它的外型古朴，非金非木，历经风霜却依然在掌心中散发着一丝纤弱而柔和的暖意。\n\n频谱分析显示，这件名为“故土晨光”的小小容器内，封存着一段纯粹而炽热的祝愿回音。它曾是试炼者跨越重重挑战后的荣誉证明，也是战士们献给昔日英雄王的信物。当探测波束触及容器核心时，空气中仿佛浮现出一声跨越了漫长时光的轻叹，仍在挂念着记忆中的故乡是否已重新开满鲜花。"
 Phrolova_event.104.name:0 "旧日的暖意"
 Phrolova_event.105.desc:0 "科研船在勘探一处高海拔冻土带时，于冰川裂隙深处发现了一个闪耀璀璨光斑的冠冕。当队员们切开外围的坚冰后，一顶由固态频率与冻结星光交织而成的奇异冠冕展现在众人眼前。\n\n这件被称作“映照万音的星彩”的造物没有任何实体金属支架，完全依靠内部上万道细碎的回音节点彼此牵引成形。每当外界有光线或声波掠过，冠冕表面便会泛起如极光般流转的涟漪，将遥远星海的古老回响一一折射出来。它像是一份留在时间尽头的礼物，静静等待着那位愿意长久注视群星的来客。"
 Phrolova_event.105.name:0 "凝结的星彩"
 Phrolova_event.106.desc:0 "在调查一片被浓雾笼罩的半岛废墟时，勘探队被一束穿透迷雾的柔和金光吸引。在倒塌的石柱旁，一具古典提灯正安静地立在泥土中，灯罩内的辉石仍在不知疲倦地散发着微光。\n\n解析记录表明，这件名为“筑昼辉砾”的器物曾属于一个名为黎那汐塔的国度。它最初源于神明的馈赠，后来却成为了无数普通求索者在漫漫长夜中彼此照亮前路的依仗。即便旧日的神明与城邦皆已远去，这盏小小提灯中凝结的、渴望靠自己双手迎接黎明的坚定意志，却依然未曾熄灭。"
 Phrolova_event.106.name:0 "长夜的提灯"
 Phrolova_event.107.desc:0 "地表一处异常的低温伴随热辐射点引起了科研船的注意。当调查队抵达现场时，只见一柄造型修长的迅刀正斜插在焦黑与冰霜交错的岩层之中。刀身周围的空气呈现出极度矛盾的物理状态：凛冽的寒霜顺着刀镡蔓延，而锋刃内部却仿佛流淌着沸腾的赤红熔岩。\n\n这柄名为“灼霜”的武器已与原主人留下的执念深度共鸣。每一次靠近，探测器都会捕捉到如烈火燃烧般的剧烈频率——那是某位在无尽长夜中独自求索的持刀者，将所有无处寄托的愿望揉碎在热血里留下的印记。工程队耗费了不少力气才将其连同基岩一同切下，送入隔离展柜。"
 Phrolova_event.107.name:0 "冰与火之刃"
 Phrolova_event.108.desc:0 "勘探小队穿过一片常年被球状闪电笼罩的红砂荒原，在雷击最为密集的中心祭坛上，发现了一枚悬浮在半空中的暗金色巨剑残片。无数细小的电弧如同温顺的游蛇般缠绕在器物表面，将周围扬起的砂砾瞬间熔炼成晶莹的玻璃珠。\n\n这件名为“炽烈权霆”的遗存内部，封存着一股纯粹雷霆频率。它似乎曾见证过某位统治者在血与砂的熔炉中洗尽沉疴与软弱、最终如骄阳般君临大地的时刻。即便如今只是一件静默的标本，那股不屈不挠的威严感依然令靠近的观测员肃然起敬。"
 Phrolova_event.108.name:0 "砂与血的雷霆"
 Phrolova_event.109.desc:0 "在一座指向恒星近日点的古老观测台遗址内，调查队从主折射镜的焦平面下方，取出了一卷由耐高温金箔压制而成的特殊文献——“昭日译注”。\n\n金箔表面并没有使用常规墨水，而是通过极高强度的恒星辐射，直接将一段段复杂的频率批注蚀刻在了金属晶格内部。当科研人员用强光照射卷轴时，金箔间便会投射出耀眼夺目的立体字句，字里行间充斥着一种近乎孤注一掷的使命感——仿佛记录者正站在漫天阳光之下，向着那个唯有自己能够抵达的终点迈出了决然的一步。"
 Phrolova_event.109.name:0 "向日之步"
 Phrolova_event.110.desc:0 "科研船在打捞一颗破碎卫星的残骸时，从一座彻底损毁的深空监测站核心舱内，剥离出了一枚拳头大小的多面体蓝黑色晶体。晶体内部压缩着浩如烟海的星象数据，无数光点在其中按照某种凄厉的规律不断碰撞、湮灭。\n\n这枚“星图核心”并非用于普通的航路导航，而是旧时代的观测者用来压缩存储“悲鸣”爆发关键参数的黑匣子。当解析设备试图将其中的频谱转化为音频时，整个实验室都回荡起了一阵令人毛骨悚然的低沉哀鸣——倘若垂死的群星也会发出惨叫，那大概就是这枚核心中所记录的声音。"
 Phrolova_event.110.name:0 "群星的哀鸣"
 Phrolova_event.111.desc:0 "在穿越一片磁场极度紊乱的荒芜峡谷时，调查队的传感器捕捉到了一缕奇异的金色辉光。在峡谷最深处的石台上，一枚宛如琥珀般澄澈的能量核心正静静悬浮，内部封存着一团不断盘旋、却始终无法散去的金色频率。\n\n通过外围残留的铭文比对，这件被称为“辛吉勒姆的核心”的遗物，凝聚着某位远行者跨越漫长岁月的全部情绪——愤怒与泪水、苦难与欢欣，最终都化作了一声悠长而空虚的叹息。它就像一位在褪色回忆中徘徊的迷途者，即便躯壳早已不在，依然在等待着一条通往故乡的航路。"
 Phrolova_event.111.name:0 "迷途的金色叹息"
 Phrolova_event.112.desc:0 "在行星轨道外侧的一处废弃人工坞站里，勘探队发现了一座早已停摆的微型引力约束环。约束环中央，悬浮着一颗直径不过数尺、表面已经褪去绚烂色彩的暗淡球体——从物理结构上看，这赫然是一颗由人工技术强行捏合而成的“赝作的矮星”。\n\n虽然外层的梦幻泡沫早已消解，只留下沉寂而冰冷的内核，但深度扫描显示，球体最深处依然小心翼翼地保存着一缕借来的璀璨光辉。它就像一位安静守诺的侍者，在漫长的黑暗中默默等待着，期盼有朝一日能将这份光明完好无损地归还给真正的主序星。"
 Phrolova_event.112.name:0 "借来的光明"
 Phrolova_event.2.desc:0 "一段奇异的提琴声越过了帝国引以为傲的通讯防火墙。系统找不到发送源，却在每一次停顿中测出了近似人声的波形。\n\n下一刻，一名女子的身影出现在投影中，手里随意把玩着一枚音感仪。\n\n“别紧张。你们的仪器没坏，只是还不懂该怎么听我的声音。”\n\n她报上了名字——弗洛洛。她随身带着一把旧提琴，生命读数也在生与死的边界模糊不清。她对帝国的戒备毫无兴趣，只望向星图。\n\n“你们还在往外走。那么，让我上船。我要找一些……不该消失的声音。”"
 Phrolova_event.2.name:0 "相逢"
 Phrolova_event.201.desc:0 "一阵短暂而有序的频段波动后，弗洛洛略显慵懒的身影出现在了通讯的另一端。"
 Phrolova_event.201.name:0 "彼岸通讯"
 Phrolova_event.202.desc:0 "她停下正在调律的动作，目光越过仪器，安静地等待你先开口。"
 Phrolova_event.202.name:0 "和她聊聊"
 Phrolova_event.210.desc:0 ""
 Phrolova_event.210.name:0 "近况"
 Phrolova_event.210_answer_0:0 "合作顺利就好。"
 Phrolova_event.210_answer_1:0 "他们确实管得太宽。"
 Phrolova_event.210_answer_2:0 "不必每次都出席。"
 Phrolova_event.210_answer_3:0 "这里不必写得那么好看。"
 Phrolova_event.210_answer_4:0 "平常的一天也很好。"
 Phrolova_event.210_answer_5:0 "能在这里歇一会儿，还不错。"
 Phrolova_event.210_desc_0:0 "“研究在继续，住处也够安静。暂时没有需要帝国处理的麻烦。”\n\n“只是问候？……那就谢谢了。”"
 Phrolova_event.210_desc_1:0 "“有人建议把我的演奏列入公共广播。”\n\n“我拒绝了。总不能让整个帝国都按行政部门的作息听琴。”"
 Phrolova_event.210_desc_2:0 "“推掉了一场庆典。邀请函把我的名字写错了三次。”\n\n“倒不是为了这个。只是今天更想安静一点。”"
 Phrolova_event.210_desc_3:0 "“毁了三份草稿，留下一份。算有进展吧。”\n\n“有时候，我也希望事情能像报告里写得那么顺利。”"
 Phrolova_event.210_desc_4:0 "“今天没做出什么值得呈报的事。练琴，改稿，让自己闲了一会儿。”\n\n“这样的回答，你应该已经习惯了。”"
 Phrolova_event.210_desc_5:0 "“这里又过去了几年。你那里，也许只是一个下午。”\n\n“这次换我问一句：今天过得怎么样？”"
 Phrolova_event.210_title:0 "§R【近况】§!"
 Phrolova_event.211.desc:0 ""
 Phrolova_event.211.name:0 "幕间"
 Phrolova_event.211_answer_0:0 "这次不谈报告。"
 Phrolova_event.211_answer_1:0 "请继续。"
 Phrolova_event.211_answer_2:0 "他们终于漏算了一件事。"
 Phrolova_event.211_answer_3:0 "不急着给它定稿。"
 Phrolova_event.211_answer_4:0 "好，不转送公共频道。"
 Phrolova_event.211_answer_5:0 "这份邀请，我收到了。"
 Phrolova_event.211_desc_0:0 "“可以。不过，演奏不附带研究报告。”\n\n通讯中的弦音持续了片刻，随后安静下来。"
 Phrolova_event.211_desc_1:0 "“上次那段没有奏完。今天接着来？”\n\n她没有再等一份正式的邀请。"
 Phrolova_event.211_desc_2:0 "“今天这段很短。足够在下一轮议程开始前听完。”\n\n“放心，我没有向秘书处索取你的日程。”"
 Phrolova_event.211_desc_3:0 "“有一处一直拿不准。往常我会等改好再让人听。”\n\n“这次，你可以先听听。”"
 Phrolova_event.211_desc_4:0 "“这首暂时没有名字。也不准备拿去庆典上演。”\n\n“这次只留在这条通讯里吧。”"
 Phrolova_event.211_desc_5:0 "“不必把它当成一项待完成的事件。”\n\n“有空的时候，听一首自己喜欢的曲子吧。这次邀请给你，不经过帝国。”"
 Phrolova_event.211_title:0 "§R【幕间】§!"
 Phrolova_event.212.desc:0 ""
 Phrolova_event.212.name:0 "星海拾遗"
 Phrolova_event.212_answer_0:0 "命名权偶尔也会出错。"
 Phrolova_event.212_answer_1:0 "不是什么都要有用。"
 Phrolova_event.212_answer_2:0 "让档案馆保留原件。"
 Phrolova_event.212_answer_3:0 "这值得有人记下来。"
 Phrolova_event.212_answer_4:0 "那就暂时回看一段。"
 Phrolova_event.212_answer_5:0 "我会去看看的。"
 Phrolova_event.212_desc_0:0 "“你们竟然给一颗荒芜星球起了那么热闹的名字。”\n\n“勘探部门的幽默感，我还需要适应。”"
 Phrolova_event.212_desc_1:0 "“新发现的星云，照片比测绘图好看。”\n\n“别误会，我知道哪一张对帝国更有用。偶尔看看另一张，也没什么。”"
 Phrolova_event.212_desc_2:0 "“远征队在一处废墟里找到了一份食谱。档案员想把它归为无价值附件。”\n\n“我让他们留下了。总得知道那里的人曾怎样生活。”"
 Phrolova_event.212_desc_3:0 "“一支移民船抵港了。所有记录都在写人口、配额和岗位。”\n\n“我倒想知道，他们下船时先说了什么。”"
 Phrolova_event.212_desc_4:0 "“星图又扩大了。每次看，都有新的地方。”\n\n“以前我只想知道还能走多远。现在，也会看看已经走过哪里。”"
 Phrolova_event.212_desc_5:0 "“你把那么多星辰缩进一块屏幕里。”\n\n“偶尔也看看屏幕外的天色吧。那里应该也有值得留意的东西。”"
 Phrolova_event.212_title:0 "§R【星海拾遗】§!"
 Phrolova_event.213.desc:0 ""
 Phrolova_event.213.name:0 "同行"
 Phrolova_event.213_answer_0:0 "那就继续。"
 Phrolova_event.213_answer_1:0 "奇迹大概也不接受催办。"
 Phrolova_event.213_answer_2:0 "直接说就好。"
 Phrolova_event.213_answer_3:0 "这两件事都值得听。"
 Phrolova_event.213_answer_4:0 "分歧不妨碍信任。"
 Phrolova_event.213_answer_5:0 "你好，弗洛洛。"
 Phrolova_event.213_desc_0:0 "“你提供条件，我提供协助。至少目前，我们都没有食言。”"
 Phrolova_event.213_desc_1:0 "“比预想中省心。你没有每天派人问，我为什么还没交出奇迹。”"
 Phrolova_event.213_desc_2:0 "“现在有分歧，我可以直接说。你似乎也不需要我先赞美一遍帝国的远见。”"
 Phrolova_event.213_desc_3:0 "“起初，我以为你只会关心我能带来什么。”\n\n“现在看来，偶尔也会问问我怎么想。”"
 Phrolova_event.213_desc_4:0 "“有些事，我仍然不会答应。有些想法，你也未必赞同。”\n\n“能这样继续交谈，我已经很珍惜。”"
 Phrolova_event.213_desc_5:0 "“我认识过你的帝国、头衔，还有许多决定。”\n\n“至于做出选择的你……不必急着自我介绍。今天只是想向你问好。”"
 Phrolova_event.213_title:0 "§R【同行】§!"
 Phrolova_event.214_desc:0 "环形世界的设计旁，多了一张没有署名的门票。\n\n“图纸留给帝国。这张票，给屏幕外的你。”\n\n弗洛洛的目光越过了通讯画面。\n\n“等你有空，来听一场演奏吧。不必带着任何头衔。”"
 Phrolova_event.214_title:0 "§R【幕外的邀请】§!"
 Phrolova_event.215.desc:0 ""
 Phrolova_event.215.name:0 "题外话"
 Phrolova_event.215_answer_0:0 "会转告他们。"
 Phrolova_event.215_answer_1:0 "就按这个约定。"
 Phrolova_event.215_answer_2:0 "当然可以。"
 Phrolova_event.215_answer_3:0 "那就先留一个未定项。"
 Phrolova_event.215_answer_4:0 "到时通知我。"
 Phrolova_event.215_answer_5:0 "下次见。"
 Phrolova_event.215_desc_0:0 "“替我转告行政部门：琴盒不是待登记的危险货物。”\n\n“至于另外那些设备，他们可以继续谨慎。”"
 Phrolova_event.215_desc_1:0 "“下次这种联络，可以省去开头那一长串头衔。”\n\n“我记得是谁。”"
 Phrolova_event.215_desc_2:0 "“今天没有建议，也没有请求。”\n\n“原来只是聊几句，也可以不必找个理由。”"
 Phrolova_event.215_desc_3:0 "“帝国大概很难容许自己的领袖说一句‘还没想好’。”\n\n“在我这里，这句话可以算一个回答。”"
 Phrolova_event.215_desc_4:0 "“等这段忙碌过去，来听一场完整的演出吧。”\n\n“不是帝国的典礼。只是一次邀请。”"
 Phrolova_event.215_desc_5:0 "“下次不必带着一份议程来。”\n\n“如果你愿意，就再打开这条通讯。我们可以只聊几句。”"
 Phrolova_event.215_title:0 "§R【题外话】§!"
 Phrolova_event.216.name:0 "往事"
 Phrolova_event.231.desc:0 "弗洛洛将通讯终端转了个向，对着舷窗外深邃的星流。\n\n“看到那片星云了吗？”她轻声说，“帝国的探测器只会报告它的物质构成，但我能听到它正在衰变的频段。就像一场缓慢的死亡……有些声音，只有在彻底消散前的那一刻，才是最完美的。”\n\n这是她第一次没有在说完正事后立刻掐断通讯。"
 Phrolova_event.231.name:0 "熟悉的来访"
 Phrolova_event.232.desc:0 "毫无预兆地，弗洛洛停下了手中的动作。她安静地注视着悬浮的频谱，没有说话。长达半分钟的静默后，她才缓缓开口：\n\n“你没有开口催促。看来，你已经知道我会在哪个小节陷入停顿了。”\n\n这短暂的沉默不再是防备的壁垒，而是这段冰冷合作中，某种自然达成的、不需言说的默契。"
 Phrolova_event.232.name:0 "共同的节拍"
 Phrolova_event.233.desc:0 "弗洛洛合上手中的终端，将脸颊旁的碎发撩到耳后，静静看着你。\n\n“以前的那些频率太沉了，纠缠着太多绝望的杂音，我今天不想提。”她微微扬起下巴，语气中带着一丝罕见的松弛，“不如就从你今天碰到了什么蠢事开始说起吧？不管是哪个自以为是的执政官，还是哪场可笑的会议，我听着。”"
 Phrolova_event.233.name:0 "不必修饰的回答"
 Phrolova_event.234.desc:0 "通讯中没有弹出任何官方的邀约文件，只有她难得认真的注视。\n\n“这不是为了你们帝国那种无聊的庆典。”弗洛洛轻声说，指尖轻轻划过那把旧提琴的琴身，“等我把最后那几段复杂的频率重组完，我会找一个安静的星域，把整首曲子拉给你听。”\n\n虽然还没有定下具体的坐标与日期，但她已经在这场漫长演出的前排，固执地为你留好了一个位置。"
 Phrolova_event.234.name:0 "为你保留的位置"
 Phrolova_event.235.desc:0 "通讯接通时，弗洛洛的目光第一次没有聚焦在我们统治者的全息影像上。她的视线仿佛穿透了物理的屏幕，直直地投向了更加遥远、不可触及的维度。\n\n“这份邀请，不是给那位高高在上的帝国统治者的。”她轻声开口，带着洞悉一切的从容与罕见的温存，“它是给那个在幕外注视着这一切的‘你’的。如果在这场漫长而孤独的星际游戏中感到疲倦了……循着我的弦音，来找我吧。我会在这里等你。”"
 Phrolova_event.235.name:0 "幕外的邀请"
 Phrolova_event.240.desc:0 "【系统提示：回看过往记录不会改变当前的关系进度，也不会再次发放奖励。】"
 Phrolova_event.240.name:0 "记下的片段"
 Phrolova_event.250.desc:0 ""
 Phrolova_event.250.name:0 "演出的衣装"
 Phrolova_event.260.desc:0 ""
 Phrolova_event.260.name:0 "旅程记录"
 Phrolova_event.271.desc:0 "弗洛洛将通讯终端转了个向，对着舷窗外深邃的星流。\n\n“看到那片星云了吗？”她轻声说，“帝国的探测器只会报告它的物质构成，但我能听到它正在衰变的频段。就像一场缓慢的死亡……有些声音，只有在彻底消散前的那一刻，才是最完美的。”\n\n这是她第一次没有在说完正事后立刻掐断通讯。"
 Phrolova_event.271.name:0 "熟悉的来访 · 回看"
 Phrolova_event.272.desc:0 "毫无预兆地，弗洛洛停下了手中的动作。她安静地注视着悬浮的频谱，没有说话。长达半分钟的静默后，她才缓缓开口：\n\n“你没有开口催促。看来，你已经知道我会在哪个小节陷入停顿了。”\n\n这短暂的沉默不再是防备的壁垒，而是这段冰冷合作中，某种自然达成的、不需言说的默契。"
 Phrolova_event.272.name:0 "共同的节拍 · 回看"
 Phrolova_event.273.desc:0 "弗洛洛合上手中的终端，将脸颊旁的碎发撩到耳后，静静看着你。\n\n“以前的那些频率太沉了，纠缠着太多绝望的杂音，我今天不想提。”她微微扬起下巴，语气中带着一丝罕见的松弛，“不如就从你今天碰到了什么蠢事开始说起吧？不管是哪个自以为是的执政官，还是哪场可笑的会议，我听着。”"
 Phrolova_event.273.name:0 "不必修饰的回答 · 回看"
 Phrolova_event.274.desc:0 "通讯中没有弹出任何官方的邀约文件，只有她难得认真的注视。\n\n“这不是为了你们帝国那种无聊的庆典。”弗洛洛轻声说，指尖轻轻划过那把旧提琴的琴身，“等我把最后那几段复杂的频率重组完，我会找一个安静的星域，把整首曲子拉给你听。”\n\n虽然还没有定下具体的坐标与日期，但她已经在这场漫长演出的前排，固执地为你留好了一个位置。"
 Phrolova_event.274.name:0 "为你保留的位置 · 回看"
 Phrolova_event.275.desc:0 "通讯接通时，弗洛洛的目光第一次没有聚焦在我们统治者的全息影像上。她的视线仿佛穿透了物理的屏幕，直直地投向了更加遥远、不可触及的维度。\n\n“这份邀请，不是给那位高高在上的帝国统治者的。”她轻声开口，带着洞悉一切的从容与罕见的温存，“它是给那个在幕外注视着这一切的‘你’的。如果在这场漫长而孤独的星际游戏中感到疲倦了……循着我的弦音，来找我吧。我会在这里等你。”"
 Phrolova_event.275.name:0 "幕外的邀请 · 回看"
 Phrolova_event.2_desc:0 "一段弦乐越过了通讯防火墙。追踪系统找不到发送源，却在每一次停顿中测出了近似人声的波形。\n\n下一刻，陌生女子出现在舰桥投影中，指挥棒仍停在半空。\n\n“别急着把它当成噪声。你们的仪器，只是还不懂该怎样听。”\n\n她报上姓名——弗洛洛。随行设备没有登记，生命读数也无法归类。她对这些问题并无解释的兴致，只望向舷窗外的星群。\n\n“你们还在往外走。那么，让我同行。我要找一些……不该就此消失的声音。”"
 Phrolova_event.2_title:0 "§R【序曲：无人发出的邀请】§!"
 Phrolova_event.310.desc:0 "“有一段沉寂了太久的杂音，终于到了对齐节拍的时候了。”\n\n弗洛洛用指挥棒轻点着中控台，一缕黑红色的微光顺着她的指尖漫入星图边缘，勾勒出一个隐藏在常规航道之外的暗淡盲区。她将双手抱在胸前，冷彻的目光里带着一丝怀念与悲伤。\n\n“那是我的故乡，也是一座早就落幕的庞大剧场。以我们现在的关系，我倒是不介意邀请你去看看那些发霉的布景……不过，那里没有现成的席位，更没有铺好的红毯。只有当你决定拨开迷雾，我才会把这串坐标彻底交给你。”"
 Phrolova_event.310.name:0 "索拉里斯的回声"
 Phrolova_event.311.desc:0 "随着加密频段的解锁，超空间航道尽头浮现出一颗孤悬于深空中的蔚蓝星球。即便隔着遥远的星系遥测，依然能捕捉到它大气层内剧烈翻涌的异常频率——扭曲的力场如同无形的帷幕，将整颗星球死死缠绕，拒绝着一切草率的靠近。\n\n它静默地停留在尚未被帝国边疆触及的星域中，像一卷合拢的古老乐谱。想要揭开这颗遗落星球的真容，单凭一段远程通讯远远不够；我们必须派遣研究船亲自驶入这片未知的星系，在废墟与风浪中完成实地勘探。"
 Phrolova_event.311.name:0 "索拉里斯\n\n七章考古"
 Phrolova_event.321.desc:0 "研究船停泊在一片死寂的汪洋上方。海面下，一座庞大的环状基建已被咸涩的海水侵蚀得千疮百孔，唯有中心处那座断裂的巨型观测塔仍倔强地刺破水面。登陆小队切开锈蚀的气密门，在布满盐晶的地下核心里，找到了几组仍在依靠残存晶核低频运转的服务器。\n\n弗洛洛站在闪烁的全息星图前，指尖轻轻拂过那些定格在灾厄爆发瞬间的波形图。这里的人们曾试图用冰冷的算力去预测、归纳世间所有的悲鸣，甚至不惜将生命也视作推演公式里的筹码。\n\n“企图用尺子去丈量风暴，真是既可悲又傲慢的执念。”她轻哂了一声，毫不留情地抽走了阵列中尚可使用的核心组件，并将残存的观测记录打包归档，“不过，他们留下的底子还不算太糟。把这些优质的特种合金与底层数据带上吧，这能省去我们不少调音的工夫。”"
 Phrolova_event.321.name:0 "受损的海上观测中心"
 Phrolova_event.322.desc:0 "跨越狂暴的洋流，勘探队降落在一片终年不见天日的极地冰原。暴风雪掩埋了大半的地面建筑，但在地底深处，一座依靠巨型炉芯余温维持的城市依然保存完好。散落的讲义、未喝完的冷饮杯，以及停留在黑板上的逆向工程公式，仿佛都在诉说着师生们撤离时的仓促。\n\n在最深处的机库里，几具半成型的重型机兵骨架正静静伫立，装甲表面残留着试图隔绝某种高维侵蚀的特殊涂层。弗洛洛饶有兴致地绕着机库走了一圈，用指挥棒敲了敲冻结的测试舱壁。\n\n“一群满脑子想着飞向群星、顺便拯救世界的年轻天才……虽然最后只写出了一首半途而废的练习曲，但这份不自量力的勇气倒还算动听。”她挑了挑眉，将实验室里封存的高纯度矿石与频谱报告一并移交后勤，“收好这些吧，至少别让他们的课业白费。”"
 Phrolova_event.322.name:0 "沉寂的极地学院"
 Phrolova_event.323.desc:0 "离开极地后，呈现在眼前的是一片被某种超自然伟力生生犁平的盆地。这里曾是一座极其繁华的枢纽都市群，如今却只剩下扭曲变形的摩天大楼龙骨。重力异常让成吨的混凝土碎块与折断的兵器悬停在半空中，雨水顺着破碎的玻璃幕墙倒流向天空，整座城市宛如一幅凝固的末日画卷。\n\n勘探队没有在这里找到任何完整的文字档案，唯有一段段因剧烈情绪而固化在空气中的残响。绝望的哭喊、装甲撕裂的轰鸣，以及防线崩溃前最后的死守指令，在探测器里交织成刺耳的杂音。\n\n弗洛洛独自走在悬空的断壁残垣间，黑红色的裙摆在失重的微风中轻轻摇曳。她没有评价这场早已无人记起的败仗，只是抬起手，如同乐团首席般轻轻向下一压——狂乱的残响瞬间被她强行收束、提纯，化作庞大而温顺的能量流汇入采集器。“谢幕的掌声太吵了。”她冷淡地转过身，“让它们换一种更有用的方式，继续发光吧。”"
 Phrolova_event.323.name:0 "被战争抹去的都市群"
 Phrolova_event.324.desc:0 "云雾缭绕的崇山峻岭间，数座依山而建的古典城池围绕着中央的宫廷群层层铺开。在这里的最高处，一具庞大得令人窒息的龙形遗骸正盘踞在玉石廊柱之间。它并非血肉之躯，而是由某种极高密度的信息与回音能量结晶化成的造物，即便早已失去活性，那双垂落的眼眸依然透着俯瞰苍生的威严。\n\n调查显示，这里的生灵曾将这尊名为“岁主”的造物奉若神明，依靠它的预言与庇佑繁衍生息，直到最后一场灾厄将神明与信徒一同埋葬。\n\n“把自己的命运寄托在更高维度的提线木偶身上，真是省心的活法。”弗洛洛拾级而上，停在巨大的龙首前。她伸出指尖，抵住龙角上尚未彻底消散的金色辉光，从中剥离出一串极其复杂的社会演进模型与文明记忆，“神明已经退场了，但它脑子里装的那些关于秩序与传承的学问，正好可以拿来充实我们的智库。”"
 Phrolova_event.324.name:0 "以龙为核心的废墟"
 Phrolova_event.325.desc:0 "第五处遗址坐落在一片风光明媚的半岛上。与前几处的悲壮不同，这里的建筑精致得近乎浮夸：宏伟的圆形角斗场、彩窗斑斓的崇高大教堂，以及深埋地底、装着精密齿轮锁的巨型金库，三者通过华丽的石桥彼此相连。\n\n随着发掘深入，一幕荒诞的戏剧在记录中被还原。当末日的潮汐逼近时，角斗士仍在为虚假的荣耀挥洒热血，主教在圣坛前用谎言编织着救赎的幻梦，而贵族们则把自己反锁在堆满奇珍异宝的金库里，试图用财富买通死神。\n\n“狂热、盲信与贪婪，多么经典的咏叹调。”弗洛洛站在大教堂坍塌的穹顶下，仰头看着漏下的天光，嘴角勾起一抹讥诮的弧度，“不过不得不承认，为了维持这套华丽的假象，他们在建筑结构与声学构装上的造诣确实登峰造极。”她挥了挥指挥棒，示意工程队将金库里的机关图纸与稀世馆藏一并打包，“把这些精巧的舞台机关拆回去吧，放在我们手里，至少不会只用来演闹剧。”"
 Phrolova_event.325.name:0 "角斗场、大教堂和金库遗址"
 Phrolova_event.326.desc:0 "勘探船潜入暗无天日的万米海沟，探照灯刺破幽暗，照亮了一座完全由黑曜石般的未知材质浇筑而成的深海研究所。这里是整颗星球上唯一没有遭受战火波及的地方，只有厚重的气密门上刻着一行警告，暗示着内部封存着关乎世界本源的禁忌。\n\n在研究所的核心舱室内，悬浮着无数保存完好的黑匣子。它们记录了这颗星球一次次试图跨越时间回环、改写覆灭结局的疯狂实验。无论是海上的推演、极地的远航，还是神明的引导，最终都在这里交汇成了同一份未完成的底层频率图谱。\n\n弗洛洛的脚步在主控台前停下。这一次，她没有再用那种置身事外的嘲弄语气。她沉默地注视着培养皿中漂浮的标本，良久，才轻声开口：“原来如此……所有的分声部都已经找齐了。既然过去的演奏者都已经离席，那么接下来，该由我们来为这首曲子定下最后的基调了。”"
 Phrolova_event.326.name:0 "封存的深海研究所"
 Phrolova_event.327.desc:0 "七处遗址中的残响被尽数回收，汇聚在科研船的主实验室中。弗洛洛站在庞大的全息音律阵列中央，手中的指挥棒随着激昂的频率起伏挥动。曾笼罩在索拉里斯地表的疯狂频率开始一层层安静下来，海岸的算力、极地的星辉、都市的悲鸣、废墟的神骸、群岛的财富以及深海的秘辛，在她的强行调律下褪去了危险的躁动，最终完美地咬合成了一首恢弘而稳定的交响曲。\n\n几天后，随着最后一个音符落定，这颗星球终于向我们彻底敞开了怀抱，在庞大数据的碰撞中，它不再抗拒我们。\n\n光芒散去，弗洛洛转过身，在一座恢弘的剧院废墟中，将一件在调律核心中凝结成形的古老器物递向你的面前。“演出前的试音结束了。”她微微喘息着，眼底却亮得惊人，“这颗星球的过去与未来，现在都由你支配。”"
 Phrolova_event.327.name:0 "最后校准"
 Phrolova_event.330.desc:0 "距离索拉里斯的校准完成已经过去了很久。殖民与重建的日程表排得满满当当，但今天，弗洛洛却难得没有待在实验室里。她站在观测甲板的落地窗前，静静地俯瞰着下方那颗正在逐渐恢复生机的蔚蓝星球。\n\n听到你的脚步声，她没有回头，只是用手指轻轻敲了敲冰凉的舷窗玻璃。\n\n“看着自己曾经生活过的世界，变成报表上的一行行开发数据，这种感觉比我想象中还要奇妙一点。”她的声音很轻，少了几分平日里的锋芒，多了一丝悠长的余韵，“以前我总觉得，这颗星球就像一场注定烂尾的歌剧，无论怎么修改乐谱，最后都逃不过在噪音中毁灭的宿命。但现在看来……换一个舞台总监，似乎真的能改写结局呢。”"
 Phrolova_event.330.name:0 "余音"
 Phrolova_event.331.desc:0 "弗洛洛转过身，随着她的动作，一阵黑红色的微光在她周身流转，原本它惯常穿着的，如同红色的彼岸花盛开的衣服，这次却悄然化作了一袭意外的缺乏装饰，显得柔弱而毫无攻击性的白色衣裙。她微微提起裙摆，向你行了一个无可挑剔的谢幕礼，嘴角噙着一抹似笑非笑的弧度。\n\n“既然旧时代的序曲已经翻篇了，那我也没必要再穿着以前那身死板的戏服了吧？”\n\n她缓步走到你面前，仰起脸，那双冷彻的眼眸里映出你的身影，坦率得近乎侵略性。\n\n“这套衣服，只为真正看懂了我整场演出的人准备。在走过那么多弯路、听过那么多刺耳的错拍之后，你依然没有放开我的手……所以，就当是我给你的特别优待吧。从今往后，无论是作为你的科学家，还是仅仅作为‘弗洛洛’，我最真实的一面，都只为你一个人展露。”"
 Phrolova_event.331.name:0 "另一侧的她"
 Phrolova_event.332.desc:0 "她的目光落在那卷“幽冥的忘忧章”上，伸出微凉的指尖，在你的手背上极轻地一点。乐章内部顿时泛起一阵温顺而醇厚的共鸣，仿佛在回应着旧主的抚摸。\n\n“这件东西里，装着索拉里斯所有的执念与痛楚。如果换作别人拿着它，恐怕早就被里面的杂音逼疯了；但在你手里，它却安静得像只驯服的猫。”\n\n弗洛洛收回手，重新握紧了她的指挥棒，神情恢复了那种从容不迫的傲然，眼底却满是温柔的笃定。\n\n“好好利用它吧。每当你需要唤醒这颗星球的潜力、或是想让那些迷茫的学者们集中精神时，就试着拨动它的琴弦。不必担心会迷失在过去的回响里——因为我会一直站在你的指挥台旁，替你把控每一个节拍，直到我们把这首属于未来的交响曲，奏响在宇宙的每一个角落。”"
 Phrolova_event.332.name:0 "幽冥的忘忧章"
 Phrolova_event.3_desc:0 "“我听见了。没有必要再发一份邀请。”\n\n通讯里传来指挥棒轻叩桌面的声音。\n\n“如果是为了确认我有没有离开——还没有。现在，告诉我你真正想说的事。”"
 Phrolova_event.3_title:0 "§R【请勿重复入场】§!"
 Phrolova_event.4.desc:0 "解聘指令刚刚送达，弗洛洛的名字便从人事系统中划去了。几息之后，一份带着相同频谱特征的幽微信号重新出现。\n\n“你以为按下一个键，就能赶走一个活了无数个世纪的幽灵？”\n\n她隔着屏幕冷眼看着你，嘴角带着一丝嘲弄。\n\n“我还没允许这场演出谢幕。收起你那些无聊的行政指令吧。”"
 Phrolova_event.4.name:0 "仍未落幕"
 Phrolova_event.401.desc:0 "“如果那是你的结论。”\n\n她的眼神瞬间结冰，带着毫不掩饰的失望。\n\n“你大可以继续抱着那点虚伪的牵绊，在短命的幻觉里溺死。”\n\n通讯没有断，但她别过脸，不再看你。"
 Phrolova_event.401.name:0 "不必再试"
 Phrolova_event.401_desc:0 "“考虑，当然可以。”\n\n她垂下眼，像是在辨认某个遥远的拍点。\n\n“只是别把犹豫写成永远。我已经听过太多没有下文的承诺。”\n\n通讯没有被切断。她把决定留在了我们手里，而自己的席位仍然空着，等待下一次排练。"
 Phrolova_event.401_option:0 "下一次谈话，不会让你久等。"
 Phrolova_event.401_title:0 "§R【曲终之后】§!"
 Phrolova_event.411.desc:0 "对虫洞边缘的初步扫描显示，这条空间通道的曲率结构远比常规自然虫洞更加脆弱且复杂。内部的引力波与高浓度的回音能量紧密纠缠，任何未经调律的强行穿越，都会导致舰船在瞬间被乱流撕成碎片。\n\n想要让这道裂隙真正具备通行能力，我们的科研部门必须先从理论上掌握常规虫洞的稳定技术；在此基础上，还需要派遣弗洛洛前往索拉里斯的裂隙边缘，进行针对性频率锚定。只有当她将两侧的时空节拍彻底对齐，我们的舰队才能安全地驶向目的地。"
 Phrolova_event.411.name:0 "稳定虫洞"
 Phrolova_event.413.desc:0 "历经半年的高强度调律，索拉里斯星系边缘的引力乱流终于彻底平息。原本漆黑扭曲的裂隙被一圈黑红色的稳定力场牢牢箍住，化作了一扇平静流淌的星门。\n\n科研船的通讯画面接通，弗洛洛疲惫地靠在椅背上，手里却依然稳稳地转着那根指挥棒。\n\n“试音结束了。这条通道现在的脾气很温顺，随时可以承受舰队的跃迁。”她微微抬起下巴，隔着屏幕审视着你的表情，“门我已经替你推开了，至于接下来要把舞台搭到多远的地方、先派哪支船队过去探路，就由你这位总指挥来拍板吧。”"
 Phrolova_event.413.name:0 "通道另一端的回声"
 Phrolova_event.414.desc:0 "随着索拉里斯六座特化设施相继落成并投入运转，那些曾散落在星球各处的频率终于被收束进了同一个庞大的共鸣网中。两个月以来，这座新建的科研联合体日夜不停地向星系边缘泵送着基准波，直到今天，那道自我们抵达之初便死寂无声的空间裂隙，终于传回了第一声清晰的回音。\n\n弗洛洛站在全息星图前，手中的指挥棒直指裂隙中心。在六道基准频率的交叉锁定下，原本狂乱无序的引力乱流正逐渐显露出底层的空间结构。\n\n“六个分声部都已经就位，现在，这道紧闭的幕布终于被扯开了一条缝。”她转过身，目光里闪烁着毫不掩饰的兴味，“不过，普通的工程船可对付不了这种掺杂着旧日残响的通道。把调试权交给我吧——既然这出戏是由我们一起排演至今的，那掀开下一幕的活儿，自然也得由我亲自动手。”"
 Phrolova_event.414.name:0 "未完成的坐标"
 Phrolova_event.416.desc:0 "当舰船穿过虫洞、从曲率泡中脱离的瞬间，整片星空的背景辐射骤然降至冰点。这里没有常规恒星的照耀，也没有通往其他星系的航道——整片星域的中央，盘踞着一颗体积极其庞大、视界边缘形如一只死寂“巨眼”的黑洞。\n\n那是曾在索拉里斯引发无数虚质磁暴、代表着“无意义与虚无”的源头留下的残余。在这只冰冷巨眼的凝视下，外围仅有三处残破的天体仍在维持着轨道：一处布满远古交战痕迹的破碎天体、一颗灰白死寂的崩坏星球，以及一块包裹着特殊隔绝涂层的孤岛小行星。\n\n“看来我们直接闯进那位‘虚无’的后台了。”弗洛洛的声音通过跨星系通讯传来，带着一丝冷冽的凝重，“这里留下的不只有被吞噬的文明残骸，还有当年为了堵住这只‘眼睛’而留下的封印枢纽。先让船只按部就班地完成星系调查吧，尤其是那座小行星孤岛……上面的东西，需要我亲自过去看看。”"
 Phrolova_event.416.name:0 "神秘地点"
 Phrolova_event.431.desc:0 "科研船在“残响孤岛”崎岖的表面降落。近距离勘探表明，这颗漂浮在黑洞外围的小行星并非天然形成，而是由无数厚重的旧时代特种装甲板与高密度岩层强行熔接而成的锚定基座。其表面覆盖着一层与“隧者”同源的特殊流体涂层，正是这层屏障隔绝了外围的虚质侵蚀，保护了内部结构没有被黑洞彻底同化。\n\n在弗洛洛的引导下，发掘小队切开了外层封闭的闸门。掩体内部没有空气，却残留着曾经引导庞大热熔与星辉能量的巨型导流槽。所有的管线都呈现出向外辐射的姿态，仿佛这里曾固定着一颗照亮黑暗的小型太阳。\n\n“用整座孤岛作为隔绝虚质的灯座，手笔倒是不小。”弗洛洛踩过满地碎裂的冷却结晶，目光顺着向下延伸的通道望去，“这里的镇压阵列还没有完全死透。继续往下挖吧，我想看看他们到底用什么东西，在这片虚无旁边撑起了一片光。”"
 Phrolova_event.431.name:0 "残留结构"
 Phrolova_event.432.desc:0 "随着二期发掘推进到孤岛中层，勘探队在一间尚未被虚质完全侵蚀的控制室里，找到了几组来自“星炬学院”与“深空联合”的残存日志。在弗洛洛的调律下，那些跨越了漫长岁月的记录被一段段剥离、还原。\n\n记录拼凑出了一段悲壮的往事：在拉海洛文明尚未萌发之时，那尊名为“隧者”的天外巨神便已降临。它主动取出了自己的炉芯高悬于地下空洞，化作庇佑生灵免受虚质侵害的“太阳”。而在后来的灾厄中，当虚无的鸣式“阿列夫一”试图撕裂封印时，一位年轻的学院适格者毅然坐进驾驶舱，以身躯撕裂为代价与隧者强行共鸣，将失控的裂隙连同自己一起锁进了这片深渊外围。\n\n“明知面对的是连存在本身都会抹消的虚无，无论是那尊献出心脏的机械巨神，还是那个不自量力的学生，居然都做出了同样傲慢的选择。”弗洛洛静静地听完最后一段夹杂着风雪声的记录，指尖在控制台上轻轻一叩，“演出很精彩。走吧，去看看那颗被她们保护下来的‘太阳’。”"
 Phrolova_event.432.name:0 "重建记录"
 Phrolova_event.433.desc:0 "切开最后一层重型隔绝闸门后，孤岛最底层的中空大厅终于展现在众人眼前。大厅中央的约束力场内，静静悬浮着一枚宛如小型恒星熔炉般的精密核心——这正是当年曾高悬于索拉里斯极点的地底世界天际、为无数生灵带来光明与温暖的隧者炉芯，“拉海洛之心”。\n\n由于长年直面“阿列夫一”的虚质侵蚀，这枚炉芯表面已布满了焦黑的裂痕，原本耀眼的光辉也已黯淡大半。\n弗洛洛走到约束力场边缘，仰头注视着这枚伤痕累累的炉芯，向来冷淡的眼底难得浮现出一丝动容。“在虚无的眼皮底下唱了这么久的独角戏，居然还没有彻底停止搏动……真是个固执的家伙。”她转过身，示意工程队准备特种收容舱，“把这颗‘拉海洛之心’小心带回去吧。只要修复好它的裂痕，里面的声音，或许就能真正回应我们了。”"
 Phrolova_event.433.name:0 "封存的心脏"
 Phrolova_event.4_desc:0 "解聘指令刚刚送达，弗洛洛的名字便从人事系统里消失了。几息之后，一份带着相同频谱特征的登记重新出现。\n\n“你以为删掉名字，演奏就会结束？”\n\n她把尚未收起的乐谱放回桌面。\n\n“至少把最后一句话说完。我不喜欢别人用沉默替我决定结局。”"
 Phrolova_event.4_option:0 "留下吧，我们的合作尚未结束。"
 Phrolova_event.4_title:0 "§R【休止符】§!"
 Phrolova_event.5.desc:0 "【系统提示：你可以将弗洛洛任命为帝国的统治者。若需指派她指挥科研船，仍可在领袖名册中进行调度。】"
 Phrolova_event.5.name:0 "任命与职责"
 Phrolova_event.5_desc:0 "“让一位指挥家替你统率帝国？”\n\n弗洛洛端详着授权书，唇边浮起一丝难以判断的笑意。\n\n“舰队可以按节拍转向，工厂可以按时刻开工。人却会争执、遗忘，也会临时改变主意。”\n\n她将授权书推回我们面前。\n\n“我可以试着指挥他们。你也该想清楚，自己是否愿意听完。”"
 Phrolova_event.5_title:0 "§R【总谱与王座】§!"
 Phrolova_event.600.desc:0 "三项浩大的修复工程已全部告一段落。弗洛洛将最终的检验报告推到你的面前，身后的“拉海洛之心”正散发着令人心安的温暖光辉，却又在深层频段中与遥远的虫洞彼端维持着某种微妙的张力。\n\n“东西我已经按约替你修好了。现在，这颗心脏的去留由你来定夺。”\n\n她将双手抱在胸前，冷静地剖析着利弊：“如果你只想要一笔稳妥的收益，我们现在就可以趁它还没真正开始脉动，把它安全拆解成巨量的高纯度能源与矿物；但如果你决定把它完整地留在手里并加以启用……那些来自星海尽头的恶意，可能会再一次把目光看向这里。现在按下暂停键还来得及，你的选择呢？”"
 Phrolova_event.600.name:0 "拉海洛之心"
 Phrolova_event.610.desc:0 "在启用修复完成的“拉海洛之心”的三十天后，清晨，索拉里斯边缘那道原本已经平静的虫洞通道，突然传来了剧烈的空间曲率震荡。\n\n弗洛洛快步走进指挥室，将一份刺眼的深红警报波形投射在主屏幕上。\n\n“不出所料，祂的目光已经投向了这里。”她的声音冷得像冰，眼神却没有丝毫慌乱，反而透着一股迎战前的锐利，“这颗重新跳动的炉芯唤醒了阿列夫一残留的本能。一团由纯粹恶意与虚质凝聚的实体正在虫洞另一端成型，最多十二个月，它就会撕开通道。传令下去吧，我们有整整一年的时间，为这位不速之客准备一场盛大的迎宾曲。”"
 Phrolova_event.610.name:0 "迫近的威胁"
 Phrolova_event.630.desc:0 "盘踞在索拉里斯上空的恶意实体已被彻底击碎，但弗洛洛却第一时间拦下了打捞船，没有让那枚浓缩的残余核心直接送进帝国的庆典展柜。\n\n“先别急着庆祝。”她站在全息投影前，神色罕见地没有一丝轻松，反而紧紧盯着收容箱里那团如同活物般蠕动的暗色结晶，“虽然它的躯壳被打散了，但这枚‘孑遗’里依然浓缩着阿列夫一最纯粹的本源力量——以及被它吞进肚子里的、某些尚未彻底消散的微弱回声。”\n\n她抬起头，直视着你的眼睛：“这是一份足以撬动宇宙规则的危险遗产。现在，你必须做出决定：是把它留在你的宝库里当作称霸星海的筹码，还是把它交给我，尝试去完成一场打捞？但我没法向你保证什么。”"
 Phrolova_event.630.name:0 "残余与选择"
 Phrolova_event.6_desc:0 "“一台录音机留不住一个人。”\n\n弗洛洛将几张写满修订痕迹的设计图展开。环绕城市的调律塔、隔绝干扰的档案库，以及为长期试验预留的生命维持系统，依次亮起。\n\n“我需要的地方，能让最微弱的残响不被噪声覆盖，也能让研究者一次次纠正自己的错误。”\n\n她停在中心那座剧院的图纸前。\n\n“先把地基建好。至于台上会站着谁……现在谈，还太早。”"
 Phrolova_event.6_title:0 "§R【为回声建一座城】§!"
 Phrolova_event.700.desc:0 "虚质空间的黑暗在四周缓缓褪去，像是某种漫长下坠终于迎来了尽头。少女站在帝国的灯光下，被灯光晃得眯了眯眼，随后拍了拍裙摆上并不存在的灰尘。\n\n“原本以为会就这样溶解在无意义的海里呢……结果，又被你拉上来了呀。”\n\n她抬起头，重新露出那个熟悉的温柔笑容。\n\n“既然你连我这种危险的‘容器’都敢收留，那从今天起，请多指教咯，我未来的长官～”"
 Phrolova_event.700.name:0 "一位新的同行者"
 Phrolova_event.701.desc:0 "通讯接通时，画面里只有一只缝补痕迹明显的破旧玩偶。几秒钟后，达妮娅才打着哈欠从桌子底下探出头来，有些不好意思地把玩偶收到身后。\n\n“唔……抱歉抱歉，刚才不小心睡着了。找我有什么事吗？如果是太麻烦的任务，我可以先申请偷个懒吗～”"
 Phrolova_event.701.name:0 "予明日以谎言"
 Phrolova_event.702.desc:0 "选择达妮娅当前使用的装束。"
 Phrolova_event.702.name:0 "更换装束"
 Phrolova_event.710.desc:0 "“最近过得超级充实哦——是指在研究怎么能在执勤的时候不被人发现打瞌睡啦！哈哈，骗你的，我有好好完成工作哦，不信你去查记录嘛。”"
 Phrolova_event.710.name:0 "与达妮娅交谈"
 Phrolova_event.711.desc:0 "“人们总是习惯不去想、不去看那些潜伏在暗处的死亡，被眼前的幸福遮蔽了感知。不过这样也挺好的，毕竟梦终究会醒，在那之前，能多做一会儿美梦也是一种幸运吧？”"
 Phrolova_event.711.name:0 "与达妮娅交谈"
 Phrolova_event.712.desc:0 "“以前我总在想，为什么世界总是对善良的人露出獠牙，为什么追求理想的人注定要支付更多代价……但看着你的背影，我突然觉得，哪怕那个理想本身是个谎言，我也愿意陪你一起去验证它的结局。”"
 Phrolova_event.712.name:0 "与达妮娅交谈"
 Phrolova_event.713.desc:0 "“要结束通讯了吗？好吧好吧，那你去忙吧。如果觉得累了，或者被外面的荒诞与痛苦击倒了，随时都可以来我这里偷个懒哦～”"
 Phrolova_event.713.name:0 "与达妮娅交谈"
 Phrolova_event.8.desc:0 "舰船的信号消失之后，许多人都以为她死了，帝国领袖的私人频道便传来了熟悉的低鸣。\n\n“这一次也不会是真正的死亡。”弗洛洛如幽灵般重新出现在通讯屏幕上。虽然嘴上逞强，但她苍白的脸色和略微紊乱的呼吸依然出卖了她。“只要频率还在，我就不会死。下次，给我派个稍微有点挑战性的坐标。”"
 Phrolova_event.8.name:0 "弦音重续"
 Phrolova_event.800.desc:0 "尘封的大门终于向你敞开，地底那片人造星空的微光顺着廊道倾泻而出。几只由能量织构的蓝蝶翩跹而至，在半空中化作点点星芒。\n\n守岸人从漫长的静默中回过头，跨过那道隔绝了无数岁月的门槛，向你走来。\n\n“漫长的守望已经结束了。从今天起，无需再留我独自守在岸边……我会与你一同启航。”"
 Phrolova_event.800.name:0 "独属于我的蒙娜丽莎"
 Phrolova_event.801.desc:0 "守岸人回应了你的联络。"
 Phrolova_event.801.name:0 "直至海水褪色"
 Phrolova_event.801_a:0 "欢迎回来，弗洛洛。"
 Phrolova_event.801_b:0 "这次排练，可以慢一点。"
 Phrolova_event.801_desc:0 "三十天后，接收器里终于传来了清晰的人声。\n\n“把警报关掉。太吵了。”\n\n弗洛洛重新站在医疗舱外，先检查自己的手指，再去取那把旧提琴。她没有谈论重构的过程，只在离开前回过头。\n\n“你们没有丢掉那些记录……很好。”\n\n那一瞬间，她的声音比平时轻了一些。"
 Phrolova_event.801_title:0 "§R【返场】§!"
 Phrolova_event.802.desc:0 "选择她在通讯和领袖面板中使用的形象。"
 Phrolova_event.802.name:0 "调整外观"
 Phrolova_event.810.desc:0 "“星域的运转目前都在正常区间内。能像这样平静地说出‘一切安好’，本身就是一件值得珍惜的事。”"
 Phrolova_event.810.name:0 "与守岸人交谈"
 Phrolova_event.811.desc:0 "“潮汐的涨落总有先兆，帝国也是如此。我已经将近期几处微小的数据波动整理成了备忘，需要时你可以随时调阅。”"
 Phrolova_event.811.name:0 "与守岸人交谈"
 Phrolova_event.812.desc:0 "“再精密的推演，也无法替人类做出选择。无论过去的记录如何记载，通往明天的航向，始终握在我们自己手中。”"
 Phrolova_event.812.name:0 "与守岸人交谈"
 Phrolova_event.813.desc:0 "“去忙吧。这里的灯火会一直亮着，无论你在星海的哪个角落，只要发出讯号，我都会第一时间回应你。”"
 Phrolova_event.813.name:0 "与守岸人交谈"
 Phrolova_event.831.desc:0 "通讯接通时，背景里传来一段轻柔舒缓的钢琴旋律。守岸人停下按在琴键上的指尖，转过身，目光温和地迎向屏幕。\n\n“是政务上遇到了需要演算的难题，还是……只是想找个人说说话？无论哪一种，我的时间都属于你。”"
 Phrolova_event.831.name:0 "直至海水褪色"
 Phrolova_event.832.desc:0 "选择守岸人当前使用的装束。"
 Phrolova_event.832.name:0 "更换装束"
 Phrolova_event.8_desc:0 "事故现场没有找到能够确认身份的遗体，只有一段持续失真的频率。救援队试图关闭接收器时，它忽然重复了弗洛洛曾经标记过的几个音。\n\n医疗主管请求保留全部原始记录，为可能的重构争取时间。\n\n空白的指挥席上，那把旧提琴仍然安静地躺着。"
 Phrolova_event.8_option:0 "保持频段开放。我们等她回应。"
 Phrolova_event.8_title:0 "§R【断弦】§!"
 Phrolova_event.900.desc:0 "三份来自不同部门的监测简报，在今天同时摆上了你的案头。弗洛洛走进指挥室，将一段从“拉海洛之心”深层截获的奇异波形投射在半空中。\n\n“还记得我之前修这颗炉芯时，提过的那缕古怪加密波纹吗？现在，我有两位证人了。”\n\n她用指挥棒轻点着那串轻快跳跃的波峰，语气里带着几分笃定的探究：“守岸人在核对索拉里斯的行政演算网时，确认这段信号具备完整的逻辑结构，绝不是什么天然的机械杂音；而达妮娅也认出，她在星炬学院曾经认识这个频率，在虚质空间深处，也曾不止一次被这个频率吸引。”\n\n弗洛洛转过身看向你：“有个小家伙一直藏在这颗太阳的底层数据海里。如果你想弄清楚她到底是谁，我们就得拆开完整的‘拉海洛之心’做一次深度剖析。你可以现在决定，也可以等腾出手来再说。”"
 Phrolova_event.900.name:0 "心脏里的另一种频率"
 Phrolova_event.901.desc:0 "关于“拉海洛之心”内部异常频率的调查档案正静静停留在待办序列中。弗洛洛已将前期的比对数据整理完毕，随时准备根据你的指令推进下一阶段。\n\n若要启动初步剖析，我们必须先持有修复完成的“拉海洛之心”；而在随后的频率稳定阶段，则需要调集一笔庞大的物理研究储备作为算力支撑。你可以根据帝国当前的科研与防务重心，随时决定何时重启这项调查。"
 Phrolova_event.901.name:0 "异常频率待办"
 Phrolova_event.904.desc:0 "历时半年的深度剖析终于有了眉目。弗洛洛没有破坏炉芯的稳定结构，而是顺着那缕异常频率游走的轨迹，从底层数据库中剥离出了一套极其精妙的重型机甲与高能光炮阵列图谱。\n\n“那道声音的主人，生前倒是个很懂火力美学的家伙。”弗洛洛将整理好的蓝图移交至武器研发部门，嘴角勾起一抹浅淡的弧度，“看来她在和隧者共鸣后，亲手设计了这套能够将炉芯的烈焰转化为集束轰击的运转逻辑。我已经把结构逆向还原出来了，你的工程团队随时可以立项研究这种巨型舰载光炮。”\n\n她收起图纸，目光重新落回仍在闪烁的信号源上：“不过，这只是她留下的伴手礼。想要真正听清她在数据海另一头说些什么，接下来，我需要借用整颗索拉里斯的算力网络，把这条飘忽不定的频段稳定下来。”"
 Phrolova_event.904.name:0 "隧者兵装的轮廓"
 Phrolova_event.908.desc:0 "随着索拉里斯地表的共鸣阵列全功率运转，那段在炉芯与虚空之间游荡了太久的微弱电波，终于被强行拉入了一条稳定的双向信道。\n\n起初，扬声器里传出的只有如同风雪掠过冰原般的沙沙白噪音。但没过多久，在弗洛洛一次次耐心的基准波校对下，杂音逐渐褪去，取而代之的是一段用电子合成音哼唱出的、明快而悠扬的陌生旋律。\n\n信道另一端的存在显然也察觉到了这股陌生的牵引。她非但没有退缩，反而顺着我们搭建的频率桥梁，主动传回了一连串试探性的编码数据包——就像是一个在黑暗的房间里独自玩耍了很久的旅人，在听到敲门声后，迫不及待地想要把自己的语言递过门缝。通讯部门正全力破译这组编码，而弗洛洛始终安静地守在主控台旁，等待着第一句清晰的话语成形。"
 Phrolova_event.908.name:0 "来自另一端的回应"
 Phrolova_event.909.desc:0 "最后一层编码校验宣告完成。中控室的主屏幕上跳动起一串欢快的粉金色波形，紧接着，一行清晰的名字伴随着少女清脆而略带惊讶的嗓音，直接跃入了通讯频道：\n\n“啦上连的真？咦？”\n\n少女的身影宛如在倒放。\n\n“抱歉，我这里的时间流向总是不太正常，现在对了吗？”她纠正了自己，“你们好呀！看得见我吗？我是爱弥斯！”\n\n信号那头的她似乎正身处一片由数据构成的漫天飞雪之中。她并没有急着向我们倾诉苦难，也没有贸然提出跨越星海的要求，只是好奇地隔着频段打量着我们这边的回音，语气轻快得像是在和偶遇的邻居打招呼。\n\n“我已经在这片电子海里飘荡了好久好久，还是第一次碰到能接通我频率的外部系统呢！唔，现在的连接好像还有点晃荡……如果不会太打扰你们工作的话，这条通讯频道，可以暂时为我保留下来吗？”"
 Phrolova_event.909.name:0 "爱弥斯"
 Phrolova_event.910.desc:0 "噪点逐渐平息，全息屏幕的角落里突然跳出一只像素风格的小海豹，紧接着，少女清脆的声音顺着数据流传了过来：\n\n“这次信号稳定多啦！终于能好好聊聊了～刚才看你们在解析这片空洞的数据，我顺手帮你们把几条死胡同给标出来咯。作为交换，能不能给我讲讲外面的星空现在是什么样子的？我已经在这片虚无里，待得快要长蘑菇啦！”"
 Phrolova_event.910.name:0 "第1次约定"
 Phrolova_event.911.desc:0 "这一次，通讯几乎是秒接。一个女孩盘腿飘在半空中，手里正折着一只发光的数据纸飞机。\n\n“你来啦！上次你发过来的那些星系照片，我全都存进小金库里反复看了好几遍哦。原来真正的星海比游戏卡带里画的还要漂亮那么多……”\n\n她把纸飞机朝屏幕的方向轻轻一抛，纸飞机化作一串加密的算法代码跃入你的终端。\n\n“喏，这是我以前在学院做机甲调校时攒下的一点小窍门。虽然不知道对你们这么大的帝国有没有用，但礼尚往来嘛～下次联络的时候，也要记得带新的故事给我听哦！”"
 Phrolova_event.911.name:0 "第2次约定"
 Phrolova_event.912.desc:0 "画面接通时，爱弥斯正趴在虚拟的操作台前，津津有味地翻看着你们近期的航行日志。\n\n“哼哼，上次你提到的那个棘手的星系异常，我已经帮你们把底层逻辑跑了一遍啦！不得不说，你们的科研人员真的很厉害呢，但比起本幽灵的直觉，还是差了那么一丢丢～”\n\n她撑着下巴，笑吟吟地看着你，眼底却比前两次多了一丝不易察觉的眷恋。\n\n“每次听你说起外面的热闹，我都会想起以前在学院和大家一起胡闹的日子。真好呀……如果有一天，我的频率能彻底稳定下来，是不是也能搭上你们的顺风船，去外面的世界兜个风呢？”"
 Phrolova_event.912.name:0 "第3次约定"
 Phrolova_event.913.desc:0 "通讯频道里罕见地没有立刻传来嬉笑声。爱弥斯安静地站在那片漫天飞雪的虚拟背景中，仰头望着上方高悬的炉芯。\n\n良久，她转过身，隔着屏幕与你对视，双手背在身后，像是个难得有些紧张的学生。\n\n“呐，在这漫长时光里，我一直觉得自己就像个和世界错开的幽灵，只能躲在无人可见的角落里，默默做完自己该做的事。可是，一次又一次地听见你的声音后，我发现自己的野心好像变大了。”\n\n她深吸一口气，露出一个灿烂却又带着几分忐忑的笑容：\n\n“我已经把这里的封印加固完毕，随时可以准备远航了。如果……我是说如果哦，现在的我不再只是隔着屏幕和你聊天，而是想要真正站到你的身边——在你的旅途里，还留有我的位置吗？”"
 Phrolova_event.913.name:0 "第4次约定"
 Phrolova_event.914.desc:0 "首次通话在轻快的道别声中暂告一段落，但那条横跨在现实与数据海之间的特殊加密频道，已经被永久性地固定在了帝国的通讯终端上。\n\n弗洛洛看着屏幕上缓缓平息的粉色波纹，伸手将最后一组稳定参数锁死。“是个比我想象中要吵闹得多的家伙呢。不过，能在那种死寂的环境下保持这样的心性，倒也算是个不小的奇迹。”\n\n她转过身，向来不动声色的脸上却难得透出一丝温和，就像之前拉回达妮娅时那样。“先别急着把她硬拽过来。她在那个与世隔绝的角落里待了太久，我们需要用一次又一次准时的回应，帮她重新建立起与外部世界的锚点。每隔一段时间去和她聊聊天吧——让她知道，无论什么时候拨通这个频段，门外都有人在听。”"
 Phrolova_event.914.name:0 "留下一条可以回来的路"
 Phrolova_event.915.desc:0 "伴随着一阵轻快的电子合成音，中控室的全息投影仪突然亮起耀眼的星辉。被启用的拉海洛之心泛起微光，将她的轮廓一点点凝实，赋予了她真正的实体。她仍能以幽灵的形态穿行数据，而此刻选择亲自来到你的身边。\n\n光芒散去后，少女轻盈地从半空中跳落，稳稳地停在你的面前。\n\n“现实系统侵入完成——锵锵！电子幽灵爱弥斯，正式向你报到啦！”\n\n她好奇地打量着四周真实的舰桥与窗外的星海，随后转过身，郑重地将一柄闪耀着奇异光芒的异域长剑交到你的手中。\n\n“它叫‘永远的启明星’。”她认真地说，“这把剑今后将为你所挥。”\n\n一个心跳之后，她便恢复了往日的开朗。\n\n“以前都是隔着冰冷的屏幕听你讲故事，从今天起，我终于可以和你一起并肩作战啦！走吧走吧，我们的宇宙大冒险，现在才刚刚开始呢～”"
 Phrolova_event.915.name:0 "同行的启明星"
 Phrolova_event.916.desc:0 "屏幕上跳动着欢快的音符波形，爱弥斯的身影很快在星光中显现出来。\n\n“叮咚～爱弥斯热线已接通！今天是来找我拆盲盒、聊八卦，还是准备继续我们之前的约定呀？”"
 Phrolova_event.916.name:0 "爱弥斯通讯"
 Phrolova_event.917.desc:0 "“哇，那个星系的陨石带居然会发出像八音盒一样的声音吗？快展开讲讲！”\n\n爱弥斯双手托腮，眼睛亮晶晶地听你讲述最近的探索见闻。她不时追问几个诸如“那里的特产好不好吃”、“有没有遇到长相奇怪的外星小动物”之类的小细节，仿佛那些你习以为常的航行日常，对屏幕另一端的她而言，都是值得小心珍藏的宝物。"
 Phrolova_event.917.name:0 "星光之间"
 Phrolova_event.950.desc:0 "在新建的居住区边缘，不少夜班工人都报告了一种怪事：每当深夜气温骤降，旧水渠的金属管壁就会传出细碎的说话声。那并非现存的任何语言，更像是几十年前的广播剧片段、街头叫卖与急促的电报声混杂在一起，顺着生锈的钢架低沉地回荡。\n\n驻地物理学家带着探测器赶到现场后发现，这些“低语”并不是幻听，而是旧时代残留的高密度回音能量在特定温差下引发的谐振现象。随着声波震颤，管壁表面正缓慢析出一层富含高能矿物的半透明晶霜。我们可以直接派工程队刮下这些价值不菲的沉积物并做消音处理，也可以保留这处天然的声学实验室，让学者们借机测绘残响衰变的物理模型。"
 Phrolova_event.950.name:0 "残响中的低语"
 Phrolova_event.951.desc:0 "一场毫无征兆的地磁微澜过后，殖民地外围的荒原上突然在一夜之间开满了黑红色的彼岸花。这些半能量化的植物并不依赖土壤与阳光，而是在地脉残响的刺激下同步盛放。在夜色中，成片的红色花海散发着幽静而迷人的微光，花瓣边缘偶尔还会逸散出细碎的红色光尘，宛如星河倒悬。\n\n植物学家指出，这批异常盛开的花朵体内富集了大量从地底抽吸上来的矿质与回音能量，若趁其枯萎前集中收割提炼，能为殖民地补充一笔可观的工业原料。但与此同时，许多疲于重建工作的开拓者纷纷在休假时来到荒原边缘驻足拍照——对于在这颗满目疮痍的星球上扎根的新居民而言，这片绚烂而静谧的花海，无疑是一场抚慰人心的奇观。"
 Phrolova_event.951.name:0 "彼岸花海异常绽放"
 Phrolova_event.952.desc:0 "在清理三号矿区的地下掩体时，工程队的爆破作业意外震醒了一座封存已久的旧时代自动哨戒炮台。伴随着沉闷的液压嘶鸣，数具包裹着复合装甲的自律机兵从升降井中缓缓升起，它们胸口的光学探头闪烁着黄色的自检微光，黑洞洞的枪口瞬间锁定了在场的所有施工人员。\n\n万幸的是，这批机兵的底层火控逻辑并未彻底失控。在扫描到工程队并未携带悲鸣频段后，它们主动垂下武器，转入了原地待命的巡逻模式。军工部门检查后认为，这些旧时代的战争机器保养得惊人完好：我们既可以趁它们处于待机状态将其彻底拆解，熔炼里面的高能电池与特种装甲；也可以将殖民地的防卫识别码写入其主控核心，让驻地守军在与这些老练机械的战术对抗演练中磨砺锋芒。"
 Phrolova_event.952.name:0 "自动防御系统残留"
 Phrolova_event.953.desc:0 "市政工程队在翻修旧城区的排水管网时，挖开了一间被重型防爆门死死封住的社区避难所。避难所内早已空无一人，但在干燥的密封箱里，不仅整齐码放着一批尚未开封的应急能源块与工业矿锭，还保存着数百枚完好无损的个人语音终端。\n\n播放的音频里没有宏大的历史叙事，只有旧日居民在灾厄间隙里的琐碎日常：母亲用轻柔的童谣安抚害怕雷声的孩子，年轻的学徒苦中作乐地抱怨食堂那碗难以下咽的浓汤，还有基层维修工详细记录的几十种对抗频率干扰的土办法。由于避难所底层结构正在加速风化，我们的工程力量只能在坍塌前抢救一部分成果——是优先把沉重的物资储备运回地面，还是集中电力维持服务器运转、将这批珍贵的民间生活样本完整导出？"
 Phrolova_event.953.name:0 "失落的遗民日志"
 Phrolova_event.954.desc:0 "昨日傍晚，一阵短促却极其猛烈的淡金色频率风暴毫无征兆地掠过了殖民地上空。避雷塔与磁暴护盾在刺耳的蜂鸣声中超负荷运转，整座城市的照明网络随之明灭不定，空气中弥漫着一股如同雨后臭氧般的奇异清香。所幸应急预案及时生效，这场持续了不到半小时的异常天象并未造成人员伤亡。\n\n风暴散去后，勘探员在城外的荒滩上发现了大量被高能闪电瞬间熔融又凝结的富矿晶体，只需简单分拣就能直接投入精炼厂使用。而能源部门的工程师们则盯着后台记录仪兴奋不已——在刚才的极端过载中，几处旧时代遗留的地下导流槽展现出了惊人的分流效率。如果我们能趁热打铁追踪那些尚未消散的残余电弧，就能顺势优化整个殖民地的电网输出结构。"
 Phrolova_event.954.name:0 "频率风暴"
 Phrolova_event.955.desc:0 "最近几周，负责外围警戒的自动监控探头频繁在浓雾弥漫的废墟边缘捕捉到一个模糊的身影。在闪烁的红外画面里，那似乎是一位身着深色裙装、手持细长器物的孤独旅人。每当巡逻队沿着传感器留下的坐标赶过去时，现场却总是空无一人，只留下几片很快便会消散的红色光斑。\n\n有人猜测这只是大气层中的残响折射出的一段旧时代全息录像，也有人怀疑是某位不愿露面的故地重游者正在暗中审视着新来者的建设。有意思的是，那道身影每次驻足的地方，往往都精准地避开了地质断层，甚至间接帮巡逻队标出了几处掩埋在地下的旧时代物资窖藏。我们是该直接挖走那些物资、并将这则容易引发胡乱猜测的都市传说彻底封存，还是将这段仿佛在默默替开拓者指路的温和影像公开，让居民们相信这片土地本身也在接纳我们的到来？"
 Phrolova_event.955.name:0 "回声中的身影"
 Phrolova_event.960.desc:0 "“这里的杂音终于被彻底洗干净了。”弗洛洛轻轻勾起唇角，任由广场上的演奏声在风中盘旋，“以前我总觉得，所有的演出都只能在毁灭与高潮中收尾，哪怕再精妙的乐章也逃不过散场的宿命。但现在看着这些庸碌却充满生命力的灯光，我突然觉得……偶尔指挥一场没有血腥味、只属于这些平凡居民的庆典，感觉也还不坏。”\n\n她看向你，眼中的锋芒收敛成了罕见的柔和：“这是我们共同交出的终版乐谱。这一次，让它属于仍在这里生活的人。”"
 Phrolova_event.960.name:0 "彼岸祭典：弗洛洛"
 Phrolova_event.961.desc:0 "“长官好呀~要来一口刚出炉的草莓蛋糕吗？”达妮娅笑吟吟地把手里的甜点递向你，眼神里满是狡黠，“今天可是个大日子，我特意把那些烦人的警报监控全都扔给了自动值班系统，绝对不会有人来打扰我们偷懒哦。”\n\n她咬了一口蛋糕，嘴角的笑意变得真实而柔软：“虽然最初对这个世界没有抱什么期待，但我现在必须承认……能在这个不再虚无的明天里，和你一起分享这些甜得发腻的东西，是我做过最聪明的决定呢。”"
 Phrolova_event.961.name:0 "彼岸祭典：达妮娅"
 Phrolova_event.962.desc:0 "“各街区的秩序与物资分配都已在正常区间内，这场新生的典礼，不会有任何差错。”守岸人收起终端，语气平稳而郑重。\n\n“在漫长的地底岁月中，我曾以为自己的使命永远只是记录与守望。是你让我走出了那扇大门，让我明白……比起在死寂中铭记过去，亲自用双手为这颗星球、为你安排一个充满温度的明天，是如此值得期待。这片海岸的灯火，以后也会一直为你亮着。”"
 Phrolova_event.962.name:0 "彼岸祭典：守岸人"
 Phrolova_event.963.desc:0 "“锵锵！爱弥斯特制庆典花束，送给拯救世界的大英雄！”她把花束塞进你怀里，眼睛亮晶晶的，“以前只能变成电子幽灵躲在炉芯里看外面的雪，现在不仅有了可以触碰大家的新身体，还能亲眼看到这么热闹的街头……简直像做梦一样！”\n\n她双手叉腰，神气地扬起下巴：“四种不同的经历，终于在同一片星空下拥有了共同的名字：新索拉里斯。以后不管宇宙里还有多难打的通关路线，只要我们在你身边，我就陪你一路闯到底！”"
 Phrolova_event.963.name:0 "彼岸祭典：爱弥斯"
 Phrolova_menu_desc_0:0 "私人通讯接通。\n\n“帝国的领袖。希望这次不需要再填一份入境声明。”"
 Phrolova_menu_desc_1:0 "“又有新的任命？”\n\n得知只是例行联络，弗洛洛放下了手中的记录。\n\n“那就说点报告以外的事。”"
 Phrolova_menu_desc_2:0 "“报告已经交了。”\n\n她顿了顿。\n\n“我知道，你有时只是想找一个不会继续汇报的人。”"
 Phrolova_menu_desc_3:0 "“今天不想讨论那些大工程。”\n\n弗洛洛把一页草稿放到一旁。\n\n“如果你不介意，我们聊点小事。”"
 Phrolova_menu_desc_4:0 "“通讯不需要每次都附议题了。”\n\n她的语气比初来时随意许多。\n\n“想说什么，就说吧。”"
 Phrolova_menu_desc_5:0 "这次，弗洛洛没有称呼你的头衔。\n\n“今天不问帝国的事。”\n\n她望向画面之外。\n\n“屏幕那边的你，想聊什么？”"
 Phrolova_menu_title:0 "§R【彼岸的幕间】§!"
 Phrolova_physics_label:0 "深红调律塔"
 Phrolova_recruit_tooltip:0 "弗洛洛将作为拥有三个专属特质的传奇科学家加入帝国。"
 Phrolova_research_option:0 "批准彼岸计划，开放科研与巨型结构研究。"
 Phrolova_society_label:0 "残响存续所"
 Phrolova_talk_beyond:0 "近况如何？"
 Phrolova_talk_hecate:0 "你怎么看待我们的合作？"
 Phrolova_talk_listen:0 "还有什么想说的吗？"
 Phrolova_talk_sunset:0 "有什么值得留意的？"
 Phrolova_talk_violin:0 "想听一段演奏。"
 Phrolova_ticket_option:0 "好。这次以我自己的名义。"
 WW01:0 "陈旧的唱片"
 WW01_desc_details:0 "尝试解析其中遗留的频率，只能听出是一小段哼唱，似乎在诉说着什么无法说出口的话语。"
 WW01_desc_short:0 "原本是唱片制品的废弃物，即便已被重新擦拭，仍能看出时间留下的磨损"
 WW02:0 "「剧本」"
 WW02_desc_details:0 "每个人都是剧本中的角色，每个人都按照剧本演绎自己的故事。除非……"
 WW02_desc_short:0 "编织了某个故事的剧本，书页中的内容会随着情节的变化而逐渐被填充"
 WW03:0 "星炬奖科学勋章"
 WW03_desc_details:0 ""
 WW03_desc_short:0 "由星炬学院设立的一门科学奖项——星炬奖，表彰那些对人类科学领域作出卓越贡献的研究者"
 WW04:0 "“故土晨光”"
 WW04_desc_details:0 "曾经是勇士完成所有挑战的证明，献给战士们等待已久的英雄王。“我那令人怀念的故乡，如今是否已有鲜花开放？”"
 WW04_desc_short:0 "材质不明的工艺玩具，能感受到纤弱但温暖的频率"
 WW05:0 "映照万音的星彩"
 WW05_desc_details:0 "冻结的星光，遥远的回响，于此刻凝为冠冕，赠予愿意一直注视着它们的你。"
 WW05_desc_short:0 "留有万数星彩的冠冕"
 WW06:0 "筑昼辉砾"
 WW06_desc_details:0 "它源于岁主的馈赠，而后，成为陪伴在黎那汐塔人漫长求索之路上的一点明光。在神明所注视的大地之上，人们终会用属于自己的光，映照出那个不因应许而被选择的黎明。"
 WW06_desc_short:0 "「声骸之国」黎那汐塔的共鸣者所使用的终端，形如提灯"
 WW07:0 "灼霜"
 WW07_desc_details:0 ""
 WW07_desc_short:0 "一把刀，到底要多锋利，才能划破不见尽头的长夜？她向前求索，那些无处寄托的愿望，都被揉碎于她的血液中流淌燃烧"
 WW08:0 "炽烈权霆"
 WW08_desc_details:0 ""
 WW08_desc_short:0 "雷霆会灼净她的沉疴与软弱，在那由血与砂铸成的熔炉中，她将不再是尘埃，而是辉煌夺目的太阳"
 WW09:0 "昭日译注"
 WW09_desc_details:0 "有一些事必须去做，有些事只有你能做到。你迈出一步，向着那近日的端点。"
 WW09_desc_short:0 "所有的阳光照耀着你，于是答案呼之欲出"
 WW10:0 "星图核心"
 WW10_desc_details:0 "倘若星星也会惨叫，这便是寰宇之内最为哀恸的声音。"
 WW10_desc_short:0 "压缩存储悲鸣关键因素的星图核心"
 WW11:0 "辛吉勒姆的核心"
 WW11_desc_details:0 "一切一切，都与她的叹息一同，糅合进这缕金色的频率。抬首凝望天穹，徘徊于那褪色的回忆。空虚的迷途者，仍寻觅着归家的航路。"
 WW11_desc_short:0 "愤怒与泪水，苦难与欢乐，悲哀与苦痛"
 WW12:0 "赝作的矮星"
 WW12_desc_details:0 "可即便如此，那曾点亮宇宙的光辉却并未消逝。她静静地等待着，将那借来的光明还给主序星的时刻。"
 WW12_desc_short:0 "如泡沫消解般，褪去梦幻，只留下沉寂的矮星"
 WW13:0 "拉海洛之心的复制品"
 WW13_desc_details:0 "通过你的授权，拉海洛之心将星球的算量汇于一身，于数据与辉光的洪流中，窥见一切真实。"
 WW13_desc_short:0 "弗洛洛与你从旧日的余烬中获取的炉芯的复制品，可以通过它与真正的拉海洛之心取得连接"
 WW14:0 "虚无之神的碎片"
 WW14_desc_details:0 "我想告诉你的是，毁灭不是我的目的，它甚至与任何人的意志都无关——它只是既定的终局。接纳祂吧。你终将明白，抗争毫无意义。”"
 WW14_desc_short:0 "“我无意与你为敌，也无意摧毁任何事物"
 WW15:0 "星序协响"
 WW15_desc_details:0 "无限以奇点为源，将牵引的星团抛散，但寂灭流转，末陨尽头处又总传来不息的回声——那是新星诞生时的问候。"
 WW15_desc_short:0 "载有能量的核心，拟造着群星演化的循环"
 WW16:0 "宙算仪轨"
 WW16_desc_details:0 "正如理想远在光年之外，抵达的方法却在双手咫尺之间。"
 WW16_desc_short:0 "一切规律皆可被观测，一切现象皆可被析解"
 WW17:0 "时和岁稔"
 WW17_desc_details:0 "剑中似有万象，而万象归于其一。温润的剑气仿佛能化解这世上一切坚不可摧之物，不论是凝结千年的寒冰，还是停滞不前的时光。"
 WW17_desc_short:0 "剑刃挥斩之间，得以窥见日月流转、物换星移"
 WW18:0 "不屈命定之冠"
 WW18_desc_details:0 "那冠冕不会成为骑士的束缚，那浪海也无法停下骑士的脚步。"
 WW18_desc_short:0 "浪海欲让骑士戴上命定的冠冕，而骑士只将冠冕收入剑中"
 add_Phrolova_events:0 "为她保留席位。"
 artifact_pf_heart_secret:0 "深入拉海洛之心的秘密"
 artifact_pf_heart_secret_desc:0 "修复完成的“拉海洛之心”内部仍潜藏着一缕未被解读的独立频率。弗洛洛将在索拉里斯进行深度剖析项目。"
 back_Phrolova_events:0 "回到未完的谈话。"
 building_Phrolova_Nocturne:0 "乌洛波洛大剧院"
 building_Phrolova_Nocturne_desc:0 "坐落于红花海中心的恢弘殿堂，精密的声学共鸣腔与华丽的舞台在此融为一体。旧日的咏叹已然落幕，如今每一次帷幕升起，奏响的皆是探索未来的新篇。"
 col_Phrolova_garden:0 "彼岸庭园"
 col_Phrolova_garden_desc:0 "将静谧的红色花圃与尖端研究设施交织排布的行星规划蓝图。在抚平创伤的土地上，求索的理性与栖居的诗意达成了微妙的平衡。"
 d_pf_array_garrison:0 "复用的防御阵列·驻军"
 d_pf_array_garrison_desc:0 "旧时代的防空基座被改造成常备驻军营地，锈蚀的炮位重新响起整齐的步伐。"
 d_pf_pollution_cleared:0 "复原的地表"
 d_pf_pollution_cleared_desc:0 "盘踞在盆地中的扭曲残像已被连根拔除。那些曾令人毛骨悚然的致命禁区终于重见天日，化作了可供城市自由向外舒展的广阔疆域。"
 d_pf_ruin_01_restored:0 "修复的观测穹顶"
 d_pf_ruin_01_restored_desc:0 "重新校准的穹顶恢复了天文观测职能。"
 d_pf_ruin_02_restored:0 "重开的运输枢纽"
 d_pf_ruin_02_restored_desc:0 "淤塞的航道被重新疏通，为城市腾出新的居住空间。"
 d_pf_ruin_03_restored:0 "校准的共鸣阵列"
 d_pf_ruin_03_restored_desc:0 "失谐的阵列重新对齐，旧日设施恢复了协调运转。"
 d_pf_ruin_04_restored:0 "结晶旧城遗址"
 d_pf_ruin_04_restored_desc:0 "晶化的街区被改造成可居住的遗址社区。"
 d_pf_ruin_05_restored:0 "打捞的资料库"
 d_pf_ruin_05_restored_desc:0 "沉没的档案被逐页打捞，旧日知识重新回到学者手中。"
 d_pf_ruin_06_restored:0 "重启的深空港"
 d_pf_ruin_06_restored_desc:0 "废弃泊位重新开放，商贸与物流再次在此汇聚。"
 d_pf_ruin_07_restored:0 "黑潮观测站"
 d_pf_ruin_07_restored_desc:0 "黑潮边缘架起了监测站，持续记录着深渊的潮汐。"
 d_pf_ruin_08_restored:0 "修复的能源管线"
 d_pf_ruin_08_restored_desc:0 "断裂的管线重新接通，稳定的能量流再次穿行于地下网络。"
 d_pf_ruin_09_restored:0 "重开的生态庭院"
 d_pf_ruin_09_restored_desc:0 "封闭的庭院重见天日，绿意重新回到聚居地。"
 d_pf_ruin_10_restored:0 "疏通的地下通道"
 d_pf_ruin_10_restored_desc:0 "塌陷的通道被重新支撑，为城市腾出新的居住空间。"
 d_pf_ruin_11_restored:0 "校准的引力锚"
 d_pf_ruin_11_restored_desc:0 "紊乱的引力场恢复稳定，矿脉再次变得可及。"
 d_pf_sealed_archive:0 "坍塌的研究塔"
 d_pf_sealed_archive_desc:0 "这座曾经高耸入云的尖端实验塔已在灾变中拦腰折断，扭曲的合金钢梁与漏电的仪器死死封堵了整片街区。若能将废墟清理重整，塔底保存完好的屏蔽实验室便能重新焕发生机。"
 d_pf_shattered_streets:0 "残像污染区"
 d_pf_shattered_streets_desc:0 "高浓度的扭曲频率在这片盆地中经年不散，空气中时常凝结出充满攻击性的怪异残像。唯有彻底抚平星球底层的悲鸣，工程队才能安全地进入此地开展净化作业。"
 d_pf_solaris_ruin_01:0 "倾覆的观测穹顶"
 d_pf_solaris_ruin_01_desc:0 "巨大的球形天文穹顶斜插在泥沼之中，破碎的透镜片与刺耳的金属刮擦声日夜不停地折磨着附近居民的神经。将其彻底拆解移除后，这片压抑的阴影才能真正散去。"
 d_pf_solaris_ruin_02:0 "潮蚀的运输枢纽"
 d_pf_solaris_ruin_02_desc:0 "倒灌的海水与高腐蚀性的潮汐早已将这座多层立体车站锈蚀成了一座危楼。交错坍塌的高架轨道宛如巨大的钢铁遗骸，静静盘踞在城市边缘等待着最终的清理。"
 d_pf_solaris_ruin_03:0 "失灵的共鸣阵列"
 d_pf_solaris_ruin_03_desc:0 "数座失去控制的旧时代信标仍在盲目地向四周喷吐着杂乱的电磁与声波脉冲。切断其地下供能回路并拆除天线，是恢复周边工厂与实验室宁静的唯一途径。"
 d_pf_solaris_ruin_04:0 "结晶化的旧城区"
 d_pf_solaris_ruin_04_desc:0 "整片古老的居民区都被一层惨白而锋利的回音结晶彻底包裹。阳光折射在怪异的晶体枝杈上，散发出令人眩晕的寒光与低频噪音，无声地抗拒着生者的靠近。"
 d_pf_solaris_ruin_05:0 "沉没的资料库"
 d_pf_solaris_ruin_05_desc:0 "地下水脉的改道让这座庞大的地下档案馆变成了一片幽深的暗湖。腐败的冷却液与不断塌方的地基交织在一起，将这里变成了一处危机四伏的深渊。"
 d_pf_solaris_ruin_06:0 "废弃的深空港"
 d_pf_solaris_ruin_06_desc:0 "无数艘半毁的旧时代舰船残骸堆满了开阔的起降坪。泄露的陈旧燃料与四散的金属碎片如同凝固的浪潮，死死扼住了这片曾经吞吐星海的物流枢纽。"
 d_pf_solaris_ruin_07:0 "黑潮侵蚀带"
 d_pf_solaris_ruin_07_desc:0 "黏稠如沥青般的暗色沉积物覆盖了这片荒滩。每当海风吹过，就会散发出一股令人情绪低落、胸口发闷的古怪腥气，仿佛大地本身正在腐烂。"
 d_pf_solaris_ruin_08:0 "破碎的能源管线"
 d_pf_solaris_ruin_08_desc:0 "蜿蜒数公里的地下高压能源管道在多次地壳变动中寸寸断裂。深埋在地底的残余能量如同随时可能苏醒的火山，将大片土地化作了生人勿近的禁区。"
 d_pf_solaris_ruin_09:0 "封闭的生态庭院"
 d_pf_solaris_ruin_09_desc:0 "失控的自动防疫系统将这座大型人工生态园彻底焊死。内部疯长的变异藤蔓不仅撑裂了强化玻璃，其散发的催眠孢子更让这片绿意变成了一座危险的迷宫。"
 d_pf_solaris_ruin_10:0 "塌陷的地下通道"
 d_pf_solaris_ruin_10_desc:0 "纵横交错的旧时代防空洞与地铁隧道已经大面积垮塌。阴冷潮湿的穿堂风裹挟着地底的霉味不断从裂缝中涌出，宛如这座死城尚未咽下的叹息。"
 d_pf_solaris_ruin_11:0 "紊乱的引力锚"
 d_pf_solaris_ruin_11_desc:0 "一台半埋在地下的旧时代重力调节装置仍在间歇性失控。方圆数公里内的引力场忽轻忽重，将这片区域变成了一座违背物理常识的怪异浮岛。"
 d_pf_submerged_vault:0 "废弃防御阵列"
 d_pf_submerged_vault_desc:0 "遍布防区的防空掩体与地基装甲板早已年久失修。一旦将其重新加固并唤醒沉睡的火控链路，这片庞大的基座必将重新化作守卫天空的坚盾。"
 d_pf_tower_restored:0 "研究塔遗址复用"
 d_pf_tower_restored_desc:0 "坍塌的废墟已被彻底清空。塔底那座曾见证过无数尖端实验的重型抗干扰设施重新亮起了灯光，迎来了新一批渴求真理的探索者。"
 decision_pf17_frequency:0 "稳定异常频率"
 decision_pf17_frequency_desc:0 "响应弗洛洛的方案，调动索拉里斯的共鸣网络锁定那缕游离的信号。"
 decision_pf_beyond_festival:0 "举办彼岸祭典"
 decision_pf_beyond_festival_desc:0 "点亮翻修一新的街巷，在盛放的花海与乐声中筹办一场属于全城居民的庆典。漫长的漂泊与守望皆在今夜汇拢，等待着你与最重要的人们一同赴约。"
 decision_pf_calibrate_echoes:0 "校准回响"
 decision_pf_calibrate_echoes_desc:0 "调集物理学者与市政力量，通过遍布行星的调律信标对地表杂乱的回音频率进行一次系统性抚平。这项宏大的工程将驱散笼罩在城市上空的阴霾，为开拓者们重建一个宁静的家园。"
 decision_pf_open_gate:0 "打开尘封的大门"
 decision_pf_open_gate_desc:0 "随着索拉里斯地表的废墟与隐患被全数扫清，一处深埋在海岸基岩下的巨型封闭闸门终于显露出来。叩开这扇紧闭已久的大门，门后的故人已等待了漫长的岁月。"
 decision_pf_restore_archives:0 "整理旧日档案"
 decision_pf_restore_archives_desc:0 "花费凝聚力，用180天整理索拉里斯遗存，提高星球凝聚力岗位产出。"
 decision_pf_resume_heart_secret:0 "重启异常频率通讯"
 decision_pf_resume_heart_secret_desc:0 "重新打开此前暂缓的异常频率调查事项，或继续推进尚未完成的接触项目。"
 district_pf_research:0 "彼岸研究区"
 district_pf_research_desc:0 "索拉里斯专用研究区划，占用下方研究面板。提供住房、研究岗位，以及六个设施槽：失亡彼岸与赫卡忒回廊各一处，四个可自由选择学科的专精槽。三种学科能够同时存在，同类最多三座。索拉里斯保留城市区划，原采矿、发电和农业区划由本研究区取代。"
 district_pf_research_plural:0 "彼岸研究区"
 district_pf_unique_1:0 "失亡彼岸"
 district_pf_unique_1_desc:0 "在静默花海与悬空基岩之间构筑的复合工程院区。曾用于承载执念的彼岸空间，如今已被改造成支撑行星运转与大型基建的核心枢纽。"
 district_pf_unique_1_plural:0 "失亡彼岸"
 district_pf_unique_2:0 "赫卡忒回廊"
 district_pf_unique_2_desc:0 "纵横交错的多向立体回廊，内部铺设着精密的重型机械导轨与能量管网。它如同星球地表的精密齿轮，将分散的工程节点紧密咬合在一起。"
 district_pf_unique_2_plural:0 "赫卡忒回廊"
 district_pf_unique_3:0 "深红调律塔"
 district_pf_unique_3_desc:0 "直刺云霄的深红色高塔群，塔身镶嵌着巨大的音律谐振环。它日夜不休地捕捉并驯服着大气中的狂乱波段，将其转化为纯粹的物理实验场。"
 district_pf_unique_3_plural:0 "深红调律塔"
 district_pf_unique_4:0 "残响存续所"
 district_pf_unique_4_desc:0 "由多重静默力场层层包裹的半地下物理收容设施。那些极易消散或失控的高危频率样本被封存于此，供学者们安全地窥探宇宙的底层规律。"
 district_pf_unique_4_plural:0 "残响存续所"
 district_pf_unique_5:0 "冥扉构装局"
 district_pf_unique_5_desc:0 "研究意识共鸣与社会组织形态的特化院落。学者们在此剖析旧时代的群体记忆与构装心智，为新生的殖民社会重塑稳固的秩序准则。"
 district_pf_unique_5_plural:0 "冥扉构装局"
 district_pf_unique_6:0 "阿斯忒里亚之门"
 district_pf_unique_6_desc:0 "环绕着巨型星象拱门建立的社会学与跨星域交流中心。它象征着索拉里斯告别被天空海封闭的过去，向着更辽阔的星海文明敞开怀抱。 拱门的能量枢纽为整座行星持续供电，驻防设施则守护着通往星海的门户。"
 district_pf_unique_6_plural:0 "阿斯忒里亚之门"
 edict_Phrolova_contact:0 "挽歌永不落幕"
 edict_Phrolova_contact_desc:0 "接通弗洛洛的私人通讯。无资源费用；同一天内只能打开一次。"
 edict_Phrolova_edict:0 "§R叩响彼岸§!"
 edict_Phrolova_edict_desc:0 "接通弗洛洛的私人通讯，聊几句议程之外的事。"
 edict_pf_aemeath_contact:0 "赠予雪中的你"
 edict_pf_aemeath_contact_desc:0 "接入爱弥斯的通讯频道。"
 edict_pf_denia_contact:0 "予明日以谎言"
 edict_pf_denia_contact_desc:0 "与达妮娅建立私人通讯。"
 edict_pf_shorekeeper_contact:0 "直至海水褪色"
 edict_pf_shorekeeper_contact_desc:0 "与守岸人建立私人通讯。"
 effect_every_bypass_in_system:0 "登记通道端点。"
 empower_permissions_Phrolova_events:0 "确认授权。"
 leader_trait_Phrolova_X:0 "重世的交响乐"
 leader_trait_Phrolova_X_desc:0 "炮火、引擎的轰鸣与濒死的呼号，在她的超频状态下都会被降维成可以揉捏的频率。当她抬起手，一切顽抗的物质结构都将陷入剧烈而无序的失真，最终化为宇宙中的残响。"
 leader_trait_Phrolova_Y:0 "幽冥的忘忧章"
 leader_trait_Phrolova_Y_desc:0 "我不在那里，也没有死去。\n\n我将追随死亡，用享受掩盖恐惧，以未来换回过去。"
 leader_trait_Phrolova_Z:0 "彼岸的安魂曲"
 leader_trait_Phrolova_Z_desc:0 "她深知生与死的界限有时只是一场骗局。即便神明未曾垂怜，她依然执拗地倾听着那些逝去之人的频率，誓要将这失谐的命运，重新调和成永不消散的真实。"
 leader_trait_pf_aemeath:0 "长航的星辉"
 leader_trait_pf_aemeath_2:0 "春风祝颂你的旅途"
 leader_trait_pf_aemeath_2_desc:0 "希望现在的我，已经成长到能和你并肩而行了。"
 leader_trait_pf_aemeath_3:0 "于无垠电子海间轻舞"
 leader_trait_pf_aemeath_3_desc:0 "我想和你一样，成为救世主。"
 leader_trait_pf_aemeath_desc:0 "只要她能自由而快乐地活着就好。"
 leader_trait_pf_denia:0 "薄明梦中的寂静光辉"
 leader_trait_pf_denia_2:0 "若能以谎言缝补心脏"
 leader_trait_pf_denia_2_desc:0 "笑是一种很方便的工具，它能以廉价的方式拉进你和别人的距离。"
 leader_trait_pf_denia_3:0 "从远方，回到远方"
 leader_trait_pf_denia_3_desc:0 "砰。像一场玩笑——无限坠落的黑暗，忽地有了尽头。昏冥中，有人轻轻叹了口气，似是等了许久。"
 leader_trait_pf_denia_desc:0 "她的频率破裂成千丝万缕的线，身躯溶解为污浊汇入海洋——随后，她升腾为穿越世界的大雾与风，拂过没有色彩的荒原，直到抵达那片再熟悉不过的、腐烂的星空。而死寂的世界一如既往地凝视着她，一言不发。"
 leader_trait_pf_shorekeeper:0 "来自叙响织构"
 leader_trait_pf_shorekeeper_2:0 "缄默的回声"
 leader_trait_pf_shorekeeper_2_desc:0 "黑海岸地下，群星在永无止息的夜空高悬，时间流转，却没有四季的分别。"
 leader_trait_pf_shorekeeper_3:0 "夜幕的赠予与拒绝"
 leader_trait_pf_shorekeeper_3_desc:0 "你就像黑夜，拥有寂静与群星。"
 leader_trait_pf_shorekeeper_desc:0 "别为我叹息，我不在那里，也没有离去。"
