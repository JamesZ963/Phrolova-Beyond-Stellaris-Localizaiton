 PF17_denia_topic0:0 "近来过得如何？"
 PF17_denia_topic0_reply:0 "“托你的福，每天都能睡个好觉哦。毕竟每次入睡，都安安静静的，什么都不用想，真的很幸福呢。”\n\n她捧着一杯热气腾腾的饮料，笑吟吟地看着你。\n\n“哈哈，别露出那种表情啦，我是在夸你们的宿舍床垫很舒服哦！倒是你，黑眼圈有点重呢，要不要我借你几本晦涩难懂的参考书？用来催眠效果一流哦。”"
 PF17_denia_topic1:0 "有什么值得留意的？"
 PF17_denia_topic1_reply:0 "“小心点哦。我能感觉到，虚质空间深处的那些东西……一直没有真正地离开。”\n\n她收起了脸上懒散的笑意，轻轻按住了自己胸口的声痕。\n\n“虽然在祂们的尺度上，我们的生命和希望都微不足道，但那些早在万亿年前就死去的群星的恶意，偶尔还是会顺着裂缝漏出来。不过别担心，在那之前，我会先用泡泡把大家都藏起来的。”"
 PF17_denia_topic2:0 "你如何看待我们的同行？"
 PF17_denia_topic2_reply:0 "“说实话，我一直觉得你是个不可理喻的人呢。”\n\n她单手托腮，眼神里带着一丝复杂的探究与感慨。\n\n“明明知道靠近我会带来危险，明明知道那些理想可能注定要支付惨痛的代价，却还是向我伸出了手……该说你是天真好呢，还是个彻头彻尾的大蠢货呢？不过，和这样一个蠢货并肩作战的感觉，倒是一点也不赖啦。”"
 PF17_denia_topic3:0 "还有未说完的往事吗？"
 PF17_denia_topic3_reply:0 "“你听说过‘达斯维达尼亚’吗？在我出生的地方，那是人们在道别时常说的话，意思是‘直到下次再见’。”\n\n她的目光有些飘忽，像是在透过屏幕看着某个极其遥远的幻影。\n\n“我把‘达妮娅’当成自己的名字，假装那是家人留给我的唯一礼物。可有时候我也会想，那个在记忆里和母亲挥手告别的女孩，真的是我吗？还是说，那只是以前那些人为了让我乖乖听话，植入给一个空洞容器的伪证呢……”"
 PF17_denia_topic4:0 "以后有什么打算？"
 PF17_denia_topic4_reply:0 "“以后的打算呀……我想吃好多好多的生日蛋糕！”\n\n她的眼睛亮晶晶的，掰着手指认真地数着。\n\n“要那种夹着新鲜水果，涂满了厚厚的奶油，上面还插着蜡烛的！”\n\n她想了想，又补上一句：\n\n“不只是这一次。明年、后年……以后每一年，我都想好好过一次生日。”\n\n“到时候也给你留一块。我们就这样约好了哦。”"
 PF17_entity_demand:0 "虫洞的视界在一瞬间被染成了死寂的灰白。没有舰船引擎的轰鸣，也没有战术通讯的试探，一团庞大到足以遮蔽恒星光芒的扭曲阴影，就这么蛮横地从裂隙中挤入了索拉里斯的星空。\n\n在它降临的刹那，星系内所有的通讯频道、雷达屏幕乃至生灵的脑海中，都被强行灌入了同一个冰冷、空洞、仿佛由无数绝望哀嚎重叠而成的声音：\n\n“存在即是徒劳，挣扎亦无意义。将你们的意志与希望尽数交出……臣服于虚无，便不必再承受失去的痛苦。”"
 PF17_entity_refuse1:0 "§R我们绝不臣服。全舰队开火！§!"
 PF17_entity_refuse2:0 "§R这里没有属于你的猎物，滚回虚无去吧！§!"
 PF17_heart_1601_q:0 "目前的它处于什么状态？"
 PF17_heart_1601_q_reply:0 "“外层的隔绝涂层已经剥落了大半，当年那场强行过载留下的撕裂伤，几乎贯穿了整个炉芯外壳。”弗洛洛指了指全息图上闪烁着红光的边缘区域，“好消息是，最核心的约束阵列还算完整，里面的热熔反应堆也没有彻底死透。不过在把它的骨头重新接好之前，任何贸然的激发都是自寻死路。”"
 PF17_heart_1602_q:0 "这次外壳修复改变了什么？"
 PF17_heart_1602_q_reply:0 "“最直观的改变，就是你的科研人员不用再穿着三层防辐射服进出实验室了。”弗洛洛轻哂了一声，指尖划过平稳的物理监测曲线，“重塑外壳彻底锁死了能量的无序逸散，也为我们搭建了一个绝对安静的密闭音室。只有先把外面的风雪挡住，下一步我们才能安全地伸手进去，拨动里面那些被打乱的琴弦。”"
 PF17_heart_1603_q:0 "这次线路梳理改变了什么？"
 PF17_heart_1603_q_reply:0 "“我把那些属于‘虚无’的死结全都挑开了。”弗洛洛将一段刚刚还原出来的波形放大到你面前，“以前这些回路里塞满了绝望的噪音，现在，原本属于拉海洛的星辉频率终于恢复正常了。不过有意思的是，在清理最底层的黑匣子时，我顺手截获了一缕很古怪的加密波纹……它看起来可不像单纯的机械自检信号。等彻底修好核心之后，我们或许能弄明白那到底是什么。”"
 PF17_heart_1604_q:0 "这次最终校准改变了什么？"
 PF17_heart_1604_q_reply:0 "“它不再是一件死物，而是真正恢复了作为‘封印中枢’与‘恒星熔炉’的全部机能。”弗洛洛用指挥棒点在炉芯中央那团跃动的光焰上，语气里多了几分锋利的警告，“只要你愿意，它随时可以为你提供源源不断的算力与热能，甚至唤醒里面沉睡的幽灵。但与此同时……一盏在黑夜里重新点亮的明灯，也势必会吸引来那些潜伏在黑暗里的掠食者。”"
 PF17_heart_choice_q0:0 "能介绍一下你自己吗？"
 PF17_heart_choice_q0_reply:0 "“弗洛洛。你大可以把我当成一个在时间里迷路的幽灵，或者一个脾气不太好的指挥家。”她眼帘微垂，“至于那些沉甸甸的往事，等我们的飞船飞得再远些，再慢慢讲吧。”"
 PF17_heart_choice_q1:0 "你会怎样帮助我们？"
 PF17_heart_choice_q1_reply:0 "“我能听见你们战舰引擎里的‘杂音’，也能听见敌人装甲崩溃前的那声尖啸。”她轻轻打了个响指，“我会替你调律。让敌人的阵线陷入失谐的狂乱，而你，只需要下达命令。”"
 PF17_heart_choice_q2:0 "关于同行，你还有什么想说的？"
 PF17_heart_choice_q2_reply:0 "“别急着许诺什么‘永远’。我等过太久，也见过太多被时间消磨殆尽的誓言。”她望向舷窗外，“现在，我只看你做出的每个选择。我们不赶时间。”"
 PF17_listen:0 "谢谢你愿意告诉我们。"
