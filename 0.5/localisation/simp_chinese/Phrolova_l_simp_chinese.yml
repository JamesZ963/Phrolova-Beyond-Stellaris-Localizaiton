 PF17_shorekeeper_topic0:0 "近来过得如何？"
 PF17_shorekeeper_topic0_reply:0 "“在料理台的旁边，我放了一个小小的沙漏。用新鲜的海产、时蔬和醇厚的牛乳一起慢炖，等沙漏流尽三次，刚好能煮出一锅热气腾腾的浓汤。”\n\n她捧着一只白色的瓷碗，微微笑了笑，眼神里带着一丝笨拙却认真的探究。\n\n“虽然能量体并不需要依靠食物维系生命，但看着热气腾起、香气弥漫在房间里，胸口也会觉得暖洋洋的。不过，我还没完全掌握火候的规律……下次，你能来帮我尝一尝味道吗？”"
 PF17_shorekeeper_topic1:0 "有什么值得留意的？"
 PF17_shorekeeper_topic1_reply:0 "“最近在审阅各星域的民生报告时，我发现了一件有些矛盾的事。”\n\n她调出几份全息图表，神情专注而略带困惑。\n\n“在几个刚刚经历过动荡的殖民地，物资配给明明还处于紧缺状态，当地居民申请举办庆典与音乐会的次数却反而增加了。按照纯粹的效率推演，这无疑是资源的浪费；可从后续的产出数据来看，正是这些看似无用的喧闹，让他们更快地从创伤中恢复了过来……生命的韧性，果然是任何公式都无法定义的。”"
 PF17_shorekeeper_topic2:0 "你如何看待我们的同行？"
 PF17_shorekeeper_topic2_reply:0 "“我本不需要睡眠。过去在漫长的等待里，我总是睁着眼睛，看着地底那片不会流转的星空，日复一日地核对时间留下的痕迹。”\n\n她的声音很轻，像是一阵拂过海面的夜风。\n\n“但与你同行之后，我开始理解为什么人类会期待黎明。因为知道明天会有新的风景，知道转过身就能看到你的身影，流逝的时间就不再是一种磨损，而变成了一份值得被妥善收藏的礼物。”"
 PF17_shorekeeper_topic3:0 "还有未说完的往事吗？"
 PF17_shorekeeper_topic3_reply:0 "“曾经，我以为只要通过复现的数据，就能读懂人类的一切。直到很久以前，我走出地底，亲眼看见金黄的麦浪在风中起伏，闻到稻谷成熟的香气。”\n\n她的目光微微垂下，像是在触碰一段珍贵的旧日影像。\n\n“那天，一位皮肤粗粝的老妇人递给我一块温热的吃食，她怀里的婴儿抓着我的手指，掌心汗津津的。紧接着灾厄降临，那些淳朴的人们在恐惧中挣扎，却又在绝望中彼此扶持……那是我第一次明白，生命不是记录里冰冷的概念。也是从那时起，我第一次产生了‘想要真正读懂你们’的愿望。”"
 PF17_shorekeeper_topic4:0 "以后有什么打算？"
 PF17_shorekeeper_topic4_reply:0 "“我一直在维护一张由回音介质制成的唱片。里面收录了风雨雷雪、鲸歌鸟鸣，还有几十种文明留下的语言与音乐。”\n\n她指了指身旁的仪器，唇角弯起一抹清浅而柔和的弧度。\n\n“它的存储空间近乎无限。在接下来的日子里，除了继续为你打理政务，我还想把我们走过的每一颗星球的声音，都收录进去。等攒够了足够的旋律，我想亲自为你谱写一首曲子……由你来当我的第一个听众，好吗？”"
 PF17_shorekeeper_topic4_reply_alt:0 "好，我愿意做你的第一个听众。"
 PF17_skin:0 "更换装束。"
 PF17_void_choice_q0:0 "这头怪物真的已经彻底结束了吗？"
 PF17_void_choice_q0_reply:0 "“它伸向现实维度的触手确实已经被你的舰队斩断了，短时间内不可能再掀起同样的风浪。”弗洛洛指了指收容箱里的结晶，“但只要这枚浓缩了‘虚无’概念的孑遗还以完整的形态存在，它就会像一颗随时可能发芽的种子，不断引诱持有者走向极端。我们只是赢下了一场防卫战，还没有为这段漫长的孽缘画上真正的句号。”"
 PF17_void_choice_q1:0 "你为什么愿意主动接过这块烫手山芋？"
 PF17_void_choice_q1_reply:0 "“因为我不喜欢看到一首曲子在最关键的地方留下一道刺耳的杂音。”弗洛洛坦然地迎上你的目光，嘴角勾起一抹自嘲而锋利的弧度，“况且，既然我已经听见了帷幕后面还有人在敲门，总不能装作耳聋吧？我愿意耗费精力去剥离这团毒药、试着确认那道回声的死活，但我没法拿一个确定的结果向你打包票。在把东西交给我之前，你得先想清楚放弃这份力量的代价。”"
 PF17_void_choice_q2:0 "在做决定时，我还来得及改变主意吗？"
 PF17_void_choice_q2_reply:0 "“只要你还没有下达最终的移交指令，随时可以反悔。”弗洛洛把话挑得很明，“一旦你确认把它交给我进行逆向剥离，这枚孑遗作为武器的结构就会被永久摧毁，说不定你也将彻底告别走上§R化身天灾§!的道路；反之，若你决定自己留着，那所有的风险也得由你自己担着。想清楚再开口吧。”"
