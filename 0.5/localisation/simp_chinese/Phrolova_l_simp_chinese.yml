 PF_denia_bio:0 "曾被作为承载“虚无”的容器而抚养长大，却在模仿人类的过程中意外拥有了一颗脆弱而真实的心。如今，这位总是带着温柔假笑、喜欢摸鱼打瞌睡的少女跨越了深黯的终末，选择以“达妮娅”自己的意志，与你一同面对这片浩瀚的星空。"
 PF_denia_bond_1_desc:0 "通讯接通时，达妮娅正低头摆弄着一罐色泽鲜艳、但明显熬制过头的果酱。看到你，她弯起眉眼笑了笑。\n\n“你看，这是我刚做的‘夺目甜蜜’哦。虽然糖放得太多，火候也大了点，但只要装进漂亮的罐子里，看起来是不是也很像那么回事？”\n\n她轻轻摩挲着玻璃罐的表面，声音渐渐低了下去。\n\n“其实我一直觉得，笑也是一种很方便的工具。只要把笑容抹得深一点，摆出温柔无害的样子，就能以最廉价的方式拉近和别人的距离。既然大家只会相信自己想要相信的假象，那内里是不是早就焦黑一片，根本无所谓吧？”\n\n她抬起头，直直地看着你，笑容依旧完美，眼底却是一片荒凉的寂静。"
 PF_denia_bond_2_desc:0 "画面里的光线有些昏暗。达妮娅没有像往常那样打招呼，她蜷缩在椅子里，双手抱膝，下巴抵在膝盖上，神情有些倦怠。\n\n“抱歉哦，今天实在笑不出来了。阿列夫一……那家伙的残响，今天一直在我脑子里嘀咕些听不懂的话，吵得我头好痛。”\n\n她苦笑了一下，眼神有些空洞地望着虚空。\n\n“以前泡在虚质舱里的时候，他们都说我是最完美的容器，因为我一无所有，觉得一切都毫无意义。我曾以为虚无是不可战胜的，以为自己最后不是变成扭曲的怪物，就是像一滴水落进大海里，无人在意地消失……”\n\n“可是，为什么呢？”她突然看向你，声音里带着一丝近乎委屈的颤抖，“为什么你要握住我的手，把那些温暖得令人讨厌的情绪分享给我？现在好了，这个空荡荡的容器里，好像长出了一颗脆弱又怕痛的心……万一以后我再也无法面对那片黑暗了……你可要负起责任哦。”"
 PF_denia_bond_3_desc:0 "这一次，桌子上摆着那个布满手工缝补痕迹的破旧玩偶。达妮娅安静地坐在屏幕前，没有再用那种刻意装出来的甜腻腔调，神情平和而舒展。\n\n“无意义的存在，无意义的生命，思考着毫无意义的世界……以前我总觉得，孩子们出生时之所以会哭，是因为他们早就知道一切终将回到黑暗之中。”\n\n她伸出手，指尖轻轻贴在屏幕中央，随后将食指和中指张开，对着你的方向，做了一个俏皮的“瞄准”手势。\n\n“但是现在，我发现自己和那个不可一世的神明，有一个最根本的区别哦。”\n\n她收回手，按在自己的左胸口，脸上绽放出一个真正毫无阴霾、属于她自己的灿烂笑容。\n\n“我已经能够听见自己心脏的搏动，听见和你在一起时的笑声了。虽然这颗心依然渺小、脆弱，在宇宙的尺度上转瞬即逝……但它让我开始像其他人一样，期待起明天了。”"
