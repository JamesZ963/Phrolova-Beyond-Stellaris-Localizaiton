 PF22_festival_intro_desc:0 "[Root.GetRulerTitle]走在索拉里斯的街道上。\n\n曾经被虚质与残响封锁的破败路口，如今已向所有行人敞开；暖黄色的路灯沿着翻修一新的屋檐一路亮起。微风穿过刚刚复苏的中心花园，带来了街角轻快的手风琴声，也带来了新移民们闲适的交谈与孩子们追逐打闹的笑音。那些在旧日记录中被标记为禁区与废墟的坐标，如今挂上了崭新的门牌，亮起了温馨的窗灯，孕育着值得期待的明天。\n\n这一次，我们以赴约者的身份来到这里，与这颗星球一同见证新生。广场那端，花海与灯光交织的中心，几道熟悉的身影正在静静等候。"
