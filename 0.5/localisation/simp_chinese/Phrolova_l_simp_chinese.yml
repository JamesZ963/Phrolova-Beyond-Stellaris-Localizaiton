 PF17_branch_shorekeeper:0 "关于这件事，我还想问得更详细些。"
 PF17_branch_shorekeeper_0:0 "有什么是我们应当记住的？"
 PF17_branch_shorekeeper_0_reply:0 "“在漫长的演算里，太多的文明最终只被简化成一行冷冰冰的兴衰数据。但真正构成历史的，往往是那些无法被量化的瞬间——人们在绝境中彼此紧握的双手，风雨夜里亮起的一盏灯，或是离别时的一句承诺。”\n\n她抬起眼眸，淡蓝色的微光在眼底静静流淌。\n\n“如果我们将要一同面对未知的星海，我希望我们记住的不仅是最终胜负的结果，还有这一路上，每一个鲜活生命留下的回音。”"
 PF17_branch_shorekeeper_1:0 "你会怎样面对接下来的旅程？"
 PF17_branch_shorekeeper_1_reply:0 "“过去，我习惯留在原地，在漫长的静默中完成推演与等待。但现在，我想走出那片海岸，亲自去看看你所注视的远方。”\n\n她的声音很轻，却透着一股不容置疑的笃定。\n\n“如果前路有风暴，我会为你校准航向；如果计算出的结局并不乐观，我会陪你一起寻找推演之外的可能。这一次，我不再只是旁观的记录者。”"
 PF17_branch_shorekeeper_back:0 "先回到刚才的话题。"
 PF17_branch_shorekeeper_back_reply:0 "她轻轻颔首，将翻开的记录归拢：“好，我听着。我们从哪里继续？”"
 PF17_branch_shorekeeper_reply:0 "“无论是什么问题，只要在我的认知与记录之内，我都会如实为你解答。”"
 PF17_branch_void:0 "关于这件事，我还想问得更详细些。"
 PF17_branch_void_0:0 "如果我们选择留下它，会付出什么代价？"
 PF17_branch_void_0_reply:0 "“它会顺从地为你提供庞大的暗物质与毁灭性的力量，但它绝不会替你衡量你的愿望是否理智。”弗洛洛冷冷地提醒道，“虚无的本质就是吞噬与同化。你越是相信自己能完美驾驭这份力量，它就越容易在不知不觉中放大你心底的傲慢、偏执与毁灭欲——直到有一天，连你自己也变成让整个星海战栗的灾厄。”"
 PF17_branch_void_1:0 "那些被帷幕遮住的声音，又是什么？"
 PF17_branch_void_1_reply:0 "“是当年被这头怪物吞噬、充当过‘容器’或祭品的倒霉蛋留下的最后一点频率。”弗洛洛的语气稍稍放缓了一些，指尖轻轻摩挲着指挥棒，“在刚才核心坍缩的瞬间，我捕捉到了那缕还在挣扎的微弱信号。如果你选择把这枚孑遗当成武器供起来，那道声音就会被彻底碾碎，永远留在虚无的帷幕后面；只有把它交给我拆解，我才有机会试着把某些迷路的人拉回来。”"
 PF17_branch_void_back:0 "先回到刚才的话题。"
 PF17_branch_void_back_reply:0 "她轻轻颔首，将翻开的分析图谱收拢：“好。在最终拍板之前，你可以把所有的疑虑都问清楚。”"
 PF17_branch_void_reply:0 "“想先弄明白哪一部分？是这团烂摊子的危险性，还是我的私心？”"
