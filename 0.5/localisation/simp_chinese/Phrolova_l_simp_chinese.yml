 PF17_aemeath_topic0:0 "近来过得如何？"
 PF17_aemeath_topic0_reply:0 "“锵锵！快看这杯‘超级豹风雪’——苦咖啡上面飘着甜甜的香草冰淇淋，最上面还有我亲手雕的雪绒豹豹冰雕哦！”\n\n她把一杯精致的特调饮品推到镜头前，脸上写满了求夸奖的小得意。\n\n“虽然幽灵形态下不需要依靠食物维系存在，但看到食堂出了新菜谱，还是会忍不住去凑个热闹嘛。我已经把配方发给你的后勤终端啦，熬夜批改公文的时候喝上一口，保准你瞬间恢复满格耐力！”"
 PF17_aemeath_topic1:0 "有什么值得留意的？"
 PF17_aemeath_topic1_reply:0 "“我最近顺着网线在各个星域的内部论坛里逛了一圈，发现大家平时工作的弦绷得有点太紧啦！”\n\n她晃了晃手里的一盘复古游戏卡带，一本正经地向你提议道：\n\n“所以我偷偷在旗舰的休息室终端里，更新了一个叫‘拉海洛方块’的联机小游戏～放心放心，我设置了防沉迷逻辑，绝对不会耽误正事的！顺带一提，目前全帝国积分排行榜的第一名可是我哦，你要不要也来挑战一下？”"
 PF17_aemeath_topic1_reply_alt:0 "好，给我留一个挑战名额。"
 PF17_aemeath_topic2:0 "你如何看待我们的同行？"
 PF17_aemeath_topic2_reply:0 "“说出来你可能会笑话我……其实在刚变成幽灵的那十几年里，走在镜子前看不到自己的倒影，跟谁说话都得不到回应，偶尔还是会觉得有那么一点点寂寞啦。”\n\n她挠了挠脸颊，随即抬起头，冲你露出一个无比灿烂的笑容。\n\n“所以，第一次听到你回应我的频率时，我真的超级开心！现在能像这样每天和你斗嘴、一起商量战术、一起看遍真正的星海，我总觉得，自己好像又重新活过来了一次。有你在身边，真好～”"
 PF17_aemeath_topic3:0 "还有未说完的往事吗？"
 PF17_aemeath_topic3_reply:0 "“以前在冰原上的时候，我特别喜欢捞湖里的狐尾蒲藻当宝剑，和岸上那些慢吞吞的雪绒海豹玩‘英雄打败大魔王’的游戏。有一次玩得太疯，把家里弄得一团糟，结果被狠狠训了一顿呢。”\n\n她怀念地眯起眼睛，手指轻轻摩挲着衣角。\n\n“不过后来，家里那个人大概是觉得凶过头了，又悄悄买了一大堆游戏卡带回来哄我。那时候窗外下着大雪，屋里的火炉烧得劈啪作响，我们就挤在沙发上一起打通关……哈哈，现在想想，我这么喜欢充当保护大家的英雄，说不定就是那时候留下的后遗症呢！”"
 PF17_aemeath_topic4:0 "以后有什么打算？"
 PF17_aemeath_topic4_reply:0 "“嗯……我想把以前没能写完的那首曲子，重新填完！”\n\n她轻轻哼起了几句明快悠扬的旋律，手指在虚空中随着节拍轻点。\n\n“以前我用‘飞行雪绒’的账号在网上发歌，后来因为突发状况断更了好久，歌友会的大家肯定都等急了吧？现在我跟着你见识了这么多跨越星海的风景，灵感简直多得要溢出来了！等新歌发布的时候，你可得第一个帮我点赞转发哦～”"
 PF17_aemeath_topic4_reply_alt:0 "发布的时候告诉我，我会认真听的。"
 PF17_ame_skin_0:0 "最初的相逢。"
 PF17_ame_skin_1:0 "另一种装束。"
 PF17_ame_skin_2:0 "星光之下。"
 PF17_branch_aemeath:0 "关于这件事，我还想问得更详细些。"
 PF17_branch_aemeath_0:0 "有什么是我们应当记住的？"
 PF17_branch_aemeath_0_reply:0 "“就算是忙着拯救宇宙的大英雄，也是需要劳逸结合的！如果眼里只有永远做不完的主线任务，那旅途未免也太枯燥、太寂寞了。”\n\n她伸出手指，在半空中轻轻画了一个笑脸的符号。\n\n“我们要记住那些一起打闹、一起拆盲盒、一起在星图角落里寻找‘隐藏房间’的快乐时光。毕竟，我们努力战斗至今，不就是为了让大家都能轻松快乐地活下去吗？”"
 PF17_branch_aemeath_1:0 "你会怎样面对接下来的旅程？"
 PF17_branch_aemeath_1_reply:0 "“唔……说完全不害怕那是骗人的啦，毕竟宇宙深处藏着那么多恐怖东西。但是，人生除死无大事——巧的是，我已经死过一次啦！”\n\n她俏皮地眨了眨眼，右手在身侧虚握，仿佛拔出了一柄斩破夜色的利剑。\n\n“既然连死亡都困不住我，就算害怕，我也会继续往前走。只要是为了保护我珍惜的家伙，无论对手是谁，我都会把它们统统斩碎！”"
